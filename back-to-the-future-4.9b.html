<!DOCTYPE html>
<html lang="en">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --teal:#0d9488; --teal-dark:#0f766e; --teal-light:#ccfbf1;
    --orange:#f97316; --orange-light:#ffedd5;
    --purple:#7c3aed; --purple-light:#ede9fe;
    --ink:#1e293b; --slate:#64748b; --paper:#ffffff; --bg:#f4f6f8;
    --radius:20px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0; font-family:'Inter',sans-serif; background:var(--bg); color:var(--ink); overflow:hidden;}
  h1,h2,h3{font-family:'Poppins',sans-serif;}
  #app{display:flex; flex-direction:column; height:100vh; width:100vw;}
  #topbar{display:flex; align-items:center; justify-content:space-between; padding:12px 22px; background:var(--paper); border-bottom:1px solid #e6eaee; flex-shrink:0; gap:12px;}
  .breadcrumb{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--slate); font-weight:600; white-space:nowrap; overflow:hidden;}
  .breadcrumb .unit{color:var(--teal-dark);}
  .breadcrumb .sep{color:#c7ced6;}
  .breadcrumb .current{color:var(--ink);}
  #dots{display:flex; gap:5px; flex-wrap:wrap; max-width:44%; justify-content:center;}
  .dot{width:7px; height:7px; border-radius:50%; background:#dbe2e8; cursor:pointer; transition:all .2s ease; flex-shrink:0;}
  .dot.active{background:var(--teal); width:20px; border-radius:5px;}
  .dot.section-start{margin-left:6px;}
  #counter{font-size:12px; font-weight:700; color:var(--slate); white-space:nowrap; font-variant-numeric: tabular-nums;}
  #stage{flex:1; position:relative; overflow:hidden;}
  .slide{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; padding:26px 5vw 90px; opacity:0; transform:translateX(40px); transition:opacity .35s ease, transform .35s ease; pointer-events:none; overflow-y:auto;}
  .slide.active{opacity:1; transform:translateX(0); pointer-events:auto;}
  .card{width:100%; max-width:1000px; margin:auto;}
  .badge{display:inline-flex; align-items:center; gap:6px; padding:6px 14px; border-radius:999px; font-size:12px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; margin-bottom:16px;}
  .badge::before{content:""; width:7px; height:7px; border-radius:50%; background:currentColor;}
  .badge.focus{background:var(--teal-light); color:var(--teal-dark);}
  .badge.practice{background:var(--orange-light); color:#c2410c;}
  .badge.check{background:var(--purple-light); color:var(--purple);}
  .badge.concept{background:#e0f2fe; color:#0369a1;}
  .badge.write{background:#fce7f3; color:#be185d;}
  .chip{display:inline-block; background:#eef2f6; color:var(--slate); font-size:12px; font-weight:700; padding:4px 10px; border-radius:8px; margin-left:8px;}
  .cover-slide{background:radial-gradient(ellipse at top, #164e63 0%, #0f172a 55%, #0b1120 100%); color:#fff; padding:0;}
  .cover-slide .card{text-align:center; color:#fff; max-width:760px;}
  .stars{position:absolute; inset:0; background-image: radial-gradient(1.5px 1.5px at 20% 30%, #fff, transparent), radial-gradient(1.5px 1.5px at 75% 20%, #fff, transparent), radial-gradient(1px 1px at 50% 60%, #fff, transparent), radial-gradient(2px 2px at 85% 70%, #fff, transparent), radial-gradient(1px 1px at 10% 80%, #fff, transparent), radial-gradient(1.5px 1.5px at 65% 45%, #fff, transparent), radial-gradient(1px 1px at 35% 15%, #fff, transparent), radial-gradient(1.5px 1.5px at 92% 40%, #fff, transparent); opacity:.7;}
  .cover-eyebrow{font-size:13px; letter-spacing:.18em; text-transform:uppercase; color:#5eead4; font-weight:700; margin-bottom:14px;}
  .cover-slide h1{font-size:clamp(26px,4.4vw,46px); line-height:1.1; margin:0 0 14px; background:linear-gradient(90deg,#5eead4,#fb923c,#c4b5fd); -webkit-background-clip:text; background-clip:text; color:transparent;}
  .cover-slide p{font-size:16px; color:#cbd5e1; max-width:580px; margin:0 auto 26px;}
  .cover-pills{display:flex; gap:12px; justify-content:center; flex-wrap:wrap;}
  .cover-pill{background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.18); padding:10px 18px; border-radius:14px; font-size:13px; font-weight:600; color:#e2e8f0;}
  .section-slide .card{text-align:center;}
  .section-num{font-family:'Poppins',sans-serif; font-size:14px; font-weight:700; color:var(--teal); letter-spacing:.1em; text-transform:uppercase; margin-bottom:6px;}
  .section-slide h2{font-size:clamp(22px,3.6vw,34px); margin:0 0 18px; color:var(--ink);}
  .section-sub{color:var(--slate); font-size:15px; max-width:620px; margin:0 auto;}
  .concept-box{background:var(--paper); border-radius:var(--radius); padding:28px 32px; box-shadow:0 10px 30px rgba(15,23,42,.06); border:1px solid #eef1f4;}
  h2.q-title{font-size:clamp(18px,2.6vw,24px); margin:0 0 12px; color:var(--ink);}
  .concept-body{font-size:15px; line-height:1.7; color:#334155;}
  .concept-body strong{color:var(--teal-dark);}
  .concept-body p{margin:0 0 10px;}
  .example-block{margin-top:14px; background:var(--teal-light); border-left:4px solid var(--teal); border-radius:12px; padding:12px 16px; font-size:14px; color:#134e4a;}
  .example-block .lab{font-weight:700; text-transform:uppercase; font-size:11px; letter-spacing:.06em; color:var(--teal-dark); margin-bottom:4px;}
  .q-eyebrow{display:flex; align-items:center; flex-wrap:wrap; gap:2px; margin-bottom:10px;}
  .q-prompt{font-size:clamp(15px,2.1vw,18px); font-weight:500; color:var(--ink); line-height:1.65; margin:6px 0 20px;}
  .instruction-text{font-size:14.5px; color:var(--slate); margin-bottom:14px; line-height:1.6;}
  .reveal-btn{display:inline-flex; align-items:center; gap:8px; background:var(--ink); color:#fff; border:none; padding:12px 22px; border-radius:12px; font-family:'Inter',sans-serif; font-size:14px; font-weight:700; cursor:pointer; transition:transform .15s ease, background .15s ease;}
  .reveal-btn:hover{background:#334155; transform:translateY(-1px);}
  .reveal-btn svg{width:16px; height:16px;}
  .answer-panel{margin-top:16px; max-height:0; opacity:0; overflow:hidden; transition:max-height .4s ease, opacity .3s ease, margin .3s ease; border-radius:14px;}
  .answer-panel.open{max-height:1400px; opacity:1;}
  .answer-inner{background:#ecfdf5; border:1.5px solid #6ee7b7; border-radius:14px; padding:16px 20px; font-size:15px; color:#065f46; line-height:1.75;}
  .answer-inner .lab{font-size:11px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:#059669; margin-bottom:8px; display:flex; align-items:center; gap:6px;}
  .answer-inner .note{display:block; margin-top:10px; font-size:12.5px; color:#0f766e; font-style:italic;}
  .passage{font-size:14.5px; line-height:1.85; color:#334155; background:#fbfcfd; border:1px solid #eef1f4; border-radius:14px; padding:18px 20px;}
  .passage .sp{display:block; margin-bottom:8px;}
  .passage .hi{background:#fef3c7; padding:0 3px; border-radius:4px; font-weight:700; color:#92400e;}
  .passage .it{font-style:italic; background:#e0e7ff; padding:0 3px; border-radius:4px;}
  .tip-box{margin-top:14px; background:var(--orange-light); border-radius:12px; padding:10px 14px; font-size:13px; color:#9a3412; display:flex; gap:10px; align-items:flex-start;}
  .compare-table{width:100%; border-collapse:separate; border-spacing:0; margin-top:14px; font-size:13.5px;}
  .compare-table th{text-align:left; padding:9px 14px; font-size:11.5px; text-transform:uppercase; letter-spacing:.05em; background:var(--ink); color:#fff;}
  .compare-table th:first-child{border-radius:10px 0 0 0;}
  .compare-table th:last-child{border-radius:0 10px 0 0;}
  .compare-table td{padding:8px 14px; border-bottom:1px solid #eef1f4; vertical-align:top; line-height:1.5;}
  .compare-table tr:nth-child(even) td{background:#fbfcfd;}
  .compare-table .col-a{color:var(--teal-dark); font-weight:700;}
  .compare-table .col-b{color:var(--purple); font-weight:700;}
  .word-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(190px,1fr)); gap:10px; margin-top:14px;}
  .word-card{background:#fff; border:1.5px solid #e2e8f0; border-radius:12px; padding:10px 14px; display:flex; align-items:center; justify-content:space-between; font-size:14px; font-weight:600; color:var(--ink);}
  .word-card .suffix-reveal{font-weight:800; color:#cbd5e1; transition:color .3s ease;}
  .word-grid.revealed .suffix-reveal{color:#059669;}
  .checklist{margin-top:14px; display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:10px;}
  .check-item{background:#fff; border:1.5px solid #e2e8f0; border-radius:12px; padding:11px 14px; font-size:13.5px; color:#334155; display:flex; gap:10px; align-items:flex-start;}
  .check-item .ico{color:var(--teal); font-weight:900; flex-shrink:0;}
  .qbox{background:#fff; border:1.5px solid #e2e8f0; border-radius:12px; padding:10px 14px; margin-bottom:8px; font-size:14px;}
  .qbox b{color:var(--purple);}
  .device-card{background:linear-gradient(135deg,#1e293b,#334155); border-radius:16px; padding:18px 20px; color:#fff; margin-top:14px;}
  .device-card .title{font-family:'Poppins',sans-serif; font-weight:800; font-size:20px; color:#fb923c; letter-spacing:.02em; margin-bottom:8px;}
  .device-card .entry-h{font-weight:800; font-size:15px; color:#5eead4; margin-top:12px;}
  .device-card ul{margin:6px 0 0; padding-left:18px; font-size:13.5px; line-height:1.7; color:#e2e8f0;}
  .plan-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:14px; margin-top:14px;}
  .plan-card{background:#fff; border:1.5px solid #e2e8f0; border-radius:14px; padding:14px 16px;}
  .plan-card .ptitle{font-weight:800; color:var(--ink); font-size:14.5px; margin-bottom:6px;}
  .plan-card .pex{font-size:13px; color:var(--slate); line-height:1.6;}
  .lines{margin-top:10px;}
  .lineitem{border-bottom:1.5px dashed #cbd5e1; height:26px; margin-bottom:4px;}
  .closing-slide .card{text-align:center;}
  .closing-slide h2{font-size:clamp(22px,3.6vw,32px); margin-bottom:10px;}
  .wb-ref{display:inline-flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-top:20px;}
  .wb-ref .pg{background:var(--paper); border:1.5px solid #e2e8f0; border-radius:12px; padding:10px 16px; font-size:13px; font-weight:700; color:var(--ink); box-shadow:0 4px 10px rgba(15,23,42,.04);}
  .wb-ref .pg span{display:block; font-size:11px; font-weight:600; color:var(--slate); text-transform:uppercase; letter-spacing:.04em;}
  #footer{position:absolute; bottom:0; left:0; right:0; display:flex; align-items:center; justify-content:center; gap:18px; padding:16px; pointer-events:none;}
  .navbtn{pointer-events:auto; width:52px; height:52px; border-radius:50%; border:none; background:var(--paper); box-shadow:0 6px 18px rgba(15,23,42,.12); display:flex; align-items:center; justify-content:center; cursor:pointer; transition:transform .15s ease, background .15s ease; color:var(--ink);}
  .navbtn:hover{transform:translateY(-2px); background:var(--teal); color:#fff;}
  .navbtn:disabled{opacity:.3; cursor:not-allowed; transform:none; background:var(--paper); color:var(--ink);}
  .navbtn svg{width:20px; height:20px;}
  .navlabel{pointer-events:auto; font-size:12px; font-weight:700; color:var(--slate); background:var(--paper); padding:8px 16px; border-radius:999px; box-shadow:0 6px 18px rgba(15,23,42,.08);}
  @media (max-width: 640px){ .concept-box{padding:20px 16px;} .slide{padding:16px 4vw 96px;} #dots{display:none;} }
</style>

<div id="app">
  <div id="topbar">
    <div class="breadcrumb"><span class="unit">Unit 4 · Back to the Future</span><span class="sep">›</span><span class="current" id="crumbCurrent">Cover</span></div>
    <div id="dots"></div>
    <div id="counter">1 / 1</div>
  </div>

  <div id="footer">
    <button class="navbtn" id="prevBtn" aria-label="Previous"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
    <div class="navlabel" id="navLabel">Tap to begin</div>
    <button class="navbtn" id="nextBtn" aria-label="Next"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button>
  </div>
</div>

<script>
const S = [];
function badge(kind, extra){
  const label = kind==='focus'?'Focus':kind==='practice'?'Practice':kind==='check'?'Focus':kind==='write'?'Writing Practice':'Concept';
  return `<span class="badge ${kind}">${label}${extra?' · '+extra:''}</span>`;
}
function questionSlide({kind, exercise, instruction, prompt, answerHtml}){
  const idBase = 'ans-' + Math.random().toString(36).slice(2,9);
  return `
    <div class="card">
      <div class="q-eyebrow">${badge(kind)} <span class="chip">${exercise}</span></div>
      ${instruction? `<div class="instruction-text">${instruction}</div>`:''}
      <div class="q-prompt">${prompt}</div>
      <button class="reveal-btn" onclick="toggleAnswer('${idBase}', this)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
        Reveal answer
      </button>
      <div class="answer-panel" id="${idBase}"><div class="answer-inner">${answerHtml}</div></div>
    </div>`;
}

/* ---------- COVER ---------- */
S.push({crumb:'Cover', section:true, html:`
  <div class="slide cover-slide"><div class="stars"></div>
    <div class="card">
      <div class="cover-eyebrow">Cambridge Primary English 6 · Unit 4</div>
      <h1>Back to the Future</h1>
      <p>Session 4.9 &mdash; A closer look at The Hitchhiker's Guide to the Galaxy: irony, colloquial language, prefixes, register, and writing your own guide entry.</p>
      <div class="cover-pills"><div class="cover-pill">4.9 Going Forward in Time</div></div>
    </div>
  </div>`});

/* ---------- SESSION TITLE ---------- */
S.push({crumb:'4.9 Title', section:true, html:`
  <div class="slide section-slide">
    <div class="card">
      <div class="section-num">Session 4.9</div>
      <h2>Going forward in time</h2>
      <p class="section-sub">We're going deeper into <em>The Hitchhiker's Guide to the Galaxy</em> &mdash; exploring how the author uses irony, informal language and word-building &mdash; then planning a guide entry of our own.</p>
    </div>
  </div>`});

/* ---------- CONCEPT: ITALICS ---------- */
S.push({crumb:'Italics Concept', html:`
  <div class="slide"><div class="card concept-box">
    ${badge('concept')}
    <h2 class="q-title">Why do writers use italics?</h2>
    <div class="concept-body">
      <p>Italics (slanted writing) make a word <em>stand out</em>. Writers use them for different reasons: to show a word is being emphasised strongly, to mark a title, or &mdash; often in comedy &mdash; to show a word is being used <strong>ironically or sarcastically</strong>, meaning the opposite of what it usually means.</p>
    </div>
    <div class="example-block"><div class="lab">Watch for this trick</div>When a character says something is <em>safe</em> right after a disaster, italics can be the author's wink to the reader: "this word doesn't really mean what you think it means here!"</div>
  </div></div>`});

/* ---------- EXTRACT 1 ---------- */
S.push({crumb:'Extract 1', html:`
  <div class="slide"><div class="card concept-box">
    ${badge('focus')} <span class="chip">The Hitchhiker's Guide to the Galaxy</span>
    <h2 class="q-title">Read the extract</h2>
    <div class="instruction-text">Arthur Dent and his friend Ford Prefect (an alien, although Arthur doesn't know it) have just escaped Earth's destruction.</div>
    <div class="passage">
      <span class="sp">[Para 1] Ford stood up. "We're safe," he said.</span>
      <span class="sp">[Para 2] "Oh good," said Arthur.</span>
      <span class="sp">[Para 3] "We're in a small galley cabin," said Ford, "in one of the spaceships of the Vogon Constructor Fleet."</span>
      <span class="sp">[Para 4] "Ah," said Arthur, "this is obviously some strange usage of the word <span class="hi it">safe</span> that I wasn't previously aware of."</span>
      <span class="sp">[Para 5] Ford struck another match to help him search for a light switch. Monstrous shadows leapt and loomed again. Arthur struggled to his feet and hugged himself apprehensively. Hideous alien shapes seem to <strong>throng</strong> about him, the air was thick with musty smells which <strong>sidled</strong> into his lungs without identifying themselves, and a low irritating hum kept his brain from focusing.</span>
    </div>
  </div></div>`});

/* ---------- Q1 (safe / italics) ---------- */
S.push({crumb:'4.9 Q1', html:`<div class="slide">${questionSlide({
  kind:'check', exercise:'Comprehension 1',
  instruction:'Look closely at how one word in Paragraph 4 is printed.',
  prompt:'One word in Paragraph 4 is printed in italics. Identify it, and explain why the author chose to emphasise it this way.',
  answerHtml:`<div class="lab">Model answer</div>
    The word is <em>safe</em>. It's emphasised in italics because Arthur is being sarcastic &mdash; he thinks their situation is actually the <em>opposite</em> of safe (trapped on a cramped, dark Vogon spaceship, having just lost their home planet). The italics signal that Arthur means the word ironically, creating humour through the contrast between the word and the reality.
    <span class="note">Accept any answer identifying "safe" + irony/sarcasm, showing the situation doesn't match the word's usual meaning.</span>`
})}</div>`});

/* ---------- EXTRACT 2 ---------- */
S.push({crumb:'Extract 2', html:`
  <div class="slide"><div class="card concept-box">
    ${badge('focus')} <span class="chip">The Hitchhiker's Guide to the Galaxy</span>
    <h2 class="q-title">Read on: finding the light switch</h2>
    <div class="passage">
      <span class="sp">"How did we get here?" he asked, shivering slightly.</span>
      <span class="sp">"We hitched a lift," said Ford.</span>
      <span class="sp">"Excuse me?" said Arthur. "Are you trying to tell me that <span class="hi">we just stuck out our thumbs</span> and some green bug-eyed monster stuck his head out and said, Hi fellas, hop right in, I can take you as far as the Basingstoke roundabout?"</span>
      <span class="sp">"Well," said Ford, "the Thumb's an electronic <strong>sub-ether</strong> signalling device, the roundabout's at Barnard's Star six light-years away, but otherwise, that's more or less right."</span>
      <span class="sp">&hellip;</span>
      <span class="sp">"Well, this is a working ship, you see," said Ford. "These are the Dentrassi sleeping quarters."</span>
      <span class="sp">"I thought you said they were called Vogons or something."</span>
      <span class="sp">"Yes," said Ford, "the Vogons run the ship, the Dentrassis are the cooks, they let us on board."</span>
    </div>
  </div></div>`});

/* ---------- Q2 (colloquial phrase) ---------- */
S.push({crumb:'4.9 Q2', html:`<div class="slide">${questionSlide({
  kind:'check', exercise:'Comprehension 2',
  instruction:'Arthur uses an everyday, informal phrase to describe how they were picked up.',
  prompt:'Find the informal phrase Arthur uses partway through this extract. What does it actually mean?',
  answerHtml:`<div class="lab">Model answer</div>
    The phrase is "we just stuck out our thumbs." It means they signalled for a lift &ndash; in other words, they hitchhiked (like standing by a road with your thumb out to ask a passing driver for a ride). Arthur uses it to sarcastically question Ford's story, since being picked up by an alien spaceship is a very different thing from a normal hitchhiked lift &ndash; which is exactly what makes the comparison funny.
    <span class="note">Accept any answer that explains the meaning as "hitchhiking / signalling for a lift", with bonus credit for noting the humour.</span>`
})}</div>`});

/* ---------- CONCEPT: SUB- PREFIX ---------- */
S.push({crumb:'Sub- Concept', html:`
  <div class="slide"><div class="card concept-box">
    ${badge('concept')}
    <h2 class="q-title">The prefix sub-</h2>
    <div class="concept-body">
      <p>A <strong>prefix</strong> is added to the <em>front</em> of a root word to change its meaning. <strong>Sub-</strong> means <strong>"under" or "beneath"</strong>.</p>
    </div>
    <div class="word-grid" id="subgrid">
      ${[['sub + marine','submarine (a vessel that goes under the sea)'],['sub + standard','substandard (below the normal standard)'],['sub + way','subway (a passage or railway under the ground)'],
         ['sub + plot','subplot (a smaller story under the main one)'],['sub + set','subset (a smaller group within a bigger group)'],['sub + conscious','subconscious (below conscious awareness)']]
        .map(([a,b])=>`<div class="word-card"><span>${a}</span><span class="suffix-reveal" data-suf="${b}">?</span></div>`).join('')}
    </div>
    <button class="reveal-btn" style="margin-top:16px;" onclick="revealGrid('subgrid', this)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
      Reveal meanings
    </button>
  </div></div>`});

/* ---------- Q3 (sub- prefix) ---------- */
S.push({crumb:'4.9 Q3', html:`<div class="slide">${questionSlide({
  kind:'check', exercise:'Comprehension 3',
  instruction:'"The Thumb\u2019s an electronic sub-ether signalling device." The "ether" means the sky/air full of radio waves.',
  prompt:'What does the prefix in "sub-ether" tell you about its meaning? Give two more examples of words that use this same prefix.',
  answerHtml:`<div class="lab">Model answer</div>
    The prefix <strong>sub-</strong> means "under" or "beneath" &ndash; so "sub-ether" means a layer or frequency <em>beneath</em> the normal ether (radio-wave layer), used for the device's special signal.<br><br>
    Two more sub- words: <strong>submarine</strong> and <strong>substandard</strong>. Other accepted answers: subway, subplot, subset, subconscious.`
})}</div>`});

/* ---------- CONCEPT: REGISTER ---------- */
S.push({crumb:'Register Concept', html:`
  <div class="slide"><div class="card concept-box">
    ${badge('concept')}
    <h2 class="q-title">What is register?</h2>
    <div class="concept-body"><p><strong>Register</strong> is how formal or informal a piece of writing is. Look at word choice, contractions, slang, and sentence length to judge it.</p></div>
    <table class="compare-table">
      <tr><th>Formal register</th><th>Informal / colloquial register (this extract)</th></tr>
      <tr><td>Full words: "We are safe"</td><td class="col-b">Contractions: "We're safe", "I'll show you"</td></tr>

/* RENDER + NAV */
const stage = document.getElementById('stage');
const dotsEl = document.getElementById('dots');
const counterEl = document.getElementById('counter');
const crumbEl = document.getElementById('crumbCurrent');
const navLabel = document.getElementById('navLabel');
let current = 0;
S.forEach((s, i)=>{
  const wrapper = document.createElement('div');
  wrapper.innerHTML = s.html.trim();
  const el = wrapper.firstChild;
  el.dataset.index = i;
  stage.appendChild(el);
  const dot = document.createElement('div');
  dot.className = 'dot' + (s.section ? ' section-start' : '');
  dot.addEventListener('click', ()=>goTo(i));
  dotsEl.appendChild(dot);
});
function render(){
  document.querySelectorAll('.slide').forEach((el,i)=>{ el.classList.toggle('active', i===current); });
  document.querySelectorAll('.dot').forEach((el,i)=>{ el.classList.toggle('active', i===current); });
  counterEl.textContent = `${current+1} / ${S.length}`;
  crumbEl.textContent = S[current].crumb;
  document.getElementById('prevBtn').disabled = current===0;
  document.getElementById('nextBtn').disabled = current===S.length-1;
  navLabel.textContent = current===S.length-1 ? 'The end 🎉' : (current===0 ? 'Tap to begin' : 'Swipe or tap arrows');
  document.querySelectorAll('.dot').forEach((el,i)=>{ if(i===current) el.scrollIntoView({inline:'center', block:'nearest', behavior:'smooth'}); });
}
function goTo(i){ if(i<0 || i>=S.length) return; current = i; render(); }
document.getElementById('prevBtn').addEventListener('click', ()=>goTo(current-1));
document.getElementById('nextBtn').addEventListener('click', ()=>goTo(current+1));
document.addEventListener('keydown', (e)=>{ if(e.key==='ArrowRight') goTo(current+1); if(e.key==='ArrowLeft') goTo(current-1); });
let touchStartX = null;
stage.addEventListener('touchstart', e=>{touchStartX = e.touches[0].clientX;});
stage.addEventListener('touchend', e=>{
  if(touchStartX===null) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  if(Math.abs(dx) > 50){ dx<0 ? goTo(current+1) : goTo(current-1); }
  touchStartX = null;
});
function toggleAnswer(id, btn){
  const panel = document.getElementById(id);
  const opening = !panel.classList.contains('open');
  panel.classList.toggle('open');
  btn.innerHTML = opening
    ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/></svg> Hide answer`
    : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg> Reveal answer`;
}
function revealGrid(gridId, btn){
  const grid = document.getElementById(gridId);
  const opening = !grid.classList.contains('revealed');
  grid.classList.toggle('revealed');
  grid.querySelectorAll('.suffix-reveal').forEach(el=>{ el.textContent = opening ? el.dataset.suf : '?'; });
  btn.innerHTML = opening
    ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/></svg> Hide meanings`
    : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg> Reveal meanings`;
}
render();
</script>
