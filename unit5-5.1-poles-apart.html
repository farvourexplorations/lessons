  .check-item .ico{color:var(--teal); font-weight:900; flex-shrink:0;}

<script>
const S = [];
function badge(kind, extra){
  const label = kind==='focus'?'Focus':kind==='practice'?'Practice':kind==='challenge'?'Challenge':kind==='write'?'Writing Practice':'Concept';
  return `<span class="badge ${kind}">${label}${extra?' · '+extra:''}</span>`;
}
function questionSlide({kind, exercise, letter, instruction, prompt, answerHtml}){
  const idBase = 'ans-' + Math.random().toString(36).slice(2,9);
  return `
    <div class="card">
      <div class="q-eyebrow">${badge(kind)} <span class="chip">${exercise}${letter?' &middot; '+letter:''}</span></div>
      ${instruction? `<div class="instruction-text">${instruction}</div>`:''}
      <div class="q-prompt">${prompt}</div>
      <button class="reveal-btn" onclick="toggleAnswer('${idBase}', this)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
        Reveal answer
      </button>
      <div class="answer-panel" id="${idBase}"><div class="answer-inner">${answerHtml}</div></div>
    </div>`;
}

/* ---------- COVER ---------- */
S.push({crumb:'Cover', section:true, html:`
  <div class="slide cover-slide"><div class="stars"></div>
    <div class="card">
      <div class="cover-eyebrow">Cambridge Primary English 6 · Unit 5</div>
      <h1>The Facts of the Matter</h1>
      <p>Session 5.1 &mdash; Poles Apart: comparing the North and South Poles using facts, opinions and connectives.</p>
      <div class="cover-pills"><div class="cover-pill">5.1 Poles Apart</div><div class="cover-pill">Learner's Book pages 128&ndash;131</div></div>
    </div>
  </div>`});

/* ---------- SESSION TITLE + WE ARE GOING TO + GETTING STARTED ---------- */
S.push({crumb:'5.1 Title', section:true, html:`
  <div class="slide section-slide">
    <div class="card">
      <div class="section-num">Session 5.1</div>
      <h2>Poles apart</h2>
      <div class="goal-box"><div class="glab">We are going to&hellip;</div><p>discuss and compare two places using facts, opinions and connectives.</p></div>
      <div class="start-box"><div class="slab">Getting started</div>
        <ol>
          <li>In small groups, discuss these questions: Do you live in a hot or a cold place? Which do you prefer?</li>
          <li>Explain the difference between a fact and an opinion.</li>
        </ol>
      </div>
    </div>
  </div>`});

/* ---------- CONCEPT: SIMILARITIES & DIFFERENCES ---------- */
S.push({crumb:'Similarities/Differences', html:`
  <div class="slide"><div class="card concept-box">
    ${badge('concept')}
    <h2 class="q-title">Similarities and differences</h2>
    <div class="concept-body">
      <p>A <strong>similarity</strong> is a way that two things are alike. A <strong>difference</strong> is a way that two things are not alike. When you compare two places, you look at both &mdash; what they share, and what sets them apart.</p>
    </div>
    <div class="example-block"><div class="lab">Example</div>Similarity: both the Arctic and the Antarctic are extremely cold. Difference: the Arctic is an ocean surrounded by land, while the Antarctic is land surrounded by ocean.</div>
  </div></div>`});

/* ---------- FOCUS 1a: COMPARE PHOTOS ---------- */
S.push({crumb:'Focus 1a', html:`
  <div class="slide"><div class="card concept-box">
    ${badge('focus')} <span class="chip">Activity 1a</span>
    <h2 class="q-title">Describe the similarities and differences</h2>
    <div class="instruction-text">Work in pairs. Compare the pictures of the North and South Poles. In your notebook, describe what you see.</div>
    <div class="photo-grid">
      <div class="photo-card np"><span class="plabel">North Pole</span><div class="pdesc">A polar bear walks across sea ice; snow-covered mountains with a small red house on the shore.</div></div>
      <div class="photo-card sp"><span class="plabel">South Pole</span><div class="pdesc">Adult penguins feeding their chicks; a boat carrying people in bright orange survival suits weaving through ice.</div></div>
    </div>
  </div></div>`});

/* ---------- CONCEPT: FACTS & OPINIONS ---------- */
S.push({crumb:'Facts/Opinions', html:`
  <div class="slide"><div class="card concept-box">
    ${badge('concept')}
    <h2 class="q-title">Facts and opinions</h2>
    <div class="concept-body">
      <p>A <strong>fact</strong> is a statement that can be checked and proven true or false. An <strong>opinion</strong> is a personal feeling, belief or judgement &mdash; it can't be proven, only agreed or disagreed with.</p>
    </div>
    <table class="compare-table">
      <tr><th>Fact</th><th>Opinion</th></tr>
      <tr><td class="col-a">Antarctica is the coldest continent on Earth.</td><td class="col-b">Antarctica sounds like the most boring place to visit.</td></tr>
    </table>
    <div class="tip-box">💡 Look out for opinion clues like "I think," "best," "worst," "boring," or "amazing."</div>
  </div></div>`});

/* ---------- FOCUS 1b: FACT OR OPINION (1-4) ---------- */
S.push({crumb:'Focus 1b (1/2)', html:`<div class="slide">${questionSlide({
  kind:'focus', exercise:'Activity 1b', letter:'1&ndash;4',
  instruction:'Read each statement. Decide if it is a fact or an opinion. How can you tell?',
  prompt:`<div class="item-list">
      <div class="item-row"><span class="letter">1</span>The North Pole is known as the Arctic and the South Pole is known as the Antarctic.</div>
      <div class="item-row"><span class="letter">2</span>The Antarctic is a continent while the Arctic is an ocean.</div>
      <div class="item-row"><span class="letter">3</span>One has penguins whereas the other has polar bears.</div>
      <div class="item-row"><span class="letter">4</span>The Arctic has a permanent human population but Antarctica does not.</div>
    </div>`,
  answerHtml:`<div class="lab">All four are facts</div>
    Each statement can be checked and proven true or false against real information &mdash; none of them state a personal feeling or judgement. Notice that joining two ideas with a connective (while, whereas, but) doesn't turn a statement into an opinion &mdash; it's still a fact as long as both halves are true and verifiable.
    <span class="note">You can tell it's a fact because you could look it up and confirm it; an opinion would use words like "I think," "best," or "worst."</span>`
})}</div>`});

/* ---------- FOCUS 1b: FACT OR OPINION (5-7) ---------- */
S.push({crumb:'Focus 1b (2/2)', html:`<div class="slide">${questionSlide({
  kind:'focus', exercise:'Activity 1b', letter:'5&ndash;7',
  instruction:'Decide if these last three statements are facts or opinions.',
  prompt:`<div class="item-list">
      <div class="item-row"><span class="letter">5</span>Both are cold; however, the Antarctic is colder.</div>
      <div class="item-row"><span class="letter">6</span>Both are desert regions although Antarctica is the largest desert on Earth.</div>
      <div class="item-row"><span class="letter">7</span>Antarctica is the name of a continent.</div>
    </div>`,
  answerHtml:`<div class="lab">All three are facts</div>
    Every statement in this activity is a fact &mdash; even the ones that sound surprising, like Antarctica being a desert. That's because "desert" means a place that gets very little precipitation, not necessarily a hot, sandy place &mdash; and this is checkable, verifiable information rather than a feeling or judgement.
    <div class="fact-check">${['1 Fact','2 Fact','3 Fact','4 Fact','5 Fact','6 Fact','7 Fact'].map(t=>`<span class="fc-tag fact">${t}</span>`).join('')}</div>`
})}</div>`});

/* ---------- CONCEPT: LITERAL & FIGURATIVE ---------- */
S.push({crumb:'Literal/Figurative', html:`
  <div class="slide"><div class="card concept-box">
    ${badge('concept')}
    <h2 class="q-title">Literal and figurative language</h2>
    <div class="concept-body">
      <p><strong>Literal</strong> language means exactly what it says, word for word. <strong>Figurative</strong> language means something different from the literal words &mdash; it paints a picture or creates an effect instead of stating a plain fact.</p>
    </div>
    <table class="compare-table">
      <tr><th>Literal</th><th>Figurative</th></tr>
      <tr><td class="col-a">The North and South Poles are thousands of kilometres apart.</td><td class="col-b">"Poles apart" &mdash; meaning two things are completely different.</td></tr>
    </table>
  </div></div>`});

/* ---------- FOCUS 1c-e: POLES APART + FIGURATIVE LANGUAGE ---------- */
S.push({crumb:'Focus 1c-e', html:`
  <div class="slide"><div class="card concept-box">
    ${badge('focus')} <span class="chip">Activity 1c&ndash;e</span>
    <h2 class="q-title">Poles apart &mdash; literal or figurative?</h2>
    <div class="item-list">
      <div class="item-row"><span class="letter">c</span>Is the expression <em>poles apart</em> literal or figurative? What does it mean?</div>
      <div class="item-row"><span class="letter">d</span>What other figurative expressions can you think of that describe cold or hot places?</div>
      <div class="item-row"><span class="letter">e</span>Is it better to use facts or figurative language to give information?</div>
    </div>
    <button class="reveal-btn" style="margin-top:16px;" id="btn1ce" onclick="toggleAnswer('ans1ce', document.getElementById('btn1ce'))">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
      Reveal discussion answers
    </button>
    <div class="answer-panel" id="ans1ce"><div class="answer-inner">
      <div class="lab">c &ndash; Literal or figurative?</div>
      <em>Poles apart</em> is <strong>figurative</strong>. Literally, the North and South Poles are the two most distant points on Earth &mdash; so figuratively, the phrase means two things (or people) are completely different or hold opposite views.<br><br>
      <div class="lab">d &ndash; Other figurative expressions</div>
      Cold: "freezing my socks off," "cold as ice," "in the dead of winter." Hot: "boiling hot," "dog days of summer," "hot as an oven."<br><br>
      <div class="lab">e &ndash; Facts or figurative language?</div>
      Facts are more reliable and precise for giving accurate information; figurative language is more useful for creating a vivid impression or feeling. A good informative report usually leans on facts, saving figurative language for emphasis.
      <span class="note">Accept any sensible figurative expressions and a reasoned answer to part e.</span>
    </div></div>
  </div></div>`});

/* ---------- WORD ORIGINS: ARCTIC / ANTARCTIC ---------- */
S.push({crumb:'Word Origins', html:`
  <div class="slide"><div class="card concept-box">
    ${badge('concept')}
    <h2 class="q-title">Where do the words Arctic and Antarctic come from?</h2>
    <div class="concept-body">
      <p>The word <strong>Arctic</strong> comes from the Greek word <em>arktos</em>, meaning "bear" &mdash; referring to the Great Bear <strong>constellation</strong> in the northern sky.</p>
      <p><strong>Antarctic</strong> has the prefix <em>ant-</em> (or <em>anti-</em>), meaning "opposite." So <strong>Ant</strong>arctic means "opposite to the north."</p>
    </div>
    <div class="glossary-box"><b>Glossary &ndash; constellation:</b> a group of stars in the sky that seem, from Earth, to form a pattern and have been given a name.</div>
    <div class="tip-box">✍️ Writing tip: You can form opposites by adding a prefix to root words &mdash; like <strong>anti</strong>clockwise, <strong>un</strong>clear, <strong>de</strong>stress.</div>
  </div></div>`});

/* ---------- CONCEPT: CONNECTIVES ---------- */
S.push({crumb:'Connectives Concept', html:`
  <div class="slide"><div class="card concept-box">
    ${badge('concept')}
    <h2 class="q-title">Language focus: connectives</h2>
    <div class="concept-body">
      <p>We use <strong>connectives</strong> to link sentences and paragraphs. We also use them in the following ways.</p>
    </div>
    <table class="compare-table">
      <tr><th>To introduce similar points</th><th>To introduce opposing points</th></tr>
      <tr><td class="col-a">similarly, in addition, as well as&hellip;</td><td class="col-b">but, although, yet, since, alternatively, however, while, whereas, on the other hand&hellip;</td></tr>
    </table>
    <div class="example-block"><div class="lab">Paired connectives</div>
      Some connectives work in pairs to link ideas of equal importance: <strong>both&hellip;and</strong>, <strong>whether&hellip;or</strong>, <strong>not only&hellip;but also</strong>, <strong>neither&hellip;nor</strong>, <strong>either&hellip;or</strong>, <strong>rather&hellip;or</strong>.
    </div>
  </div></div>`});

/* ---------- PRACTICE 2a ---------- */
S.push({crumb:'Practice 2a', html:`<div class="slide">${questionSlide({
  kind:'practice', exercise:'Activity 2a',
  instruction:'Go back to the statements from Activity 1b.',
  prompt:`Identify the connective in each statement. Can you change the connectives without changing the meaning? Give an example.`,
  answerHtml:`<div class="lab">Model answer</div>
    The connectives used are: <strong>while</strong> (statement 2), <strong>whereas</strong> (statement 3), <strong>but</strong> (statement 4), <strong>however</strong> (statement 5), <strong>although</strong> (statement 6).<br><br>
    Yes &mdash; most of these opposing connectives can swap for one another without changing the meaning. For example, "The Antarctic is a continent <em>while</em> the Arctic is an ocean" could equally read "The Antarctic is a continent, <em>whereas</em> the Arctic is an ocean" or "&hellip;<em>but</em> the Arctic is an ocean."
    <span class="note">Accept any correctly identified connective and a sensible substitution that keeps the same contrasting meaning.</span>`
})}</div>`});

/* RENDER + NAV */
const stage = document.getElementById('stage');
const dotsEl = document.getElementById('dots');
const counterEl = document.getElementById('counter');
const crumbEl = document.getElementById('crumbCurrent');
const navLabel = document.getElementById('navLabel');
let current = 0;
S.forEach((s, i)=>{
  const wrapper = document.createElement('div');
  wrapper.innerHTML = s.html.trim();
  const el = wrapper.firstChild;
  el.dataset.index = i;
  stage.appendChild(el);
  const dot = document.createElement('div');
  dot.className = 'dot' + (s.section ? ' section-start' : '');
  dot.addEventListener('click', ()=>goTo(i));
  dotsEl.appendChild(dot);
});
function render(){
  document.querySelectorAll('.slide').forEach((el,i)=>{ el.classList.toggle('active', i===current); });
  document.querySelectorAll('.dot').forEach((el,i)=>{ el.classList.toggle('active', i===current); });
  counterEl.textContent = `${current+1} / ${S.length}`;
  crumbEl.textContent = S[current].crumb;
  document.getElementById('prevBtn').disabled = current===0;
  document.getElementById('nextBtn').disabled = current===S.length-1;
  navLabel.textContent = current===S.length-1 ? 'The end 🎉' : (current===0 ? 'Tap to begin' : 'Swipe or tap arrows');
  document.querySelectorAll('.dot').forEach((el,i)=>{ if(i===current) el.scrollIntoView({inline:'center', block:'nearest', behavior:'smooth'}); });
}
function goTo(i){ if(i<0 || i>=S.length) return; current = i; render(); }
document.getElementById('prevBtn').addEventListener('click', ()=>goTo(current-1));
document.getElementById('nextBtn').addEventListener('click', ()=>goTo(current+1));
document.addEventListener('keydown', (e)=>{ if(e.key==='ArrowRight') goTo(current+1); if(e.key==='ArrowLeft') goTo(current-1); });
let touchStartX = null;
stage.addEventListener('touchstart', e=>{touchStartX = e.touches[0].clientX;});
stage.addEventListener('touchend', e=>{
  if(touchStartX===null) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  if(Math.abs(dx) > 50){ dx<0 ? goTo(current+1) : goTo(current-1); }
  touchStartX = null;
});
function toggleAnswer(id, btn){
  const panel = document.getElementById(id);
  const opening = !panel.classList.contains('open');
  panel.classList.toggle('open');
  btn.innerHTML = opening
    ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/></svg> Hide answer`
    : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg> Reveal answer`;
}
render();
</script>
