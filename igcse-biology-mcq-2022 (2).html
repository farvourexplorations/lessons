<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cambridge IGCSE Biology 0610/22 — February/March 2022</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Source+Serif+4:ital,wght@0,300;0,400;0,600;1,300&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f1117;
    --surface: #181c27;
    --surface2: #1e2335;
    --accent: #4ecca3;
    --accent2: #e8c547;
    --text: #e8e6df;
    --muted: #7a8199;
    --correct: #4ecca3;
    --wrong: #e05c5c;
    --border: rgba(255,255,255,0.07);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Source Serif 4', Georgia, serif;
    font-weight: 300;
    min-height: 100vh;
    line-height: 1.7;
  }

  /* Subtle grid background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: 
      linear-gradient(rgba(78,204,163,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(78,204,163,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  .container {
    max-width: 860px;
    margin: 0 auto;
    padding: 0 24px 80px;
    position: relative;
    z-index: 1;
  }

  /* Header */
  header {
    padding: 60px 0 40px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 48px;
  }

  .exam-tag {
    display: inline-block;
    font-family: 'Source Serif 4', serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--accent);
    border: 1px solid var(--accent);
    padding: 4px 12px;
    margin-bottom: 20px;
  }

  h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(28px, 5vw, 48px);
    font-weight: 900;
    line-height: 1.1;
    color: #fff;
    margin-bottom: 12px;
  }

  h1 span { color: var(--accent); }

  .subtitle {
    font-size: 15px;
    color: var(--muted);
    font-style: italic;
  }

  .meta-row {
    display: flex;
    gap: 32px;
    margin-top: 24px;
    flex-wrap: wrap;
  }

  .meta-item {
    font-size: 13px;
    color: var(--muted);
    letter-spacing: 0.05em;
  }

  .meta-item strong {
    color: var(--accent2);
    font-style: normal;
    font-weight: 600;
  }

  /* Progress bar */
  .progress-bar-wrap {
    position: sticky;
    top: 0;
    z-index: 100;
    background: var(--bg);
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
    margin-bottom: 40px;
  }

  .progress-info {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 6px;
    letter-spacing: 0.05em;
  }

  #progress-count { color: var(--accent); font-weight: 600; }

  .progress-track {
    height: 3px;
    background: var(--surface2);
    border-radius: 2px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 2px;
    transition: width 0.4s ease;
    width: 0%;
  }

  /* Questions */
  .question-block {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 32px;
    margin-bottom: 20px;
    transition: border-color 0.2s;
    position: relative;
  }

  .question-block:hover { border-color: rgba(78,204,163,0.2); }

  .question-block.answered { border-color: rgba(78,204,163,0.15); }

  .q-number {
    font-family: 'Playfair Display', serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 10px;
  }

  .q-text {
    font-size: 16px;
    color: var(--text);
    margin-bottom: 24px;
    line-height: 1.65;
  }

  .q-text .note {
    font-style: italic;
    color: var(--muted);
    font-size: 14px;
    display: block;
    margin-top: 6px;
  }

  .options {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .option {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    padding: 14px 16px;
    border: 1px solid var(--border);
    border-radius: 2px;
    cursor: pointer;
    transition: all 0.15s ease;
    background: var(--surface2);
    font-size: 15px;
    line-height: 1.55;
    user-select: none;
  }

  .option:hover {
    border-color: rgba(78,204,163,0.4);
    background: rgba(78,204,163,0.04);
  }

  .option.selected {
    border-color: var(--accent);
    background: rgba(78,204,163,0.08);
  }

  .option-letter {
    flex-shrink: 0;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    border: 1px solid var(--muted);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Playfair Display', serif;
    font-size: 12px;
    font-weight: 700;
    color: var(--muted);
    transition: all 0.15s;
    margin-top: 1px;
  }

  .option.selected .option-letter {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(78,204,163,0.15);
  }

  /* Results state */
  .option.correct {
    border-color: var(--correct) !important;
    background: rgba(78,204,163,0.1) !important;
  }

  .option.wrong {
    border-color: var(--wrong) !important;
    background: rgba(224,92,92,0.08) !important;
  }

  .option.correct .option-letter {
    border-color: var(--correct);
    color: var(--correct);
    background: rgba(78,204,163,0.2);
  }

  .option.wrong .option-letter {
    border-color: var(--wrong);
    color: var(--wrong);
    background: rgba(224,92,92,0.15);
  }

  .option.show-correct {
    border-color: var(--correct) !important;
    background: rgba(78,204,163,0.05) !important;
  }

  .option.show-correct .option-letter {
    border-color: var(--correct);
    color: var(--correct);
  }

  .result-icon {
    display: none;
    font-size: 16px;
    margin-left: auto;
    flex-shrink: 0;
    align-self: center;
  }

  .explanation {
    display: none;
    margin-top: 20px;
    padding: 16px 18px;
    background: rgba(232,197,71,0.06);
    border-left: 3px solid var(--accent2);
    font-size: 14px;
    color: #c9c5b8;
    line-height: 1.65;
    border-radius: 0 2px 2px 0;
  }

  .explanation strong { color: var(--accent2); }

  .explanation.visible { display: block; }

  /* Submit / Results section */
  .submit-area {
    margin-top: 48px;
    text-align: center;
  }

  .btn-submit {
    font-family: 'Playfair Display', serif;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--bg);
    background: var(--accent);
    border: none;
    padding: 18px 56px;
    cursor: pointer;
    border-radius: 2px;
    transition: all 0.2s;
  }

  .btn-submit:hover {
    background: #5fe0b5;
    transform: translateY(-1px);
    box-shadow: 0 8px 32px rgba(78,204,163,0.25);
  }

  .btn-submit:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    transform: none;
    box-shadow: none;
  }

  .unanswered-note {
    font-size: 13px;
    color: var(--wrong);
    margin-top: 12px;
    font-style: italic;
    display: none;
  }

  /* Score panel */
  #score-panel {
    display: none;
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 48px 40px;
    text-align: center;
    margin-bottom: 48px;
    position: relative;
    overflow: hidden;
  }

  #score-panel::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--accent), var(--accent2), var(--accent));
  }

  .score-title {
    font-family: 'Playfair Display', serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 16px;
  }

  .score-big {
    font-family: 'Playfair Display', serif;
    font-size: 72px;
    font-weight: 900;
    line-height: 1;
    color: var(--accent);
    margin-bottom: 8px;
  }

  .score-max { font-size: 32px; color: var(--muted); }

  .score-percent {
    font-size: 20px;
    color: var(--accent2);
    margin-bottom: 16px;
    font-style: italic;
  }

  .score-grade {
    font-family: 'Playfair Display', serif;
    font-size: 18px;
    font-weight: 700;
    color: #fff;
    margin-bottom: 24px;
  }

  .score-bar-wrap {
    max-width: 400px;
    margin: 0 auto 24px;
    height: 8px;
    background: var(--surface2);
    border-radius: 4px;
    overflow: hidden;
  }

  .score-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 4px;
    transition: width 1.2s cubic-bezier(0.4,0,0.2,1);
    width: 0;
  }

  .btn-retry {
    font-family: 'Playfair Display', serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--accent);
    background: transparent;
    border: 1px solid var(--accent);
    padding: 12px 32px;
    cursor: pointer;
    margin-top: 16px;
    transition: all 0.2s;
  }

  .btn-retry:hover { background: rgba(78,204,163,0.1); }

  /* Disabled after submit */
  .option.locked { cursor: default; pointer-events: none; }

  /* Table support for Q3 */
  .q-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    margin: 12px 0 8px;
    color: var(--text);
  }

  .q-table th {
    border: 1px solid var(--muted);
    padding: 6px 12px;
    text-align: center;
    font-weight: 600;
    color: var(--accent2);
    background: var(--surface2);
    font-family: 'Source Serif 4', serif;
  }

  .q-table td {
    border: 1px solid rgba(255,255,255,0.1);
    padding: 6px 12px;
    text-align: center;
  }

  .q-table tr:nth-child(odd) td { background: rgba(255,255,255,0.02); }

  .diagram-wrap {
    margin: 16px 0 20px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 20px;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow-x: auto;
  }

  .diagram-wrap svg {
    max-width: 100%;
    height: auto;
    display: block;
  }

  .diagram-caption {
    font-size: 12px;
    color: var(--muted);
    text-align: center;
    margin-top: 10px;
    font-style: italic;
    letter-spacing: 0.04em;
  }

  @media (max-width: 600px) {
    .question-block { padding: 22px 18px; }
    header { padding: 40px 0 28px; }
    .score-big { font-size: 52px; }
  }
</style>
<body>
<div class="container">

  <header>
    <div class="exam-tag">Cambridge IGCSE · Biology 0610/22</div>
    <h1>Paper 2 <span>Multiple Choice</span><br>Extended</h1>
    <p class="subtitle">February / March 2022 — Revision Edition</p>
    <div class="meta-row">
      <div class="meta-item"><strong>40</strong> Questions</div>
      <div class="meta-item"><strong>40</strong> Marks</div>
      <div class="meta-item"><strong>45</strong> Minutes (suggested)</div>
    </div>
  </header>

  <div id="score-panel">
    <div class="score-title">Your Result</div>
    <div class="score-big"><span id="score-num">0</span><span class="score-max">/40</span></div>
    <div class="score-percent" id="score-pct"></div>
    <div class="score-grade" id="score-grade"></div>
    <div class="score-bar-wrap"><div class="score-bar-fill" id="score-bar"></div></div>
    <p style="font-size:14px;color:var(--muted);font-style:italic;">Scroll down to review each question with explanations.</p>
    <button class="btn-retry" onclick="location.reload()">↺ Start Again</button>
  </div>

  <div class="progress-bar-wrap">
    <div class="progress-info">
      <span>Progress</span>
      <span><span id="progress-count">0</span> / 40 answered</span>
    </div>
    <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
  </div>

  <div id="quiz"></div>

  <div class="submit-area">
    <button class="btn-submit" id="btn-submit" onclick="submitExam()">Submit Answers</button>
    <p class="unanswered-note" id="unanswered-note"></p>
  </div>

</div>
<script>
const questions = [
  {
    n: 1,
    q: "The diagrams show a test-tube containing pond water. The green colour is caused by microorganisms that have chloroplasts. Which characteristics of living organisms are shown?", diagram: `<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg" width="320" height="200">
<style>.tube{fill:#162030;stroke:#7a8199;stroke-width:2}.water-pale{fill:#1a3a1a;opacity:0.7}.water-dark{fill:#0d280d;opacity:0.9}.lbl{fill:#e8e6df;font-size:10px;font-family:serif;text-anchor:middle}.acc{fill:#4ecca3;font-size:10px;font-family:serif}<\/style>

<rect x="30" y="30" width="80" height="140" class="tube" rx="8"/>
<rect x="34" y="34" width="72" height="132" class="water-pale" rx="6"/>
<text x="70" y="185" class="lbl">light off</text>
<text x="70" y="18" class="lbl" style="fill:#7a8199">pale green</text>

<circle cx="50" cy="60" r="4" fill="#2d6020" opacity="0.8"/>
<circle cx="80" cy="75" r="5" fill="#2d6020" opacity="0.8"/>
<circle cx="60" cy="95" r="4" fill="#2d6020" opacity="0.8"/>

<circle cx="55" cy="130" r="4" fill="#2d6020" opacity="0.8"/>

<rect x="210" y="30" width="80" height="140" class="tube" rx="8"/>
<rect x="214" y="34" width="72" height="132" class="water-dark" rx="6"/>
<text x="250" y="185" class="lbl">light on</text>
<text x="250" y="18" class="lbl" style="fill:#4ecca3">dark green</text>

<circle cx="230" cy="65" r="5" fill="#1a4010" opacity="0.9"/>
<circle cx="260" cy="80" r="6" fill="#1a4010" opacity="0.9"/>
<circle cx="240" cy="105" r="5" fill="#1a4010" opacity="0.9"/>
<circle cx="270" cy="120" r="6" fill="#1a4010" opacity="0.9"/>
<circle cx="235" cy="145" r="4" fill="#1a4010" opacity="0.9"/>
<circle cx="265" cy="158" r="5" fill="#1a4010" opacity="0.9"/>

<circle cx="255" cy="42" r="7" fill="none" stroke="#6aafe0" stroke-width="1.8"/>

<circle cx="258" cy="65" r="4" fill="none" stroke="#6aafe0" stroke-width="1.5"/>

<text x="278" y="48" class="acc" style="fill:#6aafe0">O₂</text>
<line x1="270" y1="45" x2="263" y2="45" stroke="#6aafe0" stroke-width="0.8"/>

<rect x="214" y="34" width="72" height="50" fill="#0a1e0a" rx="6" opacity="0.6"/>
<text x="250" y="55" class="lbl" style="fill:#4ecca3">dark green</text>
<text x="250" y="67" class="lbl" style="fill:#4ecca3">area</text>
</svg>`, diagCaption: `Pond water test tube: light off = pale green; light on = dark green area with oxygen bubble rising`,
    opts: ["Excretion, growth and movement","Movement, nutrition and sensitivity","Nutrition, reproduction and respiration","Reproduction, sensitivity and growth"],
    ans: "B",
    exp: "The diagram shows: oxygen bubbles forming in light (nutrition = photosynthesis producing glucose/oxygen), the organisms moving toward/away from light (movement), and responding to the light stimulus (sensitivity). Reproduction is not shown. Answer = B."
  },
  {
    n: 2,
    q: "The key shows some features of living organisms used to place them into three kingdoms. Which row correctly identifies kingdoms X, Y and Z?", diagram: `<svg viewBox="0 0 400 180" xmlns="http://www.w3.org/2000/svg" width="400" height="180">
<style>.box{fill:#1e2335;stroke:#4a5568;stroke-width:1.2}.lbl{fill:#e8e6df;font-size:10px;font-family:serif;text-anchor:middle}.acc{fill:#4ecca3;font-size:10px;font-family:serif;text-anchor:middle}.line{stroke:#7a8199;stroke-width:1.5;fill:none}<\/style>

<text x="156" y="195" style="fill:#e8c547;font-size:8px;font-family:serif;text-anchor:middle">(Fungi)</text>

<text x="200" y="172" class="lbl" style="fill:#4ecca3;font-weight:bold">Answer C: X=Plant, Y=Fungi, Z=Prokaryote</text>
</svg>`, diagCaption: `Classification key: no nucleus → Z (Prokaryote); nucleus + cellulose cell wall → X (Plant); nucleus + non-cellulose cell wall → Y (Fungi)`,
    opts: ["X=Fungi, Y=Plant, Z=Prokaryote","X=Fungi, Y=Plant, Z=Protoctist","X=Plant, Y=Fungi, Z=Prokaryote","X=Plant, Y=Fungi, Z=Protoctist"],
    ans: "C",
    exp: "Z has no nucleus → Prokaryote. Of those with a nucleus: those with a cellulose cell wall → Plant (X); those with a non-cellulose cell wall (e.g. chitin) → Fungi (Y). Answer = C: X=Plant, Y=Fungi, Z=Prokaryote."
  },
  {
    n: 3,
    q: "The diagram shows a mitochondrion. The scale bar shows the actual size of 1 μm. The diagram is 70 mm long. What is the magnification of the diagram?", diagram: `<svg viewBox="0 0 320 150" xmlns="http://www.w3.org/2000/svg" width="320" height="150">

<line x1="40" y1="135" x2="116" y2="135" stroke="#e8e6df" stroke-width="2.5"/>
<text x="78" y="148" class="lbl" style="fill:#7a8199">1 μm (actual size)</text>

<line x1="40" y1="110" x2="280" y2="110" stroke="#e8c547" stroke-width="1.5"/>
<polygon points="40,107 34,110 40,113" fill="#e8c547"/>
<polygon points="280,107 286,110 280,113" fill="#e8c547"/>
<text x="160" y="106" class="lbl" style="fill:#e8c547">70 mm (diagram length)</text>

<text x="160" y="20" class="lbl" style="fill:#4ecca3;font-size:10px">Magnification = image ÷ actual = 70mm ÷ 0.001mm = ×70 000</text>
</svg>`, diagCaption: `Mitochondrion with scale bar: diagram = 70 mm, actual = 1 μm = 0.001 mm → magnification = 70 ÷ 0.001 = ×70 000`,
    opts: ["0.0007","70","7000","70 000"],
    ans: "D",
    exp: "Magnification = image size ÷ actual size. Convert 1 μm to mm: 1 μm = 0.001 mm. Magnification = 70 mm ÷ 0.001 mm = 70,000. Answer = D (×70 000)."
  },

let answered = {};
let submitted = false;

function letterToIndex(letter) {
  return letter.charCodeAt(0) - 65; // A=0, B=1, C=2, D=3
}

function buildQuiz() {
  const container = document.getElementById('quiz');
  questions.forEach((q, qi) => {
    const block = document.createElement('div');
    block.className = 'question-block';
    block.id = `q-${qi}`;

    let tableHTML = '';
    if (q.table) {
      tableHTML = '<table class="q-table"><thead><tr>';
      q.table.headers.forEach(h => { tableHTML += `<th>${h}</th>`; });
      tableHTML += '</tr></thead><tbody>';
      q.table.rows.forEach(row => {
        tableHTML += '<tr>';
        row.forEach((cell, ci) => {
          tableHTML += ci === 0 ? `<td><strong style="color:var(--accent2)">${cell}</strong></td>` : `<td>${cell}</td>`;
        });
        tableHTML += '</tr>';
      });
      tableHTML += '</tbody></table>';
    }

    const qTextFormatted = q.q.replace(/\n/g, '<br>');

    let diagHTML = '';
    if (q.diagram) {
      const cap = q.diagCaption ? `<div class="diagram-caption">${q.diagCaption}</div>` : '';
      diagHTML = `<div class="diagram-wrap">${q.diagram}</div>${cap}`;
    }

    let optsHTML = '';
    q.opts.forEach((opt, oi) => {
      const letter = String.fromCharCode(65 + oi);
      optsHTML += `
        <div class="option" id="q${qi}-opt${oi}" onclick="selectOption(${qi}, ${oi})">
          <div class="option-letter">${letter}</div>
          <div style="flex:1">${opt}</div>
          <div class="result-icon" id="q${qi}-icon${oi}"></div>
        </div>`;
    });

    block.innerHTML = `
      <div class="q-number">Question ${q.n} of 40</div>
      <div class="q-text">${qTextFormatted}</div>
      ${diagHTML}
      ${tableHTML ? `<div style="overflow-x:auto;margin:0 0 20px">${tableHTML}</div>` : ''}
      <div class="options">${optsHTML}</div>
      <div class="explanation" id="q${qi}-exp"></div>
    `;
    container.appendChild(block);
  });
}

function selectOption(qi, oi) {
  if (submitted) return;
  const prev = answered[qi];
  if (prev !== undefined) {
    document.getElementById(`q${qi}-opt${prev}`).classList.remove('selected');
  }
  answered[qi] = oi;
  document.getElementById(`q${qi}-opt${oi}`).classList.add('selected');
  document.getElementById(`q-${qi}`).classList.add('answered');
  updateProgress();
}

function updateProgress() {
  const count = Object.keys(answered).length;
  document.getElementById('progress-count').textContent = count;
  document.getElementById('progress-fill').style.width = (count / 40 * 100) + '%';
}

function submitExam() {
  const unanswered = questions.length - Object.keys(answered).length;
  if (unanswered > 0) {
    const note = document.getElementById('unanswered-note');
    note.style.display = 'block';
    note.textContent = `You have ${unanswered} unanswered question${unanswered > 1 ? 's' : ''}. Submit anyway or go back and answer them.`;
    if (!document.getElementById('btn-submit-confirm')) {
      const btn2 = document.createElement('button');
      btn2.className = 'btn-submit';
      btn2.id = 'btn-submit-confirm';
      btn2.style.marginTop = '14px';
      btn2.style.background = 'var(--accent2)';
      btn2.textContent = 'Submit Anyway';
      btn2.onclick = doSubmit;
      document.querySelector('.submit-area').appendChild(btn2);
    }
    return;
  }
  doSubmit();
}

function doSubmit() {
  submitted = true;
  document.getElementById('btn-submit').disabled = true;
  const conf = document.getElementById('btn-submit-confirm');
  if (conf) conf.disabled = true;

  let score = 0;
  questions.forEach((q, qi) => {
    const correctIdx = letterToIndex(q.ans);
    const userIdx = answered[qi];

    // Lock all options
    q.opts.forEach((_, oi) => {
      document.getElementById(`q${qi}-opt${oi}`).classList.add('locked');
    });

    // Show correct answer
    const correctEl = document.getElementById(`q${qi}-opt${correctIdx}`);

    if (userIdx !== undefined) {
      const userEl = document.getElementById(`q${qi}-opt${userIdx}`);
      const icon = document.getElementById(`q${qi}-icon${userIdx}`);
      if (userIdx === correctIdx) {
        userEl.classList.remove('selected');
        userEl.classList.add('correct');
        icon.style.display = 'block';
        icon.textContent = '✓';
        icon.style.color = 'var(--correct)';
        score++;
      } else {
        userEl.classList.remove('selected');
        userEl.classList.add('wrong');
        icon.style.display = 'block';
        icon.textContent = '✗';
        icon.style.color = 'var(--wrong)';
        correctEl.classList.add('show-correct');
        const correctIcon = document.getElementById(`q${qi}-icon${correctIdx}`);
        correctIcon.style.display = 'block';
        correctIcon.textContent = '✓';
        correctIcon.style.color = 'var(--correct)';
      }
    } else {
      // Not answered — just show correct
      correctEl.classList.add('show-correct');
      const correctIcon = document.getElementById(`q${qi}-icon${correctIdx}`);
      correctIcon.style.display = 'block';
      correctIcon.textContent = '✓';
      correctIcon.style.color = 'var(--correct)';
    }

    // Show explanation
    const expEl = document.getElementById(`q${qi}-exp`);
    expEl.innerHTML = `<strong>Answer: ${q.ans}</strong> — ${q.exp.replace(/\n/g,'<br>')}`;
    expEl.classList.add('visible');
  });

  // Score panel
  const pct = Math.round(score / 40 * 100);
  let grade = '';
  if (pct >= 90) grade = 'Exceptional — A*';
  else if (pct >= 80) grade = 'Excellent — A';
  else if (pct >= 70) grade = 'Strong — B';
  else if (pct >= 60) grade = 'Good — C';
  else if (pct >= 50) grade = 'Satisfactory — D';
  else grade = 'Keep Revising — E/U';

  document.getElementById('score-num').textContent = score;
  document.getElementById('score-pct').textContent = pct + '%';
  document.getElementById('score-grade').textContent = grade;

  const panel = document.getElementById('score-panel');
  panel.style.display = 'block';
  panel.scrollIntoView({ behavior: 'smooth', block: 'start' });

  setTimeout(() => {
    document.getElementById('score-bar').style.width = pct + '%';
  }, 300);

  updateProgress();
}

buildQuiz();

</script>
