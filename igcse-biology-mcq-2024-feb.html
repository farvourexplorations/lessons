<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cambridge IGCSE Biology 0610/22 — February/March 2024</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=DM+Mono:wght@400;500&family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f0f4f0;--surface:#f8fbf8;--surface2:#e2ead2;--ink:#121a12;--ink2:#2a3a2a;--muted:#6a826a;--accent:#2e7d32;--accent2:#1565c0;--correct:#1e8449;--wrong:#c0392b;--gold:#b7860b;--border:rgba(18,26,18,0.12);}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--ink);font-family:'Outfit',sans-serif;font-weight:300;min-height:100vh;line-height:1.7;}
.container{max-width:820px;margin:0 auto;padding:0 24px 100px;}
header{padding:56px 0 44px;border-bottom:2px solid var(--ink);margin-bottom:48px;position:relative;}
header::after{content:'';position:absolute;bottom:4px;left:0;right:0;height:1px;background:var(--ink);opacity:0.3;}
.exam-badge{display:inline-flex;align-items:center;gap:10px;margin-bottom:22px;}
.badge-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);}
.badge-text{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--accent);font-weight:500;}
h1{font-family:'Cormorant Garamond',serif;font-size:clamp(36px,6vw,62px);font-weight:700;line-height:1.05;color:var(--ink);margin-bottom:10px;}
h1 em{font-style:italic;color:var(--accent);}
.subtitle{font-family:'DM Mono',monospace;font-size:12px;color:var(--muted);letter-spacing:0.08em;margin-top:14px;}
.meta-row{display:flex;margin-top:28px;border:1px solid var(--border);border-radius:2px;overflow:hidden;width:fit-content;}
.meta-item{font-family:'DM Mono',monospace;font-size:11px;padding:8px 18px;border-right:1px solid var(--border);color:var(--muted);letter-spacing:0.06em;}
.meta-item:last-child{border-right:none;}
.meta-item strong{color:var(--ink2);font-weight:500;}
.progress-bar-wrap{position:sticky;top:0;z-index:100;background:var(--bg);padding:10px 0;border-bottom:1px solid var(--border);margin-bottom:36px;}
.progress-info{display:flex;justify-content:space-between;font-family:'DM Mono',monospace;font-size:11px;color:var(--muted);margin-bottom:6px;}
#progress-count{color:var(--accent2);font-weight:500;}
.progress-track{height:3px;background:var(--surface2);overflow:hidden;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));transition:width 0.4s ease;width:0%;}
.question-block{background:var(--surface);border:1px solid var(--border);border-left:4px solid transparent;padding:30px 28px;margin-bottom:18px;transition:border-left-color 0.2s,box-shadow 0.2s;}
.question-block:hover{box-shadow:0 2px 16px rgba(18,26,18,0.06);}
.question-block.answered{border-left-color:var(--accent2);}
.q-number{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;}
.q-text{font-size:15.5px;font-weight:400;color:var(--ink2);margin-bottom:16px;line-height:1.65;}
.diagram-wrap{margin:4px 0 20px;background:white;border:1px solid var(--border);padding:16px;display:flex;justify-content:center;border-radius:2px;}
.diagram-wrap svg{max-width:100%;height:auto;}
.q-table{width:100%;border-collapse:collapse;font-size:13.5px;margin:10px 0 20px;}
.q-table th{background:var(--surface2);border:1px solid var(--border);padding:7px 12px;font-weight:600;font-family:'DM Mono',monospace;font-size:11px;letter-spacing:0.05em;text-transform:uppercase;color:var(--ink2);text-align:center;}
.q-table td{border:1px solid var(--border);padding:7px 12px;text-align:center;color:var(--ink2);}
.q-table tr:nth-child(even) td{background:rgba(18,26,18,0.02);}
.options{display:flex;flex-direction:column;gap:8px;}
.option{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;border:1px solid var(--border);background:var(--bg);cursor:pointer;transition:all 0.13s ease;font-size:14.5px;line-height:1.55;user-select:none;border-radius:1px;}
.option:hover{border-color:var(--accent2);background:rgba(21,101,192,0.04);}
.option.selected{border-color:var(--accent2);background:rgba(21,101,192,0.07);}
.option-letter{flex-shrink:0;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--muted);display:flex;align-items:center;justify-content:center;font-family:'DM Mono',monospace;font-size:11px;font-weight:500;color:var(--muted);transition:all 0.13s;margin-top:1px;}
.option.selected .option-letter{border-color:var(--accent2);color:var(--accent2);background:rgba(21,101,192,0.12);}
.option.locked{cursor:not-allowed;}
.option.correct{border-color:var(--correct)!important;background:rgba(30,132,73,0.07)!important;}
.option.wrong{border-color:var(--wrong)!important;background:rgba(192,57,43,0.06)!important;}
.option.show-correct{border-color:var(--correct)!important;background:rgba(30,132,73,0.04)!important;}
.option.correct .option-letter{border-color:var(--correct);color:var(--correct);background:rgba(30,132,73,0.15);}
.option.wrong .option-letter{border-color:var(--wrong);color:var(--wrong);background:rgba(192,57,43,0.12);}
.option.show-correct .option-letter{border-color:var(--correct);color:var(--correct);}
.result-icon{display:none;font-size:14px;margin-left:auto;flex-shrink:0;align-self:center;}
.explanation{display:none;margin-top:18px;padding:14px 16px;background:rgba(18,26,18,0.03);border-left:3px solid var(--gold);font-size:13.5px;color:var(--ink2);line-height:1.65;font-style:italic;}
.explanation strong{font-family:'DM Mono',monospace;font-style:normal;font-size:12px;color:var(--gold);letter-spacing:0.05em;}
.explanation.visible{display:block;}
.submit-area{margin-top:44px;text-align:center;}
.btn-submit{font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:700;letter-spacing:0.06em;color:var(--surface);background:var(--ink);border:none;padding:16px 56px;cursor:pointer;transition:all 0.2s;border-radius:1px;}
.btn-submit:hover{background:var(--accent);transform:translateY(-1px);box-shadow:0 6px 24px rgba(46,125,50,0.25);}
.btn-submit:disabled{opacity:0.35;cursor:not-allowed;transform:none;box-shadow:none;}
.unanswered-note{font-family:'DM Mono',monospace;font-size:12px;color:var(--wrong);margin-top:12px;display:none;letter-spacing:0.04em;}
#score-panel{display:none;background:var(--ink);color:var(--bg);padding:52px 40px;text-align:center;margin-bottom:44px;position:relative;overflow:hidden;}
#score-panel::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--accent),var(--gold),var(--accent2));}
.score-title{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:0.2em;text-transform:uppercase;color:var(--muted);margin-bottom:18px;}
.score-big{font-family:'Cormorant Garamond',serif;font-size:80px;font-weight:700;line-height:1;color:var(--bg);margin-bottom:6px;}
.score-max{font-size:36px;color:var(--muted);}
.score-percent{font-family:'DM Mono',monospace;font-size:16px;color:var(--gold);margin-bottom:14px;letter-spacing:0.08em;}
.score-grade{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:600;color:var(--bg);margin-bottom:28px;font-style:italic;}
.score-bar-wrap{max-width:360px;margin:0 auto 28px;height:6px;background:rgba(240,244,240,0.1);}
.score-bar-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--gold));transition:width 0.9s cubic-bezier(0.22,1,0.36,1);width:0%;}
.btn-retry{font-family:'DM Mono',monospace;font-size:12px;letter-spacing:0.1em;color:var(--ink);background:var(--bg);border:none;padding:12px 32px;cursor:pointer;margin-top:8px;}
.btn-retry:hover{background:#ddeedd;}
@media(max-width:600px){.question-block{padding:22px 18px;}header{padding:40px 0 28px;}.score-big{font-size:56px;}.meta-row{flex-wrap:wrap;}}
</style>
</head>
<body>
<div class="container">
<header>
  <div class="exam-badge"><div class="badge-dot"></div><span class="badge-text">Cambridge IGCSE &middot; Biology 0610/22</span></div>
  <h1>Paper 2 <em>Multiple Choice</em><br>Extended</h1>
  <p class="subtitle">FEBRUARY / MARCH 2024 &mdash; REVISION EDITION</p>
  <div class="meta-row">
    <div class="meta-item"><strong>40</strong> Questions</div>
    <div class="meta-item"><strong>40</strong> Marks</div>
    <div class="meta-item"><strong>45</strong> Minutes</div>
  </div>
</header>
<div id="score-panel">
  <div class="score-title">Your Result</div>
  <div class="score-big"><span id="score-num">0</span><span class="score-max">/40</span></div>
  <div class="score-percent" id="score-pct"></div>
  <div class="score-grade" id="score-grade"></div>
  <div class="score-bar-wrap"><div class="score-bar-fill" id="score-bar"></div></div>
  <p style="font-size:13px;color:var(--muted);font-family:'DM Mono',monospace;letter-spacing:0.04em;">Scroll down to review each answer.</p>
  <button class="btn-retry" onclick="location.reload()">&#8634; Start Again</button>
</div>
<div class="progress-bar-wrap">
  <div class="progress-info"><span>Progress</span><span><span id="progress-count">0</span> / 40 answered</span></div>
  <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
</div>
<div id="quiz"></div>
<div class="submit-area">
  <button class="btn-submit" id="btn-submit" onclick="submitExam()">Submit Answers</button>
  <p class="unanswered-note" id="unanswered-note"></p>
</div>
</div>
<script>
const diagrams = {};

// Q2: Evolution tree — Homo sapiens ancestors
diagrams[2] = `<svg viewBox="0 0 380 200" xmlns="http://www.w3.org/2000/svg" font-family="Georgia,serif">
  <text x="190" y="13" text-anchor="middle" font-size="11" fill="#555">Evolution of Homo sapiens from earlier ancestors</text>

  <line x1="190" y1="52" x2="190" y2="70" stroke="#555" stroke-width="1.5" marker-end="url(#ev)"/>

diagrams[8] = `<svg viewBox="0 0 320 170" xmlns="http://www.w3.org/2000/svg" font-family="Georgia,serif">

// Q9: Active transport table (already a table in data, but show diagram of membrane)
diagrams[9] = `<svg viewBox="0 0 380 160" xmlns="http://www.w3.org/2000/svg" font-family="Georgia,serif">
  <text x="190" y="13" text-anchor="middle" font-size="11" fill="#555">Active transport across a cell membrane</text>
  <rect x="20" y="30" width="340" height="50" rx="0" fill="#b3e5fc" stroke="#0277bd" stroke-width="2"/>

// Q12: Enzyme activity vs temperature graph
diagrams[12] = `<svg viewBox="0 0 380 195" xmlns="http://www.w3.org/2000/svg" font-family="Georgia,serif">

// Q15: Leaf cross-section — cuticle labelled A (top layer)
diagrams[15] = `<svg viewBox="0 0 360 200" xmlns="http://www.w3.org/2000/svg" font-family="Georgia,serif">
  <text x="180" y="13" text-anchor="middle" font-size="11" fill="#555">Cross-section through part of a leaf</text>

  <text x="340" y="35" font-size="9" fill="#c0392b">cuticle</text>
  <!-- Upper epidermis B -->
  <rect x="50" y="38" width="260" height="16" rx="0" fill="#d4efdf" stroke="#1e8449" stroke-width="1.2"/>
  <text x="322" y="50" font-size="11" fill="#555" font-weight="bold">B</text>
  <text x="340" y="50" font-size="9" fill="#555">upper epidermis</text>
  <!-- Palisade cells C -->
  <rect x="50" y="54" width="260" height="52" rx="0" fill="#a9dfbf" stroke="#1e8449" stroke-width="1.2"/>

  {n:1,q:"Which characteristic of living organisms is represented by gas exchange in the alveoli?",opts:["Excretion","Growth","Nutrition","Reproduction"],ans:"A",exp:"Gas exchange in the alveoli involves taking in oxygen for respiration and releasing CO\u2082 \u2014 a waste product. Removing waste substances from the body is excretion. Answer = A."},
  {n:2,q:"The diagram shows how Homo sapiens could have evolved from earlier ancestors (Homo habilis \u2192 Homo erectus \u2192 Homo heidelbergensis \u2192 Homo sapiens). Which statement about modern people and their ancestors is correct?",opts:["They are the same species and the same genus.","They are the same species but not the same genus.","They are the same genus but not the same species.","They are neither the same species nor the same genus."],ans:"C",exp:"All are in the genus Homo (same first name) but are different species (habilis, erectus, heidelbergensis, sapiens). Same genus, different species. Answer = C.",diagram:2},
  {n:3,q:"What is a characteristic of both insects and arachnids?",opts:["Eight legs","Exoskeleton","Only three pairs of legs","Wings"],ans:"B",exp:"Both insects (class Insecta) and arachnids (class Arachnida) belong to the phylum Arthropoda and have an exoskeleton. Insects have 3 pairs of legs; arachnids have 4 pairs. Wings are only in some insects. Answer = B."},
  {n:4,q:"An animal can swim, has a backbone and produces milk. Which group does this animal belong to?",opts:["Amphibians","Fish","Mammals","Reptiles"],ans:"C",exp:"Producing milk is the defining characteristic of mammals. All mammals are vertebrates (have a backbone). Some mammals (like dolphins, whales) swim. Answer = C."},
  {n:5,q:"In which cell structure does aerobic respiration occur?",opts:["Mitochondrion","Nucleus","Ribosome","Vacuole"],ans:"A",exp:"Aerobic respiration occurs in the mitochondria, where glucose and oxygen are used to produce ATP. The nucleus stores DNA; ribosomes make proteins; vacuoles store substances. Answer = A."},
  {n:6,q:"Which formula shows the correct way to calculate the actual size of an object?",opts:["actual size = magnification \u00f7 image size","actual size = image size \u00f7 magnification","actual size = image size \u00d7 magnification","actual size = image size \u2212 magnification"],ans:"B",exp:"The magnification formula is: magnification = image size \u00f7 actual size. Rearranging: actual size = image size \u00f7 magnification. Answer = B."},
  {n:7,q:"What is a reason why oxygen diffuses into the blood from an alveolus in the lungs?",opts:["The O\u2082 concentration in the alveolus is greater than the CO\u2082 concentration in the blood.","The O\u2082 concentration in the alveolus is greater than the O\u2082 concentration in the blood.","The O\u2082 concentration in the blood is greater than the O\u2082 concentration in the alveolus.","The O\u2082 concentration in the blood is greater than the CO\u2082 concentration in the alveolus."],ans:"B",exp:"Diffusion moves substances from high to low concentration. O\u2082 diffuses from alveolus into blood because the O\u2082 concentration is higher in the alveolus than in the blood (where O\u2082 has been used in respiration). Answer = B."},
  {n:8,q:"The diagram shows two plant cells. Cell X has high water potential; Cell Y has low water potential. Which statement describes what will happen to the water in the cells?",opts:["Equal movement between cells","Net movement from cell X to cell Y","Net movement from cell Y to cell X","No movement between cells"],ans:"B",exp:"Water moves by osmosis from higher water potential to lower water potential. Cell X has higher water potential \u2192 water moves from X to Y. Answer = B.",diagram:8},
  {n:9,q:"Which row describes active transport?",table:{headers:["","Requires protein carrier","Requires energy from respiration","Moves substances from lower to higher concentration"],rows:[["A","no","no","no"],["B","no","no","yes"],["C","yes","yes","no"],["D","yes","yes","yes"]]},opts:["A","B","C","D"],ans:"D",exp:"Active transport requires: (1) carrier proteins in the membrane, (2) energy from respiration (ATP), and (3) moves substances against the concentration gradient (low \u2192 high). Answer = D.",diagram:9},
  {n:10,q:"Which row shows the elements that make up a carbohydrate molecule?",table:{headers:["","Carbon","Hydrogen","Nitrogen","Oxygen"],rows:[["A","no","no","yes","yes"],["B","no","yes","no","yes"],["C","yes","yes","no","yes"],["D","yes","yes","yes","no"]]},opts:["A","B","C","D"],ans:"C",exp:"Carbohydrates contain carbon (C), hydrogen (H) and oxygen (O) only. The general formula is Cx(H\u2082O)y. No nitrogen. Answer = C."},
  {n:11,q:"Which row names the large molecule and the small molecules it is made from?",table:{headers:["","Large molecule","Small molecules"],rows:[["A","cellulose","glucose"],["B","fat","glycogen"],["C","glycogen","fatty acid"],["D","starch","amino acid"]]},opts:["A","B","C","D"],ans:"A",exp:"Cellulose is a structural polysaccharide made from glucose monomers (like starch and glycogen). Fat is made from glycerol + fatty acids. Proteins are made from amino acids. Answer = A."},
  {n:12,q:"The graph shows the effect of temperature on enzyme activity, with points 1 (below optimum) and 2 (above optimum, activity near zero). Which statements about the enzyme at temperatures 1 and 2 are correct?",opts:["Temp 1: enzymes denature; Temp 2: enzymes denature","Temp 1: enzymes denature; Temp 2: less kinetic energy","Temp 1: complementary shapes; Temp 2: enzyme denatured (active site changes shape)","Temp 1: same shape enzyme/substrate; Temp 2: substrate fits active site"],ans:"D",exp:"At temperature 1 (below optimum): enzyme and substrate still have complementary shapes so substrate fits into the active site, but rate is low due to less kinetic energy. At temperature 2 (above optimum): the enzyme is denatured \u2014 the active site changes shape so the substrate cannot fit. Answer = D.",diagram:12},
  {n:13,q:"The graph shows rate of photosynthesis vs temperature at high, medium and low light intensities. Point X is on the low light intensity curve where it has become flat. What is the limiting factor at point X?",opts:["Neither light intensity nor temperature","Temperature only","Light intensity only","Both light intensity and temperature"],ans:"C",exp:"At point X, the low light intensity curve is flat \u2014 increasing temperature does not increase the rate. This means temperature is NOT limiting. The rate is limited by light intensity (which is fixed at low). Answer = C.",diagram:13},
  {n:14,q:"In plants, which ions are used to make amino acids?",opts:["Magnesium","Nitrates","Phosphates","Potassium"],ans:"B",exp:"Amino acids contain nitrogen. Plants absorb nitrate ions (NO\u2083\u207b) from the soil and use them to make amino acids and proteins. Magnesium is for chlorophyll; phosphates for ATP/DNA. Answer = B."},
  {n:15,q:"The diagram shows a cross-section of part of a leaf. Which labelled structure is the cuticle?",opts:["A","B","C","D"],ans:"A",exp:"The cuticle is the waxy, waterproof layer on the outermost surface of the leaf (upper and lower epidermis). It is labelled A \u2014 the thin layer at the very top of the leaf. Answer = A.",diagram:15},
  {n:16,q:"The table shows minerals and vitamins in four foods. Which food would be best for a child who has rickets?",opts:["Food A (calcium \u2713, iron \u2717, vitamin C \u2713, vitamin D \u2717)","Food B (calcium \u2713, iron \u2717, vitamin C \u2717, vitamin D \u2713)","Food C (calcium \u2717, iron \u2713, vitamin C \u2713, vitamin D \u2717)","Food D (calcium \u2717, iron \u2713, vitamin C \u2717, vitamin D \u2713)"],ans:"B",exp:"Rickets is caused by vitamin D deficiency (bones fail to develop properly). Treatment also needs calcium. Food B has both calcium AND vitamin D. Answer = B.",diagram:16},
  {n:17,q:"Which food group is chemically digested in the mouth, passes through the stomach and continues to be broken down by chemical digestion in the small intestine?",opts:["Carbohydrates","Mineral salts","Proteins","Vitamins"],ans:"A",exp:"Carbohydrates: amylase in the mouth starts digestion \u2192 passes through stomach (no carbohydrate digestion) \u2192 amylase + maltase in small intestine complete digestion. Proteins are only digested in stomach + small intestine. Answer = A."},
  {n:18,q:"Which row about bile is correct?",table:{headers:["","Process","Effect on fat droplet surface area","Organ where bile is produced"],rows:[["A","gall bladder","increases","chemical digestion"],["B","gall bladder","decreases","physical digestion"],["C","liver","decreases","chemical digestion"],["D","liver","increases","physical digestion"]]},opts:["A","B","C","D"],ans:"D",exp:"Bile is produced in the liver (stored in gall bladder). It emulsifies fat \u2014 breaking large fat droplets into smaller ones, increasing surface area. This is physical digestion (no enzymes involved). Answer = D."},
  {n:19,q:"These are features of villi:\n1. Each villus contains a network of capillaries.\n2. Each villus contains a lacteal.\n3. The surface of each epithelial cell is covered with microvilli.\n4. Villi increase the internal surface area of the small intestine.\n\nWhich statements are important for the efficient absorption of glucose?",opts:["1, 2, 3 and 4","1, 3 and 4 only","1 and 3 only","2 and 4 only"],ans:"B",exp:"Glucose is absorbed into capillaries (statement 1 \u2713). Microvilli increase surface area further (statement 3 \u2713). Villi increase overall surface area (statement 4 \u2713). The lacteal (statement 2) is for fatty acids, not glucose. Answer = B."},

  {n:22,q:"The diagram shows part of the human circulatory system with vessels A, B, C, D. Which structure is the hepatic vein?",opts:["A","B","C","D"],ans:"D",exp:"The hepatic vein carries deoxygenated blood FROM the liver BACK to the heart (specifically to the vena cava). In the diagram, D connects the liver to the heart going upward. Answer = D.",diagram:22},
  {n:23,q:"What is a feature of passive immunity?",opts:["Antibodies are acquired from another individual.","It can be gained through infection with a pathogen.","Long-term protection is gained.","Memory cells are produced."],ans:"A",exp:"Passive immunity involves receiving ready-made antibodies from another individual (e.g. mother\u2019s antibodies through breast milk, or antiserum injection). It is short-lived (no memory cells). Answer = A."},
  {n:24,q:"The graph shows the change in rate of breathing of an athlete, with a period Y showing a rapid increase. What causes the response during time period Y?",opts:["A decrease in the concentration of oxygen in the blood","A decrease in the concentration of urea in the blood","An increase in the concentration of carbon dioxide in the blood","An increase in the concentration of red blood cells in the blood"],ans:"C",exp:"During exercise, cells respire faster producing more CO\u2082. Rising CO\u2082 in the blood is detected by the breathing centre in the brain, which sends nerve impulses to increase the rate and depth of breathing. Answer = C.",diagram:24},
  {n:25,q:"These are processes that occur in plants:\n1. Active transport\n2. Cell division\n3. Osmosis\n4. Transpiration\n\nWhich processes use energy from respiration?",opts:["1 and 2","1 and 4","2 and 3","3 and 4"],ans:"A",exp:"Active transport (1) requires ATP from respiration to move substances against a concentration gradient. Cell division (2) requires ATP for DNA replication and spindle formation. Osmosis (3) and transpiration (4) are passive processes \u2014 no energy needed. Answer = A."},
  {n:26,q:"What is the balanced equation for anaerobic respiration in yeast?",opts:["6O\u2082 + C\u2086H\u2081\u2082O\u2086 \u2192 6CO\u2082 + 6H\u2082O","C\u2086H\u2081\u2082O\u2086 \u2192 2C\u2082H\u2085OH + 2CO\u2082","C\u2086H\u2081\u2082O\u2086 \u2192 2C\u2083H\u2086O\u2083","6CO\u2082 + 6H\u2082O \u2192 C\u2086H\u2081\u2082O\u2086 + 6O\u2082"],ans:"B",exp:"Yeast anaerobic respiration (fermentation): glucose \u2192 ethanol (alcohol) + carbon dioxide. Balanced: C\u2086H\u2081\u2082O\u2086 \u2192 2C\u2082H\u2085OH + 2CO\u2082. Option C is lactic acid fermentation (in animals). Answer = B."},
  {n:27,q:"Which labelled organ has a major role in the assimilation of amino acids by converting them to proteins?",opts:["A","B","C","D"],ans:"A",exp:"The liver is the main site of protein synthesis from amino acids (assimilation). It also deaminates excess amino acids. In the body diagram, the liver is labelled A. Answer = A.",diagram:27},
  {n:28,q:"A toxin with the same shape as a neurotransmitter prevents muscle contraction. Which statement explains why the toxin prevents muscle contraction?",opts:["The toxin blocks the binding of neurotransmitters to receptors on motor neurones.","The toxin increases the release of neurotransmitters from relay neurones.","The toxin increases the release of neurotransmitters from sensory neurones.","The toxin stimulates impulses in motor neurones."],ans:"A",exp:"The toxin has the same shape as the neurotransmitter, so it fits into and blocks the receptors on the motor neurone (or muscle). The real neurotransmitter cannot bind, so no signal reaches the muscle, and no contraction occurs. Answer = A."},
  {n:29,q:"The diagram shows the structure of the human eye with structures labelled A, B, C and D. Which labelled part refracts light entering the eye?",opts:["A","B","C","D"],ans:"D",exp:"The cornea is the transparent curved front of the eye that refracts (bends) most of the light entering the eye. In the diagram it is the outermost curved structure on the front \u2014 labelled D. The lens also refracts light but the cornea does most of the work. Answer = D.",diagram:29},
  {n:30,q:"A patient is injected with adrenaline. Which graph shows the expected changes to pulse rate and blood glucose concentration?",opts:["Graph A","Graph B","Graph C","Graph D"],ans:"C",exp:"Adrenaline (the fight-or-flight hormone) increases heart rate (pulse rate rises) AND stimulates the liver to release glycogen as glucose (blood glucose rises). Both increase then gradually return to normal. Answer = C.",diagram:30},
  {n:31,q:"The diagram shows the shoot and root of a seedling responding to gravity. Which row shows where auxin accumulates and the effect in the shoot?",table:{headers:["","Accumulates","Effect"],rows:[["A","lower surface","inhibits cell elongation"],["B","lower surface","promotes cell elongation"],["C","upper surface","inhibits cell division"],["D","upper surface","promotes cell division"]]},opts:["A","B","C","D"],ans:"B",exp:"In a horizontal shoot, gravity causes auxin to accumulate on the lower surface. In shoots, auxin promotes cell elongation \u2014 cells on the lower side elongate more, causing the shoot to bend upward (negative gravitropism). Answer = B.",diagram:31},
  {n:32,q:"Which factors would increase the chance of antibiotic resistance developing?\n1. Regularly giving antibiotics to healthy livestock\n2. Only using antibiotics to treat bacterial infections\n3. Using several different antibiotics to treat an infection\n4. Using good personal hygiene to avoid infection",opts:["1 and 2","1 and 3","2 and 4","3 and 4"],ans:"B",exp:"Giving antibiotics to healthy livestock (1) exposes bacteria unnecessarily, selecting for resistance. Using multiple antibiotics (3) puts more selection pressure and may select for multi-drug-resistant strains. Good hygiene (4) reduces infections (helps). Only using antibiotics for bacterial infections (2) is responsible use. Answer = B."},
  {n:33,q:"What is an advantage of using asexual reproduction in crop plants?",opts:["It can reliably produce many crop plants with a desirable characteristic.","It increases genetic variation.","It only requires wind pollination.","It reduces the chance of a new disease spreading through all the crop plants."],ans:"A",exp:"Asexual reproduction produces genetically identical offspring (clones). If a parent plant has a desirable trait (e.g. disease resistance, high yield), all clones will reliably have that trait. It does NOT increase variation \u2014 that\u2019s a disadvantage. Answer = A."},
  {n:34,q:"The graphs show concentrations of four hormones controlling the menstrual cycle. Which line represents FSH (follicle-stimulating hormone)?",opts:["A","B","C","D"],ans:"B",exp:"FSH is released from the pituitary gland early in the cycle (days 1\u20137) to stimulate follicle development. It peaks around day 5\u20137 then falls. In the graph, line B shows this early peak pattern. Answer = B.",diagram:34},
  {n:35,q:"Mitotic index = % of cells dividing. Tissue X: 80 total, 25 dividing. Tissue Y: 110 total, 15 dividing. Which statement is correct?",opts:["Tissue X is growing fastest with a mitotic index of 31.3%.","Tissue X is growing fastest with a mitotic index of 45.4%.","Tissue Y is growing fastest with a mitotic index of 13.6%.","Tissue Y is growing fastest with a mitotic index of 15.8%."],ans:"A",exp:"Tissue X: (25 \u00f7 80) \u00d7 100 = 31.3%. Tissue Y: (15 \u00f7 110) \u00d7 100 = 13.6%. Tissue X has a higher mitotic index so is growing faster. Answer = A.",diagram:35},
  {n:36,q:"Fruit fly cross: female X\u1d3f X\u1d3f (red-eyed) \u00d7 male X\u1d3f Y (red-eyed). R = red eyes (dominant), r = white eyes. What percentage of offspring will have red eyes?",opts:["25%","50%","75%","100%"],ans:"C",exp:"Cross: X\u1d3fX\u691f \u00d7 X\u1d3fY \u2192 X\u1d3fX\u1d3f (red \u2640), X\u1d3fY (red \u2642), X\u691fX\u1d3f (red \u2640 carrier), X\u691fY (white \u2642). 3 out of 4 offspring have red eyes = 75%. Answer = C.",diagram:36},
  {n:37,q:"Which statement about variation is correct?",opts:["ABO blood groups show continuous variation.","Body mass shows discontinuous variation.","Seed colour in peas shows continuous variation.","Seed shape in peas shows discontinuous variation."],ans:"D",exp:"Seed shape in peas is either round or wrinkled \u2014 distinct categories, no intermediates = discontinuous variation. ABO blood groups are also discontinuous. Body mass is continuous (range of values). Seed colour (yellow/green) is discontinuous. Answer = D."},
  {n:38,q:"Which row shows part of the nitrogen cycle?",table:{headers:["","Name of process","Chemical changed","Chemical produced"],rows:[["A","decomposition","ammonium ions","protein"],["B","denitrification","nitrate ions","ammonium ions"],["C","nitrogen fixation","nitrate ions","nitrogen gas"],["D","nitrification","ammonium ions","nitrate ions"]]},opts:["A","B","C","D"],ans:"D",exp:"Nitrification: nitrifying bacteria convert ammonium ions (NH\u2084\u207a) into nitrate ions (NO\u2083\u207b). Denitrification converts nitrates to N\u2082 gas. Nitrogen fixation converts N\u2082 to ammonium. Decomposition converts protein to ammonium. Answer = D."},
  {n:39,q:"In IVF for captive breeding, these steps occur:\n1. The egg cell is fertilised.\n2. The egg cell is removed from an ovary.\n3. The embryo is implanted into the uterus.\n4. The sperm cells are added.\n\nIn which order do these processes occur?",opts:["2 \u2192 3 \u2192 4 \u2192 1","2 \u2192 4 \u2192 1 \u2192 3","4 \u2192 1 \u2192 2 \u2192 3","4 \u2192 3 \u2192 2 \u2192 1"],ans:"B",exp:"IVF sequence: egg is removed from ovary (2) \u2192 sperm are added to the egg in a dish (4) \u2192 fertilisation occurs (1) \u2192 embryo is implanted into the uterus (3). Order: 2 \u2192 4 \u2192 1 \u2192 3. Answer = B."},
  {n:40,q:"The diagram shows a bacterial cell with structures labelled A, B, C and D. Which cell structure is useful in genetic modification?",opts:["A","B","C","D"],ans:"B",exp:"Plasmids (small circular DNA molecules) are the key structures used in genetic modification. They can be extracted, cut open with restriction enzymes, a human gene inserted, and then reintroduced into bacteria. The plasmid is labelled B. Answer = B.",diagram:40}

let answered={},submitted=false;
function letterToIndex(l){return l.charCodeAt(0)-65;}
function buildQuiz(){
  const c=document.getElementById('quiz');
  questions.forEach((q,qi)=>{
    const block=document.createElement('div');
    block.className='question-block';block.id='q-'+qi;
    let tHTML='';
    if(q.table){
      tHTML='<table class="q-table"><thead><tr>';
      q.table.headers.forEach(h=>{tHTML+='<th>'+h+'</th>';});
      tHTML+='</tr></thead><tbody>';
      q.table.rows.forEach(row=>{
        tHTML+='<tr>';
        row.forEach((cell,ci)=>{tHTML+=ci===0?'<td><strong style="font-family:\'DM Mono\',monospace;font-size:12px;color:var(--accent)">'+cell+'</strong></td>':'<td>'+cell+'</td>';});
        tHTML+='</tr>';
      });
      tHTML+='</tbody></table>';
    }
    let dHTML='';
    if(q.diagram&&diagrams[q.diagram]){dHTML='<div class="diagram-wrap">'+diagrams[q.diagram]+'</div>';}
    let oHTML='';
    q.opts.forEach((opt,oi)=>{
      const l=String.fromCharCode(65+oi);
      oHTML+='<div class="option" id="q'+qi+'-opt'+oi+'" onclick="selectOption('+qi+','+oi+')"><div class="option-letter">'+l+'</div><div style="flex:1">'+opt+'</div><div class="result-icon" id="q'+qi+'-icon'+oi+'"></div></div>';
    });
    block.innerHTML='<div class="q-number">Question '+q.n+' &nbsp;/&nbsp; 40</div><div class="q-text">'+q.q.replace(/\n/g,'<br>')+'</div>'+dHTML+(tHTML?'<div style="overflow-x:auto;margin:0 0 18px">'+tHTML+'</div>':'')+'<div class="options">'+oHTML+'</div><div class="explanation" id="q'+qi+'-exp"></div>';
    c.appendChild(block);
  });
}
function selectOption(qi,oi){
  if(submitted)return;
  const prev=answered[qi];
  if(prev!==undefined)document.getElementById('q'+qi+'-opt'+prev).classList.remove('selected');
  answered[qi]=oi;
  document.getElementById('q'+qi+'-opt'+oi).classList.add('selected');
  document.getElementById('q-'+qi).classList.add('answered');
  updateProgress();
}
function updateProgress(){
  const count=Object.keys(answered).length;
  document.getElementById('progress-count').textContent=count;
  document.getElementById('progress-fill').style.width=(count/40*100)+'%';
}
function submitExam(){
  const u=questions.length-Object.keys(answered).length;
  if(u>0){
    const note=document.getElementById('unanswered-note');
    note.style.display='block';
    note.textContent=u+' question'+(u>1?'s':'')+' unanswered. Submit anyway or keep going.';
    if(!document.getElementById('btn-confirm')){
      const b=document.createElement('button');
      b.className='btn-submit';b.id='btn-confirm';b.style.cssText='margin-top:14px;background:var(--gold)';
      b.textContent='Submit Anyway';b.onclick=doSubmit;
      document.querySelector('.submit-area').appendChild(b);
    }
    return;
  }
  doSubmit();
}
function doSubmit(){
  submitted=true;
  document.getElementById('btn-submit').disabled=true;
  const conf=document.getElementById('btn-confirm');if(conf)conf.disabled=true;
  let score=0;
  questions.forEach((q,qi)=>{
    const ci=letterToIndex(q.ans),ui=answered[qi];
    q.opts.forEach((_,oi)=>document.getElementById('q'+qi+'-opt'+oi).classList.add('locked'));
    const correctEl=document.getElementById('q'+qi+'-opt'+ci);
    if(ui!==undefined){
      const uEl=document.getElementById('q'+qi+'-opt'+ui);
      const icon=document.getElementById('q'+qi+'-icon'+ui);
      if(ui===ci){uEl.classList.remove('selected');uEl.classList.add('correct');icon.style.display='block';icon.textContent='\u2713';icon.style.color='var(--correct)';score++;}
      else{uEl.classList.remove('selected');uEl.classList.add('wrong');icon.style.display='block';icon.textContent='\u2717';icon.style.color='var(--wrong)';correctEl.classList.add('show-correct');const ci2=document.getElementById('q'+qi+'-icon'+ci);ci2.style.display='block';ci2.textContent='\u2713';ci2.style.color='var(--correct)';}
    } else {correctEl.classList.add('show-correct');const ci2=document.getElementById('q'+qi+'-icon'+ci);ci2.style.display='block';ci2.textContent='\u2713';ci2.style.color='var(--correct)';}
    const expEl=document.getElementById('q'+qi+'-exp');
    expEl.innerHTML='<strong>ANSWER: '+q.ans+'</strong> \u2014 '+q.exp.replace(/\n/g,'<br>');
    expEl.classList.add('visible');
  });
  const pct=Math.round(score/40*100);
  let grade=pct>=90?'Exceptional \u2014 A*':pct>=80?'Excellent \u2014 A':pct>=70?'Strong \u2014 B':pct>=60?'Good \u2014 C':pct>=50?'Satisfactory \u2014 D':'Keep Revising \u2014 E/U';
  document.getElementById('score-num').textContent=score;
  document.getElementById('score-pct').textContent=pct+'%';
  document.getElementById('score-grade').textContent=grade;
  const panel=document.getElementById('score-panel');
  panel.style.display='block';panel.scrollIntoView({behavior:'smooth',block:'start'});
  setTimeout(()=>{document.getElementById('score-bar').style.width=pct+'%';},300);
  updateProgress();
}
buildQuiz();
</script>
