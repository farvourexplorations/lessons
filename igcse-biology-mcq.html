<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cambridge IGCSE Biology — Paper 2 Revision</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Source+Serif+4:ital,wght@0,300;0,400;0,600;1,300&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f1117;
    --surface: #181c27;
    --surface2: #1e2335;
    --accent: #4ecca3;
    --accent2: #e8c547;
    --text: #e8e6df;
    --muted: #7a8199;
    --correct: #4ecca3;
    --wrong: #e05c5c;
    --border: rgba(255,255,255,0.07);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Source Serif 4', Georgia, serif;
    font-weight: 300;
    min-height: 100vh;
    line-height: 1.7;
  }

  /* Subtle grid background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: 
      linear-gradient(rgba(78,204,163,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(78,204,163,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  .container {
    max-width: 860px;
    margin: 0 auto;
    padding: 0 24px 80px;
    position: relative;
    z-index: 1;
  }

  /* Header */
  header {
    padding: 60px 0 40px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 48px;
  }

  .exam-tag {
    display: inline-block;
    font-family: 'Source Serif 4', serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--accent);
    border: 1px solid var(--accent);
    padding: 4px 12px;
    margin-bottom: 20px;
  }

  h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(28px, 5vw, 48px);
    font-weight: 900;
    line-height: 1.1;
    color: #fff;
    margin-bottom: 12px;
  }

  h1 span { color: var(--accent); }

  .subtitle {
    font-size: 15px;
    color: var(--muted);
    font-style: italic;
  }

  .meta-row {
    display: flex;
    gap: 32px;
    margin-top: 24px;
    flex-wrap: wrap;
  }

  .meta-item {
    font-size: 13px;
    color: var(--muted);
    letter-spacing: 0.05em;
  }

  .meta-item strong {
    color: var(--accent2);
    font-style: normal;
    font-weight: 600;
  }

  /* Progress bar */
  .progress-bar-wrap {
    position: sticky;
    top: 0;
    z-index: 100;
    background: var(--bg);
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
    margin-bottom: 40px;
  }

  .progress-info {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 6px;
    letter-spacing: 0.05em;
  }

  #progress-count { color: var(--accent); font-weight: 600; }

  .progress-track {
    height: 3px;
    background: var(--surface2);
    border-radius: 2px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 2px;
    transition: width 0.4s ease;
    width: 0%;
  }

  /* Questions */
  .question-block {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 32px;
    margin-bottom: 20px;
    transition: border-color 0.2s;
    position: relative;
  }

  .question-block:hover { border-color: rgba(78,204,163,0.2); }

  .question-block.answered { border-color: rgba(78,204,163,0.15); }

  .q-number {
    font-family: 'Playfair Display', serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 10px;
  }

  .q-text {
    font-size: 16px;
    color: var(--text);
    margin-bottom: 24px;
    line-height: 1.65;
  }

  .q-text .note {
    font-style: italic;
    color: var(--muted);
    font-size: 14px;
    display: block;
    margin-top: 6px;
  }

  .options {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .option {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    padding: 14px 16px;
    border: 1px solid var(--border);
    border-radius: 2px;
    cursor: pointer;
    transition: all 0.15s ease;
    background: var(--surface2);
    font-size: 15px;
    line-height: 1.55;
    user-select: none;
  }

  .option:hover {
    border-color: rgba(78,204,163,0.4);
    background: rgba(78,204,163,0.04);
  }

  .option.selected {
    border-color: var(--accent);
    background: rgba(78,204,163,0.08);
  }

  .option-letter {
    flex-shrink: 0;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    border: 1px solid var(--muted);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Playfair Display', serif;
    font-size: 12px;
    font-weight: 700;
    color: var(--muted);
    transition: all 0.15s;
    margin-top: 1px;
  }

  .option.selected .option-letter {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(78,204,163,0.15);
  }

  /* Results state */
  .option.correct {
    border-color: var(--correct) !important;
    background: rgba(78,204,163,0.1) !important;
  }

  .option.wrong {
    border-color: var(--wrong) !important;
    background: rgba(224,92,92,0.08) !important;
  }

  .option.correct .option-letter {
    border-color: var(--correct);
    color: var(--correct);
    background: rgba(78,204,163,0.2);
  }

  .option.wrong .option-letter {
    border-color: var(--wrong);
    color: var(--wrong);
    background: rgba(224,92,92,0.15);
  }

  .option.show-correct {
    border-color: var(--correct) !important;
    background: rgba(78,204,163,0.05) !important;
  }

  .option.show-correct .option-letter {
    border-color: var(--correct);
    color: var(--correct);
  }

  .result-icon {
    display: none;
    font-size: 16px;
    margin-left: auto;
    flex-shrink: 0;
    align-self: center;
  }

  .explanation {
    display: none;
    margin-top: 20px;
    padding: 16px 18px;
    background: rgba(232,197,71,0.06);
    border-left: 3px solid var(--accent2);
    font-size: 14px;
    color: #c9c5b8;
    line-height: 1.65;
    border-radius: 0 2px 2px 0;
  }

  .explanation strong { color: var(--accent2); }

  .explanation.visible { display: block; }

  /* Submit / Results section */
  .submit-area {
    margin-top: 48px;
    text-align: center;
  }

  .btn-submit {
    font-family: 'Playfair Display', serif;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--bg);
    background: var(--accent);
    border: none;
    padding: 18px 56px;
    cursor: pointer;
    border-radius: 2px;
    transition: all 0.2s;
  }

  .btn-submit:hover {
    background: #5fe0b5;
    transform: translateY(-1px);
    box-shadow: 0 8px 32px rgba(78,204,163,0.25);
  }

  .btn-submit:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    transform: none;
    box-shadow: none;
  }

  .unanswered-note {
    font-size: 13px;
    color: var(--wrong);
    margin-top: 12px;
    font-style: italic;
    display: none;
  }

  /* Score panel */
  #score-panel {
    display: none;
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 48px 40px;
    text-align: center;
    margin-bottom: 48px;
    position: relative;
    overflow: hidden;
  }

  #score-panel::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--accent), var(--accent2), var(--accent));
  }

  .score-title {
    font-family: 'Playfair Display', serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 16px;
  }

  .score-big {
    font-family: 'Playfair Display', serif;
    font-size: 72px;
    font-weight: 900;
    line-height: 1;
    color: var(--accent);
    margin-bottom: 8px;
  }

  .score-max { font-size: 32px; color: var(--muted); }

  .score-percent {
    font-size: 20px;
    color: var(--accent2);
    margin-bottom: 16px;
    font-style: italic;
  }

  .score-grade {
    font-family: 'Playfair Display', serif;
    font-size: 18px;
    font-weight: 700;
    color: #fff;
    margin-bottom: 24px;
  }

  .score-bar-wrap {
    max-width: 400px;
    margin: 0 auto 24px;
    height: 8px;
    background: var(--surface2);
    border-radius: 4px;
    overflow: hidden;
  }

  .score-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 4px;
    transition: width 1.2s cubic-bezier(0.4,0,0.2,1);
    width: 0;
  }

  .btn-retry {
    font-family: 'Playfair Display', serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--accent);
    background: transparent;
    border: 1px solid var(--accent);
    padding: 12px 32px;
    cursor: pointer;
    margin-top: 16px;
    transition: all 0.2s;
  }

  .btn-retry:hover { background: rgba(78,204,163,0.1); }

  /* Disabled after submit */
  .option.locked { cursor: default; pointer-events: none; }

  /* Table support for Q3 */
  .q-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    margin: 12px 0 8px;
    color: var(--text);
  }

  .q-table th {
    border: 1px solid var(--muted);
    padding: 6px 12px;
    text-align: center;
    font-weight: 600;
    color: var(--accent2);
    background: var(--surface2);
    font-family: 'Source Serif 4', serif;
  }

  .q-table td {
    border: 1px solid rgba(255,255,255,0.1);
    padding: 6px 12px;
    text-align: center;
  }

  .q-table tr:nth-child(odd) td { background: rgba(255,255,255,0.02); }

  .diagram-wrap {
    margin: 16px 0 20px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 20px;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow-x: auto;
  }

  .diagram-wrap svg {
    max-width: 100%;
    height: auto;
    display: block;
  }

  .diagram-caption {
    font-size: 12px;
    color: var(--muted);
    text-align: center;
    margin-top: 10px;
    font-style: italic;
    letter-spacing: 0.04em;
  }

  @media (max-width: 600px) {
    .question-block { padding: 22px 18px; }
    header { padding: 40px 0 28px; }
    .score-big { font-size: 52px; }
  }
</style>
</head>
<body>
<div class="container">

  <header>
    <div class="exam-tag">Cambridge IGCSE · Biology 0610/22</div>
    <h1>Paper 2 <span>Multiple Choice</span><br>Extended</h1>
    <p class="subtitle">February / March 2025 — Revision Edition</p>
    <div class="meta-row">
      <div class="meta-item"><strong>40</strong> Questions</div>
      <div class="meta-item"><strong>40</strong> Marks</div>
      <div class="meta-item"><strong>45</strong> Minutes (suggested)</div>
    </div>
  </header>

  <div id="score-panel">
    <div class="score-title">Your Result</div>
    <div class="score-big"><span id="score-num">0</span><span class="score-max">/40</span></div>
    <div class="score-percent" id="score-pct"></div>
    <div class="score-grade" id="score-grade"></div>
    <div class="score-bar-wrap"><div class="score-bar-fill" id="score-bar"></div></div>
    <p style="font-size:14px;color:var(--muted);font-style:italic;">Scroll down to review each question with explanations.</p>
    <button class="btn-retry" onclick="location.reload()">↺ Start Again</button>
  </div>

  <div class="progress-bar-wrap">
    <div class="progress-info">
      <span>Progress</span>
      <span><span id="progress-count">0</span> / 40 answered</span>
    </div>
    <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
  </div>

  <div id="quiz"></div>

  <div class="submit-area">
    <button class="btn-submit" id="btn-submit" onclick="submitExam()">Submit Answers</button>
    <p class="unanswered-note" id="unanswered-note"></p>
  </div>

</div>

<script>
const questions = [
  {
    n: 1,
    q: "The relationships of four species of bacteria, P, Q, R and S, were compared.\n• Species P and Q have a more recent common ancestor than either species has with species R.\n• Species S developed recently from species P.\nWhich species has the least similar base sequences in their DNA compared to the other three species of bacteria?",
    diagram: `<svg viewBox="0 0 380 180" xmlns="http://www.w3.org/2000/svg" width="380" height="180">
<style>.dg{fill:none;stroke:#e8e6df;stroke-width:1.5;stroke-linecap:round}.lbl{fill:#e8e6df;font-size:13px;font-family:serif}.muted{fill:#7a8199;font-size:11px;font-family:serif}</style>
<!-- Root -->
<line x1="50" y1="90" x2="100" y2="90" class="dg"/>
<!-- Split to R vs (P,Q,S) -->
<line x1="100" y1="90" x2="100" y2="40" class="dg"/>
<line x1="100" y1="90" x2="100" y2="140" class="dg"/>
<!-- R branch -->
<line x1="100" y1="40" x2="320" y2="40" class="dg"/>
<text x="325" y="45" class="lbl">R</text>
<!-- P,Q,S branch down -->
<line x1="100" y1="140" x2="160" y2="140" class="dg"/>
<!-- Split S from (P,Q) -->
<line x1="160" y1="140" x2="160" y2="115" class="dg"/>
<line x1="160" y1="140" x2="160" y2="165" class="dg"/>
<!-- S branch -->
<line x1="160" y1="165" x2="220" y2="165" class="dg"/>
<!-- split P from S derived -->
<line x1="220" y1="165" x2="220" y2="155" class="dg"/>
<line x1="220" y1="165" x2="220" y2="175" class="dg"/>
<line x1="220" y1="155" x2="320" y2="155" class="dg"/>
<text x="325" y="160" class="lbl" fill="#4ecca3">S</text>
<line x1="220" y1="175" x2="320" y2="175" class="dg"/>
<text x="325" y="180" class="lbl">P</text>
<!-- P,Q split -->
<line x1="160" y1="115" x2="220" y2="115" class="dg"/>
<line x1="220" y1="115" x2="220" y2="105" class="dg"/>
<line x1="220" y1="115" x2="220" y2="125" class="dg"/>
<line x1="220" y1="105" x2="320" y2="105" class="dg"/>
<text x="325" y="110" class="lbl">P</text>
<line x1="220" y1="125" x2="320" y2="125" class="dg"/>
<text x="325" y="130" class="lbl">Q</text>
<!-- Annotation -->
<text x="52" y="82" class="muted">common</text>
<text x="52" y="93" class="muted">ancestor</text>
<text x="108" y="168" class="muted" fill="#e8c547">S derived</text>
<text x="108" y="178" class="muted" fill="#e8c547">from P</text>
</svg>`,
    diagCaption: "Phylogenetic tree showing evolutionary relationships between P, Q, R and S",
    opts: ["P","Q","R","S"],
    ans: "C",
    exp: "Species R shares the most distant common ancestor with the others — P, Q, and S are all more closely related to each other. Because R diverged earliest, its DNA base sequences will have had the longest time to accumulate differences, making it least similar to the other three."
  },
  {
    n: 2,
    q: "The diagram shows an arthropod. To which group does it belong?",
    diagram: `<svg viewBox="0 0 340 230" xmlns="http://www.w3.org/2000/svg" width="340" height="230">
<style>.dg{fill:none;stroke:#c8c5be;stroke-width:1.8;stroke-linecap:round}.dgf{fill:#2a3045;stroke:#c8c5be;stroke-width:1.8}.lbl{fill:#7a8199;font-size:11px;font-family:serif}.lblg{fill:#4ecca3;font-size:11px;font-family:serif;font-weight:bold}</style>

<ellipse cx="170" cy="158" rx="35" ry="42" class="dgf"/>

<ellipse cx="170" cy="95" rx="42" ry="35" class="dgf"/>

<!-- 8 legs (4 per side) -->
<path d="M136,88 Q106,72 78,65" class="dg"/>

<path d="M133,108 Q100,112 70,118" class="dg"/>

<path d="M204,88 Q234,72 262,65" class="dg"/>
<path d="M207,98 Q240,92 272,92" class="dg"/>

<path d="M204,118 Q232,134 258,148" class="dg"/>
<!-- Eyes -->
<circle cx="158" cy="83" r="3" fill="#e8c547"/>
<circle cx="168" cy="80" r="3" fill="#e8c547"/>
<circle cx="178" cy="80" r="3" fill="#e8c547"/>
<circle cx="188" cy="83" r="3" fill="#e8c547"/>
<!-- Spinnerets -->
<ellipse cx="162" cy="196" rx="5" ry="3" fill="#2a3045" stroke="#c8c5be" stroke-width="1"/>
<ellipse cx="172" cy="198" rx="5" ry="3" fill="#2a3045" stroke="#c8c5be" stroke-width="1"/>
<ellipse cx="182" cy="196" rx="5" ry="3" fill="#2a3045" stroke="#c8c5be" stroke-width="1"/>
<!-- Label arrows -->
<line x1="104" y1="44" x2="60" y2="30" stroke="#4ecca3" stroke-width="0.8"/>
<text x="2" y="28" class="lblg">pedipalp</text>
<line x1="272" y1="92" x2="288" y2="80" stroke="#7a8199" stroke-width="0.8"/>
<text x="289" y="84" class="lbl">legs (×8)</text>
<text x="212" y="160" class="lbl">abdomen</text>
<text x="212" y="95" class="lbl">cephalo-</text>
<text x="212" y="107" class="lbl">thorax</text>
</svg>`,
    diagCaption: "Arthropod specimen — note the pedipalps and 4 pairs of legs",
    opts: ["Arachnids","Crustaceans","Insects","Myriapods"],
    ans: "A",
    exp: "Pedipalps are a defining feature of arachnids (e.g. spiders, scorpions). Insects have 3 pairs of legs and antennae; crustaceans typically have more varied appendages; myriapods (e.g. centipedes) have many leg-bearing segments but no pedipalps."
  },
  {
    n: 3,
    q: "Which structures are found in both plant cells and bacterial cells?",
    table: {
      headers: ["","cell membrane","cell wall","plasmid","ribosomes"],
      rows: [
        ["A","yes","yes","yes","no"],
        ["B","no","yes","yes","yes"],
        ["C","yes","no","yes","yes"],
        ["D","yes","yes","no","yes"]
      ]
    },
    opts: ["A","B","C","D"],
    ans: "D",
    exp: "Both plant cells and bacterial cells have a cell membrane, a cell wall, and ribosomes. Plasmids are found in bacteria but are NOT a normal feature of plant cells. Therefore option D (cell membrane ✓, cell wall ✓, plasmid ✗, ribosomes ✓) is correct."
  },
  {
    n: 4,
    q: "A cell is 65 μm across. What is this measurement in mm?",
    opts: ["0.00065 mm","0.0065 mm","0.065 mm","0.65 mm"],
    ans: "C",
    exp: "There are 1000 μm in 1 mm. So 65 μm ÷ 1000 = 0.065 mm. Check: 0.065 × 1000 = 65 μm. ✓"
  },
  {
    n: 5,
    q: "The diagram shows four mesophyll cells W, X, Y and Z. Water moves through these cells. Which row shows the direction of movement and the correct water potentials?",
    diagram: `<svg viewBox="0 0 400 130" xmlns="http://www.w3.org/2000/svg" width="400" height="130">
<style>.cell{fill:#1e3028;stroke:#4ecca3;stroke-width:1.5}.vac{fill:#0f2018;stroke:#4ecca3;stroke-width:1}.lbl{fill:#e8e6df;font-size:12px;font-family:serif;text-anchor:middle}.sub{fill:#7a8199;font-size:10px;font-family:serif;text-anchor:middle}.arrow{fill:#e8c547;stroke:#e8c547}</style>
<!-- Cell W -->
<rect x="20" y="25" width="70" height="70" class="cell" rx="4"/>
<ellipse cx="55" cy="60" rx="22" ry="22" class="vac"/>

<!-- Cell X -->
<rect x="110" y="25" width="70" height="70" class="cell" rx="4"/>
<ellipse cx="145" cy="60" rx="22" ry="22" class="vac"/>
<text x="145" y="14" class="lbl">X</text>
<!-- Cell Y -->
<rect x="200" y="25" width="70" height="70" class="cell" rx="4"/>
<ellipse cx="235" cy="60" rx="22" ry="22" class="vac"/>
<text x="235" y="14" class="lbl">Y</text>
<!-- Cell Z -->
<rect x="290" y="25" width="70" height="70" class="cell" rx="4"/>
<ellipse cx="325" cy="60" rx="22" ry="22" class="vac"/>
<text x="325" y="14" class="lbl">Z</text>
<!-- Water movement arrow -->
<defs><marker id="arrowhead" markerWidth="8" markerHeight="6" refX="6" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#e8c547"/></marker></defs>

let answered = {};
let submitted = false;

function letterToIndex(letter) {
  return letter.charCodeAt(0) - 65; // A=0, B=1, C=2, D=3
}

function buildQuiz() {
  const container = document.getElementById('quiz');
  questions.forEach((q, qi) => {
    const block = document.createElement('div');
    block.className = 'question-block';
    block.id = `q-${qi}`;

    let tableHTML = '';
    if (q.table) {
      tableHTML = '<table class="q-table"><thead><tr>';
      q.table.headers.forEach(h => { tableHTML += `<th>${h}</th>`; });
      tableHTML += '</tr></thead><tbody>';
      q.table.rows.forEach(row => {
        tableHTML += '<tr>';
        row.forEach((cell, ci) => {
          tableHTML += ci === 0 ? `<td><strong style="color:var(--accent2)">${cell}</strong></td>` : `<td>${cell}</td>`;
        });
        tableHTML += '</tr>';
      });
      tableHTML += '</tbody></table>';
    }

    const qTextFormatted = q.q.replace(/\n/g, '<br>');

    let diagHTML = '';
    if (q.diagram) {
      const cap = q.diagCaption ? `<div class="diagram-caption">${q.diagCaption}</div>` : '';
      diagHTML = `<div class="diagram-wrap">${q.diagram}</div>${cap}`;
    }

    let optsHTML = '';
    q.opts.forEach((opt, oi) => {
      const letter = String.fromCharCode(65 + oi);
      optsHTML += `
        <div class="option" id="q${qi}-opt${oi}" onclick="selectOption(${qi}, ${oi})">
          <div class="option-letter">${letter}</div>
          <div style="flex:1">${opt}</div>
          <div class="result-icon" id="q${qi}-icon${oi}"></div>
        </div>`;
    });

    block.innerHTML = `
      <div class="q-number">Question ${q.n} of 40</div>
      <div class="q-text">${qTextFormatted}</div>
      ${diagHTML}
      ${tableHTML ? `<div style="overflow-x:auto;margin:0 0 20px">${tableHTML}</div>` : ''}
      <div class="options">${optsHTML}</div>
      <div class="explanation" id="q${qi}-exp"></div>
    `;
    container.appendChild(block);
  });
}

function selectOption(qi, oi) {
  if (submitted) return;
  const prev = answered[qi];
  if (prev !== undefined) {
    document.getElementById(`q${qi}-opt${prev}`).classList.remove('selected');
  }
  answered[qi] = oi;
  document.getElementById(`q${qi}-opt${oi}`).classList.add('selected');
  document.getElementById(`q-${qi}`).classList.add('answered');
  updateProgress();
}

function updateProgress() {
  const count = Object.keys(answered).length;
  document.getElementById('progress-count').textContent = count;
  document.getElementById('progress-fill').style.width = (count / 40 * 100) + '%';
}

function submitExam() {
  const unanswered = questions.length - Object.keys(answered).length;
  if (unanswered > 0) {
    const note = document.getElementById('unanswered-note');
    note.style.display = 'block';
    note.textContent = `You have ${unanswered} unanswered question${unanswered > 1 ? 's' : ''}. Submit anyway or go back and answer them.`;
    if (!document.getElementById('btn-submit-confirm')) {
      const btn2 = document.createElement('button');
      btn2.className = 'btn-submit';
      btn2.id = 'btn-submit-confirm';
      btn2.style.marginTop = '14px';
      btn2.style.background = 'var(--accent2)';
      btn2.textContent = 'Submit Anyway';
      btn2.onclick = doSubmit;
      document.querySelector('.submit-area').appendChild(btn2);
    }
    return;
  }
  doSubmit();
}

function doSubmit() {
  submitted = true;
  document.getElementById('btn-submit').disabled = true;
  const conf = document.getElementById('btn-submit-confirm');
  if (conf) conf.disabled = true;

  let score = 0;
  questions.forEach((q, qi) => {
    const correctIdx = letterToIndex(q.ans);
    const userIdx = answered[qi];

    // Lock all options
    q.opts.forEach((_, oi) => {
      document.getElementById(`q${qi}-opt${oi}`).classList.add('locked');
    });

    // Show correct answer
    const correctEl = document.getElementById(`q${qi}-opt${correctIdx}`);

    if (userIdx !== undefined) {
      const userEl = document.getElementById(`q${qi}-opt${userIdx}`);
      const icon = document.getElementById(`q${qi}-icon${userIdx}`);
      if (userIdx === correctIdx) {
        userEl.classList.remove('selected');
        userEl.classList.add('correct');
        icon.style.display = 'block';
        icon.textContent = '✓';
        icon.style.color = 'var(--correct)';
        score++;
      } else {
        userEl.classList.remove('selected');
        userEl.classList.add('wrong');
        icon.style.display = 'block';
        icon.textContent = '✗';
        icon.style.color = 'var(--wrong)';
        correctEl.classList.add('show-correct');
        const correctIcon = document.getElementById(`q${qi}-icon${correctIdx}`);
        correctIcon.style.display = 'block';
        correctIcon.textContent = '✓';
        correctIcon.style.color = 'var(--correct)';
      }
    } else {
      // Not answered — just show correct
      correctEl.classList.add('show-correct');
      const correctIcon = document.getElementById(`q${qi}-icon${correctIdx}`);
      correctIcon.style.display = 'block';
      correctIcon.textContent = '✓';
      correctIcon.style.color = 'var(--correct)';
    }

    // Show explanation
    const expEl = document.getElementById(`q${qi}-exp`);
    expEl.innerHTML = `<strong>Answer: ${q.ans}</strong> — ${q.exp.replace(/\n/g,'<br>')}`;
    expEl.classList.add('visible');
  });

  // Score panel
  const pct = Math.round(score / 40 * 100);
  let grade = '';
  if (pct >= 90) grade = 'Exceptional — A*';
  else if (pct >= 80) grade = 'Excellent — A';
  else if (pct >= 70) grade = 'Strong — B';
  else if (pct >= 60) grade = 'Good — C';
  else if (pct >= 50) grade = 'Satisfactory — D';
  else grade = 'Keep Revising — E/U';

  document.getElementById('score-num').textContent = score;
  document.getElementById('score-pct').textContent = pct + '%';
  document.getElementById('score-grade').textContent = grade;

  const panel = document.getElementById('score-panel');
  panel.style.display = 'block';
  panel.scrollIntoView({ behavior: 'smooth', block: 'start' });

  setTimeout(() => {
    document.getElementById('score-bar').style.width = pct + '%';
  }, 300);

  updateProgress();
}

buildQuiz();
</script>
