<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Back to the Future | Sessions 4.7 & 4.8</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --teal:#0d9488;
    --teal-dark:#0f766e;
    --teal-light:#ccfbf1;
    --orange:#f97316;
    --orange-light:#ffedd5;
    --purple:#7c3aed;
    --purple-light:#ede9fe;
    --ink:#1e293b;
    --slate:#64748b;
    --paper:#ffffff;
    --bg:#f4f6f8;
    --focus:#0d9488;
    --practice:#f97316;
    --challenge:#7c3aed;
    --radius:20px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'Inter',sans-serif;
    background:var(--bg);
    color:var(--ink);
    overflow:hidden;
  }
  h1,h2,h3,.display{font-family:'Poppins',sans-serif;}

  /* ---------- APP SHELL ---------- */
  #app{
    display:flex;
    flex-direction:column;
    height:100vh;
    width:100vw;
  }

  /* ---------- TOPBAR ---------- */
  #topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:12px 22px;
    background:var(--paper);
    border-bottom:1px solid #e6eaee;
    flex-shrink:0;
    gap:12px;
  }
  .breadcrumb{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:13px;
    color:var(--slate);
    font-weight:600;
    white-space:nowrap;
    overflow:hidden;
  }
  .breadcrumb .unit{color:var(--teal-dark);}
  .breadcrumb .sep{color:#c7ced6;}
  .breadcrumb .current{color:var(--ink);}
  #dots{
    display:flex;
    gap:5px;
    flex-wrap:wrap;
    max-width:46%;
    justify-content:center;
  }
  .dot{
    width:7px;height:7px;border-radius:50%;
    background:#dbe2e8;
    cursor:pointer;
    transition:all .2s ease;
    flex-shrink:0;
  }
  .dot.active{background:var(--teal); width:20px; border-radius:5px;}
  .dot.section-start{margin-left:6px;}
  #counter{
    font-size:12px;
    font-weight:700;
    color:var(--slate);
    white-space:nowrap;
    font-variant-numeric: tabular-nums;
  }

  /* ---------- SLIDE STAGE ---------- */
  #stage{
    flex:1;
    position:relative;
    overflow:hidden;
  }
  .slide{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:26px 5vw 90px;
    opacity:0;
    transform:translateX(40px);
    transition:opacity .35s ease, transform .35s ease;
    pointer-events:none;
    overflow-y:auto;
  }
  .slide.active{
    opacity:1;
    transform:translateX(0);
    pointer-events:auto;
  }
  .slide.exit-left{transform:translateX(-40px);}

  .card{
    width:100%;
    max-width:900px;
    margin:auto;
  }

  /* ---------- BADGES ---------- */
  .badge{
    display:inline-flex;
    align-items:center;
    gap:6px;
    padding:6px 14px;
    border-radius:999px;
    font-size:12px;
    font-weight:700;
    letter-spacing:.06em;
    text-transform:uppercase;
    margin-bottom:16px;
  }
  .badge::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;}
  .badge.focus{background:var(--teal-light); color:var(--teal-dark);}
  .badge.practice{background:var(--orange-light); color:#c2410c;}
  .badge.challenge{background:var(--purple-light); color:var(--purple);}
  .chip{
    display:inline-block;
    background:#eef2f6;
    color:var(--slate);
    font-size:12px;
    font-weight:700;
    padding:4px 10px;
    border-radius:8px;
    margin-left:8px;
  }

  /* ---------- COVER ---------- */
  .cover-slide{
    background:radial-gradient(ellipse at top, #164e63 0%, #0f172a 55%, #0b1120 100%);
    color:#fff;
    padding:0;
  }
  .cover-slide .card{text-align:center; color:#fff; max-width:760px;}
  .stars{
    position:absolute; inset:0;
    background-image:
      radial-gradient(1.5px 1.5px at 20% 30%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 75% 20%, #fff, transparent),
      radial-gradient(1px 1px at 50% 60%, #fff, transparent),
      radial-gradient(2px 2px at 85% 70%, #fff, transparent),
      radial-gradient(1px 1px at 10% 80%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 65% 45%, #fff, transparent),
      radial-gradient(1px 1px at 35% 15%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 92% 40%, #fff, transparent);
    opacity:.7;
  }
  .cover-eyebrow{
    font-size:13px; letter-spacing:.18em; text-transform:uppercase;
    color:#5eead4; font-weight:700; margin-bottom:14px;
  }
  .cover-slide h1{
    font-size:clamp(30px,5vw,52px);
    line-height:1.1;
    margin:0 0 14px;
    background:linear-gradient(90deg,#5eead4,#fb923c,#c4b5fd);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .cover-slide p{font-size:16px; color:#cbd5e1; max-width:560px; margin:0 auto 26px;}
  .cover-pills{display:flex; gap:12px; justify-content:center; flex-wrap:wrap;}
  .cover-pill{
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.18);
    padding:10px 18px;
    border-radius:14px;
    font-size:13px;
    font-weight:600;
    color:#e2e8f0;
  }

  /* ---------- SECTION TITLE SLIDE ---------- */
  .section-slide .card{text-align:center;}
  .section-num{
    font-family:'Poppins',sans-serif;
    font-size:14px; font-weight:700; color:var(--teal);
    letter-spacing:.1em; text-transform:uppercase; margin-bottom:6px;
  }
  .section-slide h2{font-size:clamp(24px,4vw,38px); margin:0 0 18px; color:var(--ink);}
  .section-sub{color:var(--slate); font-size:15px; max-width:560px; margin:0 auto;}

  /* ---------- CONCEPT / EXPLANATION ---------- */
  .concept-box{
    background:var(--paper);
    border-radius:var(--radius);
    padding:32px 34px;
    box-shadow:0 10px 30px rgba(15,23,42,.06);
    border:1px solid #eef1f4;
  }
  h2.q-title{font-size:clamp(20px,3vw,27px); margin:0 0 14px; color:var(--ink);}
  .concept-body{font-size:16px; line-height:1.65; color:#334155;}
  .concept-body strong{color:var(--teal-dark);}
  .example-block{
    margin-top:18px;
    background:var(--teal-light);
    border-left:4px solid var(--teal);
    border-radius:12px;
    padding:14px 18px;
    font-size:15px;
    color:#134e4a;
  }
  .example-block .lab{font-weight:700; text-transform:uppercase; font-size:11px; letter-spacing:.06em; color:var(--teal-dark); margin-bottom:4px;}

  /* ---------- QUESTION SLIDES ---------- */
  .q-eyebrow{
    display:flex; align-items:center; flex-wrap:wrap; gap:2px;
    margin-bottom:10px;
  }
  .q-prompt{
    font-size:clamp(18px,2.6vw,23px);
    font-weight:600;
    color:var(--ink);
    line-height:1.5;
    margin:6px 0 22px;
  }
  .q-prompt .letter{
    display:inline-flex; align-items:center; justify-content:center;
    width:30px; height:30px; border-radius:50%;
    background:var(--ink); color:#fff; font-size:14px; font-weight:700;
    margin-right:10px; vertical-align:middle;
  }
  .instruction-text{
    font-size:15px; color:var(--slate); margin-bottom:18px; line-height:1.6;
  }
  .instruction-text em{color:var(--ink); font-style:normal; font-weight:600;}

  .reveal-btn{
    display:inline-flex; align-items:center; gap:8px;
    background:var(--ink); color:#fff;
    border:none; padding:12px 22px; border-radius:12px;
    font-family:'Inter',sans-serif; font-size:14px; font-weight:700;
    cursor:pointer; transition:transform .15s ease, background .15s ease;
  }
  .reveal-btn:hover{background:#334155; transform:translateY(-1px);}
  .reveal-btn svg{width:16px; height:16px;}

  .answer-panel{
    margin-top:16px;
    max-height:0;
    opacity:0;
    overflow:hidden;
    transition:max-height .4s ease, opacity .3s ease, margin .3s ease;
    border-radius:14px;
  }
  .answer-panel.open{
    max-height:600px;
    opacity:1;
  }
  .answer-inner{
    background:#ecfdf5;
    border:1.5px solid #6ee7b7;
    border-radius:14px;
    padding:16px 20px;
    font-size:16px;
    color:#065f46;
    line-height:1.6;
  }
  .answer-inner .lab{
    font-size:11px; font-weight:800; letter-spacing:.08em; text-transform:uppercase;
    color:#059669; margin-bottom:6px; display:flex; align-items:center; gap:6px;
  }
  .answer-inner .conn{
    background:#059669; color:#fff; padding:1px 8px; border-radius:6px; font-weight:700;
  }
  .answer-inner .purpose{
    display:inline-block; margin-top:8px; background:#d1fae5; color:#065f46;
    padding:3px 10px; border-radius:8px; font-size:13px; font-weight:700;
  }
  .answer-inner .note{
    display:block; margin-top:8px; font-size:13px; color:#0f766e; font-style:italic;
  }

  /* fill-blank styling */
  .blank{
    display:inline-block; min-width:70px; border-bottom:2.5px dashed var(--slate);
    text-align:center; margin:0 2px;
  }
  .blank.filled{border-bottom:2.5px solid #059669; color:#059669; font-weight:800;}

  .passage{
    font-size:16px; line-height:1.9; color:#334155;
    background:#fbfcfd; border:1px solid #eef1f4; border-radius:14px; padding:20px 22px;
  }

  /* word bank chips */
  .wordbank{
    display:flex; flex-wrap:wrap; gap:8px; margin:14px 0 4px;
  }
  .wchip{
    background:var(--purple-light); color:var(--purple);
    padding:6px 13px; border-radius:999px; font-size:13px; font-weight:700;
  }
  .tip-box{
    margin-top:16px;
    background:var(--orange-light);
    border-radius:12px;
    padding:12px 16px;
    font-size:13.5px;
    color:#9a3412;
    display:flex;
    gap:10px;
    align-items:flex-start;
  }

  /* ---------- CLOSING ---------- */
  .closing-slide .card{text-align:center;}
  .closing-slide h2{font-size:clamp(24px,4vw,36px); margin-bottom:10px;}
  .wb-ref{
    display:inline-flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-top:22px;
  }
  .wb-ref .pg{
    background:var(--paper); border:1.5px solid #e2e8f0; border-radius:12px;
    padding:10px 16px; font-size:13px; font-weight:700; color:var(--ink);
    box-shadow:0 4px 10px rgba(15,23,42,.04);
  }
  .wb-ref .pg span{display:block; font-size:11px; font-weight:600; color:var(--slate); text-transform:uppercase; letter-spacing:.04em;}

  /* ---------- FOOTER NAV ---------- */
  #footer{
    position:absolute; bottom:0; left:0; right:0;
    display:flex; align-items:center; justify-content:center; gap:18px;
    padding:16px;
    pointer-events:none;
  }
  .navbtn{
    pointer-events:auto;
    width:52px; height:52px; border-radius:50%;
    border:none; background:var(--paper);
    box-shadow:0 6px 18px rgba(15,23,42,.12);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; transition:transform .15s ease, background .15s ease;
    color:var(--ink);
  }
  .navbtn:hover{transform:translateY(-2px); background:var(--teal); color:#fff;}
  .navbtn:disabled{opacity:.3; cursor:not-allowed; transform:none; background:var(--paper); color:var(--ink);}
  .navbtn svg{width:20px; height:20px;}
  .navlabel{
    pointer-events:auto;
    font-size:12px; font-weight:700; color:var(--slate);
    background:var(--paper); padding:8px 16px; border-radius:999px;
    box-shadow:0 6px 18px rgba(15,23,42,.08);
  }

  @media (max-width: 640px){
    .concept-box{padding:22px 18px;}
    .slide{padding:16px 4vw 96px;}
    #dots{display:none;}
  }
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div class="breadcrumb">
      <span class="unit">Unit 4 · Back to the Future</span>
      <span class="sep">›</span>
      <span class="current" id="crumbCurrent">Cover</span>
    </div>
    <div id="dots"></div>
    <div id="counter">1 / 1</div>
  </div>
  <div id="stage"></div>
  <div id="footer">
    <button class="navbtn" id="prevBtn" aria-label="Previous">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div class="navlabel" id="navLabel">Tap to begin</div>
    <button class="navbtn" id="nextBtn" aria-label="Next">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
    </button>
  </div>
</div>

<script>
/* =========================================================
   SLIDE DATA
   ========================================================= */
const S = []; // slides array, each -> {crumb, section:boolean, html}

function badge(kind, extra){
  const label = kind === 'focus' ? 'Focus' : kind === 'practice' ? 'Practice' : 'Challenge';
  return `<span class="badge ${kind}">${label}${extra? ' · '+extra:''}</span>`;
}

function questionSlide({kind, exercise, letter, instruction, prompt, answerHtml, exNum}){
  const idBase = 'ans-' + Math.random().toString(36).slice(2,9);
  return `
    <div class="card">
      <div class="q-eyebrow">${badge(kind)} <span class="chip">${exercise}${letter? ' &middot; '+letter:''}</span></div>
      ${instruction? `<div class="instruction-text">${instruction}</div>`:''}
      <div class="q-prompt">${letter?`<span class="letter">${letter}</span>`:''}${prompt}</div>
      <button class="reveal-btn" onclick="toggleAnswer('${idBase}', this)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
        Reveal answer
      </button>
      <div class="answer-panel" id="${idBase}">
        <div class="answer-inner">${answerHtml}</div>
      </div>
    </div>`;
}

/* ---------- 0. COVER ---------- */
S.push({crumb:'Cover', section:true, html:`
  <div class="slide cover-slide">
    <div class="stars"></div>
    <div class="card">
      <div class="cover-eyebrow">Cambridge Primary English 6 · Unit 4</div>
      <h1>Back to the Future</h1>
      <p>Sessions 4.7 &amp; 4.8 — Connectives, paragraphs, and writing in an old-fashioned style. We'll take every question one small step at a time.</p>
      <div class="cover-pills">
        <div class="cover-pill">4.7 Chapters, Paragraphs &amp; Connectives</div>
        <div class="cover-pill">4.8 Describing Fictional Surroundings</div>
      </div>
    </div>
  </div>`});

/* ========================================================
   SESSION 4.7
   ======================================================== */
S.push({crumb:'4.7 Title', section:true, html:`
  <div class="slide section-slide">
    <div class="card">
      <div class="section-num">Session 4.7</div>
      <h2>Working with chapters, paragraphs and connectives</h2>
      <p class="section-sub">We are going to look closely at <strong>connectives</strong> — the linking words that join ideas together in a sentence.</p>
    </div>
  </div>`});

S.push({crumb:'4.7 Concept', html:`
  <div class="slide">
    <div class="card concept-box">
      ${badge('focus')}
      <h2 class="q-title">What is a connective?</h2>
      <div class="concept-body">
        Connectives have various purposes in linking parts of a sentence, for example:
        <strong>sequencing</strong>, <strong>comparing</strong>, <strong>adding</strong>, <strong>contrasting</strong> or <strong>cause and effect</strong>.
      </div>
      <div class="example-block">
        <div class="lab">Example</div>
        Amélie was excited <span class="conn" style="background:var(--teal); color:#fff; padding:1px 8px; border-radius:6px; font-weight:700;">because</span> it was her birthday.
        <span class="purpose" style="display:inline-block; margin-top:8px; background:#ccfbf1; color:#0f766e; padding:3px 10px; border-radius:8px; font-size:13px; font-weight:700;">cause and effect</span>
      </div>
    </div>
  </div>`});

S.push({crumb:'Ex1 Instructions', html:`
  <div class="slide">
    <div class="card concept-box">
      ${badge('focus')} <span class="chip">Exercise 1</span>
      <h2 class="q-title">Underline the connective and name its purpose</h2>
      <div class="concept-body">
        For each sentence on the next slides: find the connective, then decide its purpose —
        <strong>sequencing</strong>, <strong>comparing</strong>, <strong>adding</strong>, <strong>contrasting</strong>, or <strong>cause and effect</strong>.
      </div>
    </div>
  </div>`});

const ex1 = [
  {l:'a', s:'He ate breakfast before he went to school.', c:'before', p:'sequencing (time)'},
  {l:'b', s:'We couldn&rsquo;t decide what to do so we went to bed.', c:'so', p:'cause and effect'},
  {l:'c', s:'I didn&rsquo;t understand my homework although I tried my hardest.', c:'although', p:'contrasting'},
  {l:'d', s:'Misha packed carefully so that everything would fit in her bag.', c:'so that', p:'cause and effect (purpose)'},
  {l:'e', s:'The learners left the class as soon as the bell rang.', c:'as soon as', p:'sequencing (time)'}
];
ex1.forEach(item=>{
  S.push({crumb:`4.7 Ex1${item.l}`, html:`<div class="slide">${questionSlide({
    kind:'focus', exercise:'Exercise 1', letter:item.l,
    prompt:item.s,
    answerHtml:`<div class="lab">Connective &amp; purpose</div>Connective: <span class="conn">${item.c}</span>
      <span class="purpose">${item.p}</span>`
  })}</div>`});
});

S.push({crumb:'Ex2 Instructions', html:`
  <div class="slide">
    <div class="card concept-box">
      ${badge('practice')} <span class="chip">Exercise 2</span>
      <h2 class="q-title">Complete these multi-clause sentences</h2>
      <div class="concept-body">
        Finish each sentence in a way that makes sense, and underline the connective you used.
        There is more than one good way to finish these — we'll show you one example answer for each.
      </div>
    </div>
  </div>`});

const ex2 = [
  {l:'a', s:'The exam was hard but', before:'The exam was hard ', conn:'but', after:' I still managed to pass.'},
  {l:'b', s:'Although it was hot,', before:'', conn:'Although', after:' it was hot, we decided to go for a run.'},
  {l:'c', s:'Jamal finished before', before:'Jamal finished ', conn:'before', after:' the bell rang.'},
  {l:'d', s:'While the boys went to the shops,', before:'', conn:'While', after:' the boys went to the shops, the girls tidied the classroom.'},
  {l:'e', s:'Despite working hard,', before:'', conn:'Despite', after:' working hard, she didn&rsquo;t finish on time.'}
];
ex2.forEach(item=>{
  S.push({crumb:`4.7 Ex2${item.l}`, html:`<div class="slide">${questionSlide({
    kind:'practice', exercise:'Exercise 2', letter:item.l,
    instruction:'Complete the sentence, then underline the connective.',
    prompt:item.s + ' <span style="color:var(--slate);">…</span>',
    answerHtml:`<div class="lab">Example answer</div>${item.before}<span class="conn">${item.conn}</span>${item.after}<span class="note">Learners&rsquo; own answers — accept any sensible sentence that uses the connective correctly.</span>`
  })}</div>`});
});

S.push({crumb:'Ex3 Instructions', html:`
  <div class="slide">
    <div class="card concept-box">
      ${badge('challenge')} <span class="chip">Exercise 3</span>
      <h2 class="q-title">Join these sentences with a suitable connective</h2>
      <div class="concept-body">Choose a connective from the box below for each pair of sentences.</div>
      <div class="wordbank">
        ${['so','that','although','before','while','because'].map(w=>`<span class="wchip">${w}</span>`).join('')}
      </div>
      <div class="tip-box">💡 You can start by choosing the connective and then separate the sentences with a comma. You may have to change the order of the sentences.</div>
    </div>
  </div>`});

const ex3 = [
  {l:'a', s1:'Prahlad wasn&rsquo;t worried.', s2:'He did not anticipate trouble.', a:'Prahlad wasn&rsquo;t worried <span class="conn">because</span> he did not anticipate trouble.'},
  {l:'b', s1:'Professor Shonku packed what he needed for the mission.', s2:'He went down to Mars.', a:'Professor Shonku packed what he needed for the mission <span class="conn">before</span> he went down to Mars.'},
  {l:'c', s1:'An unusual thing happened.', s2:'I was writing in my diary.', a:'An unusual thing happened <span class="conn">while</span> I was writing in my diary.'},
  {l:'d', s1:'I sat down.', s2:'I would not be tired.', a:'I sat down <span class="conn">so that</span> I would not be tired.'},
  {l:'e', s1:'I trusted my assistant.', s2:'I didn&rsquo;t believe he would be able to help me.', a:'I trusted my assistant <span class="conn">although</span> I didn&rsquo;t believe he would be able to help me.'}
];
ex3.forEach(item=>{
  S.push({crumb:`4.7 Ex3${item.l}`, html:`<div class="slide">${questionSlide({
    kind:'challenge', exercise:'Exercise 3', letter:item.l,
    prompt:`${item.s1} <br><span style="color:var(--slate); font-weight:500;">+</span> ${item.s2}`,
    answerHtml:`<div class="lab">Joined sentence</div>${item.a}`
  })}</div>`});
});

S.push({crumb:'Ex4 Instructions', html:`
  <div class="slide">
    <div class="card concept-box">
      ${badge('challenge')} <span class="chip">Exercise 4</span>
      <h2 class="q-title">Complete the paragraph with connectives</h2>
      <div class="concept-body">This diary extract is missing its connectives. Choose the best one from the box for each gap — you may need to start some with a capital letter.</div>
      <div class="wordbank">
        ${['next','although','because','compared to','first','at last','before','finally','in addition'].map(w=>`<span class="wchip">${w}</span>`).join('')}
      </div>
    </div>
  </div>`});

const ex4 = [
  {l:'1', s:'I wanted to explore the planet <span class="blank">?</span> I was interested in how it would compare with Earth.', a:'because'},

/* =========================================================
   RENDER + NAVIGATION
   ========================================================= */
const stage = document.getElementById('stage');
const dotsEl = document.getElementById('dots');
const counterEl = document.getElementById('counter');
const crumbEl = document.getElementById('crumbCurrent');
const navLabel = document.getElementById('navLabel');
let current = 0;

S.forEach((s, i)=>{
  const wrapper = document.createElement('div');
  wrapper.innerHTML = s.html.trim();
  const el = wrapper.firstChild;
  el.dataset.index = i;
  stage.appendChild(el);

  const dot = document.createElement('div');
  dot.className = 'dot' + (s.section ? ' section-start' : '');
  dot.addEventListener('click', ()=>goTo(i));
  dotsEl.appendChild(dot);
});

function render(){
  document.querySelectorAll('.slide').forEach((el,i)=>{
    el.classList.toggle('active', i===current);
  });
  document.querySelectorAll('.dot').forEach((el,i)=>{
    el.classList.toggle('active', i===current);
  });
  counterEl.textContent = `${current+1} / ${S.length}`;
  crumbEl.textContent = S[current].crumb;
  document.getElementById('prevBtn').disabled = current===0;
  document.getElementById('nextBtn').disabled = current===S.length-1;
  navLabel.textContent = current===S.length-1 ? 'The end 🎉' : (current===0 ? 'Tap to begin' : 'Swipe or tap arrows');
  document.querySelectorAll('.dot').forEach((el,i)=>{
    if(i===current) el.scrollIntoView({inline:'center', block:'nearest', behavior:'smooth'});
  });
}

function goTo(i){
  if(i<0 || i>=S.length) return;
  current = i;
  render();
}

document.getElementById('prevBtn').addEventListener('click', ()=>goTo(current-1));
document.getElementById('nextBtn').addEventListener('click', ()=>goTo(current+1));

document.addEventListener('keydown', (e)=>{
  if(e.key==='ArrowRight') goTo(current+1);
  if(e.key==='ArrowLeft') goTo(current-1);
});

/* touch swipe */
let touchStartX = null;
stage.addEventListener('touchstart', e=>{touchStartX = e.touches[0].clientX;});
stage.addEventListener('touchend', e=>{
  if(touchStartX===null) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  if(Math.abs(dx) > 50){ dx<0 ? goTo(current+1) : goTo(current-1); }
  touchStartX = null;
});

function toggleAnswer(id, btn){
  const panel = document.getElementById(id);
  const opening = !panel.classList.contains('open');
  panel.classList.toggle('open');
  btn.innerHTML = opening
    ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/></svg> Hide answer`
    : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg> Reveal answer`;
}

render();
</script>
