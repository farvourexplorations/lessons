gs began to croak in the marsh.\n\n\"Glorious!\" said the Chinese Court preacher. \"Now I hear it—it sounds just like little church bells.\"\n\n\"No, those are frogs,\" said the little kitchen maid. \"But now I think we shall soon hear it.\"\n\nAnd then the Nightingale began to sing.\n\n\"That is it!\" exclaimed the little girl. \"Listen, listen! and yonder it sits.\"\n\nAnd she pointed to a little gray bird up in the boughs.\n\n\"Is it possible?\" cried the cavalier. \"I should never have thought it looked like that! How simple it looks! It must certainly have lost its color at seeing such grand people around.\"\n\n\"Little Nightingale!\" called the little kitchen maid, quite loudly, \"our gracious Emperor wishes you to sing before him.\"\n\n\"With the greatest pleasure!\" replied the Nightingale, and began to sing most delightfully.\n\n\"It sounds just like glass bells!\" said the cavalier. \"And look at its little throat, how it's working! It's wonderful that we should never have heard it before. That bird will be a great success at Court.\"\n\n\"Shall I sing once more before the Emperor?\" inquired the Nightingale, for it thought the Emperor was present.\n\n\"My excellent little Nightingale,\" said the cavalier, \"I have great pleasure in inviting you to a Court festival this evening, when you shall charm his Imperial Majesty with your beautiful singing.\"\n\n\"My song sounds best in the green wood,\" replied the Nightingale; still it came willingly when it heard what the Emperor wished.\n\nThe palace was festively adorned. The walls and the flooring, which were of porcelain, gleamed in the rays of thousands of golden lamps. The most glorious flowers, which could ring clearly, had been placed in the passages. There was a running to and fro, and a thorough draught, and all the bells rang so loudly that one could not hear one's self speak.\n\nIn the midst of the great hall, where the Emperor sat, a golden perch had been placed, on which the Nightingale was to sit. The whole Court was there, and the little cook-maid had got leave to stand behind the door, as she had now received the title of a real Court cook. All were in full dress, and all looked at the little gray bird, to which the Emperor nodded.\n\nAnd the Nightingale sang so gloriously that the tears came into the Emperor's eyes, and the tears ran down over his cheeks; then the Nightingale sang still more sweetly, that went straight to the heart. The Emperor was so much pleased that he said the Nightingale should have his golden slipper to wear round its neck. But the Nightingale declined this with thanks, saying it had already received a sufficient reward.\n\n\"I have seen tears in the Emperor's eyes—that is the real treasure to me. An Emperor's tears have a peculiar power. I am rewarded enough!\" And then it sang again with a sweet, glorious voice.\n\n\"That's the most amiable coquetry I ever saw!\" said the ladies who stood round about, and then they took water in their mouths to gurgle when anyone spoke to them. They thought they should be nightingales too. And the lackeys and chambermaids reported that they were satisfied also; and that was saying a good deal, for they are the most difficult to please. In short, the Nightingale achieved a real success.\n\nIt was now to remain at Court, to have its own cage, with liberty to go out twice every day and once at night. Twelve servants were appointed when the Nightingale went out, each of whom had a silken string fastened to the bird's legs, which they held very tight. There was really no pleasure in an excursion of that kind.\n\nThe whole city spoke of the wonderful bird, and whenever two people met, one said nothing but \"Nightin,\" and the other said \"gale\"; and then they both sighed, and understood one another. Eleven pedlars' children were named after the bird, but not one of them could sing a note.\n\nOne day the Emperor received a large parcel, on which was written, \"The Nightingale.\"\n\n\"There we have a new book about this celebrated bird,\" said the Emperor.\n\nBut it was not a book, but a little work of art, contained in a box—an artificial nightingale, which was to sing like a natural one, and was brilliantly ornamented with diamonds, sapphires, and rubies. So soon as the artificial bird was wound up, he could sing one of the pieces that he really sang, and then his tail moved up and down, and shone with silver and gold. Round his neck hung a little ribbon, and on that was written, \"The Emperor of China's nightingale is poor compared to that of the Emperor of Japan.\"\n\n\"That is capital!\" said they all, and he who had brought the artificial bird immediately received the title, Imperial Head-Nightingale-Bringer.\n\n\"Now they must sing together; what a duet that will be!\" cried the courtiers.\n\nAnd so they had to sing together; but it did not sound very well, for the real Nightingale sang its own way, and the artificial bird sang waltzes.\n\n\"That's not his fault,\" said the playmaster; \"he's quite perfect, and very much in my style.\"\n\nNow the artificial bird was to sing alone. It had just as much success as the real one, and then it was much handsomer to look at—it shone like bracelets and breastpins.\n\nThree and thirty times over did it sing the same piece, and yet was not tired. The people would gladly have heard it again, but the Emperor said that the living Nightingale ought to sing something now. But where was it? No one had noticed that it had flown away out of the open window, back to the green wood.\n\n\"But what has become of that?\" asked the Emperor.\n\nAnd all the courtiers abused the Nightingale, and declared that it was a very ungrateful creature.\n\n\"We have the best bird after all,\" said they.\n\nAnd so the artificial bird had to sing again, and that was the thirty-fourth time that they listened to the same piece. For all that they did not know it quite by heart, for it was so very difficult. And the playmaster praised the bird particularly; yes, he declared that it was better than a nightingale, not only with regard to its plumage and the many beautiful diamonds, but inside as well.\n\n\"For you see, ladies and gentlemen, and above all, your Imperial Majesty, with a real nightingale one can never calculate what is coming, but in this artificial bird, everything is settled. One can explain it; one can open it and make people understand where the waltzes come from, how they go, and how one follows up another.\"\n\n\"Those are quite our own ideas,\" they all said.\n\nAnd the speaker received permission to show the bird to the people on the next Sunday. The people were to hear it sing too, the Emperor commanded: and they did hear it, and were as much pleased as if they had all got tipsy upon tea, for that's quite the Chinese fashion, and they all said, \"Oh!\" and held up their forefingers and nodded. But the poor fisherman, who had heard the real Nightingale, said:\n\n\"It sounds pretty enough, and the melodies resemble each other, but there's something wanting, though I know not what!\"\n\nThe real Nightingale was banished from the country and empire. The artificial bird had its place on a silken cushion close to the Emperor's bed; all the presents it had received, gold and precious stones, were ranged about it; in title it had advanced to be the High Imperial After-Dinner-Singer, and in rank to Number One on the left hand; for the Emperor considered that side the most important on which the heart is placed, and even in an Emperor the heart is on the left side; and the playmaster wrote a work of five and twenty volumes about the artificial bird; it was very learnèd and very long, full of the most difficult Chinese words; but yet all the people declared that they had read it and understood it, for fear of being considered stupid, and having their bodies trampled on.\n\nSo a whole year went by. The Emperor, the Court, and all the other Chinese knew every little twitter in the artificial bird's song by heart. But just for that reason it pleased them best—they could sing with it themselves, and they did so. The street boys sang, \"Tsi-tsi-tsi-glug-glug!\" and the Emperor himself sang it too. Yes, that was certainly famous.\n\nBut one evening, when the artificial bird was singing its best, and the Emperor lay in bed listening to it, something inside the bird said, \"Whizz!\" Something cracked. \"Whir-r-r!\" All the wheels ran round, and then the music stopped.\n\nThe Emperor immediately sprang out of bed, and caused his body physician to be called; but what could he do? Then they sent for a watchmaker, and after a good deal of talking and investigation, the bird was put into something like order, but the watchmaker said that the bird must be carefully treated, for the barrels were worn, and it would be impossible to put new ones in in such a manner that the music would go. There was a great lamentation; only once in the year was it permitted to let the bird sing, and that was almost too much. But then the playmaster made a little speech full of heavy words, and said this was just as good as before—and so of course it was as good as before.\n\nNow five years had gone by, and a real grief came upon the whole nation. The Chinese were really fond of their Emperor, and now he was ill, and could not, it was said, live much longer. Already a new Emperor had been chosen, and the people stood out in the street and asked the cavalier how the Emperor did.\n\n\"P!\" said he, and shook his head.\n\nCold and pale lay the Emperor in his great, gorgeous bed; the whole Court thought him dead, and each one ran to pay homage to the new ruler. The chamberlains ran out to talk it over, and the ladies' maids had a great coffee party. All about, in all the halls and passages, cloth had been laid down so that no footstep could be heard, and therefore it was quiet there, quite quiet. But the Emperor was not dead yet; stiff and pale he lay on the gorgeous bed, with the long velvet curtains and the heavy gold tassels; high up, a window stood open, and the moon shone in upon the Emperor and the artificial bird.\n\nThe poor Emperor could scarcely breathe; it was just as if something lay upon his chest; he opened his eyes, and then he saw that it was Death who sat upon his chest, and had put on his golden crown, and held in one hand the Emperor's sword, in the other his beautiful banner. And all around, from among the folds of the splendid velvet curtains, strange heads peered forth; a few very ugly, the rest quite lovely and mild. These were all the Emperor's bad and good deeds, that stood before him now that Death sat upon his heart.\n\n\"Do you remember this?\" whispered one to the other. \"Do you remember that?\" and then they told him so much that the perspiration ran from his forehead.\n\n\"I did not know that!\" said the Emperor. \"Music! music! the great Chinese drum!\" he cried, \"so that I need not hear all they say!\"\n\nAnd they continued speaking, and Death nodded like a Chinaman to all they said.\n\n\"Music! music!\" cried the Emperor. \"You little precious golden bird, sing, sing! I have given you gold and costly presents; I have even hung my golden slipper around your neck—sing now, sing!\"\n\nBut the bird stood still; no one was there to wind him up, and he could not sing without that; but Death continued to stare at the Emperor with his great, hollow eyes, and it was quiet, fearfully quiet.\n\nThen there sounded from the window, suddenly, the most lovely song. It was the little live Nightingale, that sat outside on a spray. It had heard of the Emperor's sad plight, and had come to sing to him of comfort and hope. As it sang the specters grew paler and paler; the blood ran quicker and more quickly through the Emperor's weak limbs; and even Death listened, and said:\n\n\"Go on, little Nightingale, go on!\"\n\n\"But will you give me that splendid golden sword? Will you give me that rich banner? Will you give me the Emperor's crown?\"\n\nAnd Death gave up each of these treasures for a song. And the Nightingale sang on and on; and it sang of the quiet churchyard where the white roses grow, where the elder blossoms smell sweet, and where the fresh grass is moistened by the tears of survivors. Then Death felt a longing to see his garden, and floated out at the window in the form of a cold white mist.\n\n\"Thanks! thanks!\" said the Emperor. \"You heavenly little bird; I know you well. I banished you from my country and empire, and yet you have charmed away the evil faces from my couch, and banished Death from my heart! How can I reward you?\"\n\n\"You have rewarded me!\" replied the Nightingale. \"I have drawn tears from your eyes, when I sang the first time—I shall never forget that. Those are the jewels that rejoice a singer's heart. But now sleep, and grow fresh and strong again. I will sing you something.\"\n\nAnd it sang, and the Emperor fell into a sweet slumber. Ah! how mild and refreshing that sleep was! The sun shone upon him through the windows when he awoke refreshed and restored: not one of his servants had yet returned, for they all thought he was dead; only the Nightingale still sat beside him and sang.\n\n\"You must always stay with me,\" said the Emperor. \"You shall sing as you please; and I'll break the artificial bird into a thousand pieces.\"\n\n\"Not so,\" replied the Nightingale. \"It did well as long as it could; keep it as you have done till now. I cannot build my nest in the palace to dwell in it, but let me come when I feel the wish; then I will sit in the evening on the spray yonder by the window, and sing you something, so that you may be glad and thoughtful at once. I will sing of those who are happy and of those who suffer. I will sing of good and of evil that remains hidden round about you. The little singing bird flies far around, to the poor fisherman, to the peasant's roof, to everyone who dwells far away from you and from your Court. I love your heart more than your crown, and yet the crown has an air of sanctity about it. I will come and sing to you—but one thing you must promise me.\"\n\n\"Every thing!\" said the Emperor; and he stood there in his imperial robes, which he had put on himself, and pressed the sword which was heavy with gold to his heart.\n\n\"One thing I beg of you: tell no one that you have a little bird who tells you everything. Then it will go all the better.\"\n\nAnd the Nightingale flew away.\n\nThe servants came in to look at their dead Emperor, and—yes, there he stood, and the Emperor said, \"Good-morning!\""}, {"id": "the-happy-prince", "title": "The Happy Prince", "byline": "Oscar Wilde", "src": "Curry & Clippinger, Children's Literature", "gid": "25545", "theme": "Andersen & Wilde", "band": "G4+", "words": 3475, "note": "Week 2 Book Circle; sacrifice", "text": "High above the city, on a tall column, stood the statue of the Happy Prince. He was gilded all over with thin leaves of fine gold, for eyes he had two bright sapphires, and a large red ruby glowed on his sword-hilt.\n\nHe was very much admired indeed. \"He is as beautiful as a weathercock,\" remarked one of the Town Councillors who wished to gain a reputation for having artistic tastes; \"only not quite so useful,\" he added, fearing lest people should think him unpractical, which he really was not.\n\n\"Why can't you be like the Happy Prince?\" asked a sensible mother of her little boy who was crying for the moon. \"The Happy Prince never dreams of crying for anything.\"\n\n\"I am glad there is some one in the world who is quite happy,\" muttered a disappointed man as he gazed at the wonderful statue.\n\n\"He looks just like an angel,\" said the Charity Children as they came out of the cathedral in their bright scarlet cloaks and their clean white pinafores.\n\n\"How do you know?\" said the Mathematical Master; \"you have never seen one.\"\n\n\"Ah! but we have, in our dreams,\" answered the children; and the Mathematical Master frowned and looked very severe, for he did not approve of children dreaming.\n\nOne night there flew over the city a Little Swallow. His friends had gone away to Egypt six weeks before, but he had stayed behind, for he was in love with the most beautiful Reed. He had met her early in the spring as he was flying down the river after a big yellow moth, and had been so attracted by her slender waist that he had stopped to talk to her.\n\n\"Shall I love you?\" said the Swallow, who liked to come to the point at once, and the Reed made him a low bow. So he flew round and round her, touching the water with his wings, and making silver ripples. This was his courtship, and it lasted all through the summer.\n\n\"It is a ridiculous attachment,\" twittered the other Swallows; \"she has no money, and far too many relations\"; and indeed the river was quite full of Reeds. Then when the autumn came they all flew away.\n\nAfter they had gone he felt lonely, and began to tire of his lady-love. \"She has no conversation,\" he said, \"and I am afraid that she is a coquette, for she is always flirting with the wind.\" And certainly, whenever the wind blew, the Reed made the most graceful curtseys. \"I admit that she is domestic,\" he continued, \"but I love traveling, and my wife, consequently, should love traveling also.\"\n\n\"Will you come away with me?\" he said finally to her; but the Reed shook her head, she was so attached to her home.\n\n\"You have been trifling with me,\" he cried. \"I am off to the Pyramids. Good-bye!\" and he flew away.\n\nAll day long he flew, and at night-time he arrived at the city. \"Where shall I put up?\" he said; \"I hope the town has made preparations.\"\n\nThen he saw the statue on the tall column.\n\n\"I will put up there,\" he cried; \"it is a fine position, with plenty of fresh air.\" So he alighted just between the feet of the Happy Prince.\n\n\"I have a golden bedroom,\" he said softly to himself as he looked round, and he prepared to go to sleep; but just as he was putting his head under his wing a large drop of water fell on him. \"What a curious thing!\" he cried; \"there is not a single cloud in the sky, the stars are quite clear and bright, and yet it is raining. The climate in the north of Europe is really dreadful. The Reed used to like the rain, but that was merely her selfishness.\"\n\nThen another drop fell.\n\n\"What is the use of a statue if it cannot keep the rain off?\" he said; \"I must look for a good chimney-pot,\" and he determined to fly away.\n\nBut before he had opened his wings, a third drop fell, and he looked up, and saw—Ah! what did he see?\n\nThe eyes of the Happy Prince were filled with tears, and tears were running down his golden cheeks. His face was so beautiful in the moonlight that the little Swallow was filled with pity.\n\n\"Who are you?\" he said.\n\n\"I am the Happy Prince.\"\n\n\"Why are you weeping then?\" asked the Swallow; \"you have quite drenched me.\"\n\n\"When I was alive and had a human heart,\" answered the statue, \"I did not know what tears were, for I lived in the Palace of Sans-Souci, where sorrow is not allowed to enter. In the daytime I played with my companions in the garden, and in the evening I led the dance in the Great Hall. Round the garden ran a very lofty wall, but I never cared to ask what lay beyond it, everything about me was so beautiful. My courtiers called me the Happy Prince, and happy indeed I was, if pleasure be happiness. So I lived, and so I died. And now that I am dead they have set me up here so high that I can see all the ugliness and all the misery of my city, and though my heart is made of lead yet I cannot choose but weep.\"\n\n\"What! is he not solid gold?\" said the Swallow to himself. He was too polite to make any personal remarks out loud.\n\n\"Far away,\" continued the statue in a low musical voice, \"far away in a little street there is a poor house. One of the windows is open, and through it I can see a woman seated at a table. Her face is thin and worn, and she has coarse, red hands, all pricked by the needle, for she is a seamstress. She is embroidering passion-flowers on a satin gown for the loveliest of the Queen's maids-of-honor to wear at the next Court-ball. In a bed in the corner of the room her little boy is lying ill. He has a fever, and is asking for oranges. His mother has nothing to give him but river water, so he is crying. Swallow, Swallow, little Swallow, will you not take her the ruby out of my sword-hilt? My feet are fastened to this pedestal and I cannot move.\"\n\n\"I am waited for in Egypt,\" said the Swallow. \"My friends are flying up and down the Nile, and talking to the large lotus-flowers. Soon they will go to sleep in the tomb of the great King. The King is there himself in his painted coffin. He is wrapped in yellow linen, and embalmed with spices. Round his neck is a chain of pale green jade, and his hands are like withered leaves.\"\n\n\"Swallow, Swallow, little Swallow,\" said the Prince, \"will you not stay with me for one night, and be my messenger? The boy is so thirsty, and the mother so sad.\"\n\n\"I don't think I like boys,\" answered the Swallow. \"Last summer, when I was staying on the river, there were two rude boys, the miller's sons, who were always throwing stones at me. They never hit me, of course; we swallows fly far too well for that, and besides, I come of a family famous for its agility; but still, it was a mark of disrespect.\"\n\nBut the Happy Prince looked so sad that the little Swallow was sorry. \"It is very cold here,\" he said; \"but I will stay with you for one night, and be your messenger.\"\n\n\"Thank you, little Swallow,\" said the Prince.\n\nSo the Swallow picked out the great ruby from the Prince's sword, and flew away with it in his beak over the roofs of the town.\n\nHe passed by the cathedral tower, where the white marble angels were sculptured. He passed by the palace and heard the sound of dancing. A beautiful girl came out on the balcony with her lover. \"How wonderful the stars are,\" he said to her, \"and how wonderful is the power of love!\"\n\n\"I hope my dress will be ready in time for the State-ball,\" she answered; \"I have ordered passion-flowers to be embroidered on it; but the seamstresses are so lazy.\"\n\nHe passed over the river, and saw the lanterns hanging to the masts of the ships. He passed over the Ghetto, and saw the old Jews bargaining with each other, and weighing out money in copper scales. At last he came to the poor house and looked in. The boy was tossing feverishly on his bed, and the mother had fallen asleep, she was so tired. In he hopped, and laid the great ruby on the table beside the woman's thimble. Then he flew gently round the bed, fanning the boy's forehead with his wings. \"How cool I feel,\" said the boy. \"I must be getting better\"; and he sank into a delicious slumber.\n\nThen the Swallow flew back to the Happy Prince, and told him what he had done. \"It is curious,\" he remarked, \"but I feel quite warm now, although it is so cold.\"\n\n\"That is because you have done a good action,\" said the Prince. And the little Swallow began to think, and then he fell asleep. Thinking always made him sleepy.\n\nWhen day broke he flew down to the river and had a bath. \"What a remarkable phenomenon,\" said the Professor of Ornithology as he was passing over the bridge. \"A swallow in winter!\" And he wrote a long letter about it to the local newspaper. Every one quoted it, it was full of so many words that they could not understand.\n\n\"To-night I go to Egypt,\" said the Swallow, and he was in high spirits at the prospect. He visited all the public monuments, and sat a long time on top of the church steeple. Wherever he went the Sparrows chirruped, and said to each other, \"What a distinguished stranger!\" so he enjoyed himself very much.\n\nWhen the moon rose he flew back to the Happy Prince. \"Have you any commissions for Egypt?\" he cried; \"I am just starting.\"\n\n\"Swallow, Swallow, little Swallow,\" said the Prince, \"will you not stay with me one night longer?\"\n\n\"I am waited for in Egypt,\" answered the Swallow. \"To-morrow my friends will fly up to the Second Cataract. The river-horse couches there among the bulrushes, and on a great granite throne sits the God Memnon. All night long he watches the stars, and when the morning star shines he utters one cry of joy, and then he is silent. At noon the yellow lions come down to the water's edge to drink. They have eyes like green beryls, and their roar is louder than the roar of the cataract.\"\n\n\"Swallow, Swallow, little Swallow,\" said the Prince, \"far away across the city I see a young man in a garret. He is leaning over a desk covered with papers, and in a tumbler by his side there is a bunch of withered violets. His hair is brown and crisp, and his lips are red as a pomegranate, and he has large and dreamy eyes. He is trying to finish a play for the Director of the Theatre, but he is too cold to write any more. There is no fire in the grate, and hunger has made him faint.\"\n\n\"I will wait with you one night longer,\" said the Swallow, who really had a good heart. \"Shall I take him another ruby?\"\n\n\"Alas! I have no ruby now,\" said the Prince; \"my eyes are all that I have left. They are made of rare sapphires, which were brought out of India a thousand years ago. Pluck out one of them and take it to him. He will sell it to the jeweller, and buy food and firewood, and finish his play.\"\n\n\"Dear Prince,\" said the Swallow, \"I cannot do that\"; and he began to weep.\n\n\"Swallow, Swallow, little Swallow,\" said the Prince, \"do as I command you.\"\n\nSo the Swallow plucked out the Prince's eye, and flew away to the student's garret. It was easy enough to get in, as there was a hole in the roof. Through this he darted, and came into the room. The young man had his head buried in his hands, so he did not hear the flutter of the bird's wings, and when he looked up he found the beautiful sapphire lying on the withered violets.\n\n\"I am beginning to be appreciated,\" he cried; \"this is from some great admirer. Now I can finish my play,\" and he looked quite happy.\n\nThe next day the Swallow flew down to the harbor. He sat on the mast of a large vessel and watched the sailors hauling big chests out of the hold with ropes. \"Heave a-hoy!\" they shouted as each chest came up. \"I am going to Egypt!\" cried the Swallow, but nobody minded, and when the moon rose he flew back to the Happy Prince.\n\n\"I am come to bid you good-bye,\" he cried.\n\n\"Swallow, Swallow, little Swallow,\" said the Prince, \"will you not stay with me one night longer?\"\n\n\"It is winter,\" answered the Swallow, \"and the chill snow will soon be here. In Egypt the sun is warm on the green palm-trees, and the crocodiles lie in the mud and look lazily about them. My companions are building a nest in the Temple of Baalbec, and the pink and white doves are watching them, and cooing to each other. Dear Prince, I must leave you, but I will never forget you, and next spring I will bring you back two beautiful jewels in place of those you have given away. The ruby shall be redder than a red rose, and the sapphire shall be as blue as the great sea.\"\n\n\"In the square below,\" said the Happy Prince, \"there stands a little match-girl. She has let her matches fall in the gutter, and they are all spoiled. Her father will beat her if she does not bring home some money, and she is crying. She has no shoes or stockings, and her little head is bare. Pluck out my other eye, and give it to her, and her father will not beat her.\"\n\n\"I will stay with you one night longer,\" said the Swallow, \"but I cannot pluck out your eye. You would be quite blind then.\"\n\n\"Swallow, Swallow, little Swallow,\" said the Prince, \"do as I command you.\"\n\nSo he plucked out the Prince's other eye, and darted down with it. He swooped past the match-girl, and slipped the jewel into the palm of her hand. \"What a lovely bit of glass,\" cried the little girl; and she ran home, laughing.\n\nThen the Swallow came back to the Prince. \"You are blind now,\" he said, \"so I will stay with you always.\"\n\n\"No, little Swallow,\" said the poor Prince, \"you must go away to Egypt.\"\n\n\"I will stay with you always,\" said the Swallow, and he slept at the Prince's feet.\n\nAll the next day he sat on the Prince's shoulder, and told him stories of what he had seen in strange lands. He told him of the red ibises, who stand in long rows on the banks of the Nile, and catch goldfish in their beaks; of the Sphinx, who is as old as the world itself, and lives in the desert, and knows everything; of the merchants, who walk slowly by the side of their camels, and carry amber beads in their hands; of the King of the Mountains of the Moon, who is as black as ebony, and worships a large crystal; of the great green snake that sleeps in a palm-tree, and has twenty priests to feed it with honey-cakes; and of the pygmies who sail over a big lake on large flat leaves, and are always at war with the butterflies.\n\n\"Dear little Swallow,\" said the Prince, \"you tell me of marvelous things, but more marvelous than anything is the suffering of men and of women. There is no Mystery so great as Misery. Fly over my city, little Swallow, and tell me what you see there.\"\n\nSo the Swallow flew over the great city, and saw the rich making merry in their beautiful houses, while the beggars were sitting at the gates. He flew into dark lanes, and saw the white faces of starving children looking out listlessly at the black streets. Under the archway of a bridge two little boys were lying in one another's arms to try to keep themselves warm. \"How hungry we are!\" they said. \"You must not lie here,\" shouted the Watchman, and they wandered out into the rain.\n\nThen he flew back and told the Prince what he had seen.\n\n\"I am covered with fine gold,\" said the Prince; \"you must take it off, leaf by leaf, and give it to my poor; the living always think that gold can make them happy.\"\n\nLeaf after leaf of the fine gold the Swallow picked off, till the Happy Prince looked quite dull and grey. Leaf after leaf of the fine gold he brought to the poor, and the children's faces grew rosier, and they laughed and played games in the street. \"We have bread now!\" they cried.\n\nThen the snow came, and after the snow came the frost. The streets looked as if they were made of silver, they were so bright and glistening; long icicles like crystal daggers hung down from the eaves of the houses, everybody went about in furs, and the little boys wore scarlet caps and skated on the ice.\n\nThe poor little Swallow grew colder and colder, but he would not leave the Prince; he loved him too well. He picked up crumbs outside the baker's door when the baker was not looking, and tried to keep himself warm by flapping his wings.\n\nBut at last he knew that he was going to die. He had just strength to fly up to the Prince's shoulder once more. \"Good-bye, dear Prince!\" he murmured, \"will you let me kiss your hand?\"\n\n\"I am glad that you are going to Egypt at last, little Swallow,\" said the Prince. \"You have stayed too long here; but you must kiss me on the lips, for I love you.\"\n\n\"It is not to Egypt that I am going,\" said the Swallow. \"I am going to the House of Death. Death is the brother of Sleep, is he not?\"\n\nAnd he kissed the Happy Prince on the lips, and fell down dead at his feet.\n\nAt that moment a curious crack sounded inside the statue, as if something had suddenly broken. The fact is that the leaden heart had snapped right in two. It certainly was a dreadfully hard frost.\n\nEarly the next morning the Mayor was walking in the square below in company with the Town Councillors. As they passed the column he looked up at the statue: \"Dear me! how shabby the Happy Prince looks!\" he said.\n\n\"How shabby indeed!\" cried the Town Councillors, who always agreed with the Mayor; and they went up to look at it.\n\n\"The ruby has fallen out of his sword, his eyes are gone, and he is golden no longer,\" said the Mayor; \"in fact, he is little better than a beggar!\"\n\n\"Little better than a beggar,\" said the Town Councillors.\n\n\"And here is actually a dead bird at his feet!\" continued the Mayor. \"We must really issue a proclamation that birds are not to be allowed to die here.\" And the Town Clerk made a note of the suggestion.\n\nSo they pulled down the statue of the Happy Prince. \"As he is no longer beautiful he is no longer useful,\" said the Art Professor at the University.\n\nThen they melted the statue in a furnace, and the Mayor held a meeting of the Corporation to decide what was to be done with the metal. \"We must have another statue, of course,\" he said, \"and it shall be a statue of myself.\"\n\n\"Of myself,\" said each of the Town Councillors, and they quarrelled. When I last heard of them they were quarreling still.\n\n\"What a strange thing!\" said the overseer of the workmen at the foundry. \"This broken lead heart will not melt in the furnace. We must throw it away.\" So they threw it on a dustheap where the dead Swallow was also lying.\n\n\"Bring me the two most precious things in the city,\" said God to one of His Angels; and the Angel brought Him the leaden heart and the dead bird.\n\n\"You have rightly chosen,\" said God, \"for in my garden of Paradise this little bird shall sing for evermore, and in my city of gold the Happy Prince shall praise me.\""}, {"id": "icarus-and-daedalus", "title": "Icarus and Daedalus", "byline": "Josephine Preston Peabody", "src": "Curry & Clippinger, Children's Literature", "gid": "25545", "theme": "Myths", "band": "G4+", "words": 726, "note": "Warnings ignored; Week 5", "text": "Among all those mortals who grew so wise that they learned the secrets of the gods, none was more cunning than Daedalus.\n\nHe once built, for King Minos of Crete, a wonderful Labyrinth of winding ways so cunningly tangled up and twisted around that, once inside, you could never find your way out again without a magic clue. But the king's favor veered with the wind, and one day he had his master architect imprisoned in a tower. Daedalus managed to escape from his cell; but it seemed impossible to leave the island, since every ship that came or went was well guarded by order of the king.\n\nAt length, watching the sea gulls in the air,—the only creatures that were sure of liberty,—he thought of a plan for himself and his young son Icarus, who was captive with him.\n\nLittle by little, he gathered a store of feathers great and small. He fastened these together with thread, moulded them in with wax, and so fashioned two great wings like those of a bird. When they were done, Daedalus fitted them to his own shoulders, and after one or two efforts, he found that by waving his arms he could winnow the air and cleave it, as a swimmer does the sea. He held himself aloft, wavered this way and that with the wind, and at last, like a great fledgling, he learned to fly.\n\nWithout delay, he fell to work on a pair of wings for the boy Icarus, and taught him carefully how to use them, bidding him beware of rash adventures among the stars. \"Remember,\" said the father, \"never to fly very low or very high, for the fogs about the earth would weigh you down, but the blaze of the sun will surely melt your feathers apart if you go too near.\"\n\nFor Icarus, these cautions went in at one ear and out by the other. Who could remember to be careful when he was to fly for the first time? Are birds careful? Not they! And not an idea remained in the boy's head but the one joy of escape.\n\nThe day came, and the fair wind that was to set them free. The father bird put on his wings, and, while the light urged them to be gone, he waited to see that all was well with Icarus, for the two could not fly hand in hand. Up they rose, the boy after his father. The hateful ground of Crete sank beneath them; and the country folk, who caught a glimpse of them when they were high above the tree-tops, took it for a vision of the gods,—Apollo, perhaps, with Cupid after him.\n\nAt first there was a terror in the joy. The wide vacancy of the air dazed them,—a glance downward made their brains reel. But when a great wind filled their wings, and Icarus felt himself sustained, like a halcyon-bird in the hollow of a wave, like a child uplifted by his mother, he forgot everything in the world but joy. He forgot Crete and the other islands that he had passed over: he saw but vaguely that winged thing in the distance before him that was his father Daedalus. He longed for one draught of flight to quench the thirst of his captivity: he stretched out his arms to the sky and made towards the highest heavens.\n\nAlas for him! Warmer and warmer grew the air. Those arms, that had seemed to uphold him, relaxed. His wings wavered, drooped. He fluttered his young hands vainly,—he was falling,—and in that terror he remembered. The heat of the sun had melted the wax from his wings; the feathers were falling, one by one, like snowflakes; and there was none to help.\n\nHe fell like a leaf tossed down the wind, down, down, with one cry that overtook Daedalus far away. When he returned, and sought high and low for the poor boy, he saw nothing but the bird-like feathers afloat on the water, and he knew that Icarus was drowned.\n\nThe nearest island he named Icaria, in memory of the child; but he, in heavy grief, went to the temple of Apollo in Sicily, and there hung up his wings as an offering. Never again did he attempt to fly."}, {"id": "midas", "title": "Midas", "byline": "", "src": "Curry & Clippinger, Children's Literature", "gid": "25545", "theme": "Myths", "band": "G4+", "words": 749, "note": "Greed; Week 3 Book Circle", "text": "Bacchus, on a certain occasion, found his old schoolmaster and foster-father, Silenus, missing. The old man had been drinking, and in that state had wandered away, and was found by some peasants, who carried him to their king, Midas. Midas recognized him and treated him hospitably, entertaining him for ten days and nights with an unceasing round of jollity. On the eleventh day he brought Silenus back, and restored him in safety to his pupil. Whereupon Bacchus offered Midas his choice of whatever reward he might wish. He asked that whatever he might touch should be changed into gold. Bacchus consented, though sorry that he had not made a better choice.\n\nMidas went his way, rejoicing in his newly acquired power, which he hastened to put to the test. He could scarce believe his eyes when he found that a twig of an oak, which he plucked from the branch, became gold in his hand. He took up a stone—it changed to gold. He touched a sod—it did the same. He took an apple from the tree—you would have thought he had robbed the garden of the Hesperides. His joy knew no bounds, and as soon as he got home, he ordered the servants to set a splendid repast on the table. Then he found to his dismay that whether he touched bread, it hardened in his hand; or put a morsel to his lips, it defied his teeth. He took a glass of wine, but it flowed down his throat like melted gold.\n\nIn consternation at the unprecedented affliction, he strove to divest himself of his power; he hated the gift he had lately coveted. But all in vain; starvation seemed to await him. He raised his arms, all shining with gold, in prayer to Bacchus, begging to be delivered from his glittering destruction. Bacchus, merciful deity, heard and consented. \"Go,\" said he, \"to the River Pactolus, trace the stream to its fountain-head, there plunge in your head and body and wash away your fault and its punishment.\" He did so, and scarce had he touched the waters before the gold-creating power passed into them, and the river sands became changed into gold, as they remain to this day.\n\nThenceforth Midas, hating wealth and splendor, dwelt in the country and became a worshipper of Pan, the god of the fields. On a certain occasion Pan had the temerity to compare his music with that of Apollo, and to challenge the god of the lyre to a trial of skill. The challenge was accepted; and Tmolus, the mountain-god, was chosen umpire. Tmolus took his seat and cleared away the trees from his ears to listen. At a given signal Pan blew on his pipes, and with his rustic melody gave great satisfaction to himself and his faithful follower Midas, who happened to be present. Then Tmolus turned his head toward the sun-god, and all his trees turned with him. Apollo rose, his brow wreathed with Parnassian laurel, while his robe of Tyrian purple swept the ground. In his left hand he held the lyre, and with his right hand struck the strings. Ravished with the harmony, Tmolus at once awarded the victory to the god of the lyre, and all but Midas acquiesced in the judgment. He dissented, and questioned the justice of the award. Apollo would not suffer such a depraved pair of ears any longer to wear the human form, but caused them to increase in length, grow hairy within and without, and to become movable on their roots; in short, to be on the perfect pattern of those of an ass.\n\nMortified enough was King Midas at this mishap; but he consoled himself with the thought that it was possible to hide his misfortune, which he attempted to do by means of an ample turban or headdress. But his hairdresser of course knew the secret. He was charged not to mention it, and threatened with dire punishment if he presumed to disobey. But he found it too much for his discretion to keep such a secret; so he went out into the meadow, dug a hole in the ground, and stooping down, whispered the story, and covered it up. Before long a thick bed of reeds sprang up in the meadow, and as soon as it had gained its growth, began whispering the story, and has continued to do so, from that day to this, with every breeze which passes over the place."}, {"id": "pha-thon", "title": "Phaëthon", "byline": "Charles Mills Gayley", "src": "Curry & Clippinger, Children's Literature", "gid": "25545", "theme": "Myths", "band": "G5", "words": 1932, "note": "Warnings ignored; Week 5", "text": "Phaëthon was the son of Apollo and the nymph Clymene. One day Epaphus, the son of Jupiter and Io, scoffed at the idea of Phaëthon's being the son of a god. Phaëthon complained of the insult to his mother Clymene. She sent him to Phoebus to ask for himself whether he had not been truly informed concerning his parentage. Gladly Phaëthon traveled toward the regions of sunrise and gained at last the palace of the sun. He approached his father's presence, but stopped at a distance, for the light was more than he could bear.\n\nPhoebus Apollo, arrayed in purple, sat on a throne that glittered with diamonds. Beside him stood the Day, the Month, the Year, the Hours, and the Seasons. Surrounded by these attendants, the Sun beheld the youth dazzled with the novelty and splendor of the scene, and inquired the purpose of his errand. The youth replied, \"Oh, light of the boundless world, Phoebus, my father—if thou dost yield me that name—give me some proof, I beseech thee, by which I may be known as thine!\"\n\nHe ceased. His father, laying aside the beams that shone around his head, bade him approach, embraced him, owned him for his son, and swore by the river Styx that whatever proof he might ask should be granted. Phaëthon immediately asked to be permitted for one day to drive the chariot of the sun. The father repented of his promise and tried to dissuade the boy by telling him the perils of the undertaking. \"None but myself,\" he said, \"may drive the flaming car of day. Not even Jupiter, whose terrible right arm hurls the thunderbolts. The first part of the way is steep and such as the horses when fresh in the morning can hardly climb; the middle is high up in the heavens, whence I myself can scarcely, without alarm, look down and behold the earth and sea stretched beneath me. The last part of the road descends rapidly and requires most careful driving. Tethys, who is waiting to receive me, often trembles for me lest I should fall headlong. Add to this that the heaven is all the time turning round and carrying the stars with it. Couldst thou keep thy course while the sphere revolved beneath thee? The road, also, is through the midst of frightful monsters. Thou must pass by the horns of the Bull, in front of the Archer, and near the Lion's jaws, and where the Scorpion stretches its arms in one direction and the Crab in another. Nor wilt thou find it easy to guide those horses, with their breasts full of fire that they breathe forth from their mouths and nostrils. Beware, my son, lest I be the donor of a fatal gift; recall the request while yet thou canst.\" He ended; but the youth rejected admonition and held to his demand. So, having resisted as long as he might, Phoebus at last led the way to where stood the lofty chariot.\n\nIt was of gold, the gift of Vulcan,—the axle of gold, the pole and wheels of gold, the spokes of silver. Along the seat were rows of chrysolites and diamonds, reflecting the brightness of the sun. While the daring youth gazed in admiration, the early Dawn threw open the purple doors of the east and showed the pathway strewn with roses. The stars withdrew, marshaled by the Daystar, which last of all retired also. The father, when he saw the earth beginning to glow and the Moon preparing to retire, ordered the Hours to harness up the horses. They led forth from the lofty stalls the steeds full fed with ambrosia, and attached the reins. Then the father, smearing the face of his son with a powerful unguent, made him capable of enduring the brightness of the flame. He set the rays on the lad's head, and, with a foreboding sigh, told him to spare the whip and hold tight the reins; not to take the straight road between the five circles, but to turn off to the left; to keep within the limit of the middle zone and avoid the northern and the southern alike; finally, to keep in the well-worn ruts and to drive neither too high nor too low, for the middle course was safest and best.\n\nForthwith the agile youth sprang into the chariot, stood erect, and grasped the reins with delight, pouring out thanks to his reluctant parent. But the steeds soon perceived that the load they drew was lighter than usual; and as a ship without its accustomed weight, was dashed about as if empty. The horses rushed headlong and left the traveled road. Then, for the first time, the Great and Little Bears were scorched with heat, and would fain, if it were possible, have plunged into the water; and the Serpent which lies coiled round the north pole, torpid and harmless, grew warm, and with warmth felt its rage revive. Boötes, they say, fled away, though encumbered with his plow and unused to rapid motion.\n\nWhen hapless Phaëthon looked down upon the earth, now spreading in vast extent beneath him, he grew pale, and his knees shook with terror. He lost his self-command and knew not whether to draw tight the reins or throw them loose; he forgot the names of the horses. But when he beheld the monstrous forms scattered over the surface of heaven,—the Scorpion extending two great arms, his tail, and his crooked claws over the space of two signs of the zodiac,—when the boy beheld him, reeking with poison and menacing with fangs, his courage failed, and the reins fell from his hands. The horses, unrestrained, went off into unknown regions of the sky in among the stars, hurling the chariot over pathless places, now up in high heaven, now down almost to the earth. The moon saw with astonishment her brother's chariot running beneath her own. The clouds began to smoke. The forest-clad mountains burned,—Athos and Taurus and Tmolus and Oete; Ida, once celebrated for fountains; the Muses' mountain Helicon, and Haemus; Aetna, with fires within and without, and Parnassus, with his two peaks, and Rhodope, forced at last to part with his snowy crown. Her cold climate was no protection to Scythia; Caucasus burned, and Ossa and Pindus, and, greater than both, Olympus,—the Alps high in air, and the Apennines crowned with clouds.\n\nPhaëthon beheld the world on fire and felt the heat intolerable. Then, too, it is said, the people of Aethiopia became black because the blood was called by the heat so suddenly to the surface; and the Libyan desert was dried up to the condition in which it remains to this day. The Nymphs of the fountains, with disheveled hair, mourned their waters, nor were the rivers safe beneath their banks; Tanaïs smoked, and Caïcus, Xanthus, and Maeander; Babylonian Euphrates and Ganges, Tagus, with golden sands, and Caÿster, where the swans resort. Nile fled away and hid his head in the desert, and there it still remains concealed. Where he used to discharge his waters through seven mouths into the sea, seven dry channels alone remained. The earth cracked open and through the chinks light broke into Tartarus and frightened the king of shadows and his queen. The sea shrank up. Even Nereus and his wife Doris with the Nereïds, their daughters, sought the deepest caves for refuge. Thrice Neptune essayed to raise his head above the surface and thrice was driven back by the heat. Earth, surrounded as she was by waters, yet with head and shoulders bare, screening her face with her hand, looked up to heaven, and with husky voice prayed Jupiter, if it were his will that she should perish by fire, to end her agony at once by his thunderbolts, or else to consider his own Heaven, how both the poles were smoking that sustained his palace, and that all must fall if they were destroyed.\n\nEarth, overcome with heat and thirst, could say no more. Then Jupiter, calling the gods to witness that all was lost unless some speedy remedy were applied, thundered, brandished a lightning bolt in his right hand, launched it against the charioteer, and struck him at the same moment from his seat and from existence. Phaëthon, with his hair on fire, fell headlong, like a shooting star which marks the heavens with its brightness as it falls, and Eridanus, the great river, received him and cooled his burning frame. His sisters, the Heliades, as they lamented his fate, were turned into poplar trees on the banks of the river; and their tears, which continued to flow, became amber as they dropped into the stream. The Italian Naiads reared a tomb for him and inscribed these words upon the stone:\n\nDriver of Phoebus' chariot, Phaëthon,\nStruck by Jove's thunder, rests beneath this stone.\nHe could not rule his father's car of fire,\nYet was it much so nobly to aspire.\n\nThe Norse myths originated among peoples who lived in the country which is now Norway, Sweden, Denmark, and Iceland. In these lands of the North, winter is long and dark, and the intense cold is not easily endured; but summer brings sunshine, warmth, and happiness. It is not strange, therefore, that the evil spirits of Norse mythology should be represented as huge frost giants and mountain giants. These giants, or Jotuns, were first formed from the mist that came from fields of ice. They lived in a dreary country called Jötunheim, and were enemies of the gods, who lived in the bright, beautiful city of Asgard.\n\nTo live the life of the old Norse folk required strength and courage, for the little boats in which they went to fish were too small for storm-tossed Arctic seas, and the weapons with which they hunted in the cold, lonely forests were primitive. It is but natural, therefore, that they should have idealized strength and courage and that they should have represented the gods of Asgard as being large, strong, and courageous. Although Thor, the eldest son of Odin, was small in comparison with the giants, we are told in one of the myths that he was a mile in height; also he had great strength and a wonderful hammer, called Mjolmer, with which he always defeated the giants and kept them from Asgard. Thunder was caused by the stroke of Thor's hammer; hence Thor was called the Thunderer.\n\nThe spiritual ideals in Norse mythology are more important than the physical ideals. The long, cold winter nights kept the Norse folk at home; hence they had a love for home and family relations and a respect for women that may not be found revealed in the mythology of Greece. Wisdom and judgment, too, were more essential than craft and fraud in encountering the hardships of their life; therefore they represented Odin, the supreme god of Asgard, as being the god of wisdom. The gods of Greek mythology often used craft and fraud to accomplish their purposes, but only Loke among the inhabitants of Asgard relied upon deception. Loke was descended from the giants, but was also related to the gods; so he was permitted to live in Asgard. It is significant of the spirit of the Norse folk that the gods did not trust Loke and came to regard him as their enemy; and it was he who finally brought misfortune to the gods."}, {"id": "the-narcissus", "title": "The Narcissus", "byline": "R. E. Francillon", "src": "Curry & Clippinger, Children's Literature", "gid": "25545", "theme": "Myths", "band": "G3+", "words": 947, "note": "Vanity; origin of a word", "text": "There was a very beautiful nymph named Echo, who had never, in all her life, seen anybody handsomer than the god Pan. You have read that Pan was the chief of all the Satyrs, and what hideous monsters the Satyrs were. So, when Pan made love to her, she very naturally kept him at a distance: and, as she supposed him to be no worse-looking than the rest of the world, she made up her mind to have nothing to do with love or lovemaking, and was quite content to ramble about the woods all alone.\n\nBut one day, to her surprise, she happened to meet with a young man who was as different from Pan as any creature could be. Instead of having a goat's legs and long hairy arms, he was as graceful as Apollo himself: no horns grew out of his forehead, and his ears were not long, pointed, and covered with hair, but just like Echo's own. And he was just as beautiful in face as he was graceful in form. I doubt if Echo would have thought even Apollo himself so beautiful.\n\nThe nymphs were rather shy, and Echo was the very shyest of them all. But she admired him so much she could not leave the spot, and at last she even plucked up courage enough to ask him, \"What is the name of the most beautiful being in the whole world?\"\n\n\"Whom do you mean?\" asked he. \"Yourself? If you want to know your own name, you can tell it better than I can.\"\n\n\"No,\" said Echo, \"I don't mean myself. I mean you. What is your name?\"\n\n\"My name is Narcissus,\" said he. \"But as for my being beautiful—that is absurd.\"\n\n\"Narcissus!\" repeated Echo to herself. \"It is a beautiful name. Which of the nymphs have you come to meet here in these woods all alone? She is lucky—whoever she may be.\"\n\n\"I have come to meet nobody,\" said Narcissus. \"But—am I really so beautiful? I have often been told so by other girls, of course; but really it is more than I can quite believe.\"\n\n\"And you don't care for any of those girls?\"\n\n\"Why, you see,\" said Narcissus, \"when all the girls one knows call one beautiful, there's no reason why I should care for one more than another. They all seem alike when they are all always saying just the same thing. Ah! I do wish I could see myself, so that I could tell if it was really true. I would marry the girl who could give me the wish of my heart—to see myself as other people see me. But as nobody can make me do that, why, I suppose I shall get on very well without marrying anybody at all.\"\n\nLooking-glasses had not been invented in those days, so that Narcissus had really never seen even so much of himself as his chin.\n\n\"What!\" cried Echo, full of hope and joy; \"if I make you see your own face, you will marry me?\"\n\n\"I said so,\" said he. \"And of course what I say I'll do, I'll do.\"\n\n\"Then—come with me!\"\n\nEcho took him by the hand and led him to the edge of a little lake in the middle of the wood, full of clear water.\n\n\"Kneel down, Narcissus,\" said she, \"and bend your eyes over the waterside. That lake is the mirror where Diana comes every morning to dress her hair, and in which, every night, the moon and the stars behold themselves. Look into that water, and see what manner of man you are!\"\n\nNarcissus kneeled down and looked into the lake. And, better than in any common looking-glass, he saw the reflected image of his own face—and he looked, and looked, and could not take his eyes away.\n\nBut Echo at last grew tired of waiting. \"Have you forgotten what you promised me?\" asked she. \"Are you content now? Do you see now that what I told you is true?\"\n\nHe lifted his eyes at last. \"Oh, beautiful creature that I am!\" said he. \"I am indeed the most divine creature in the whole wide world. I love myself madly. Go away. I want to be with my beautiful image, with myself, all alone. I can't marry you. I shall never love anybody but myself for the rest of my days.\" And he kneeled down and gazed at himself once more, while poor Echo had to go weeping away.\n\nNarcissus had spoken truly. He loved himself and his own face so much that he could think of nothing else: he spent all his days and nights by the lake, and never took his eyes away. But unluckily his image, which was only a shadow in the water, could not love him back again. And so he pined away until he died. And when his friends came to look for his body, they found nothing but a flower, into which his soul had turned. So they called it the Narcissus, and we call it so still. And yet I don't know that it is a particularly conceited or selfish flower.\n\nAs for poor Echo, she pined away too. She faded and faded until nothing was left of her but her voice. There are many places where she can even now be heard. And she still has the same trick of saying to vain and foolish people whatever they say to themselves, or whatever they would like best to hear said to them. If you go where Echo is, and call out loudly, \"I am beautiful!\"—she will echo your very words."}, {"id": "a-story-of-the-springtime", "title": "A Story of the Springtime", "byline": "Grace H. Kupfer", "src": "Curry & Clippinger, Children's Literature", "gid": "25545", "theme": "Myths", "band": "G4+", "words": 1265, "note": "Persephone; why seasons change", "text": "PART I\n\nIn the blue Mediterranean Sea, which washes the southern shore of Europe, lies the beautiful island of Sicily. Long, long ago, there lived on this island a goddess named Ceres. She had power to make the earth yield plentiful crops of grain, or to leave it barren; and on her depended the food, and therefore the life of all the people on the great, wide earth.\n\nCeres had one fair young daughter, whom she loved very dearly. And no wonder, for Proserpine was the sunniest, happiest girl you could imagine.\n\nHer face was all white and pink, like apple blossoms in spring, and there was just enough blue in her eyes to give you a glimpse of an April morning sky. Her long, golden curls reminded you of the bright sunlight. In fact there was something so young and fair and tender about the maiden that if you could imagine anything so strange as the whole springtime, with all its loveliness, changed into a human being, you would have looked but an instant at Proserpine and said, \"She is the Spring.\"\n\nProserpine spent the long, happy days in the fields, helping her mother, or dancing and singing among the flowers, with her young companions.\n\nWay down under the earth, in the land of the dead, lived dark King Pluto; and the days were very lonely for him with only shadows to talk to. Often and often, he had tried to urge some goddess to come and share his gloomy throne; but not the richest jewels or wealth could tempt any one of them to leave the bright sunlight above and dwell in the land of shades.\n\nOne day Pluto came up to earth and was driving along in his swift chariot, when, behind some bushes, he heard such merry voices and musical laughter that he drew rein, and stepping down, parted the bushes to see who was on the other side. There he saw Proserpine standing in the center of a ring of laughing young girls who were pelting her with flowers.\n\nThe stern old king felt his heart beat quicker at sight of all these lovely maidens, and he singled out Proserpine, and said to himself, \"She shall be my queen. That fair face can make even dark Hades light and beautiful.\" But he knew it would be useless to ask the girl for her consent; so, with a bold stride, he stepped into the midst of the happy circle.\n\nThe young girls, frightened at his dark, stern face, fled to right and left. But Pluto grasped Proserpine by the arm and carried her to his chariot, and then the horses flew along the ground, leaving Proserpine's startled companions far behind.\n\nKing Pluto knew that he must hasten away with his prize, lest Ceres should discover her loss; and to keep out of her path, he drove his chariot a roundabout way. He came to a river; but as he neared its banks, it suddenly began to bubble and swell and rage, so that Pluto did not dare to drive through its waters. To go back another way would mean great loss of time; so with his scepter he struck the ground thrice. It opened, and, in an instant, horses, chariot, and all, plunged into the darkness below.\n\nBut Proserpine knew that the nymph of the stream had recognized her, and had tried to save her by making the waters of the stream rise. So, just as the ground was closing over her, the girl seized her girdle and threw it far out into the river. She hoped that in some way the girdle might reach Ceres and help her to find her lost daughter.\n\nPART II\n\nIn the evening Ceres returned to her home; but her daughter, who usually came running to meet her, was nowhere to be seen. Ceres searched for her in all the rooms, but they were empty. Then she lighted a great torch from the fires of a volcano, and went wandering among the fields, looking for her child. When morning broke, and she had found no trace of Proserpine, her grief was terrible to see.\n\nOn that sad day, Ceres began a long, long wandering. Over land and sea she journeyed, bearing in her right hand the torch which had been kindled in the fiery volcano.\n\nAll her duties were neglected, and everywhere the crops failed, and the ground was barren and dry. Want and famine took the place of wealth and plenty throughout the world. It seemed as though the great earth grieved with the mother for the loss of beautiful Proserpine.\n\nWhen the starving people came to Ceres and begged her to resume her duties and to be their friend again, Ceres lifted her great eyes, wearied with endless seeking, and answered that until Proserpine was found, she could think only of her child, and could not care for the neglected earth. So all the people cried aloud to Jupiter that he should bring Proserpine back to her mother, for they were sadly in need of great Ceres' help.\n\nAt last, after wandering over all the earth in her fruitless search, Ceres returned to Sicily. One day, as she was passing a river, suddenly a little swell of water carried something to her feet. Stooping to see what it was, she picked up the girdle which Proserpine had long ago thrown to the water nymph.\n\nWhile she was looking at it, with tears in her eyes, she heard a fountain near her bubbling louder and louder, until at last it seemed to speak. And this is what it said:\n\n\"I am the nymph of the fountain, and I come from the inmost parts of the earth, O Ceres, great mother! There I saw your daughter seated on a throne at the dark king's side. But in spite of her splendor, her cheeks were pale and her eyes were heavy with weeping. I can stay no longer now, O Ceres, for I must leap into the sunshine. The bright sky calls me, and I must hasten away.\"\n\nThen Ceres arose and went to Jupiter and said, \"I have found the place where my daughter is hidden. Give her back to me, and the earth shall once more be fruitful, and the people shall have food.\"\n\nJupiter was moved, both by the mother's sorrow and by the prayers of the people on earth; and he said that Proserpine might return to her home if she had tasted no food while in Pluto's kingdom.\n\nSo the happy mother hastened down into Hades. But alas! that very day Proserpine had eaten six pomegranate seeds; and for every one of those seeds she was doomed each year to spend a month underground.\n\nFor six months of the year Ceres is happy with her daughter. At Proserpine's coming, flowers bloom and birds sing and the earth everywhere smiles its welcome to its young queen.\n\nSome people say that Proserpine really is the springtime, and that while she is with us all the earth seems fair and beautiful. But when the time comes for Proserpine to rejoin King Pluto in his dark home underground, Ceres hides herself and grieves through all the weary months until her daughter's return.\n\nThen the earth, too, is somber and sad. The leaves fall to the ground, as though the trees were weeping for the loss of the fair, young queen; and the flowers hide underground, until the eager step of the maiden, returning to earth, awakens all nature from its winter sleep."}, {"id": "thor-s-visit-to-j-tunheim", "title": "Thor's Visit to Jötunheim", "byline": "", "src": "Curry & Clippinger, Children's Literature", "gid": "25545", "theme": "Myths", "band": "G5", "words": 2585, "note": "Norse; tricks and tests; Week 5 Book Circle", "text": "One day the god Thor, with his servant Thialfi, and accompanied by Loki, set out on a journey to the giants' country. Thialfi was of all men the swiftest of foot. He bore Thor's wallet, containing their provisions. When night came on they found themselves in an immense forest, and searched on all sides for a place where they might pass the night, and at last came to a very large hall, with an entrance that took the whole breadth of one end of the building. Here they lay down to sleep, but towards midnight were alarmed by an earthquake which shook the whole edifice. Thor, rising up, called on his companions to seek with him a place of safety. On the right they found an adjoining chamber, into which the others entered, but Thor remained at the doorway with his mallet in his hand, prepared to defend himself, whatever might happen. A terrible groaning was heard during the night, and at dawn of day Thor went out and found lying near him a huge giant, who slept and snored in the way that had alarmed them so. It is said that for once Thor was afraid to use his mallet, and as the giant soon waked up, Thor contented himself with simply asking his name.\n\n\"My name is Skrymir,\" said the giant, \"but I need not ask thy name, for I know that thou art the god Thor. But what has become of my glove?\" Thor then perceived that what they had taken overnight for a hall was the giant's glove, and the chamber where his two companions had sought refuge was the thumb. Skrymir then proposed that they should travel in company, and Thor consenting, they sat down to eat their breakfast, and when they had done, Skrymir packed all the provisions into one wallet, threw it over his shoulder, and strode on before them, taking such tremendous strides that they were hard put to it to keep up with him. So they traveled the whole day, and at dusk Skrymir chose a place for them to pass the night in under a large oak tree. Skrymir then told them he would lie down to sleep. \"But take ye the wallet,\" he added, \"and prepare your supper.\"\n\nSkrymir soon fell asleep and began to snore strongly; but when Thor tried to open the wallet, he found the giant had tied it up so tight he could not untie a single knot. At last Thor became wroth, and grasping his mallet with both hands he struck a furious blow on the giant's head. Skrymir, awakening, merely asked whether a leaf had not fallen on his head, and whether they had supped and were ready to go to sleep. Thor answered that they were just going to sleep, and so saying went and laid himself down under another tree. But sleep came not that night to Thor, and when Skrymir snored again so loud that the forest reëchoed with the noise, he arose, and grasping his mallet launched it with such force at the giant's skull that it made a deep dint in it. Skrymir, awakening, cried out, \"What's the matter? Are there any birds perched on this tree? I felt some moss from the branches fall on my head. How fares it with thee Thor?\" But Thor went away hastily, saying that he had just then awoke, and that as it was only midnight, there was still time for sleep. He, however, resolved that if he had an opportunity of striking a third blow, it should settle all matters between them.\n\nA little before daybreak he perceived that Skrymir was again fast asleep, and again grasping his mallet, he dashed it with such violence that it forced its way into the giant's skull up to the handle. But Skrymir sat up, and stroking his cheek said, \"An acorn fell on my head. What! Art thou awake, Thor? Methinks it is time for us to get up and dress ourselves; but you have not now a long way before you to the city called Utgard. I have heard you whispering to one another that I am not a man of small dimensions; but if you come to Utgard you will see there many men much taller than I. Wherefore, I advise you, when you come there, not to make too much of yourselves, for the followers of Utgard-Loki will not brook the boasting of such little fellows as you are. You must take the road that leads eastward, mine lies northward, so we must part here.\"\n\nHereupon he threw his wallet over his shoulders and turned away from them into the forest, and Thor had no wish to stop him or to ask for any more of his company.\n\nThor and his companions proceeded on their way, and towards noon descried a city standing in the middle of a plain. It was so lofty that they were obliged to bend their necks quite back on their shoulders in order to see to the top of it. On arriving they entered the city, and seeing a large palace before them with the door wide open, they went in, and found a number of men of prodigious stature, sitting on benches in the hall. Going further, they came before the king, Utgard-Loki, whom they saluted with great respect. The king, regarding them with a scornful smile, said, \"If I do not mistake me, that stripling yonder must be the god Thor.\" Then addressing himself to Thor, he said, \"Perhaps thou mayst be more than thou appearest to be. What are the feats that thou and thy fellows deem yourselves skilled in, for no one is permitted to remain here who does not, in some feat or other, excel all other men?\"\n\n\"The feat that I know,\" said Loki, \"is to eat quicker than any one else, and in this I am ready to give a proof against any one here who may choose to compete with me.\"\n\n\"That will indeed be a feat,\" said Utgard-Loki, \"if thou performest what thou promisest, and it shall be tried forthwith.\"\n\nHe then ordered one of his men who was sitting at the farther end of the bench, and whose name was Logi, to come forward and try his skill with Loki. A trough filled with meat having been set on the hall floor, Loki placed himself at one end, and Logi at the other, and each of them began to eat as fast as he could, until they met in the middle of the trough. But it was found that Loki had only eaten the flesh, while his adversary had devoured both flesh and bone, and the trough to boot. All the company therefore adjudged that Loki was vanquished.\n\nUtgard-Loki then asked what feat the young man who accompanied Thor could perform. Thialfi answered that he would run a race with any one who might be matched against him. The king observed that skill in running was something to boast of, but if the youth would win the match he must display great agility. He then arose and went with all who were present to a plain where there was good ground for running on, and calling a young man named Hugi, bade him run a match with Thialfi. In the first course Hugi so much outstripped his competitor that he turned back and met him not far from the starting place. Then they ran a second and a third time, but Thialfi met with no better success.\n\nUtgard-Loki then asked Thor in what feats he would choose to give proofs of that prowess for which he was so famous. Thor answered that he would try a drinking-match with any one. Utgard-Loki bade his cup-bearer bring the large horn which his followers were obliged to empty when they had trespassed in any way against the law of the feast. The cup-bearer having presented it to Thor, Utgard-Loki said, \"Whoever is a good drinker will empty that horn at a single draught, though most men make two of it, but the most puny drinker can do it in three.\"\n\nThor looked at the horn, which seemed of no extraordinary size though somewhat long; however, as he was very thirsty, he set it to his lips, and without drawing breath, pulled as long and as deeply as he could, that he might not be obliged to make a second draught of it; but when he set the horn down and looked in, he could scarcely perceive that the liquor was diminished.\n\nAfter taking breath, Thor went to it again with all his might, but when he took the horn from his mouth, it seemed to him that he had drunk rather less than before, although the horn could now be carried without spilling.\n\n\"How now, Thor?\" said Utgard-Loki; \"thou must not spare thyself. If thou meanest to drain the horn at the third draught thou must pull deeply; and I must needs say that thou wilt not be called so mighty a man here as thou art at home if thou showest no greater prowess in other feats than methinks will be shown in this.\"\n\nThor, full of wrath, again set the horn to his lips and did his best to empty it; but on looking in found the liquor was only a little lower, so he resolved to make no further attempt, but gave back the horn to the cup-bearer.\n\n\"I now see plainly,\" said Utgard-Loki, \"that thou art not quite so stout as we thought thee; but wilt thou try any other feat, though methinks thou art not likely to bear any prize away with thee hence?\"\n\n\"What new trial hast thou to propose?\" said Thor.\n\n\"We have a very trifling game here,\" answered Utgard-Loki, \"in which we exercise none but children. It consists in merely lifting my cat from the ground; nor should I have dared to mention such a feat to the great Thor if I had not already observed that thou art by no means what we took thee for.\"\n\nAs he finished speaking, a large gray cat sprang on the hall floor. Thor put his hand under the cat's belly and did his utmost to raise him from the floor, but the cat, bending his back, had, notwithstanding all Thor's efforts, only one of his feet lifted up, seeing which Thor made no further attempt.\n\n\"This trial has turned out,\" said Utgard-Loki, \"just as I imagined it would. The cat is large, but Thor is little in comparison to our men.\"\n\n\"Little as ye call me,\" answered Thor, \"let me see who among you will come hither now I am in wrath and wrestle with me.\"\n\n\"I see no one here,\" said Utgard-Loki, looking at the men sitting on the benches, \"who would not think it beneath him to wrestle with thee; let somebody, however, call hither that old crone, my nurse Elli, and let Thor wrestle with her if he will. She has thrown to the ground many a man not less strong than this Thor is.\"\n\nA toothless old woman then entered the hall, and was told by Utgard-Loki to take hold of Thor. The tale is shortly told. The more Thor tightened his hold on the crone the firmer she stood. At length after a very violent struggle Thor began to lose his footing, and was finally brought down upon one knee. Utgard-Loki then told them to desist, adding that Thor had now no occasion to ask any one else in the hall to wrestle with him, and it was also getting late; so he showed Thor and his companions to their seats, and they passed the night there in good cheer.\n\nThe next morning, at break of day, Thor and his companions dressed themselves and prepared for their departure. Utgard-Loki ordered a table to be set for them, on which there was no lack of victuals or drink. After the repast Utgard-Loki led them to the gate of the city, and on parting asked Thor how he thought his journey had turned out, and whether he had met with any men stronger than himself. Thor told him that he could not deny but that he had brought great shame on himself. \"And what grieves me most,\" he added, \"is that ye will call me a person of little worth.\"\n\n\"Nay,\" said Utgard-Loki, \"it behooves me to tell thee the truth, now thou art out of the city, which so long as I live and have my way thou shalt never enter again. And, by my troth, had I known beforehand that thou hadst so much strength in thee, and wouldst have brought me so near to a great mishap, I would not have suffered thee to enter this time. Know then that I have all along deceived thee by my illusions; first in the forest, where I tied up the wallet with iron wire so that thou couldst not untie it. After this thou gavest me three blows with thy mallet; the first, though the least, would have ended my days had it fallen on me, but I slipped aside and thy blows fell on the mountain, where thou wilt find three glens, one of them remarkably deep. These are the dints made by thy mallet. I have made use of similar illusions in the contests you have had with my followers. In the first, Loki, like hunger itself, devoured all that was set before him, but Logi was in reality nothing else than Fire, and therefore consumed not only the meat, but the trough which held it. Hugi, with whom Thialfi contended in running, was Thought, and it was impossible for Thialfi to keep pace with that. When thou in thy turn didst attempt to empty the horn, thou didst perform, by my troth, a deed so marvelous that had I not seen it myself I should never have believed it. For one end of that horn reached the sea, which thou wast not aware of, but when thou comest to the shore thou wilt perceive how much the sea has sunk by thy draughts. Thou didst perform a feat no less wonderful by lifting up the cat, and to tell thee the truth, when we saw that one of his paws was off the floor, we were all of us terror-stricken, for what thou tookest for a cat was in reality the Midgard serpent that encompasseth the earth, and he was so stretched by thee that he was barely long enough to enclose it between his head and tail. Thy wrestling with Elli was also a most astonishing feat, for there was never yet a man, nor ever will be, whom Old Age, for such in fact was Elli, will not sooner or later lay low. But now, as we are going to part, let me tell thee that it will be better for both of us if thou never come near me again, for shouldst thou do so, I shall again defend myself by other illusions, so that thou wilt only lose thy labor and get no fame from the contest with me.\"\n\nOn hearing these words Thor in a rage laid hold of his mallet and would have launched it at him, but Utgard-Loki had disappeared, and when Thor would have returned to the city to destroy it, he found nothing around him but a verdant plain."}, {"id": "how-the-fenris-wolf-was-chained", "title": "How the Fenris Wolf Was Chained", "byline": "E. M. Wilmot-Buxton", "src": "Curry & Clippinger, Children's Literature", "gid": "25545", "theme": "Myths", "band": "G5", "words": 1996, "note": "Norse; promises", "text": "Fair as were the meads of Asgard, we have seen that the Asa folk were fond of wandering far afield in other regions. Most restless of all was Red Loki, that cunning fellow who was always bringing trouble upon himself or upon his kindred. And because he loved evil, he would often betake himself to the gloomy halls of Giantland and mingle with t
