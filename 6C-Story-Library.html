want to skin you!\"\n\n\"Oh! Don't take my skin away, daddy dear, and I will bring you hens and geese.\"\n\n\"Very well, see that you do it,\" and he let the fox go.\n\nThe hare now alone remained, and the old man began sharpening his knife on the hare's account.\n\n\"Why do you do that?\" asked Puss. He replied: \"Little hares have nice little, soft, warm skins, which will make me nice gloves and mittens against the winter!\"\n\n\"Oh! daddy dear! Don't flay me, and I'll bring you kale and good cauliflower, if only you let me go!\"\n\nThen he let the hare go also.\n\nThen they went to bed; but very early in the morning, when it was neither dusk nor dawn, there was a noise in the doorway like \"Durrrrrr!\"\n\n\"Daddy!\" cried the old woman, \"there's some one scratching at the door; go and see who it is!\"\n\nThe old man went out, and there was the bear carrying a whole hive full of honey. The old man took the honey from the bear; but no sooner did he lie down again than there was another \"Durrrrr!\" at the door. The old man looked out and saw the wolf driving a whole flock of sheep into the court-yard. Close on his heels came the fox, driving before him the geese and hens, and all manner of fowls; and last of all came the hare, bringing cabbage and kale, and all manner of good food.\n\nAnd the old man was glad, and the old woman was glad. And the old man sold the sheep and oxen, and got so rich that he needed nothing more.\n\nAs for the straw-stuffed ox, it stood in the sun till it fell to pieces."}, {"id": "king-o-toole-and-his-goose", "title": "King O'Toole and His Goose", "byline": "", "src": "Curry & Clippinger, Children's Literature", "gid": "25545", "theme": "Folk & fairy tales", "band": "G4+", "words": 1386, "note": "Irish; funny", "text": "\"By Gor, I thought all the world, far and near, heerd o' King O'Toole—well, well, but the darkness of mankind is ontellible! Well, sir, you must know, as you didn't hear it afore, that there was a king, called King O'Toole, who was a fine ould king in the ould ancient times, long ago; and it was him that owned the churches in the early days. The king, you see, was the right sort; he was the rale boy, and loved sport as he loved his life, and huntin' in partic'lar; and from the risin' o' the sun, up he got, and away he wint over the mountains beyant afther the deer; and the fine times them wor.\n\n\"Well, it was all mighty good, as long as the king had his health; but, you see, in coorse of time the king grew ould, by raison he was stiff in his limbs, and when he got sthriken in years, his heart failed him, and he was lost intirely for want o' divarshin, bekase he couldn't go a huntin' no longer; and, by dad, the poor king was obleeged at last for to get a goose to divart him. Oh, you may laugh, if you like, but it's truth I'm tellin' you; and the way the goose divarted him was this-a-way: You see, the goose used for to swim across the lake, and go divin' for throut, and cotch fish on a Friday for the king, and flew every other day round about the lake, divartin' the poor king. All went on mighty well, antil, by dad, the goose got sthriken in years like her master, and couldn't divart him no longer, and then it was that the poor king was lost complate. The king was walkin' one mornin' by the edge of the lake, lamentin' his cruel fate, and thinkin' o' drownin' himself, that could get no divarshun in life, when all of a suddint, turnin' round the corner beyant, who should he meet but a mighty dacent young man comin' up to him.\n\n\"'God save you,' says the king to the young man.\n\n\"'God save you kindly, King O'Toole,' says the young man. 'Thrue for you,' says the king. 'I am King O'Toole,' says he, 'prince and plennypennytinchery o' these parts,' says he; 'but how kem ye to know that?' says he. 'Oh, never mind,' says Saint Kavin.\n\n\"You see it was Saint Kavin, sure enough—the saint himself in disguise, and nobody else. 'Oh, never mind,' says he, 'I know more than that. May I make bowld to ax how is your goose, King O'Toole?' says he. 'Bluran-agers, how kem ye to know about my goose?' says the king. 'Oh, no matther; I was given to understand it,' says Saint Kavin. After some more talk the king says, 'What are you?' 'I'm an honest man,' says Saint Kavin. 'Well, honest man,' says the king, 'and how is it you make your money so aisy?' 'By makin' ould things as good as new,' says Saint Kavin. 'Is it a tinker you are?' says the king. 'No,' says the saint; 'I'm no tinker by thrade, King O'Toole; I've a betther thrade than a tinker,' says he—'what would you say,' says he, 'if I made your ould goose as good as new?'\n\n\"My dear, at the word o' makin' his goose as good as new, you'd think the poor ould king's eyes was ready to jump out iv his head. With that the king whistled, and down kem the poor goose, all as one as a hound, waddlin' up to the poor cripple, her masther, and as like him as two pays. The minute the saint clapt his eyes on the goose, 'I'll do the job for you,' says he, 'King O'Toole.' 'By Jaminee!' says King O'Toole, 'if you do, but I'll say you're the cleverest fellow in the sivin parishes.' 'Oh, by dad,' says Saint Kavin, 'you must say more nor that—my horn's not so soft all out,' says he, 'as to repair your ould goose for nothin'; what'll you gi' me if I do the job for you?—that's the chat,' says Saint Kavin. 'I'll give you whatever you ax,' says the king; 'isn't that fair?' 'Divil a fairer,' says the saint; 'that's the way to do business. Now,' says he, 'this is the bargain I'll make with you, King O'Toole: will you gi' me all the ground the goose flies over, the first offer, afther I make her as good as new?' 'I will,' says the king, 'You won't go back o' your word?' says Saint Kavin. 'Honor bright!' says King O'Toole, howldin' out his fist. 'Honor bright!' says Saint Kavin, back agin, 'it's a bargain. Come here!' says he to the poor ould goose—'come here, you unfort'nate ould cripple, and it's I that'll make you the sportin' bird.' With that, my dear, he took up the goose by the two wings—'Criss o' my crass and you,' says he, markin' her to grace with the blessed sign at the same minute—and throwin' her up in the air, 'whew,' says he, jist givin' her a blast to help her; and with that, my jewel, she tuk to her heels, flyin' like one o' the aigles themselves and cuttin' as many capers as a swallow before a shower of rain.\n\n\"Well, my dear, it was a beautiful sight to see the king standin' with his mouth open, lookin' at his poor ould goose flyin' as light as a lark, and betther nor ever she was: and when she lit at his fut, patter her an the head, and, 'Ma vourneen,' says he, 'but you are the darlint o' the world.' 'And what do you say to me,' says Saint Kavin, 'for makin' her the like?' 'By gor,' says the king, 'I say nothin' bates the art o' man, barrin' the bees.' 'And do you say no more nor that?' says Saint Kavin. 'And that I'm behoulden to you,' says the king. 'But will you give me all the ground the goose flew over?' says Saint Kavin. 'I will,' says King O'Toole, 'and you're welkim to it,' says he, 'though it's the last acre I have to give.' 'But you'll keep your word thrue?' says the saint. 'As thrue as the sun,' says the king. 'It's well for you, King O'Toole, that you said that word,' says he; 'for if you didn't say that word, the devil receave the bit o' your goose id ever fly agin.'\n\n\"Whin the king was as good as his word, Saint Kavin was plazed with him, and thin it was that he made himself known to the king. 'And,' says he, 'King O'Toole, you're a dacent man, for I only kem here to thry you. You don't know me,' says he, 'bekase I'm disguised.' 'Musha! thin,' says the king, 'who are you?' 'I'm Saint Kavin,' said the Saint, blessin' himself. 'Oh, queen iv heaven!' says the king makin' the sign o' the crass betune his eyes, and fallin' down on his knees before the saint; 'is it the great Saint Kavin,' says he, 'that I've been discoorsin' all this time without knowin' it,' says he, 'all as one as if he was a lump iv a gosson?—and so you're a saint?' says the king. 'I am,' says Saint Kavin. 'By gor, I thought I was only talking to a dacent boy,' says the king. 'Well, you know the differ now,' says the saint. 'I'm Saint Kavin,' says he, 'the greatest of all the saints.'\n\n\"And so the king had his goose as good as new, to divart him as long as he lived: and the saint supported him afther he kem into his property, as I tould you, until the day iv his death—and that was soon afther; for the poor goose thought he was ketchin' a throut one Friday; but, my jewel, it was a mistake he made—and instead of a throut, it was a thievin' horse-eel; and by gor, instead iv the goose killin' a throut for the king's supper,—by dad, the eel killed the king's goose—and small blame to him; but he didn't ate her, bekase he darn't ate what Saint Kavin had laid his blessed hands on.\""}, {"id": "the-emperor-s-new-clothes", "title": "The Emperor's New Clothes", "byline": "", "src": "Andersen's Fairy Tales", "gid": "1597", "theme": "Andersen & Wilde", "band": "G3+", "words": 1870, "note": "Honesty; peer pressure", "text": "Many years ago, there was an Emperor, who was so excessively fond of new clothes, that he spent all his money in dress. He did not trouble himself in the least about his soldiers; nor did he care to go either to the theatre or the chase, except for the opportunities then afforded him for displaying his new clothes. He had a different suit for each hour of the day; and as of any other king or emperor, one is accustomed to say, “he is sitting in council,” it was always said of him, “The Emperor is sitting in his wardrobe.”\n\nTime passed merrily in the large town which was his capital; strangers arrived every day at the court. One day, two rogues, calling themselves weavers, made their appearance. They gave out that they knew how to weave stuffs of the most beautiful colors and elaborate patterns, the clothes manufactured from which should have the wonderful property of remaining invisible to everyone who was unfit for the office he held, or who was extraordinarily simple in character.\n\n“These must, indeed, be splendid clothes!” thought the Emperor. “Had I such a suit, I might at once find out what men in my realms are unfit for their office, and also be able to distinguish the wise from the foolish! This stuff must be woven for me immediately.” And he caused large sums of money to be given to both the weavers in order that they might begin their work directly.\n\nSo the two pretended weavers set up two looms, and affected to work very busily, though in reality they did nothing at all. They asked for the most delicate silk and the purest gold thread; put both into their own knapsacks; and then continued their pretended work at the empty looms until late at night.\n\n“I should like to know how the weavers are getting on with my cloth,” said the Emperor to himself, after some little time had elapsed; he was, however, rather embarrassed, when he remembered that a simpleton, or one unfit for his office, would be unable to see the manufacture. To be sure, he thought he had nothing to risk in his own person; but yet, he would prefer sending somebody else, to bring him intelligence about the weavers, and their work, before he troubled himself in the affair. All the people throughout the city had heard of the wonderful property the cloth was to possess; and all were anxious to learn how wise, or how ignorant, their neighbors might prove to be.\n\n“I will send my faithful old minister to the weavers,” said the Emperor at last, after some deliberation, “he will be best able to see how the cloth looks; for he is a man of sense, and no one can be more suitable for his office than he is.”\n\nSo the faithful old minister went into the hall, where the knaves were working with all their might, at their empty looms. “What can be the meaning of this?” thought the old man, opening his eyes very wide. “I cannot discover the least bit of thread on the looms.” However, he did not express his thoughts aloud.\n\nThe impostors requested him very courteously to be so good as to come nearer their looms; and then asked him whether the design pleased him, and whether the colors were not very beautiful; at the same time pointing to the empty frames. The poor old minister looked and looked, he could not discover anything on the looms, for a very good reason, viz: there was nothing there. “What!” thought he again. “Is it possible that I am a simpleton? I have never thought so myself; and no one must know it now if I am so. Can it be, that I am unfit for my office? No, that must not be said either. I will never confess that I could not see the stuff.”\n\n“Well, Sir Minister!” said one of the knaves, still pretending to work. “You do not say whether the stuff pleases you.”\n\n“Oh, it is excellent!” replied the old minister, looking at the loom through his spectacles. “This pattern, and the colors, yes, I will tell the Emperor without delay, how very beautiful I think them.”\n\n“We shall be much obliged to you,” said the impostors, and then they named the different colors and described the pattern of the pretended stuff. The old minister listened attentively to their words, in order that he might repeat them to the Emperor; and then the knaves asked for more silk and gold, saying that it was necessary to complete what they had begun. However, they put all that was given them into their knapsacks; and continued to work with as much apparent diligence as before at their empty looms.\n\nThe Emperor now sent another officer of his court to see how the men were getting on, and to ascertain whether the cloth would soon be ready. It was just the same with this gentleman as with the minister; he surveyed the looms on all sides, but could see nothing at all but the empty frames.\n\n“Does not the stuff appear as beautiful to you, as it did to my lord the minister?” asked the impostors of the Emperor's second ambassador; at the same time making the same gestures as before, and talking of the design and colors which were not there.\n\n“I certainly am not stupid!” thought the messenger. “It must be, that I am not fit for my good, profitable office! That is very odd; however, no one shall know anything about it.” And accordingly he praised the stuff he could not see, and declared that he was delighted with both colors and patterns. “Indeed, please your Imperial Majesty,” said he to his sovereign when he returned, “the cloth which the weavers are preparing is extraordinarily magnificent.”\n\nThe whole city was talking of the splendid cloth which the Emperor had ordered to be woven at his own expense.\n\nAnd now the Emperor himself wished to see the costly manufacture, while it was still in the loom. Accompanied by a select number of officers of the court, among whom were the two honest men who had already admired the cloth, he went to the crafty impostors, who, as soon as they were aware of the Emperor's approach, went on working more diligently than ever; although they still did not pass a single thread through the looms.\n\n“Is not the work absolutely magnificent?” said the two officers of the crown, already mentioned. “If your Majesty will only be pleased to look at it! What a splendid design! What glorious colors!” and at the same time they pointed to the empty frames; for they imagined that everyone else could see this exquisite piece of workmanship.\n\n“How is this?” said the Emperor to himself. “I can see nothing! This is indeed a terrible affair! Am I a simpleton, or am I unfit to be an Emperor? That would be the worst thing that could happen—Oh! the cloth is charming,” said he, aloud. “It has my complete approbation.” And he smiled most graciously, and looked closely at the empty looms; for on no account would he say that he could not see what two of the officers of his court had praised so much. All his retinue now strained their eyes, hoping to discover something on the looms, but they could see no more than the others; nevertheless, they all exclaimed, “Oh, how beautiful!” and advised his majesty to have some new clothes made from this splendid material, for the approaching procession. “Magnificent! Charming! Excellent!” resounded on all sides; and everyone was uncommonly gay. The Emperor shared in the general satisfaction; and presented the impostors with the riband of an order of knighthood, to be worn in their button-holes, and the title of “Gentlemen Weavers.”\n\nThe rogues sat up the whole of the night before the day on which the procession was to take place, and had sixteen lights burning, so that everyone might see how anxious they were to finish the Emperor's new suit. They pretended to roll the cloth off the looms; cut the air with their scissors; and sewed with needles without any thread in them. “See!” cried they, at last. “The Emperor's new clothes are ready!”\n\nAnd now the Emperor, with all the grandees of his court, came to the weavers; and the rogues raised their arms, as if in the act of holding something up, saying, “Here are your Majesty's trousers! Here is the scarf! Here is the mantle! The whole suit is as light as a cobweb; one might fancy one has nothing at all on, when dressed in it; that, however, is the great virtue of this delicate cloth.”\n\n“Yes indeed!” said all the courtiers, although not one of them could see anything of this exquisite manufacture.\n\n“If your Imperial Majesty will be graciously pleased to take off your clothes, we will fit on the new suit, in front of the looking glass.”\n\nThe Emperor was accordingly undressed, and the rogues pretended to array him in his new suit; the Emperor turning round, from side to side, before the looking glass.\n\n“How splendid his Majesty looks in his new clothes, and how well they fit!” everyone cried out. “What a design! What colors! These are indeed royal robes!”\n\n“The canopy which is to be borne over your Majesty, in the procession, is waiting,” announced the chief master of the ceremonies.\n\n“I am quite ready,” answered the Emperor. “Do my new clothes fit well?” asked he, turning himself round again before the looking glass, in order that he might appear to be examining his handsome suit.\n\nThe lords of the bedchamber, who were to carry his Majesty's train felt about on the ground, as if they were lifting up the ends of the mantle; and pretended to be carrying something; for they would by no means betray anything like simplicity, or unfitness for their office.\n\nSo now the Emperor walked under his high canopy in the midst of the procession, through the streets of his capital; and all the people standing by, and those at the windows, cried out, “Oh! How beautiful are our Emperor's new clothes! What a magnificent train there is to the mantle; and how gracefully the scarf hangs!” in short, no one would allow that he could not see these much-admired clothes; because, in doing so, he would have declared himself either a simpleton or unfit for his office. Certainly, none of the Emperor's various suits, had ever made so great an impression, as these invisible ones.\n\n“But the Emperor has nothing at all on!” said a little child.\n\n“Listen to the voice of innocence!” exclaimed his father; and what the child had said was whispered from one to another.\n\n“But he has nothing at all on!” at last cried out all the people. The Emperor was vexed, for he knew that the people were right; but he thought the procession must go on now! And the lords of the bedchamber took greater pains than ever, to appear holding up a train, although, in reality, there was no train to hold."}, {"id": "the-real-princess", "title": "The Real Princess", "byline": "", "src": "Andersen's Fairy Tales", "gid": "1597", "theme": "Andersen & Wilde", "band": "G2+", "words": 411, "note": "Very short; funny", "text": "There was once a Prince who wished to marry a Princess; but then she must be a real Princess. He travelled all over the world in hopes of finding such a lady; but there was always something wrong. Princesses he found in plenty; but whether they were real Princesses it was impossible for him to decide, for now one thing, now another, seemed to him not quite right about the ladies. At last he returned to his palace quite cast down, because he wished so much to have a real Princess for his wife.\n\nOne evening a fearful tempest arose, it thundered and lightened, and the rain poured down from the sky in torrents: besides, it was as dark as pitch. All at once there was heard a violent knocking at the door, and the old King, the Prince's father, went out himself to open it.\n\nIt was a Princess who was standing outside the door. What with the rain and the wind, she was in a sad condition; the water trickled down from her hair, and her clothes clung to her body. She said she was a real Princess.\n\n“Ah! we shall soon see that!” thought the old Queen-mother; however, she said not a word of what she was going to do; but went quietly into the bedroom, took all the bed-clothes off the bed, and put three little peas on the bedstead. She then laid twenty mattresses one upon another over the three peas, and put twenty feather beds over the mattresses.\n\nUpon this bed the Princess was to pass the night.\n\nThe next morning she was asked how she had slept. “Oh, very badly indeed!” she replied. “I have scarcely closed my eyes the whole night through. I do not know what was in my bed, but I had something hard under me, and am all over black and blue. It has hurt me so much!”\n\nNow it was plain that the lady must be a real Princess, since she had been able to feel the three little peas through the twenty mattresses and twenty feather beds. None but a real Princess could have had such a delicate sense of feeling.\n\nThe Prince accordingly made her his wife; being now convinced that he had found a real Princess. The three peas were however put into the cabinet of curiosities, where they are still to be seen, provided they are not lost.\n\nWasn't this a lady of real delicacy?"}, {"id": "the-little-match-girl", "title": "The Little Match Girl", "byline": "", "src": "Andersen's Fairy Tales", "gid": "1597", "theme": "Andersen & Wilde", "band": "G3+", "words": 1021, "note": "Sad; mood and empathy", "text": "Most terribly cold it was; it snowed, and was nearly quite dark, and evening—the last evening of the year. In this cold and darkness there went along the street a poor little girl, bareheaded, and with naked feet. When she left home she had slippers on, it is true; but what was the good of that? They were very large slippers, which her mother had hitherto worn; so large were they; and the poor little thing lost them as she scuffled away across the street, because of two carriages that rolled by dreadfully fast.\n\nOne slipper was nowhere to be found; the other had been laid hold of by an urchin, and off he ran with it; he thought it would do capitally for a cradle when he some day or other should have children himself. So the little maiden walked on with her tiny naked feet, that were quite red and blue from cold. She carried a quantity of matches in an old apron, and she held a bundle of them in her hand. Nobody had bought anything of her the whole livelong day; no one had given her a single farthing.\n\nShe crept along trembling with cold and hunger—a very picture of sorrow, the poor little thing!\n\nThe flakes of snow covered her long fair hair, which fell in beautiful curls around her neck; but of that, of course, she never once now thought. From all the windows the candles were gleaming, and it smelt so deliciously of roast goose, for you know it was New Year's Eve; yes, of that she thought.\n\nIn a corner formed by two houses, of which one advanced more than the other, she seated herself down and cowered together. Her little feet she had drawn close up to her, but she grew colder and colder, and to go home she did not venture, for she had not sold any matches and could not bring a farthing of money: from her father she would certainly get blows, and at home it was cold too, for above her she had only the roof, through which the wind whistled, even though the largest cracks were stopped up with straw and rags.\n\nHer little hands were almost numbed with cold. Oh! a match might afford her a world of comfort, if she only dared take a single one out of the bundle, draw it against the wall, and warm her fingers by it. She drew one out. “Rischt!” how it blazed, how it burnt! It was a warm, bright flame, like a candle, as she held her hands over it: it was a wonderful light. It seemed really to the little maiden as though she were sitting before a large iron stove, with burnished brass feet and a brass ornament at top. The fire burned with such blessed influence; it warmed so delightfully. The little girl had already stretched out her feet to warm them too; but—the small flame went out, the stove vanished: she had only the remains of the burnt-out match in her hand.\n\nShe rubbed another against the wall: it burned brightly, and where the light fell on the wall, there the wall became transparent like a veil, so that she could see into the room. On the table was spread a snow-white tablecloth; upon it was a splendid porcelain service, and the roast goose was steaming famously with its stuffing of apple and dried plums. And what was still more capital to behold was, the goose hopped down from the dish, reeled about on the floor with knife and fork in its breast, till it came up to the poor little girl; when—the match went out and nothing but the thick, cold, damp wall was left behind. She lighted another match. Now there she was sitting under the most magnificent Christmas tree: it was still larger, and more decorated than the one which she had seen through the glass door in the rich merchant's house.\n\nThousands of lights were burning on the green branches, and gaily-colored pictures, such as she had seen in the shop-windows, looked down upon her. The little maiden stretched out her hands towards them when—the match went out. The lights of the Christmas tree rose higher and higher, she saw them now as stars in heaven; one fell down and formed a long trail of fire.\n\n“Someone is just dead!” said the little girl; for her old grandmother, the only person who had loved her, and who was now no more, had told her, that when a star falls, a soul ascends to God.\n\nShe drew another match against the wall: it was again light, and in the lustre there stood the old grandmother, so bright and radiant, so mild, and with such an expression of love.\n\n“Grandmother!” cried the little one. “Oh, take me with you! You go away when the match burns out; you vanish like the warm stove, like the delicious roast goose, and like the magnificent Christmas tree!” And she rubbed the whole bundle of matches quickly against the wall, for she wanted to be quite sure of keeping her grandmother near her. And the matches gave such a brilliant light that it was brighter than at noon-day: never formerly had the grandmother been so beautiful and so tall. She took the little maiden, on her arm, and both flew in brightness and in joy so high, so very high, and then above was neither cold, nor hunger, nor anxiety—they were with God.\n\nBut in the corner, at the cold hour of dawn, sat the poor girl, with rosy cheeks and with a smiling mouth, leaning against the wall—frozen to death on the last evening of the old year. Stiff and stark sat the child there with her matches, of which one bundle had been burnt. “She wanted to warm herself,” people said. No one had the slightest suspicion of what beautiful things she had seen; no one even dreamed of the splendor in which, with her grandmother she had entered on the joys of a new year."}, {"id": "the-fir-tree", "title": "The Fir Tree", "byline": "", "src": "Andersen's Fairy Tales", "gid": "1597", "theme": "Andersen & Wilde", "band": "G4+", "words": 3221, "note": "Never content; theme", "text": "Out in the woods stood a nice little Fir Tree. The place he had was a very good one: the sun shone on him: as to fresh air, there was enough of that, and round him grew many large-sized comrades, pines as well as firs. But the little Fir wanted so very much to be a grown-up tree.\n\nHe did not think of the warm sun and of the fresh air; he did not care for the little cottage children that ran about and prattled when they were in the woods looking for wild-strawberries. The children often came with a whole pitcher full of berries, or a long row of them threaded on a straw, and sat down near the young tree and said, “Oh, how pretty he is! What a nice little fir!” But this was what the Tree could not bear to hear.\n\nAt the end of a year he had shot up a good deal, and after another year he was another long bit taller; for with fir trees one can always tell by the shoots how many years old they are.\n\n“Oh! Were I but such a high tree as the others are,” sighed he. “Then I should be able to spread out my branches, and with the tops to look into the wide world! Then would the birds build nests among my branches: and when there was a breeze, I could bend with as much stateliness as the others!”\n\nNeither the sunbeams, nor the birds, nor the red clouds which morning and evening sailed above him, gave the little Tree any pleasure.\n\nIn winter, when the snow lay glittering on the ground, a hare would often come leaping along, and jump right over the little Tree. Oh, that made him so angry! But two winters were past, and in the third the Tree was so large that the hare was obliged to go round it. “To grow and grow, to get older and be tall,” thought the Tree—“that, after all, is the most delightful thing in the world!”\n\nIn autumn the wood-cutters always came and felled some of the largest trees. This happened every year; and the young Fir Tree, that had now grown to a very comely size, trembled at the sight; for the magnificent great trees fell to the earth with noise and cracking, the branches were lopped off, and the trees looked long and bare; they were hardly to be recognised; and then they were laid in carts, and the horses dragged them out of the wood.\n\nWhere did they go to? What became of them?\n\nIn spring, when the swallows and the storks came, the Tree asked them, “Don't you know where they have been taken? Have you not met them anywhere?”\n\nThe swallows did not know anything about it; but the Stork looked musing, nodded his head, and said, “Yes; I think I know; I met many ships as I was flying hither from Egypt; on the ships were magnificent masts, and I venture to assert that it was they that smelt so of fir. I may congratulate you, for they lifted themselves on high most majestically!”\n\n“Oh, were I but old enough to fly across the sea! But how does the sea look in reality? What is it like?”\n\n“That would take a long time to explain,” said the Stork, and with these words off he went.\n\n“Rejoice in thy growth!” said the Sunbeams. “Rejoice in thy vigorous growth, and in the fresh life that moveth within thee!”\n\nAnd the Wind kissed the Tree, and the Dew wept tears over him; but the Fir understood it not.\n\nWhen Christmas came, quite young trees were cut down: trees which often were not even as large or of the same age as this Fir Tree, who could never rest, but always wanted to be off. These young trees, and they were always the finest looking, retained their branches; they were laid on carts, and the horses drew them out of the wood.\n\n“Where are they going to?” asked the Fir. “They are not taller than I; there was one indeed that was considerably shorter; and why do they retain all their branches? Whither are they taken?”\n\n“We know! We know!” chirped the Sparrows. “We have peeped in at the windows in the town below! We know whither they are taken! The greatest splendor and the greatest magnificence one can imagine await them. We peeped through the windows, and saw them planted in the middle of the warm room and ornamented with the most splendid things, with gilded apples, with gingerbread, with toys, and many hundred lights!”\n\n“And then?” asked the Fir Tree, trembling in every bough. “And then? What happens then?”\n\n“We did not see anything more: it was incomparably beautiful.”\n\n“I would fain know if I am destined for so glorious a career,” cried the Tree, rejoicing. “That is still better than to cross the sea! What a longing do I suffer! Were Christmas but come! I am now tall, and my branches spread like the others that were carried off last year! Oh! were I but already on the cart! Were I in the warm room with all the splendor and magnificence! Yes; then something better, something still grander, will surely follow, or wherefore should they thus ornament me? Something better, something still grander must follow—but what? Oh, how I long, how I suffer! I do not know myself what is the matter with me!”\n\n“Rejoice in our presence!” said the Air and the Sunlight. “Rejoice in thy own fresh youth!”\n\nBut the Tree did not rejoice at all; he grew and grew, and was green both winter and summer. People that saw him said, “What a fine tree!” and towards Christmas he was one of the first that was cut down. The axe struck deep into the very pith; the Tree fell to the earth with a sigh; he felt a pang—it was like a swoon; he could not think of happiness, for he was sorrowful at being separated from his home, from the place where he had sprung up. He well knew that he should never see his dear old comrades, the little bushes and flowers around him, anymore; perhaps not even the birds! The departure was not at all agreeable.\n\nThe Tree only came to himself when he was unloaded in a court-yard with the other trees, and heard a man say, “That one is splendid! We don't want the others.” Then two servants came in rich livery and carried the Fir Tree into a large and splendid drawing-room. Portraits were hanging on the walls, and near the white porcelain stove stood two large Chinese vases with lions on the covers. There, too, were large easy-chairs, silken sofas, large tables full of picture-books and full of toys, worth hundreds and hundreds of crowns—at least the children said so. And the Fir Tree was stuck upright in a cask that was filled with sand; but no one could see that it was a cask, for green cloth was hung all round it, and it stood on a large gaily-colored carpet. Oh! how the Tree quivered! What was to happen? The servants, as well as the young ladies, decorated it. On one branch there hung little nets cut out of colored paper, and each net was filled with sugarplums; and among the other boughs gilded apples and walnuts were suspended, looking as though they had grown there, and little blue and white tapers were placed among the leaves. Dolls that looked for all the world like men—the Tree had never beheld such before—were seen among the foliage, and at the very top a large star of gold tinsel was fixed. It was really splendid—beyond description splendid.\n\n“This evening!” they all said. “How it will shine this evening!”\n\n“Oh!” thought the Tree. “If the evening were but come! If the tapers were but lighted! And then I wonder what will happen! Perhaps the other trees from the forest will come to look at me! Perhaps the sparrows will beat against the windowpanes! I wonder if I shall take root here, and winter and summer stand covered with ornaments!”\n\nHe knew very much about the matter—but he was so impatient that for sheer longing he got a pain in his back, and this with trees is the same thing as a headache with us.\n\nThe candles were now lighted—what brightness! What splendor! The Tree trembled so in every bough that one of the tapers set fire to the foliage. It blazed up famously.\n\n“Help! Help!” cried the young ladies, and they quickly put out the fire.\n\nNow the Tree did not even dare tremble. What a state he was in! He was so uneasy lest he should lose something of his splendor, that he was quite bewildered amidst the glare and brightness; when suddenly both folding-doors opened and a troop of children rushed in as if they would upset the Tree. The older persons followed quietly; the little ones stood quite still. But it was only for a moment; then they shouted that the whole place re-echoed with their rejoicing; they danced round the Tree, and one present after the other was pulled off.\n\n“What are they about?” thought the Tree. “What is to happen now!” And the lights burned down to the very branches, and as they burned down they were put out one after the other, and then the children had permission to plunder the Tree. So they fell upon it with such violence that all its branches cracked; if it had not been fixed firmly in the ground, it would certainly have tumbled down.\n\nThe children danced about with their beautiful playthings; no one looked at the Tree except the old nurse, who peeped between the branches; but it was only to see if there was a fig or an apple left that had been forgotten.\n\n“A story! A story!” cried the children, drawing a little fat man towards the Tree. He seated himself under it and said, “Now we are in the shade, and the Tree can listen too. But I shall tell only one story. Now which will you have; that about Ivedy-Avedy, or about Humpy-Dumpy, who tumbled downstairs, and yet after all came to the throne and married the princess?”\n\n“Ivedy-Avedy,” cried some; “Humpy-Dumpy,” cried the others. There was such a bawling and screaming—the Fir Tree alone was silent, and he thought to himself, “Am I not to bawl with the rest? Am I to do nothing whatever?” for he was one of the company, and had done what he had to do.\n\nAnd the man told about Humpy-Dumpy that tumbled down, who notwithstanding came to the throne, and at last married the princess. And the children clapped their hands, and cried. “Oh, go on! Do go on!” They wanted to hear about Ivedy-Avedy too, but the little man only told them about Humpy-Dumpy. The Fir Tree stood quite still and absorbed in thought; the birds in the wood had never related the like of this. “Humpy-Dumpy fell downstairs, and yet he married the princess! Yes, yes! That's the way of the world!” thought the Fir Tree, and believed it all, because the man who told the story was so good-looking. “Well, well! who knows, perhaps I may fall downstairs, too, and get a princess as wife!” And he looked forward with joy to the morrow, when he hoped to be decked out again with lights, playthings, fruits, and tinsel.\n\n“I won't tremble to-morrow!” thought the Fir Tree. “I will enjoy to the full all my splendor! To-morrow I shall hear again the story of Humpy-Dumpy, and perhaps that of Ivedy-Avedy too.” And the whole night the Tree stood still and in deep thought.\n\nIn the morning the servant and the housemaid came in.\n\n“Now then the splendor will begin again,” thought the Fir. But they dragged him out of the room, and up the stairs into the loft: and here, in a dark corner, where no daylight could enter, they left him. “What's the meaning of this?” thought the Tree. “What am I to do here? What shall I hear now, I wonder?” And he leaned against the wall lost in reverie. Time enough had he too for his reflections; for days and nights passed on, and nobody came up; and when at last somebody did come, it was only to put some great trunks in a corner, out of the way. There stood the Tree quite hidden; it seemed as if he had been entirely forgotten.\n\n“'Tis now winter out-of-doors!” thought the Tree. “The earth is hard and covered with snow; men cannot plant me now, and therefore I have been put up here under shelter till the spring-time comes! How thoughtful that is! How kind man is, after all! If it only were not so dark here, and so terribly lonely! Not even a hare! And out in the woods it was so pleasant, when the snow was on the ground, and the hare leaped by; yes—even when he jumped over me; but I did not like it then! It is really terribly lonely here!”\n\n“Squeak! Squeak!” said a little Mouse, at the same moment, peeping out of his hole. And then another little one came. They snuffed about the Fir Tree, and rustled among the branches.\n\n“It is dreadfully cold,” said the Mouse. “But for that, it would be delightful here, old Fir, wouldn't it?”\n\n“I am by no means old,” said the Fir Tree. “There's many a one considerably older than I am.”\n\n“Where do you come from,” asked the Mice; “and what can you do?” They were so extremely curious. “Tell us about the most beautiful spot on the earth. Have you never been there? Were you never in the larder, where cheeses lie on the shelves, and hams hang from above; where one dances about on tallow candles: that place where one enters lean, and comes out again fat and portly?”\n\n“I know no such place,” said the Tree. “But I know the wood, where the sun shines and where the little birds sing.” And then he told all about his youth; and the little Mice had never heard the like before; and they listened and said,\n\n“Well, to be sure! How much you have seen! How happy you must have been!”\n\n“I!” said the Fir Tree, thinking over what he had himself related. “Yes, in reality those were happy times.” And then he told about Christmas-eve, when he was decked out with cakes and candles.\n\n“Oh,” said the little Mice, “how fortunate you have been, old Fir Tree!”\n\n“I am by no means old,” said he. “I came from the wood this winter; I am in my prime, and am only rather short for my age.”\n\n“What delightful stories you know,” said the Mice: and the next night they came with four other little Mice, who were to hear what the Tree recounted: and the more he related, the more he remembered himself; and it appeared as if those times had really been happy times. “But they may still come—they may still come! Humpy-Dumpy fell downstairs, and yet he got a princess!” and he thought at the moment of a nice little Birch Tree growing out in the woods: to the Fir, that would be a real charming princess.\n\n“Who is Humpy-Dumpy?” asked the Mice. So then the Fir Tree told the whole fairy tale, for he could remember every single word of it; and the little Mice jumped for joy up to the very top of the Tree. Next night two more Mice came, and on Sunday two Rats even; but they said the stories were not interesting, which vexed the little Mice; and they, too, now began to think them not so very amusing either.\n\n“Do you know only one story?” asked the Rats.\n\n“Only that one,” answered the Tree. “I heard it on my happiest evening; but I did not then know how happy I was.”\n\n“It is a very stupid story! Don't you know one about bacon and tallow candles? Can't you tell any larder stories?”\n\n“No,” said the Tree.\n\n“Then good-bye,” said the Rats; and they went home.\n\nAt last the little Mice stayed away also; and the Tree sighed: “After all, it was very pleasant when the sleek little Mice sat round me, and listened to what I told them. Now that too is over. But I will take good care to enjoy myself when I am brought out again.”\n\nBut when was that to be? Why, one morning there came a quantity of people and set to work in the loft. The trunks were moved, the tree was pulled out and thrown—rather hard, it is true—down on the floor, but a man drew him towards the stairs, where the daylight shone.\n\n“Now a merry life will begin again,” thought the Tree. He felt the fresh air, the first sunbeam—and now he was out in the courtyard. All passed so quickly, there was so much going on around him, the Tree quite forgot to look to himself. The court adjoined a garden, and all was in flower; the roses hung so fresh and odorous over the balustrade, the lindens were in blossom, the Swallows flew by, and said, “Quirre-vit! My husband is come!” but it was not the Fir Tree that they meant.\n\n“Now, then, I shall really enjoy life,” said he exultingly, and spread out his branches; but, alas, they were all withered and yellow! It was in a corner that he lay, among weeds and nettles. The golden star of tinsel was still on the top of the Tree, and glittered in the sunshine.\n\nIn the court-yard some of the merry children were playing who had danced at Christmas round the Fir Tree, and were so glad at the sight of him. One of the youngest ran and tore off the golden star.\n\n“Only look what is still on the ugly old Christmas tree!” said he, trampling on the branches, so that they all cracked beneath his feet.\n\nAnd the Tree beheld all the beauty of the flowers, and the freshness in the garden; he beheld himself, and wished he had remained in his dark corner in the loft; he thought of his first youth in the wood, of the merry Christmas-eve, and of the little Mice who had listened with so much pleasure to the story of Humpy-Dumpy.\n\n“'Tis over—'tis past!” said the poor Tree. “Had I but rejoiced when I had reason to do so! But now 'tis past, 'tis past!”\n\nAnd the gardener's boy chopped the Tree into small pieces; there was a whole heap lying there. The wood flamed up splendidly under the large brewing copper, and it sighed so deeply! Each sigh was like a shot.\n\nThe boys played about in the court, and the youngest wore the gold star on his breast which the Tree had had on the happiest evening of his life. However, that was over now—the Tree gone, the story at an end. All, all was over—every tale must end at last."}, {"id": "the-ugly-duckling", "title": "The Ugly Duckling", "byline": "Hans Christian Andersen", "src": "Curry & Clippinger, Children's Literature", "gid": "25545", "theme": "Andersen & Wilde", "band": "G3+", "words": 3690, "note": "Belonging; character change", "text": "It was glorious out in the country. It was summer, and the cornfields were yellow, and the oats were green; the hay had been put up in stacks in the green meadows, and the stork went about on his long red legs, and chattered Egyptian, for this was the language he had learned from his good mother. All around the fields and meadows were great forests, and in the midst of these forests lay deep lakes. Yes, it was really glorious out in the country. In the midst of the sunshine there lay an old farm, surrounded by deep canals, and from the wall down to the water grew great burdocks, so high that little children could stand upright under the loftiest of them. It was just as wild there as in the deepest wood. Here sat a Duck upon her nest, for she had to hatch her young ones; but she was almost tired out before the little ones came; and then she so seldom had visitors. The other ducks liked better to swim about in the canals than to run up to sit down under a burdock and cackle with her.\n\nAt last one eggshell after another burst open. \"Piep! piep!\" it cried, and in all the eggs there were little creatures that stuck out their heads.\n\n\"Rap! rap!\" they said; and they all came rapping out as fast as they could, looking all round them under the green leaves; and the mother let them look as much as they chose, for green is good for the eyes.\n\n\"How wide the world is!\" said the young ones, for they certainly had much more room now than when they were in the eggs.\n\n\"Do you think this is all the world!\" asked the mother. \"That extends far across the other side of the garden, quite into the parson's field, but I have never been there yet. I hope you are all together,\" she continued, and stood up. \"No, I have not all. The largest egg still lies there. How long is that to last? I am really tired of it.\" And she sat down again.\n\n\"Well, how goes it?\" asked an old Duck who had come to pay her a visit.\n\n\"It lasts a long time with that one egg,\" said the Duck who sat there. \"It will not burst. Now, only look at the others; are they not the prettiest ducks one could possibly see? They are all like their father; the bad fellow never comes to see me.\"\n\n\"Let me see the egg which will not burst,\" said the old visitor. \"Believe me, it is a turkey's egg. I was once cheated in that way, and had much anxiety and trouble with the young ones, for they are afraid of the water. I could not get them to venture in. I quacked and clucked, but it was of no use. Let me see the egg. Yes, that's a turkey's egg! Let it lie there, and you teach the other children to swim.\"\n\n\"I think I will sit on it a little longer,\" said the Duck. \"I've sat so long now that I can sit a few days more.\"\n\n\"Just as you please,\" said the old Duck; and she went away.\n\nAt last the great egg burst. \"Piep! piep!\" said the little one, and crept forth. It was very large and very ugly. The Duck looked at it.\n\n\"It's a very large duckling,\" said she; \"none of the others look like that; can it really be a turkey chick? Now we shall soon find out. It must go into the water, even if I have to thrust it in myself.\"\n\nThe next day the weather was splendidly bright, and the sun shone on all the green trees. The Mother-Duck went down to the water with all her little ones. Splash! she jumped into the water. \"Quack! quack!\" she said, and then one duckling after another plunged in. The water closed over their heads, but they came up in an instant, and swam capitally; their legs went of themselves, and there they were, all in the water. The ugly gray Duckling swam with them.\n\n\"No, it's not a turkey,\" said she; \"look how well it can use its legs, and how upright it holds itself. It is my own child! On the whole it's quite pretty, if one looks at it rightly. Quack! quack! come with me, and I'll lead you out into the great world, and present you in the poultry-yard; but keep close to me, so that no one may tread on you; and take care of the cats!\"\n\nAnd so they came into the poultry-yard. There was a terrible riot going on in there, for two families were quarreling about an eel's head, and the cat got it after all.\n\n\"See, that's how it goes in the world!\" said the Mother-Duck; and she whetted her beak, for she, too, wanted the eel's head. \"Only use your legs,\" she said. \"See that you bustle about, and bow your heads before the old Duck yonder. She's the grandest of all here; she's of Spanish blood—that's why she's so fat; and do you see, she has a red rag round her leg; that's something particularly fine, and the greatest distinction a duck can enjoy; it signifies that one does not want to lose her, and that she's to be recognized by man and beast. Shake yourselves—don't turn in your toes; a well-brought-up Duck turns its toes quite out, just like father and mother, so! Now bend your necks and say 'Rap!'\"\n\nAnd they did so; but the other Ducks round about looked at them, and said quite boldly:\n\n\"Look there! now we're to have these hanging on, as if there were not enough of us already! And—fie—! how that Duckling yonder looks; we won't stand that!\" And one duck flew up immediately, and bit it in the neck.\n\n\"Let it alone,\" said the mother; \"it does no harm to anyone.\"\n\n\"Yes, but it's too large and peculiar,\" said the Duck who had bitten it; \"and therefore it must be buffeted.\"\n\n\"Those are pretty children that the mother has there,\" said the old Duck with the rag round her leg. \"They're all pretty but that one; that was a failure. I wish she could alter it.\"\n\n\"That cannot be done, my lady,\" replied the Mother-Duck. \"It is not pretty, but it has a really good disposition, and swims as well as any other; I may even say it swims better. I think it will grow up pretty, and become smaller in time; it has lain too long in the egg, and therefore is not properly shaped.\" And then she pinched it in the neck, and smoothed its feathers. \"Moreover, it is a drake,\" she said, \"and therefore it is not of so much consequence. I think he will be very strong; he makes his way already.\"\n\n\"The other ducklings are graceful enough,\" said the old Duck. \"Make yourself at home; and if you find an eel's head, you may bring it me.\"\n\nAnd now they were at home. But the poor Duckling which had crept last out of the egg, and looked so ugly, was bitten and pushed and jeered, as much by the ducks as by the chickens.\n\n\"It is too big!\" they all said. And the turkey-cock, who had been born with spurs, and therefore thought himself an Emperor, blew himself up like a ship in full sail, and bore straight down upon it; then he gobbled, and grew quite red in the face. The poor Duckling did not know where it should stand or walk; it was quite melancholy, because it looked ugly and was scoffed at by the whole yard.\n\nSo it went on the first day; and afterward it became worse and worse. The poor Duckling was hunted about by every one; even its brothers and sisters were quite angry with it, and said, \"If the cat would only catch you, you ugly creature!\" And the mother said, \"If you were only far away!\" And the ducks bit it, and the chickens beat it, and the girl who had to feed the poultry kicked at it with her foot.\n\nThen it ran and flew over the fence, and the little birds in the bushes flew up in fear.\n\n\"That is because I am so ugly!\" thought the Duckling; and it shut its eyes, but flew no farther; thus it came out into the great moor, where the Wild Ducks lived. Here it lay the whole night long; and it was weary and downcast.\n\nToward morning the Wild Ducks flew up, and looked at their new companion.\n\n\"What sort of a one are you?\" they asked; and the Duckling turned in every direction, and bowed as well as it could. \"You are remarkably ugly!\" said the Wild Ducks. \"But that is very indifferent to us, so long as you do not marry into our family.\"\n\nPoor thing! It certainly did not think of marrying, and only hoped to obtain leave to lie among the reeds and drink some of the swamp-water.\n\nThus it lay two whole days; then came thither two Wild Geese, or, properly speaking, two wild ganders. It was not long since each had crept out of an egg, and that's why they were so saucy.\n\n\"Listen, comrade,\" said one of them. \"You're so ugly that I like you. Will you go with us, and become a bird of passage? Near here, in another moor, there are a few sweet lovely wild geese, all unmarried, and all able to say, 'Rap!' You've a chance of making your fortune, ugly as you are!\"\n\n\"Piff! paff!\" resounded through the air; and the two ganders fell down dead in the swamp, and the water became blood-red. \"Piff! paff!\" it sounded again, and whole flocks of wild geese rose up from the reeds. And then there was another report. A great hunt was going on. The hunters were lying in wait all round the moor, and some were even sitting up in the branches of the trees, which spread far over the reeds. The blue smoke rose up like clouds among the dark trees, and was wafted far away across the water; and the hunting dogs came—splash, splash!—into the swamp, and the rushes and the reeds bent down on every side. That was a fright for the poor Duckling! It turned its head, and put it under its wing; but at that moment a frightful great dog stood close by the Duckling. His tongue hung far out of his mouth and his eyes gleamed horrible and ugly; he thrust out his nose close against the Duckling, showed his sharp teeth, and—splash, splash!—on he went without seizing it.\n\n\"Oh, Heaven be thanked!\" sighed the Duckling. \"I am so ugly that even the dog does not like to bite me!\"\n\nAnd so it lay quite quiet, while the shots rattled through the reeds and gun after gun was fired. At last, late in the day, silence was restored; but the poor Duckling did not dare to rise up; it waited several hours before it looked round, and then hastened away out of the moor as fast as it could. It ran on over field and meadow; there was such a storm raging that it was difficult to get from one place to another.\n\nToward evening the Duck came to a little miserable peasant's hut. This hut was so dilapidated that it did not know on which side it should fall; and that's why it remained standing. The storm whistled round the Duckling in such a way that the poor creature was obliged to sit down, to stand against it; and the tempest grew worse and worse. Then the Duckling noticed that one of the hinges of the door had given way, and the door hung so slanting that the Duckling could slip through the crack into the room; and it did so.\n\nHere lived a woman with her Tom Cat and her Hen. And the Tom Cat, whom she called Sonnie, could arch his back and purr. He could even give out sparks; but for that one had to stroke his fur the wrong way. The Hen had quite little short legs, and therefore she was called Chickabiddy-shortshanks; she laid good eggs, and the woman loved her as her own child.\n\nIn the morning the strange Duckling was at once noticed, and the Tom Cat began to purr, and the Hen to cluck.\n\n\"What's this?\" said the woman, and looked all round; but she could not see well, and therefore she thought the Duckling was a fat duck that had strayed. \"This is a rare prize,\" she said. \"Now I shall have duck's eggs. I hope it is not a drake. We must try that.\"\n\nAnd so the Duckling was admitted on trial for three weeks; but no eggs came. And the Tom Cat was master of the house, and the Hen was the lady, and they always said, \"We and the world!\" for they thought they were half the world, and by far the better half. The Duckling thought one might have a different opinion, but the Hen would not allow it.\n\n\"Can you lay eggs?\" she asked.\n\n\"No.\"\n\n\"Then you'll have the goodness to hold your tongue.\"\n\nAnd the Tom Cat said, \"Can you curve your back, and purr, and give out sparks?\"\n\n\"No.\"\n\n\"Then you cannot have any opinion of your own when sensible people are speaking.\"\n\nAnd the Duckling sat in a corner and was melancholy; then the fresh air and the sunshine streamed in; and it was seized with such a strange longing to swim on the water that it could not help telling the Hen of it.\n\n\"What are you thinking of?\" cried the Hen. \"You have nothing to do; that's why you have these fancies. Purr or lay eggs, and they will pass over.\"\n\n\"But it is so charming to swim on the water!\" said the Duckling, \"so refreshing to let it close above one's head, and to dive down to the bottom.\"\n\n\"Yes, that must be a mighty pleasure, truly,\" quoth the Hen. \"I fancy you must have gone crazy. Ask the Cat about it—he's the cleverest animal I know—ask him if he likes to swim on the water, or to dive down: I won't speak about myself. Ask our mistress, the old woman; no one in the world is cleverer than she. Do you think she has any desire to swim, and to let the water close above her head?\"\n\n\"You don't understand me,\" said the Duckling.\n\n\"We don't understand you? Then pray who is to understand you? You surely don't pretend to be cleverer than the Tom Cat and the old woman—I won't say anything of myself. Don't be conceited, child, and be grateful for all the kindness you have received. Did you not get into a warm room, and have you not fallen into company from which you may learn something? But you are a chatterer, and it is not pleasant to associate with you. You may believe me, I speak for your good. I tell you disagreeable things, and by that one may always know one's true friends. Only take care that you learn to lay eggs, or to purr and give out sparks!\"\n\n\"I think I will go out into the wide world,\" said the Duckling.\n\n\"Yes, do go,\" replied the Hen.\n\nAnd the Duckling went away. It swam on the water, and dived, but it was slighted by every creature because of its ugliness.\n\nNow came the autumn. The leaves in the forest turned yellow and brown; the wind caught them so that they danced about, and up in the air it was very cold. The clouds hung low, heavy with hail and snow-flakes, and on the fence stood the raven, crying, \"Croak! croak!\" for mere cold; yes, it was enough to make one feel cold to think of this. The poor little Duckling certainly had not a good time. One evening—the sun was just setting in his beauty—there came a whole flock of great handsome birds out of the bushes; they were dazzlingly white, with long flexible necks; they were swans. They uttered a very peculiar cry, spread forth their glorious great wings, and flew away from that cold region to warmer lands, to fair open lakes. They mounted so high, so high! and the ugly little Duckling felt quite strange as it watched them. It turned round and round in the water like a wheel, stretched out its neck toward them, and uttered such a strange loud cry as frightened itself. Oh! it could not forget those beautiful, happy birds; and so soon as it could see them no longer, it dived down to the very bottom, and when it came up again, it was quite beside itself. It knew not the name of those birds, and knew not whither they were flying; but it loved them more than it had ever loved anyone. It was not at all envious of them. How could it think of wishing to possess such loveliness as they had? It would have been glad if only the ducks would have endured its company—the poor ugly creature!\n\nAnd the winter grew cold, very cold! The Duckling was forced to swim about in the water, to prevent the surface from freezing entirely; but every night the hole in which it swam about became smaller and smaller. It froze so hard that the icy covering crackled again; and the Duckling was obliged to use its legs continually to prevent the hole from freezing up. At last it became exhausted, and lay quite still, and thus froze fast into the ice.\n\nEarly in the morning a peasant came by, and when he saw what had happened, he took his wooden shoe, broke the ice-crust to pieces, and carried the Duckling home to his wife. Then it came to itself again. The children wanted to play with it; but the Duckling thought they would do it an injury, and in its terror fluttered up into the milk-pan, so that the milk spurted down into the room. The woman clapped her hands, at which the Duckling flew down into the butter-tub, and then into the meal-barrel and out again. How it looked then! The woman screamed, and struck at it with the fire-tongs; the children tumbled over one another in their efforts to catch the Duckling; and they laughed and screamed finely. Happily the door stood open, and the poor creature was able to slip out between the shrubs into the newly-fallen snow; and there it lay quite exhausted.\n\nBut it would be too melancholy if I were to tell all the misery and care which the Duckling had to endure in the hard winter. It lay out on the moor among the reeds when the sun began to shine again and the larks to sing; it was a beautiful spring.\n\nThen all at once the Duckling could flap its wings; they beat the air more strongly than before, and bore it strongly away; and before it well knew how all this had happened, it found itself in a great garden, where the elder trees smelt sweet, and bent their long green branches down to the canal that wound through the region. Oh, here it was so beautiful, such a gladness of spring! and from the thicket came three glorious white swans; they rustled their wings, and swam lightly on the water. The Duckling knew the splendid creatures, and felt oppressed by a peculiar sadness.\n\n\"I will fly away to them, to the royal birds! and they will kill me, because I, that am so ugly, dare to approach them. But it is of no consequence! Better to be killed by them than to be pursued by ducks, and beaten by fowls, and pushed about by the girl who takes care of the poultry-yard, and to suffer hunger in winter!\" And it flew out into the water, and swam toward the beautiful swans: these looked at it, and came sailing down upon it with outspread wings. \"Kill me!\" said the poor creature, and bent its head down upon the water, expecting nothing but death. But what was this that it saw in the clear water? It beheld its own image—and, lo! it was no longer a clumsy dark-gray bird, ugly and hateful to look at, but—a swan.\n\nIt matters nothing if one was born in a duck-yard, if one has only lain in a swan's egg.\n\nIt felt quite glad at all the need and misfortune it had suffered, now it realized its happiness in all the splendor that surrounded it. And the great swans swam round it, and stroked it with their beaks.\n\nInto the garden came little children, who threw bread and corn into the water; the youngest cried, \"There is a new one!\" and the other children shouted joyously, \"Yes, a new one has arrived!\" And they clapped their hands and danced about, and ran to their father and mother; and bread and cake were thrown into the water; and they all said, \"The new one is the most beautiful of all! so young and handsome!\" and the old swans bowed their heads before him.\n\nThen he felt quite ashamed, and hid his head under his wing, for he did not know what to do; he was so happy, and yet not at all proud. He thought how he had been persecuted and despised; and now he heard them saying that he was the most beautiful of all the birds. Even the elder tree bent its branches straight down into the water before him, and the sun shone warm and mild. Then his wings rustled, he lifted his slender neck, and cried rejoicingly from the depths of his heart:\n\n\"I never dreamed of so much happiness when I was still the Ugly Duckling!\""}, {"id": "the-hardy-tin-soldier", "title": "The Hardy Tin Soldier", "byline": "Hans Christian Andersen", "src": "Curry & Clippinger, Children's Literature", "gid": "25545", "theme": "Andersen & Wilde", "band": "G3+", "words": 1687, "note": "Adventure; courage", "text": "There were once five-and-twenty tin soldiers; they were all brothers, for they had all been born of one old tin spoon. They shouldered their muskets, and looked straight before them; their uniform was red and blue, and very splendid. The first thing they had heard in the world, when the lid was taken off their box, had been the words, \"Tin soldiers!\" These words were uttered by a little boy, clapping his hands: the soldiers had been given to him, for it was his birthday; and now he put them upon the table. Each soldier was exactly like the rest; but one of them had been cast last of all, and there had not been enough tin to finish him; but he stood as firmly upon his one leg as the others on their two; and it was just this Soldier who became remarkable.\n\nOn the table on which they had been placed stood many other playthings, but the toy that attracted most attention was a neat castle of cardboard. Through the little windows one could see straight into the hall. Before the castle some little trees were placed round a little looking-glass, which was to represent a clear lake. Waxen swans swam on this lake, and were mirrored in it. This was all very pretty; but the prettiest of all was a little lady, who stood at the open door of the castle; she was also cut out in paper, but she had a dress of the clearest gauze, and a little narrow blue ribbon over her shoulders, that looked like a scarf; and in the middle of this ribbon was a shining tinsel rose as big as her whole face. The little lady stretched out both her arms, for she was a dancer; and then she lifted one leg so high that the Tin Soldier could not see it at all, and thought that, like himself, she had but one leg.\n\n\"That would be the wife for me,\" thought he; \"but she is very grand. She lives in a castle, and I have only a box, and there are five-and-twenty of us in that. It is no place for her. But I must try to make acquaintance with her.\"\n\nAnd then he lay down at full length behind a snuff-box which was on the table; there he could easily watch the little dainty lady, who continued to stand upon one leg without losing her balance.\n\nWhen the evening came all the other tin soldiers were put into their box, and the people in the house went to bed. Now the toys began to play at \"visiting,\" and at \"war,\" and \"giving balls.\" The tin soldiers rattled in their box, for they wanted to join, but could not lift the lid. The nutcracker threw somersaults, and the pencil amused itself on the table; there was so much noise that the canary woke up, and began to speak too, and even in verse. The only two who did not stir from their places were the Tin Soldier and the Dancing Lady: she stood straight up on the point of one of her toes, and stretched out both her arms; and he was just as enduring on his one leg; and he never turned his eyes away from her.\n\nNow the clock struck twelve—and, bounce! the lid flew off the snuff-box; but there was no snuff in it, but a little black Goblin: you see, it was a trick.\n\n\"Tin Soldier!\" said the Goblin, \"don't stare at things that don't concern you.\"\n\nBut the Tin Soldier pretended not to hear him.\n\n\"Just you wait till to-morrow!\" said the Goblin.\n\nBut when the morning came, and the children got up, the Tin Soldier was placed in the window; and whether it was the Goblin or the draught that did it, all at once the window flew open, and the Soldier fell head over heels out of the third story. That was a terrible passage! He put his leg straight up, and stuck with helmet downward and his bayonet between the paving-stones.\n\nThe servant-maid and the little boy came down directly to look for him, but though they almost trod upon him, they could not see him. If the Soldier had cried out \"Here I am!\" they would have found him; but he did not think it fitting to call out loudly, because he was in uniform.\n\nNow it began to rain; the drops soon fell thicker, and at last it came down into a complete stream. When the rain was past, two street boys came by.\n\n\"Just look!\" said one of them, \"there lies a Tin Soldier. He must come out and ride in the boat.\"\n\nAnd they made a boat out of a newspaper, and put the Tin Soldier in the middle of it, and so he sailed down the gutter, and the two boys ran beside him and clapped their hands. Goodness preserve us! how the waves rose in that gutter, and how fast the stream ran! But then it had been a heavy rain. The paper boat rocked up and down, and sometimes turned round so rapidly that the Tin Soldier trembled; but he remained firm, and never changed countenance, and looked straight before him, and shouldered his musket.\n\nAll at once the boat went into a long drain, and it became as dark as if he had been in his box.\n\n\"Where am I going now?\" he thought. \"Yes, yes, that's the Goblin's fault. Ah! if the little lady only sat here with me in the boat, it might be twice as dark for what I should care.\"\n\nSuddenly there came a great Water Rat, which lived under the drain.\n\n\"Have you a passport?\" said the Rat. \"Give me your passport.\"\n\nBut the Tin Soldier kept silence, and held his musket tighter than ever.\n\nThe boat went on, but the Rat came after it. Hu! how he gnashed his teeth, and called out to the bits of straw and wood:\n\n\"Hold him! hold him! He hasn't paid toll—he hasn't shown his passport!\"\n\nBut the stream became stronger and stronger. The Tin Soldier could see the bright daylight where the arch ended; but he heard a roaring noise which might well frighten a bolder man. Only think—just where the tunnel ended, the drain ran into a great canal; and for him that would have been as dangerous as for us to be carried down a great waterfall.\n\nNow he was already so near it that he could not stop. The boat was carried out, the poor Tin Soldier stiffening himself as much as he could, and no one could say that he moved an eyelid. The boat whirled round three or four times, and was full of water to the very edge—it must sink. The Tin Soldier stood up to his neck in water, and the boat sank deeper and deeper, and the paper was loosened more and more; and now the water closed over the soldier's head. Then he thought of the pretty little Dancer, and how he should never see her again; and it sounded in the soldier's ears:\n\nFarewell, farewell, thou warrior brave,\nFor this day thou must die!\n\nAnd now the paper parted, and the Tin Soldier fell out; but at that moment he was snapped up by a great fish.\n\nOh, how dark it was in that fish's body! It was darker yet than in the drain tunnel; and then it was very narrow too. But the Tin Soldier remained unmoved, and lay at full length shouldering his musket.\n\nThe fish swam to and fro; he made the most wonderful movements, and then became quite still. At last something flashed through him like lightning. The daylight shone quite clear, and a voice said aloud, \"The Tin Soldier!\" The fish had been caught, carried to market, bought, and taken into the kitchen, where the cook cut him open with a large knife. She seized the Soldier round the body with both her hands and carried him into the room, where all were anxious to see the remarkable man who had traveled about in the inside of a fish; but the Tin Soldier was not at all proud. They placed him on the table, and there—no! What curious things may happen in the world. The Tin Soldier was in the very room in which he had been before! He saw the same children, and the same toys stood on the table; and there was the pretty castle with the graceful little Dancer. She was still balancing herself on one leg, and held the other extended in the air. She was hardy too. That moved the Tin Soldier; he was very nearly weeping tin tears, but that would not have been proper. He looked at her, but they said nothing to each other.\n\nThen one of the little boys took the Tin Soldier and flung him into the stove. He gave no reason for doing this. It must have been the fault of the Goblin in the snuff-box.\n\nThe Tin Soldier stood there quite illuminated, and felt a heat that was terrible; but whether this heat proceeded from the real fire or from love he did not know. The colors had quite gone off from him; but whether that had happened on the journey, or had been caused by grief, no one could say. He looked at the little lady, she looked at him, and he felt that he was melting; but he still stood firm, shouldering his musket. Then suddenly the door flew open, and the draught of air caught the Dancer, and she flew like a sylph just into the stove to the Tin Soldier, and flashed up in a flame, and she was gone. Then the Tin Soldier melted down into a lump; and when the servant-maid took the ashes out next day, she found him in the shape of a little tin heart. But of the Dancer nothing remained but the tinsel rose, and that was burned as black as a coal."}, {"id": "the-nightingale", "title": "The Nightingale", "byline": "Hans Christian Andersen", "src": "Curry & Clippinger, Children's Literature", "gid": "25545", "theme": "Andersen & Wilde", "band": "G4+", "words": 3615, "note": "Real vs artificial; set in China", "text": "In China, you must know, the Emperor is a Chinaman, and all whom he has about him are Chinamen too. It happened a good many years ago, but that's just why it's worth while to hear the story before it is forgotten. The Emperor's palace was the most splendid in the world; it was made entirely of porcelain, very costly, but so delicate and brittle that one had to take care how one touched it. In the garden were to be seen the most wonderful flowers, and to the costliest of them silver bells were tied, which sounded, so that nobody should pass by without noticing the flowers. Yes, everything in the Emperor's garden was admirably arranged. And it extended so far that the gardener himself did not know where the end was. If a man went on and on, he came into a glorious forest with high trees and deep lakes. The wood extended straight down to the sea, which was blue and deep; great ships could sail, too, beneath the branches of the trees; and in the trees lived a Nightingale, which sang so splendidly that even the poor fisherman, who had many other things to do, stopped still and listened, when he had gone out at night to throw out his nets, and heard the Nightingale.\n\n\"How beautiful that is!\" he said; but he was obliged to attend to his property, and thus forgot the bird. But when the next night the bird sang again, and the fisherman heard it, he exclaimed again, \"How beautiful that is!\"\n\nFrom all the countries of the world travelers came to the city of the Emperor, and admired it, and the palace and the garden, but when they heard the Nightingale, they said, \"That is the best of all!\"\n\nAnd the travelers told of it when they came home; and the learnèd men wrote many books about the town, the palace, and the garden. But they did not forget the Nightingale; that was placed highest of all; and those who were poets wrote most magnificent poems about the Nightingale in the wood by the deep lake.\n\nThe books went through all the world, and a few of them once came to the Emperor. He sat in his golden chair, and read, and read: every moment he nodded his head, for it pleased him to peruse the masterly descriptions of the city, the palace, and the garden. \"But the Nightingale is the best of all,\" it stood written there.\n\n\"What's that?\" exclaimed the Emperor. \"I don't know the Nightingale at all! Is there such a bird in my empire, and even in my garden? I've never heard of that. To think that I should have to learn such a thing for the first time from books!\"\n\nAnd hereupon he called his cavalier. This cavalier was so grand that if anyone lower in rank than himself dared to speak to him, or to ask him any question, he answered nothing but \"P!\"—and that meant nothing.\n\n\"There is said to be a wonderful bird here called a Nightingale,\" said the Emperor. \"They say it is the best thing in all my great empire. Why have I never heard anything about it?\"\n\n\"I have never heard him named,\" replied the cavalier. \"He has never been introduced at Court.\"\n\n\"I command that he shall appear this evening, and sing before me,\" said the Emperor. \"All the world knows what I possess, and I do not know it myself!\"\n\n\"I have never heard him mentioned,\" said the cavalier. \"I will seek for him. I will find him.\"\n\nBut where was he to be found? The cavalier ran up and down all the staircases, through halls and passages, but no one among all those whom he met had heard talk of the Nightingale. And the cavalier ran back to the Emperor, and said that it must be a fable invented by the writers of books.\n\n\"Your Imperial Majesty cannot believe how much is written that is fiction, besides something that they call the black art.\"\n\n\"But the book in which I read this,\" said the Emperor, \"was sent to me by the high and mighty Emperor of Japan and therefore it cannot be a falsehood. I will hear the Nightingale! It must be here this evening! It has my imperial favor; and if it does not come, all the Court shall be trampled upon after the Court has supped!\"\n\n\"Tsing-pe!\" said the cavalier; and again he ran up and down all the staircases, and through all the halls and corridors; and half the Court ran with him, for the courtiers did not like being trampled upon.\n\nThen there was a great inquiry after the wonderful Nightingale, which all the world knew excepting the people at Court.\n\nAt last they met with a poor little girl in the kitchen, who said:\n\n\"The Nightingale? I know it well; yes, it can sing gloriously. Every evening I get leave to carry my poor sick mother the scraps from the table. She lives down by the strand; and when I get back and am tired, and rest in the wood, then I hear the Nightingale sing. And then the water comes into my eyes, and it is just as if my mother kissed me.\"\n\n\"Little kitchen girl,\" said the cavalier, \"I will get you a place in the Court kitchen, with permission to see the Emperor dine, if you will but lead us to the Nightingale, for it is announced for this evening.\"\n\nSo they all went out into the wood where the Nightingale was accustomed to sing; half the Court went forth. When they were in the midst of their journey a cow began to low.\n\n\"Oh!\" cried the Court pages, \"now we have it! That shows a wonderful power in so small a creature! I have certainly heard it before.\"\n\n\"No, those are cows lowing,\" said the little kitchen girl. \"We are a long way from the place yet.\"\n\nNow the fro
