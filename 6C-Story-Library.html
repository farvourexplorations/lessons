eces of the trap but one. The leather was so hard that it made his teeth feel as if they would fall out. His mouth was all covered with blood. The Deer heard the Woodpecker, and saw the hunter, knife in hand, coming on. With a strong pull the Deer broke this last piece of the trap, and ran into the woods.\n\nThe Woodpecker flew up to her nest in the tree-top.\n\nBut the Turtle was so weak he could not get away. He lay where he was. The hunter picked him up and threw him into a bag, tying it to a tree.\n\nThe Deer saw that the Turtle was taken, and made up his mind to save his friend's life. So the Deer let the hunter see him.\n\nThe hunter seized his knife and started after the Deer. The Deer, keeping just out of his reach, led the hunter into the forest.\n\nWhen the Deer saw that they had gone far into the forest he slipped away from the hunter, and swift as the wind, he went by another way to where he had left the Turtle.\n\nBut the Turtle was not there. The Deer called, \"Turtle, Turtle!\"; and the Turtle called out, \"Here I am in a bag hanging on this tree.\"\n\nThen the Deer lifted the bag with his horns, and throwing it upon the ground, he tore the bag open, and let the Turtle out.\n\nThe Woodpecker flew down from her nest, and the Deer said to them: \"You two friends saved my life, but if we stay here talking, the hunter will find us, and we may not get away. So do you, Friend Woodpecker, fly away. And you, Friend Turtle, dive into the water. I will hide in the forest.\"\n\nThe hunter did come back, but neither the Deer, nor the Turtle, nor the Woodpecker was to be seen. He found his torn bag, and picking that up he went back to his home.\n\nThe three friends lived together all the rest of their lives."}, {"id": "the-golden-goose", "title": "The Golden Goose", "byline": "", "src": "More Jataka Tales (Babbitt)", "gid": "7518", "theme": "Jataka tales", "band": "G1+", "words": 335, "note": "Greed; pair with Aesop's The Goose With the Golden Eggs", "text": "Once upon a time there was a Goose who had beautiful golden feathers. Not far away from this Goose lived a poor, a very poor woman, who had two daughters. The Goose saw that they had a hard time to get along and said he to himself:\n\n\"If I give them one after another of my golden feathers, the mother can sell them, and with the money they bring she and her daughters can then live in comfort.\"\n\nSo away the Goose flew to the poor woman's house.\n\nSeeing the Goose, the woman said: \"Why do you come here? We have nothing to give you.\"\n\n\"But I have something to give you,\" said the Goose. \"I will give my feathers, one by one, and you can sell them for enough so that you and your daughters can live in comfort.\"\n\nSo saying the Goose gave her one of his feathers, and then flew away. From time to time he came back, each time leaving another feather.\n\nThe mother and her daughters sold the beautiful feathers for enough money to keep them in comfort. But one day the mother said to her daughters: \"Let us not trust this Goose. Some day he may fly away and never come back. Then we should be poor again. Let us get all of his feathers the very next time he comes.\"\n\nThe daughters said: \"This will hurt the Goose. We will not do such a thing.\"\n\nBut the mother was greedy. The next time the Golden Goose came she took hold of him with both hands, and pulled out every one of his feathers.\n\nNow the Golden Goose has strange feathers. If his feathers are plucked out against his wish, they no longer remain golden but turn white and are of no more value than chicken-feathers. The new ones that come in are not golden, but plain white.\n\nAs time went on his feathers grew again, and then he flew away to his home and never came back again."}, {"id": "the-stupid-monkeys", "title": "The Stupid Monkeys", "byline": "", "src": "More Jataka Tales (Babbitt)", "gid": "7518", "theme": "Jataka tales", "band": "G1+", "words": 356, "note": "Following instructions too literally; pair with Lazy Jack", "text": "Once upon a time a king gave a holiday to all the people in one of his cities.\n\nThe king's gardener thought to himself: \"All my friends are having a holiday in the city. I could go into the city and enjoy myself with them if I did not have to water the trees here in this garden. I know what I will do. I will get the Monkeys to water the young trees for me.\" In those days, a tribe of Monkeys lived in the king's garden.\n\nSo the gardener went to the Chief of the Monkeys, and said: \"You are lucky Monkeys to be living in the king's garden. You have a fine place to play in. You have the best of food--nuts, fruit, and the young shoots of trees to eat. You have no work at all to do. You can play all day, every day. To-day my friends are having a holiday in the city, and I want to enjoy myself with them. Will you water the young trees so that I can go away?\"\n\n\"Oh, yes!\" said the Chief of the Monkeys. \"We shall be glad to do that.\"\n\n\"Do not forget to water the trees when the sun goes down. See they have plenty of water, but not too much,\" said the gardener. Then he showed them where the watering-pots were kept, and went away.\n\nWhen the sun went down the Monkeys took the watering-pots, and began to water the young trees. \"See that each tree has enough water,\" said the Chief of the Monkeys.\n\n\"How shall we know when each tree has enough?\" they asked. The Chief of the Monkeys had no good answer, so he said: \"Pull up each young tree and look at the length of its roots. Give a great deal of water to those with long roots, but only a little to those trees that have short roots.\"\n\nThen those stupid Monkeys pulled up all the young trees to see which trees had long roots and which had short roots.\n\nWhen the gardener came back the next day, the poor young trees were all dead."}, {"id": "the-cunning-wolf", "title": "The Cunning Wolf", "byline": "", "src": "More Jataka Tales (Babbitt)", "gid": "7518", "theme": "Jataka tales", "band": "G1+", "words": 305, "note": "Trick for a trick", "text": "Once upon a time the people in a certain town went out into the woods for a holiday. They took baskets full of good things to eat. But when noontime came they ate all the meat they had brought with them, not leaving any for supper.\n\n\"I will get some fresh meat. We will make a fire here and roast it,\" said one of the men.\n\nSo taking a club, he went to the lake where the animals came to drink. He lay down, club in hand, pretending to be dead.\n\nWhen the animals came down to the lake they saw the man lying there and they watched him for some time.\n\n\"That man is playing a trick on us, I believe,\" said the King of the Wolves. \"The rest of you stay here while I will see whether he is really dead, or whether he is pretending to be dead.\"\n\nThen the cunning King of the Wolves crept up to the man and slyly pulled at his club.\n\nAt once the man pulled back on his club.\n\nThen the King of the Wolves ran off saying: \"If you had been dead, you would not have pulled back on your club when I tried to pull it away. I see your trick. You pretend you are dead so that you may kill one of us for your supper.\"\n\nThe man jumped up and threw his club at the King of the Wolves. But he missed his aim. He looked for the other animals but there was not one in sight. They had all run away.\n\nThen the man went back to his friends, saying: \"I tried to get fresh meat by playing a trick on the animals, but the cunning Wolf played a better trick on me, and I could not get one of them.\""}, {"id": "the-penny-wise-monkey", "title": "The Penny-Wise Monkey", "byline": "", "src": "More Jataka Tales (Babbitt)", "gid": "7518", "theme": "Jataka tales", "band": "G1+", "words": 214, "note": "Losing a lot to save a little; very short", "text": "Once upon a time the king of a large and rich country gathered together his army to take a faraway little country. The king and his soldiers marched all morning long and then went into camp in the forest.\n\nWhen they fed the horses they gave them some peas to eat. One of the Monkeys living in the forest saw the peas and jumped down to get some of them. He filled his mouth and hands with them, and up into the tree he went again, and sat down to eat the peas.\n\nAs he sat there eating the peas, one pea fell from his hand to the ground. At once the greedy Monkey dropped all the peas he had in his hands, and ran down to hunt for the lost pea. But he could not find that one pea. He climbed up into his tree again, and sat still looking very glum. \"To get more, I threw away what I had,\" he said to himself.\n\nThe king had watched the Monkey, and he said to himself: \"I will not be like this foolish Monkey, who lost much to gain a little. I will go back to my own country and enjoy what I now have.\"\n\nSo he and his men marched back home."}, {"id": "the-red-bud-tree", "title": "The Red-Bud Tree", "byline": "", "src": "More Jataka Tales (Babbitt)", "gid": "7518", "theme": "Jataka tales", "band": "G1+", "words": 381, "note": "Four princes see the same tree in different seasons: point of view", "text": "Once upon a time four young princes heard a story about a certain wonderful tree, called the Red-Bud Tree. No one of them had ever seen a Red-Bud Tree, and each prince wished to be the first to see one. So the eldest prince asked the driver of the king's chariot to take him deep into the woods where this tree grew. It was still very early in the spring and the tree had no leaves, nor buds. It was black and bare like a dead tree. The prince could not understand why this was called a Red-Bud Tree, but he asked no questions.\n\nLater in the spring, the next son went with the driver of the king's chariot to see the Red-Bud Tree. At this time it was covered with red buds.\n\nThe tree was all covered with green leaves when the third son went into the woods a little later to see it. He asked no questions about it, but he could see no reason for calling it the Red-Bud Tree.\n\nSome time after this the youngest prince begged to be taken to see the Red-Bud Tree. By this time it was covered with little bean-pods.\n\nWhen he came back from the woods he ran into the garden where his brothers were playing, crying, \"I have seen the Red-Bud Tree.\"\n\n\"So have I,\" said the eldest prince. \"It did not look like much of a tree to me,\" said he; \"it looked like a dead tree. It was black and bare.\"\n\n\"What makes you say that?\" said the second son. \"The tree has hundreds of beautiful red buds. This is why it is called the Red-Bud Tree.\"\n\nThe third prince said: \"Red buds, did you say? Why do you say it has red buds? It is covered with green leaves.\"\n\nThe prince who had seen the tree last laughed at his brothers, saying: \"I have just seen that tree, and it is not like a dead tree. It has neither red buds nor green leaves on it. It is covered with little bean-pods.\"\n\nThe king heard them and waited until they stopped talking. Then he said: \"My sons, you have all four seen the same tree, but each of you saw it at a different time of the year.\""}, {"id": "the-woodpecker-and-the-lion", "title": "The Woodpecker and the Lion", "byline": "", "src": "More Jataka Tales (Babbitt)", "gid": "7518", "theme": "Jataka tales", "band": "G1+", "words": 365, "note": "Ingratitude", "text": "One day while a Lion was eating his dinner a bone stuck in his throat. It hurt so that he could not finish his dinner. He walked up and down, up and down, roaring with pain.\n\nA Woodpecker lit on a branch of a tree near-by, and hearing the Lion, she said, \"Friend, what ails you?\" The Lion told the Woodpecker what the matter was, and the Woodpecker said: \"I would take the bone out of your throat, friend, but I do not dare to put my head into your mouth, for fear I might never get it out again. I am afraid you might eat me.\"\n\n\"O Woodpecker, do not be afraid,\" the Lion said. \"I will not eat you. Save my life if you can!\"\n\n\"I will see what I can do for you,\" said the Woodpecker. \"Open your mouth wide.\" The Lion did as he was told, but the Woodpecker said to himself: \"Who knows what this Lion will do? I think I will be careful.\"\n\nSo the Woodpecker put a stick between the Lion's upper and lower jaws so that he could not shut his mouth.\n\nThen the Woodpecker hopped into the Lion's mouth and hit the end of the bone with his beak. The second time he hit it, the bone fell out.\n\nThe Woodpecker hopped out of the Lion's mouth, and hit the stick so that it too fell out. Then the Lion could shut his mouth.\n\nAt once the Lion felt very much better, but not one word of thanks did he say to the Woodpecker.\n\nOne day later in the summer, the Woodpecker said to the Lion, \"I want you to do something for me.\"\n\n\"Do something for you?\" said the Lion. \"You mean you want me to do something more for you. I have already done a great deal for you. You cannot expect me to do anything more for you. Do not forget that once I had you in my mouth, and I let you go. That is all that you can ever expect me to do for you.\"\n\nThe Woodpecker said no more, but he kept away from the Lion from that day on."}, {"id": "the-otters-and-the-wolf", "title": "The Otters and the Wolf", "byline": "", "src": "More Jataka Tales (Babbitt)", "gid": "7518", "theme": "Jataka tales", "band": "G1+", "words": 345, "note": "Two otters quarrel and the 'judge' takes the fish", "text": "One day a Wolf said to her mate, \"A longing has come upon me to eat fresh fish.\"\n\n\"I will go and get some for you,\" said he and he went down to the river.\n\nThere he saw two Otters standing on the bank looking for fish. Soon one of the Otters saw a great fish, and entering the water with a bound, he caught hold of the tail of the fish.\n\nBut the fish was strong and swam away, dragging the Otter after him. \"Come and help me,\" the Otter called back to his friend. \"This great fish will be enough for both of us!\"\n\nSo the other Otter went into the water. The two together were able to bring the fish to land. \"Let us divide the fish into two parts.\"\n\n\"I want the half with the head on,\" said one.\n\n\"You cannot have that half. That is mine,\" said the other. \"You take the tail.\"\n\nThe Wolf heard the Otters and he went up to them.\n\nSeeing the Wolf, the Otters said: \"Lord of the gray-grass color, this fish was caught by both of us together. We cannot agree about dividing him. Will you divide him for us?\"\n\nThe Wolf cut off the tail and gave it to one, giving the head to the other. He took the large middle part for himself, saying to them, \"You can eat the head and the tail without quarreling.\" And away he ran with the body of the fish. The Otters stood and looked at each other. They had nothing to say, but each thought to himself that the Wolf had run off with the best of the fish.\n\nThe Wolf was pleased and said to himself, as he ran toward home, \"Now I have fresh fish for my mate.\"\n\nHis mate, seeing him coming, came to meet him, saying: \"How did you get fish? You live on land, not in the water.\"\n\nThen he told her of the quarrel of the Otters. \"I took the fish as pay for settling their quarrel,\" said he."}, {"id": "how-the-monkey-saved-his-troop", "title": "How the Monkey Saved His Troop", "byline": "", "src": "More Jataka Tales (Babbitt)", "gid": "7518", "theme": "Jataka tales", "band": "G2+", "words": 728, "note": "Week 2 tale: leadership and sacrifice", "text": "A mango-tree grew on the bank of a great river. The fruit fell from some of the branches of this tree into the river, and from other branches it fell on the ground.\n\nEvery night a troop of Monkeys gathered the fruit that lay on the ground and climbed up into the tree to get the mangoes, which were like large, juicy peaches.\n\nOne day the king of the country stood on the bank of this same river, but many miles below where the mango-tree grew. The king was watching the fishermen with their nets.\n\nAs they drew in their nets, the fishermen found not only fishes but a strange fruit. They went to the king with the strange fruit. \"What is this?\" asked the king. \"We do not know, O King,\" they said.\n\n\"Call the foresters,\" said the king, \"They will know what it is.\"\n\nSo they called the foresters and they said that it was a mango.\n\n\"Is it good to eat?\" asked the king.\n\nThe foresters said it was very good. So the king cut the mango and giving some to the princes, he ate some of it himself. He liked it very much, and they all liked it.\n\nThen the king said to the foresters, \"Where does the mango-tree grow?\"\n\nThe foresters told him that it grew on the river bank many miles farther up the river.\n\n\"Let us go and see the tree and get some mangoes,\" said the king.\n\nSo he had many rafts joined together, and they went up the river until they came to the place where the mango-tree grew.\n\nThe foresters said, \"O King, this is the mango-tree.\"\n\n\"We will land here,\" said the king, and they did so. The king and all the men with him gathered the mangoes that lay on the ground under the tree. They all liked them so well that the king said, \"Let us stay here to-night, and gather more fruit in the morning.\" So they had their supper under the trees, and then lay down to sleep.\n\nWhen all was quiet, the Chief of the Monkeys came with his troop. All the mangoes on the ground had been eaten, so the monkeys jumped from branch to branch, picking and eating mangoes, and chattering to one another. They made so much noise that they woke up the king. He called his archers saying: \"Stand under the mango-tree and shoot the Monkeys as they come down to the ground to get away. Then in the morning we shall have Monkey's flesh as well as mangoes to eat.\"\n\nThe Monkeys saw the archers standing around with their arrows ready to shoot. Fearing death, the Monkeys ran to their Chief, saying: \"O Chief, the archers stand around the tree ready to shoot us! What shall we do?\" They shook with fear.\n\nThe Chief said: \"Do not fear; I will save you. Stay where you are until I call you.\"\n\nThe Monkeys were comforted, for he had always helped them whenever they had needed help.\n\nThen the Chief of the Monkeys ran out on the branch of the mango-tree that hung out over the river. The long branches of the tree across the river did not quite meet the branch he stood on. The Chief said to himself: \"If the Monkeys try to jump across from this tree to that, some of them will fall into the water and drown. I must save them, but how am I to do it? I know what I shall do. I shall make a bridge of my back.\"\n\nSo the Chief reached across and took hold of the longest branch of the tree across the river. He called, \"Come, Monkeys; run out on this branch, step on my back, and then run along the branch of the other tree.\"\n\nThe Monkeys did as the Chief told them to do. They ran along the branch, stepped on his back, then ran along the branch of the other tree. They swung themselves down to the ground, and away they went back to their home.\n\nThe king saw all that was done by the Chief and his troop. \"That big Monkey,\" said the king to the archers, \"saved the whole troop. I will see to it that he is taken care of the rest of his life.\"\n\nAnd the king kept his promise."}, {"id": "the-hawks-and-their-friends", "title": "The Hawks and Their Friends", "byline": "", "src": "More Jataka Tales (Babbitt)", "gid": "7518", "theme": "Jataka tales", "band": "G2+", "words": 998, "note": "Friends in need are friends indeed", "text": "A family of Hawks lived on an island in a lake not far from the great forest. On the northern shore of this lake lived a Lion, King of Beasts. On the eastern shore lived a Kingfisher. On the southern shore of the lake lived a Turtle.\n\n\"Have you many friends near here?\" the Mother Hawk asked the Father Hawk.\n\n\"No, not one in this part of the forest,\" he said.\n\n\"You must find some friends. We must have some one who can help us if ever we are in danger, or in trouble,\" said the Mother Hawk.\n\n\"With whom shall I make friends?\" asked the Father Hawk.\n\n\"With the Kingfisher, who lives on the eastern shore, and with the Lion on the north,\" said the Mother Hawk, \"and with the Turtle who lives on the southern shore of this lake.\"\n\nThe Father Hawk did so.\n\nOne day men hunted in the great forest from morning until night, but found nothing. Not wishing to go home empty-handed, they went to the island to see what they could find there.\n\n\"Let us stay here to-night,\" they said, \"and see what we can find in the morning.\"\n\nSo they made beds of leaves for themselves and lay down to sleep. They had made their beds under the tree in which the Hawks had their nest.\n\nBut the hunters could not go to sleep because they were bothered by the flies and mosquitoes. At last the hunters got up and made a fire on the shore of the lake, so that the smoke would drive away the flies and mosquitoes. The smoke awoke the birds, and the young ones cried out.\n\n\"Did you hear that?\" said one of the hunters. \"That was the cry of birds! They will do very well for our breakfast. There are young ones in that nest.\" And the hunters put more wood on the fire, and made it blaze up.\n\nThen the Mother bird said to the Father: \"These men are planning to eat our young ones. We must ask our friends to save us. Go to the Kingfisher and tell him what danger we are in.\"\n\nThe Father Hawk flew with all speed to the Kingfisher's nest and woke him with his cry.\n\n\"Why have you come?\" asked the Kingfisher.\n\nThen the Father Hawk told the Kingfisher what the hunters planned to do.\n\n\"Fear not,\" said the Kingfisher. \"I will help you. Go back quickly and comfort my friend your mate, and say that I am coming.\"\n\nSo the Father Hawk flew back to his nest, and the Kingfisher flew to the island and went into the lake near the place where the fire was burning.\n\nWhile the Father Hawk was away, one of the hunters had climbed up into the tree. Just as he neared the nest, the Kingfisher, beating the water with his wings, sprinkled water on the fire and put it out.\n\nDown came the hunter to make another fire. When it was burning well he climbed the tree again. Once more the Kingfisher put it out. As often as a fire was made, the Kingfisher put it out. Midnight came and the Kingfisher was now very tired.\n\nThe Mother Hawk noticed this and said to her mate: \"The Kingfisher is tired out. Go and ask the Turtle to help us so that the Kingfisher may have a rest.\"\n\nThe Father Hawk flew down and said, \"Rest awhile, Friend Kingfisher; I will go and get the Turtle.\"\n\nSo the Father Hawk flew to the southern shore and wakened the Turtle.\n\n\"What is your errand, Friend?\" asked the Turtle.\n\n\"Danger has come to us,\" said the Father Hawk, and he told the Turtle about the hunters. \"The Kingfisher has been working for hours, and now he is very tired. That is why I have come to you.\"\n\nThe Turtle said, \"I will help you at once.\"\n\nThen the Turtle went to the island where the Hawks lived. He dived into the water, collected some mud, and put out the fire with it. Then he lay still.\n\nThe hunters cried: \"Why should we bother to get the young Hawks? Let us kill this Turtle. He will make a fine breakfast for all of us. We must be careful or he will bite us. Let us throw a net over him and turn him over.\"\n\nThey had no nets with them, so they took some vines, and tore their clothes into strings and made a net.\n\nBut when they had put the net all over the Turtle, they could not roll him over. Instead, the Turtle suddenly dived down into the deep water. The men were so eager to get him that they did not let go of the net, so down they went into the water. As they came out they said: \"Half the night a Kingfisher kept putting out our fires. Now we have torn our clothes and got all wet trying to get this Turtle. We will build another fire, and at sunrise we will eat those young Hawks.\" And they began to build another fire.\n\nThe Mother Hawk heard them, and said to her mate: \"Sooner or later these men will get our young. Do go and tell our friend the Lion.\"\n\nAt once the Father Hawk flew to the Lion.\n\n\"Why do you come at this hour of the night?\" asked the Lion.\n\nThe Hawk told him the whole story.\n\nThe Lion said: \"I will come at once. You go back and comfort your mate and the young ones.\" Soon the Lion came roaring.\n\nWhen the hunters heard the Lion's roar they cried, \"Now we shall all be killed.\" And away they ran as fast as they could go.\n\nWhen the Lion came to the foot of the tree, not one of the hunters was to be seen. Then the Kingfisher and the Turtle came up, and the Hawks said: \"You have saved us. Friends in need are friends indeed.\""}, {"id": "the-brave-little-bowman", "title": "The Brave Little Bowman", "byline": "", "src": "More Jataka Tales (Babbitt)", "gid": "7518", "theme": "Jataka tales", "band": "G2+", "words": 815, "note": "Brains beat size", "text": "Once upon a time there was a little man with a crooked back who was called the wise little bowman because he used his bow and arrow so very well. This crooked little man said to himself: \"If I go to the king and ask him to let me join his army, he's sure to ask what a little man like me is good for. I must find some great big man who will take me as his page, and ask the king to take us.\" So the little bowman went about the city looking for a big man.\n\nOne day he saw a big, strong man digging a ditch \"What makes a fine big man like you do such work?\" asked the little man.\n\n\"I do this work because I can earn a living in no other way,\" said the big man.\n\n\"Dig no more,\" said the bowman. \"There is in this whole country no such bowman as I am; but no king would let me join his army because I am such a little man. I want you to ask the king to let you join the army. He will take you because you are big and strong. I will do the work that you are given to do, and we will divide the pay. In this way we shall both of us earn a good living. Will you come with me and do as I tell you?\" asked the little bowman.\n\n\"Yes, I will go with you,\" said the big man.\n\nSo together they set out to go to the king. By and by they came to the gates of the palace, and sent word to the king that a wonderful bowman was there. The king sent for the bowman to come before him. Both the big man and the little man went in and, bowing, stood before the king.\n\nThe king looked at the big man and asked, \"What brings you here?\"\n\n\"I want to be in your army,\" said the big man.\n\n\"Who is the little man with you?\" asked the king.\n\n\"He is my page,\" said the big man.\n\n\"What pay do you want?\" asked the king.\n\n\"A thousand pieces a month for me and my page, O King,\" said the big man.\n\n\"I will take you and your page,\" said the king.\n\nSo the big man and the little bowman joined the king's army.\n\nNow in those days there was a tiger in the forest who had carried off many people. The king sent for the big man and told him to kill that tiger.\n\nThe big man told the little bowman what the king said. They went into the forest together, and soon the little bowman shot the tiger.\n\nThe king was glad to be rid of the tiger, and gave the big man rich gifts and praised him.\n\nAnother day word came that a buffalo was running up and down a certain road. The king told the big man to go and kill that buffalo. The big man and the little man went to the road, and soon the little man shot the buffalo. When they both went back to the king, he gave a bag of money to the big man.\n\nThe king and all the people praised the big man, and so one day the big man said to the little man: \"I can get on without you. Do you think there's no bowman but yourself?\" Many other harsh and unkind things did he say to the little man.\n\nBut a few days later a king from a far country marched upon the city and sent a message to its king saying, \"Give up your country, or do battle.\"\n\nThe king at once sent his army. The big man was armed and mounted on a war-elephant. But the little bowman knew that the big man could not shoot, so he took his bow and seated himself behind the big man.\n\nThen the war-elephant, at the head of the army, went out of the city. At the first beat of the drums, the big man shook with fear. \"Hold on tight,\" said the little bowman. \"If you fall off now, you will be killed. You need not be afraid; I am here.\"\n\nBut the big man was so afraid that he slipped down off the war-elephant's back, and ran back into the city. He did not stop until he reached his home.\n\n\"And now to win!\" said the little bowman, as he drove the war-elephant into the fight. The army broke into the camp of the king that came from afar, and drove him back to his own country. Then the little bowman led the army back into the city. The king and all the people called him \"the brave little bowman.\" The king made him the chief of the army, giving him rich gifts."}, {"id": "the-foolhardy-wolf", "title": "The Foolhardy Wolf", "byline": "", "src": "More Jataka Tales (Babbitt)", "gid": "7518", "theme": "Jataka tales", "band": "G2+", "words": 560, "note": "Pride and copying others", "text": "A lion bounded forth from his lair one day, looking north, west, south, and east. He saw a Buffalo and went to kill him.\n\nThe Lion ate all of the Buffalo-meat he wanted, and then went down to the lake for a drink.\n\nAs the Lion turned to go toward his den for a nap, he came upon a hungry Wolf.\n\nThe Wolf had no chance to get away, so he threw himself at the Lion's feet.\n\n\"What do you want?\" the Lion asked.\n\n\"O Lion, let me be your servant,\" said the Wolf. \"Very well,\" said the Lion, \"serve me, and you shall have good food to eat.\"\n\nSo saying, the Lion went into his den for his nap. When he woke up, the Lion said to the Wolf: \"Each day you must go to the mountain top, and see whether there are any elephants, or ponies, or buffaloes about. If you see any, come to me and say: 'Great Lion, come forth in thy might. Food is in sight.' Then I will kill and eat, and give part of the meat to you.\"\n\nSo day after day the Wolf climbed to the mountain top, and seeing a pony, or a buffalo, or an elephant, he went back to the den, and falling at the Lion's feet he said: \"Great Lion, come forth in thy might. Food is in sight.\"\n\nThen the Lion would bound forth and kill whichever beast it was, sharing the meat with the Wolf.\n\nNow this Wolf had never had such fine meat to eat, nor so much. So as time went on, the Wolf grew bigger and bigger, and stronger and stronger, until he was really proud of his great size and strength.\n\n\"See how big and strong I am,\" he said to himself.\n\n\"Why am I living day after day on food given me by another? I will kill for my own eating. I'll kill an elephant for myself.\"\n\nSo the Wolf went to the Lion, and said: \"I want to eat an elephant of my own killing. Will you let me lie in your corner in the den, while you climb the mountain to look out for an elephant? Then when you see one, you come to the den and say, 'Great Wolf, come forth in thy might. Food is in sight.' Then I will kill the elephant.\"\n\nSaid the Lion: \"Wolf, only Lions can kill elephants. The world has never seen a Wolf that could kill an elephant. Give up this notion of yours, and eat what I kill.\"\n\nBut no matter what the Lion said, the Wolf would not give way. So at last the Lion said: \"Well, have your own way. Lie down in the den, and I will climb to the top of the mountain.\"\n\nWhen he saw an elephant the Lion went back to the mouth of the cave, and said: \"Great Wolf, come forth in thy might. Food is in sight.\"\n\nThen from the den the Wolf nimbly bounded forth, ran to where the elephant was, and, howling three times, he sprang at the elephant.\n\nBut the Wolf missed his aim, and fell down at the elephant's feet. The elephant raised his right foot and killed the Wolf.\n\nSeeing all this, the Lion said, \"You will no more come forth in your might, you foolhardy Wolf.\""}, {"id": "the-stolen-plow", "title": "The Stolen Plow", "byline": "", "src": "More Jataka Tales (Babbitt)", "gid": "7518", "theme": "Jataka tales", "band": "G2+", "words": 489, "note": "Clever justice", "text": "At one time there were two traders who were great friends. One of them lived in a small village, and one lived in a large town near-by.\n\nOne day the village trader took his plow to the large town to have it mended. Then he left it with the trader who lived there. After some time the town trader sold the plow, and kept the money.\n\nWhen the trader from the village came to get his plow the town trader said, \"The mice have eaten your plow.\"\n\n\"That is strange! How could mice eat such a thing?\" said the village trader.\n\nThat afternoon when all the children went down to the river to go swimming, the village trader took the town trader's little son to the house of a friend saying, \"Please keep this little boy here until I come back for him.\"\n\nBy and by the villager went back to the town trader's house.\n\n\"Where is my son? He went away with you. Why didn't you bring him back?\" asked the town trader.\n\n\"I took him with me and left him on the bank of the river while I went down into the water,\" said the villager. \"While I was swimming about a big bird seized your son, and flew up into the air with him. I shouted, but I could not make the bird let go,\" he said.\n\n\"That cannot be true,\" cried the town trader. \"No bird could carry off a boy. I will go to the court, and you will have to go there, and tell the judge.\"\n\nThe villager said, \"As you please\"; and they both went to the court. The town trader said to the judge:\n\n\"This fellow took my son with him to the river, and when I asked where the boy was, he said that a bird had carried him off.\"\n\n\"What have you to say?\" said the judge to the village trader.\n\n\"I told the father that I took the boy with me, and that a bird had carried him off,\" said the village trader.\n\n\"But where in the world are there birds strong enough to carry off boys?\" said the judge.\n\n\"I have a question to ask you,\" answered the village trader. \"If birds cannot carry off boys, can mice eat plows?\"\n\n\"What do you mean by that?\" asked the judge.\n\n\"I left my good plow with this man. When I came for it he told me that the mice had eaten it. If mice eat plows, then birds carry off boys; but if mice cannot do this, neither can birds carry off boys. This man says the mice ate my plow.\"\n\nThe judge said to the town trader, \"Give back the plow to this man, and he will give your son back to you.\"\n\nAnd the two traders went out of the court, and by night-time one had his son back again, and the other had his plow."}, {"id": "the-lion-in-bad-company", "title": "The Lion in Bad Company", "byline": "", "src": "More Jataka Tales (Babbitt)", "gid": "7518", "theme": "Jataka tales", "band": "G2+", "words": 506, "note": "Bad influence", "text": "One day a young Lion came suddenly upon a Wolf. The Wolf was not able to get away, so he said to the Lion: \"Please, Great Lion, could you take me to your den, and let me live with you and your mate? I will work for you all my days.\"\n\nThis young Lion had been told by his father and mother not to make friends with any Wolf. But when this Wolf called him \"Great Lion,\" he said to himself: \"This Wolf is not bad. This Wolf is not like other Wolves.\" So he took the Wolf to the den where he lived with his father and mother.\n\nNow this Lion's father was a fine old Lion, and he told his son that he did not like having this Wolf there. But the young Lion thought he knew better than his father, so the Wolf stayed in the den.\n\nOne day the Wolf wanted horse-flesh to eat, so he said to the young Lion, \"Sir, there is nothing we have not eaten except horse-meat; let us take a horse.\"\n\n\"But where are there horses?\" asked the Lion.\n\n\"There are small ponies on the river bank,\" said the Wolf.\n\nSo the young Lion went with the Wolf to the river bank when the ponies were bathing. The Lion caught a small pony, and throwing it on his back, he ran back to his den.\n\nHis father said: \"My son, those ponies belong to the king. Kings have many skilful archers. Lions do not live long who eat ponies belonging to the king. Do not take another pony.\"\n\nBut the young Lion liked the taste of horse-meat, and he caught and killed pony after pony.\n\nSoon the king heard that a Lion was killing the ponies when they went to bathe in the river. \"Build a tank inside the town,\" said the king. \"The lion will not get the ponies there.\" But the Lion killed the ponies as they bathed in the tank.\n\nThen the king said the ponies must be kept in the stables. But the Lion went over the wall, and killed the ponies in their stables.\n\nAt last the king called an archer, who shot like lightning. \"Do you think you can shoot this Lion?\" the king asked him. The archer said that he was sure he could. \"Very well,\" said the king, \"take your place in the tower on the wall, and shoot him.\" So the archer waited there in the tower.\n\nBy and by the Lion and the Wolf came to the wall. The Wolf did not go over the wall but waited to see what would happen. The Lion sprang over the wall. Very soon he caught and killed a pony. Then the archer let fly an arrow.\n\nThe Lion roared, \"I am shot.\"\n\nThen the Wolf said to himself: \"The Lion has been shot, and soon he will die. I will now go back to my old home in the woods.\" And so he did.\n\nThe Lion fell down dead."}, {"id": "the-wise-goat-and-the-wolf", "title": "The Wise Goat and the Wolf", "byline": "", "src": "More Jataka Tales (Babbitt)", "gid": "7518", "theme": "Jataka tales", "band": "G2+", "words": 612, "note": "A clever goat outwits a wolf", "text": "Once upon a time, many, many wild Goats lived in a cave in the side of a hill. A Wolf lived with his mate not far from this cave. Like all Wolves they liked the taste of Goat-meat. So they caught the Goats, one after another, and ate them all but one who was wiser than all the others. Try as they might, the Wolves could not catch her.\n\nOne day the Wolf said to his mate: \"My dear, let us play a trick on that wise Goat. I will lie down here pretending to be dead. You go alone to the cave where the Goat lives, and looking very sad, say to her: 'My dear, do you see my mate lying there dead? I am so sad; I have no friends. Will you be good to me? Will you come and help me bury the body of my mate?' The Goat will be sorry for you and I think she will come here with you. When she stands beside me I will spring upon her and bite her in the neck. Then she will fall over dead, and we shall have good meat to eat.\"\n\nThe Wolf then lay down, and his mate went to the Goat, saying what she had been told to say.\n\nBut the wise Goat said: \"My dear, all my family and friends have been eaten by your mate I am afraid to go one step with you. I am far safer here than I would be there.\"\n\n\"Do not be afraid,\" said the Wolf. \"What harm can a dead Wolf do to you?\"\n\nThese and many more words the Wolf said to the Goat, so that at last the Goat said she would go with the Wolf.\n\nBut as they went up the hill side by side, the Goat said to herself: \"Who knows what will happen? How do I know the Wolf is dead?\" She said to the Wolf, \"I think it will be better if you go on in front of me.\"\n\nThe Wolf thought he heard them coming. He was hungry and he raised up his head to see if he could see them The Goat saw him raise his head, and she turned and ran back to her cave.\n\n\"Why did you raise your head when you were pretending to be dead?\" the Wolf asked her mate. He had no good answer.\n\nBy and by the Wolves were both so very hungry that the Wolf asked his mate to try once more to catch the Goat.\n\nThis time the Wolf went to the Goat and said: \"My friend, your coming helped us, for as soon as you came, my mate felt better. He is now very much better. Come and talk to him. Let us be friends and have a good time together.\"\n\nThe wise Goat thought: \"These wicked Wolves want to play another trick on me. But I have thought of a trick to play on them.\" So the Goat said: \"I will go to see your mate, and I will take my friends with me. You go back and get ready for us. Let us all have a good time together.\"\n\nThen the Wolf was afraid, and she asked: \"Who are the friends who will come with you? Tell me their names.\"\n\nThe wise Goat said: \"I will bring the two Hounds, Old Gray and Young Tan, and that fine big dog called Four-Eyes. And I will ask each of them to bring his mate.\"\n\nThe Wolf waited to hear no more. She turned, and away she ran back to her mate. The Goat never saw either of them again."}, {"id": "prince-wicked-and-the-grateful-animals", "title": "Prince Wicked and the Grateful Animals", "byline": "", "src": "More Jataka Tales (Babbitt)", "gid": "7518", "theme": "Jataka tales", "band": "G2+", "words": 1692, "note": "Grateful animals vs an ungrateful prince; longest", "text": "Once upon a time a king had a son named Prince Wicked. He was fierce and cruel, and he spoke to nobody without abuse, or blows. Like grit in the eye, was Prince Wicked to every one, both in the palace and out of it.\n\nHis people said to one another, \"If he acts this way while he is a prince, how will he act when he is king?\"\n\nOne day when the prince was swimming in the river, suddenly a great storm came on, and it grew very dark.\n\nIn the darkness the servants who were with the prince swam from him, saying to themselves, \"Let us leave him alone in the river, and he may drown.\"\n\nWhen they reached the shore, some of the servants who had not gone into the river said, \"Where is Prince Wicked?\"\n\n\"Isn't he here?\" they asked. \"Perhaps he came out of the river in the darkness and went home.\" Then the servants all went back to the palace.\n\nThe king asked where his son was, and again the servants said: \"Isn't he here, O King? A great storm came on soon after we went into the water. It grew very dark. When we came out of the water the prince was not with us.\"\n\nAt once the king had the gates thrown open. He and all his men searched up and down the banks of the river for the missing prince. But no trace of him could be found.\n\nIn the darkness the prince had been swept down the river. He was crying for fear he would drown when he came across a log. He climbed upon the log, and floated farther down the river.\n\nWhen the great storm arose, the water rushed into the homes of a Rat and a Snake who lived on the river bank. The Rat and the Snake swam out into the river and found the same log the prince had found. The Snake climbed upon one end of the log, and the Rat climbed upon the other.\n\nOn the river's bank a cottonwood-tree grew, and a young Parrot lived in its branches. The storm pulled up this tree, and it fell into the river. The heavy rain beat down the Parrot when it tried to fly, and it could not go far. Looking down it saw the log and flew down to rest. Now there were four on the log floating down stream together.\n\nJust around the bend in the river a certain poor man had built himself a hut. As he walked to and fro late at night listening to the storm, he heard the loud cries of the prince. The poor man said to himself: \"I must get that man out of the water. I must save his life.\" So he shouted: \"I will save you! I will save you!\" as he swam out in the river.\n\nSoon he reached the log, and pushing it by one end, he soon pushed it into the bank. The prince jumped up and down, he was so glad to be safe and sound on dry land.\n\nThen the poor man saw the Snake, the Rat, and the Parrot, and carried them to his hut. He built a fire, putting the animals near it so they could get dry. He took care of them first, because they were the weaker, and afterwards he looked after the comfort of the prince.\n\nThen the poor man brought food and set it before them, looking after the animals first and the prince afterwards. This made the young prince angry, and he said to himself: \"This poor man does not treat me like a prince. He takes care of the animals before taking care of me.\" Then the prince began to hate the poor man.\n\nA few days later, when the prince, and the Snake, the Rat, and the Parrot were rested, and the storm was all over, the Snake said good-by to the poor man with these words:\n\n\"Father, you have been very kind to me. I know where there is some buried gold. If ever you want gold, you have only to come to my home and call, 'Snake!' and I will show you the buried gold. It shall all be yours.\"\n\nNext the Rat said good-by to the poor man. \"If ever you want money,\" said the Rat, \"come to my home, and call out, 'Rat!' and I will show you where a great deal of money is buried near my home. It shall all be yours.\"\n\nThen the Parrot came, saying: \"Father, silver and gold have I none, but if you ever want choice rice, come to where I live and call, 'Parrot!' and I will call all my family and friends together, and we will gather the choicest rice in the fields for you.\"\n\nLast came the prince. In his heart he hated the poor man who had saved his life. But he pretended to be as thankful as the animals had been, saying, \"Come to me when I am king, and I will give you great riches.\" So saying, he went away.\n\nNot long after this the prince's father died, and Prince Wicked was made king. He was then very rich.\n\nBy and by the poor man said to himself: \"Each of the four whose lives I saved made a promise to me. I will see if they will keep their promises.\"\n\nFirst of all he went to the Snake, and standing near his hole, the poor man called out, \"Snake!\"\n\nAt once the Snake darted forth, and with every mark of respect he said: \"Father, in this place there is much gold. Dig it up and take it all.\"\n\n\"Very well,\" said the poor man. \"When I need it, I will not forget.\"\n\nAfter visiting for a while, the poor man said good-by to the Snake, and went to where the Rat lived, calling out, \"Rat!\"\n\nThe Rat came at once, and did as the Snake had done, showing the poor man where the money was buried.\n\n\"When I need it, I will come for it,\" said the poor man.\n\nGoing next to the Parrot, he called out, \"Parrot!\" and the bird flew down from the tree-top as soon as he heard the call.\n\n\"O Father,\" said the Parrot, \"shall I call together all my family and friends to gather choice rice for you?\"\n\nThe poor man, seeing that the Parrot was willing and ready to keep his promise, said: \"I do not need rice now. If ever I do, I will not forget your offer.\"\n\nLast of all, the poor man went into the city where the king lived. The king, seated on his great white elephant, was riding through the city. The king saw the poor man, and said to himself: \"That poor man has come to ask me for the great riches I promised to give him. I must have his head cut off before he can tell the people how he saved my life when I was the prince.\"\n\nSo the king called his servants to him and said: \"You see that poor man over there? Seize him and bind him, beat him at every corner of the street as you march him out of the city, and then chop off his head.\"\n\nThe servants had to obey their king. So they seized and bound the poor man. They beat him at every corner of the street. The poor man did not cry out, but he said, over and over again, \"It is better to save poor, weak animals than to save a prince.\"\n\nAt last some wise men among the crowds along the street asked the poor man what prince he had saved. Then the poor man told the whole story, ending with the words, \"By saving your king, I brought all this pain upon myself.\"\n\nThe wise men and all the rest of the crowd cried out: \"This poor man saved the life of our king, and now the king has ordered him to be killed. How can we be sure that he will not have any, or all, of us killed? Let us kill him.\" And in their anger they rushed from every side upon the king as he rode on his elephant, and with arrows and stones they killed him then and there.\n\nThen they made the poor man king, and set him to rule over them.\n\nThe poor man ruled his people well. One day he decided once more to try the Snake, the Rat, and the Parrot. So, followed by many servants, the king went to where the Snake lived.\n\nAt the call of \"Snake!\" out came the Snake from his hole, saying, \"Here, O King, is your treasure; take it.\"\n\n\"I will,\" said the king. \"And I want you to come with me.\"\n\nThen the king had his servants dig up the gold.\n\nGoing to where the Rat lived, the king called, \"Rat!\" Out came the Rat, and bowing low to the king, the Rat said, \"Take all the money buried here and have your servants carry it away.\"\n\n\"I will,\" said the king, and he asked the Rat to go with him and the Snake.\n\nThen the king went to where the Parrot lived, and called, \"Parrot!\" The Parrot flew down to the king's feet and said, \"O King, shall I and my family and my friends gather choice rice for you?\"\n\n\"Not now, not until rice is needed,\" said the king. \"Will you come with us?\" The Parrot was glad to join them.\n\nSo with the gold, and the money, and with the Snake, the Rat, and the Parrot as well, the king went back to the city.\n\nThe king had the gold and the money hidden away in the palace. He had a tube of gold made for the Snake to live in. He had a glass box made for the Rat's home, and a cage of gold for the Parrot. Each had the food he liked best of all to eat every day, and so these four lived happily all their lives."}, {"id": "beauty-and-brownie", "title": "Beauty and Brownie", "byline": "", "src": "More Jataka Tales (Babbitt)", "gid": "7518", "theme": "Jataka tales", "band": "G1+", "words": 365, "note": "Two deer brothers: one listens, one doesn't", "text": "Two Deer named Beauty and Brownie lived with their father and mother and great herds of Deer in a forest. One day their father called them to him and said: \"The Deer in the forest are always in danger when the corn is ripening in the fields. It will be best for you to go away for a while, and you must each take your own herd of Deer with you.\"\n\n\"What is the danger, Father?\" they asked.\n\n\"When the Deer go into the fields to eat the corn they get caught in the traps the men set there,\" the father said. \"Many Deer are caught in these traps every year.\"\n\n\"Shall you go away with us?\" Brownie said.\n\n\"No, your mother and I, and some of the other old Deer will stay here in the forest,\" said the father. \"There will be food enough for us, but there is not enough for you and your herds. You must lead your herds up into the high hills where there is plenty of food for you, and stay there until the crops are all cut. Then you can bring your herds back here. But you must be careful.\n\n\"You must travel by night, because the hunters will see you if you go by day. And you must not take your herd near the villages where hunters live.\"\n\nSo Beauty and Brownie and their herds set out. Beauty traveled at night and did not go near any villages, and at last brought his herd safely to the high hills. Not a single Deer did Beauty lose.\n\nBut Brownie forgot what his father had said. Early each morning he started off with his herd, going along all through the day. When he saw a village, he led his herd right past it. Again and again hunters saw the herd, and they killed many, many of the Deer in Brownie's herd.\n\nWhen crops had been cut, the Deer started back to the forest. Beauty led all his herd back, but stupid Brownie traveled in the daytime, and again he took his herd past the villages. When he reached the forest only a few were left of all Brownie's herd."}, {"id": "the-elephant-and-the-dog", "title": "The Elephant and the Dog", "byline": "", "src": "More Jataka Tales (Babbitt)", "gid": "7518", "theme": "Jataka tales", "band": "G2+", "words": 549, "note": "Friendship", "text": "Once upon a time a Dog used to go into the stable where the king's Elephant lived. At first the Dog went there to get the food that was left after the Elephant had finished eating.\n\nDay after day the Dog went to the stable, waiting around for bits to eat. But by and by the Elephant and the Dog came to be great friends. Then the Elephant began to share his food with the Dog, and they ate together. When the Elephant slept, his friend the Dog slept beside him. When the Elephant felt like playing, he would catch the Dog in his trunk and swing him to and fro. Neither the Dog nor the Elephant was quite happy unless the other was nearby.\n\nOne day a farmer saw the Dog and said to the Elephant-keeper: \"I will buy that Dog. He looks good-tempered, and I see that he is smart. How much do you want for the Dog?\"\n\nThe Elephant-keeper did not care for the Dog, and he did want some money just then. So he asked a fair price, and the fanner paid it and took the Dog away to the country.\n\nThe king's Elephant missed the Dog and did not care to eat when his friend was not there to share the food. When the time came for the Elephant to bathe, he would not bathe. The next day again the Elephant would not eat, and he would not bathe. The third day, when the Elephant would neither eat nor bathe, the king was told about it.\n\nThe king sent for his chief servant, saying, \"Go to the stable and find out why the Elephant is acting in this way.\"\n\nThe chief servant went to the stable and looked the Elephant all over. Then he said to the Elephant-keeper: \"There seems to be nothing the matter with this Elephant's body, but why does he look so sad? Has he lost a playmate?\"\n\n\"Yes,\" said the keeper, \"there was a Dog who ate and slept and played with the Elephant. The Dog went away three days ago.\"\n\n\"Do you know where the Dog is now?\" asked the chief servant.\n\n\"No, I do not,\" said the keeper.\n\nThen the chief servant went back to the king and said, \"The Elephant is not sick, but he is lonely without his friend, the Dog.\"\n\n\"Where is the Dog?\" asked the king.\n\n\"A farmer took him away, so the Elephant-keeper says,\" said the chief servant. \"No one knows where the farmer lives.\"\n\n\"Very well,\" said the king. \"I will send word all over the country, asking the man who bought this Dog to turn him loose. I will give him back as much as he paid for the Dog.\"\n\nWhen the farmer who had bought the Dog heard this, he turned him loose. The Dog ran back as fast as ever he could go to the Elephant's stable. The Elephant was so glad to see the Dog that he picked him up with his trunk and put him on his head. Then he put him down again.\n\nWhen the Elephant-keeper brought food, the Elephant watched the Dog as he ate, and then took his own food.\n\nAll the rest of their lives the Elephant and the Dog lived together.\n\nback"}, {"id": "the-lion-and-the-mouse", "title": "The Lion and the Mouse", "byline": "", "src": "Aesop (Jacobs)", "gid": "28", "theme": "Fables", "band": "G2+", "words": 184, "note": "Kindness repaid. Pair with Androcles", "text": "Once when a Lion was asleep a little Mouse began running up and down upon him; this soon wakened the Lion, who placed his huge paw upon him, and opened his big jaws to swallow him. “Pardon, O King,” cried the little Mouse: “forgive me this time, I shall never forget it: who knows but what I may be able to do you a turn some of these days?” The Lion was so tickled at the idea of the Mouse being able to help him, that he lifted up his paw and let him go. Some time after the Lion was caught in a trap, and the hunters who desired to carry him alive to the King, tied him to a tree while they went in search of a waggon to carry him on. Just then the little Mouse happened to pass by, and seeing the sad plight in which the Lion was, went up to him and soon gnawed away the ropes that bound the King of the Beasts. “Was I not right?” said the little Mouse.\n\nLittle friends may prove great friends."}, {"id": "the-fox-and-the-crow", "title": "The Fox and the Crow", "byline": "", "src": "Aesop (Jacobs)", "gid": "28", "theme": "Fables", "band": "G2+", "words": 176, "note": "Flattery; great for character traits", "text": "A Fox once saw a Crow fly off with a piece of cheese in its beak and settle on a branch of a tree. “That’s for me, as I am a Fox,” said Master Reynard, and he walked up to the foot of the tree. “Good-day, Mistress Crow,” he cried. “How well you are looking to-day: how glossy your feathers; how bright your eye. I feel sure your voice must surpass that of other birds, just as your figure does; let me hear but one song from you that I may greet you as the Queen of Birds.” The Crow lifted up her head and began to caw her best, but the moment she opened her mouth the piece of cheese fell to the ground, only to be snapped up by Master Fox. “That will do,” said he. “That was all I wanted. In exchange for your cheese I will give you a piece of advice for the future—\n\n“Do not trust flatterers.”\n\nThe Flatter doth rob by stealth,\nHis victim, both of Wit and Wealth."}, {"id": "the-town-mouse-and-the-country-mouse", "title": "The Town Mouse and the Country Mouse", "byline": "", "src": "Aesop (Jacobs)", "gid": "28", "theme": "Fables", "band": "G2+", "words": 290, "note": "Compare two settings and points of view", "text": "Now you must know that a Town Mouse once upon a time went on a visit to his cousin in the country. He was rough and ready, this cousin, but he loved his town friend and made him heartily welcome. Beans and bacon, cheese and bread, were all he had to offer, but he offered them freely. The Town Mouse rather turned up his long nose at this country fare, and said: “I cannot understand, Cousin, how you can put up with such poor food as this, but of course you cannot expect anything better in the country; come you with me and I will show you how to live. When you have been in town a week you will wonder how you could ever have stood a country life.” No sooner said than done: the two mice set off for the town and arrived at the Town Mouse’s residence late at night. “You will want some refreshment after our long journey,” said the polite Town Mouse, and took his friend into the grand dining-room. There they found the remains of a fine feast, and soon the two mice were eating up jellies and cakes and all that was nice. Suddenly they heard growling and barking. “What is that?” said the Country Mouse. “It is only the dogs of the house,” answered the other. “Only!” said the Country Mouse. “I do not like that music at my dinner.” Just at that moment the door flew open, in came two huge mastiffs, and the two mice had to scamper down and run off. “Good-bye, Cousin,” said the Country Mouse. “What! going so soon?” said the other. “Yes,” he replied;\n\n“Better beans and bacon in peace than cakes and ale in fear.”"}, {"id": "the-fox-and-the-stork", "title": "The Fox and the Stork", "byline": "", "src": "Aesop (Jacobs)", "gid": "28", "theme": "Fables", "band": "G2+", "words": 181, "note": "Tit for tat; cause and effect", "text": "At one time the Fox and the Stork were on visiting terms and seemed very good friends. So the Fox invited the Stork to dinner, and for a joke put nothing before her but some soup in a very shallow dish. This the Fox could easily lap up, but the Stork could only wet the end of her long bill in it, and left the meal as hungry as when she began. “I am sorry,” said the Fox, “the soup is not to your liking.”\n\n“Pray do not apologise,” said the Stork. “I hope you will return this visit, and come and dine with me soon.” So a day was appointed when the Fox should visit the Stork; but when they were seated at table all that was for their dinner was contained in a very long-necked jar with a narrow mouth, in which the Fox could not insert his snout, so all he could manage to do was to lick the outside of the jar.\n\n“I will not apologise for the dinner,” said the Stork:\n\n“One bad turn deserves another.”"}, {"id": "the-ant-and-the-grasshopper", "title": "The Ant and the Grasshopper", "byline": "", "src": "Aesop (Jacobs)", "gid": "28", "theme": "Fables", "band": "G2+", "words": 150, "note": "Planning ahead; easy debate", "text": "In a field one summer’s day a Grasshopper was hopping about, chirping and singing to its heart’s content. An Ant passed by, bearing along with great toil an ear of corn he was taking to the nest.\n\n“Why not come and chat with me,” said the Grasshopper, “instead of toiling and moiling in that way?”\n\n“I am helping to lay up food for the winter,” said the Ant, “and recommend you to do the same.”\n\n“Why bother about winter?” said the Grasshopper; we have got plenty of food at present.” But the Ant went on its way and continued its toil. When the winter came the Grasshopper had no food and found itself dying of hunger, while it saw the ants distributing every day corn and grain from the stores they had collected in the summer. Then the Grasshopper knew:\n\nIt is best to prepare for the days of necessity."}, {"id": "the-hare-and-the-tortoise", "title": "The Hare and the Tortoise", "byline": "", "src": "Aesop (Jacobs)", "gid": "28", "theme": "Fables", "band": "G2+", "words": 150, "note": "Pride; sequencing", "text": "The Hare was once boasting of his speed before the other animals. “I have never yet been beaten,” said he, “when I put forth my full speed. I challenge any one here to race with me.”\n\nThe Tortoise said quietly, “I accept your challenge.”\n\n“That is a good joke,” said the Hare; “I could dance round you all the way.”\n\n“Keep your boasting till you’ve beaten,” answered the Tortoise. “Shall we race?”\n\nSo a course was fixed and a start was made. The Hare darted almost out of sight at once, but soon stopped and, to show his contempt for the Tortoise, lay down to have a nap. The Tortoise plodded on and plodded on, and when the Hare awoke from his nap, he saw the Tortoise just near the winning-post and could not run up in time to save the race. Then said the Tortoise:\n\n“Plodding wins the race.”"}, {"id": "the-crow-and-the-pitcher", "title": "The Crow and the Pitcher", "byline": "", "src": "Aesop (Jacobs)", "gid": "28", "theme": "Fables", "band": "G2+", "words": 176, "note": "Problem and solution; links to science", "text": "A Crow, half-dead with thirst, came upon a Pitcher which had once been full of water; but when the Crow put its beak into the mouth of the Pitcher he found that only very little water was left in it, and that he could not reach far enough down to get at it. He tried, and he tried, but at last had to give up in despair. Then a thought came to him, and he took a pebble and dropped it into the Pitcher. Then he took another pebble and dropped it into the Pitcher. Then he took another pebble and dropped that into the Pitcher. Then he took another pebble and dropped that into the Pitcher. Then he took another pebble and dropped that into the Pitcher. Then he took another pebble and dropped that into the Pitcher. At last, at last, he saw the water mount up near him, and after casting in a few more pebbles he was able to quench his thirst and save his life.\n\nLittle by little does the trick."}, {"id": "the-wind-and-the-sun", "title": "The Wind and the Sun", "byline": "", "src": "Aesop (Jacobs)", "gid": "28", "theme": "Fables", "band": "G2+", "words": 131, "note": "Persuasion; compare methods", "text": "The Wind and the Sun were disputing which was the stronger. Suddenly they saw a traveller coming down the road, and the Sun said: “I see a way to decide our dispute. Whichever of us can cause that traveller to take off his cloak shall be regarded as the stronger. You begin.” So the Sun retired behind a cloud, and the Wind began to blow as hard as it could upon the traveller. But the harder he blew the more closely did the traveller wrap his cloak round him, till at last the Wind had to give up in despair. Then the Sun came out and shone in all his glory upon the traveller, who soon found it too hot to walk with his cloak on.\n\nKindness effects more than severity."}, {"id": "the-shepherd-s-boy", "title": "The Shepherd’s Boy", "byline": "", "src": "Aesop (Jacobs)", "gid": "28", "theme": "Fables", "band": "G2+", "words": 192, "note": "Lying; consequences", "text": "There was once a young Shepherd Boy who tended his sheep at the foot of a mountain near a dark forest. It was rather lonely for him all day, so he thought upon a plan by which he could get a little company and some excitement. He rushed down towards the village calling out “Wolf, Wolf,” and the villagers came out to meet him, and some of them stopped with him for a considerable time. This pleased the boy so much that a few days afterwards he tried the same trick, and again the villagers came to his help. But shortly after this a Wolf actually did come out from the forest, and began to worry the sheep, and the boy of course cried out “Wolf, Wolf,” still louder than before. But this time the villagers, who had been fooled twice before, thought the boy was again deceiving them, and nobody stirred to come to his help. So the Wolf made a good meal off the boy’s flock, and when the boy complained, the wise man of the village said:\n\n“A liar will not be believed, even when he speaks the truth.”"}, {"id": "belling-the-cat", "title": "Belling the Cat", "byline": "", "src": "Aesop (Jacobs)", "gid": "28", "theme": "Fables", "band": "G2+", "words": 181, "note": "Easy to say, hard to do; debate", "text": "Long ago, the mice had a general council to consider what measures they could take to outwit their common enemy, the Cat. Some said this, and some said that; but at last a young mouse got up and said he had a proposal to make, which he thought would meet the case. “You will all agree,” said he, “that our chief danger consists in the sly and treacherous manner in which the enemy approaches us. Now, if we could receive some signal of her approach, we could easily escape from her. I venture, therefore, to propose that a small bell be procured, and attached by a ribbon round the neck of the Cat. By this means we should always know when she was about, and could easily retire while she was in the neighbourhood.”\n\nThis proposal met with general applause, until an old mouse got up and said: “That is all very well, but who is to bell the Cat?” The mice looked at one another and nobody spoke. Then the old mouse said:\n\n“It is easy to propose impossible remedies.”"}, {"id": "the-dog-and-the-shadow", "title": "The Dog and the Shadow", "byline": "", "src": "Aesop (Jacobs)", "gid": "28", "theme": "Fables", "band": "G2+", "words": 118, "note": "Greed; very short", "text": "It happened that a Dog had got a piece of meat and was carrying it home in his mouth to eat it in peace. Now on his way home he had to cross a plank lying across a running brook. As he crossed, he looked down and saw his own shadow reflected in the water beneath. Thinking it was another dog with another piece of meat, he made up his mind to have that also. So he made a snap at the shadow in the water, but as he opened his mouth the piece of meat fell out, dropped into the water and was never seen more.\n\nBeware lest you lose the substance by grasping at the shadow."}, {"id": "the-goose-with-the-golden-eggs", "title": "The Goose With the Golden Eggs", "byline": "", "src": "Aesop (Jacobs)", "gid": "28", "theme": "Fables", "band": "G2+", "words": 120, "note": "Greed; pair with Midas", "text": "One day a countryman going to the nest of his Goose found there an egg all yellow and glittering. When he took it up it was as heavy as lead and he was going to throw it away, because he thought a trick had been played upon him. But he took it home on second thoughts, and soon found to his delight that it was an egg of pure gold. Every morning the same thing occurred, and he soon became rich by selling his eggs. As he grew rich he grew greedy; and thinking to get at once all the gold the Goose could give, he killed it and opened it only to find nothing.\n\nGreed oft o’er reaches itself."}, {"id": "the-milkmaid-and-her-pail", "title": "The Milkmaid and Her Pail", "byline": "", "src": "Aesop (Jacobs)", "gid": "28", "theme": "Fables", "band": "G2+", "words": 169, "note": "Daydreaming; sequence of 'if... then'", "text": "Patty the Milkmaid was going to market carrying her milk in a Pail on her head. As she went along she began calculating what she would do with the money she would get for the milk. “I’ll buy some fowls from Farmer Brown,” said she, “and they will lay eggs each morning, which I will sell to the parson’s wife. With the money that I get from the sale of these eggs I’ll buy myself a new dimity frock and a chip hat; and when I go to market, won’t all the young men come up and speak to me! Polly Shaw will be that jealous; but I don’t care. I shall just look at her and toss my head like this. As she spoke she tossed her head back, the Pail fell off it, and all the milk was spilt. So she had to go home and tell her mother what had occurred.\n\n“Ah, my child,” said the mother,\n\n“Do not count your chickens before they are hatched.”"}, {"id": "the-bundle-of-sticks", "title": "The Bundle of Sticks", "byline": "", "src": "Aesop (Jacobs)", "gid": "28", "theme": "Fables", "band": "G2+", "words": 106, "note": "Unity; very short", "text": "An old man on the point of death summoned his sons around him to give them some parting advice. He ordered his servants to bring in a faggot of sticks, and said to his eldest son: “Break it.” The son strained and strained, but with all his efforts was unable to break the Bundle. The other sons also tried, but none of them was successful. “Untie the faggots,” said the father, “and each of you take a stick.” When they had done so, he called out to them: “Now, break,” and each stick was easily broken. “You see my meaning,” said their father.\n\nUnion gives strength."}, {"id": "the-fox-and-the-grapes", "title": "The Fox and the Grapes", "byline": "", "src": "Aesop (Jacobs)", "gid": "28", "theme": "Fables", "band": "G2+", "words": 116, "note": "Origin of 'sour grapes' idiom", "text": "One hot summer’s day a Fox was strolling through an orchard till he came to a bunch of Grapes just ripening on a vine which had been trained over a lofty branch. “Just the thing to quench my thirst,” quoth he. Drawing back a few paces, he took a run and a jump, and just missed the bunch. Turning round again with a One, Two, Three, he jumped up, but with no greater success. Again and again he tried after the tempting morsel, but at last had to give it up, and walked away with his nose in the air, saying: “I am sure they are sour.”\n\nIt is easy to despise what you cannot get."}, {"id": "the-two-fellows-and-the-bear", "title": "The Two Fellows and the Bear", "byline": "", "src": "Aesop (Jacobs)", "gid": "28", "theme": "Fables", "band": "G2+", "words": 136, "note": "True friendship", "text": "Two Fellows were travelling together through a wood, when a Bear rushed out upon them. One of the travellers happened to be in front, and he seized hold of the branch of a tree, and hid himself among the leaves. The other, seeing no help for it, threw himself flat down upon the ground, with his face in the dust. The Bear, coming up to him, put his muzzle close to his ear, and sniffed and sniffed. But at last with a growl he shook his head and slouched off, for bears will not touch dead meat. Then the fellow in the tree came down to his comrade, and, laughing, said “What was it that Master Bruin whispered to you?”\n\n“He told me,” said the other,\n\n“Never trust a friend who deserts you at a pinch.”"}, {"id": "the-man-the-boy-and-the-donkey", "title": "The Man, the Boy, and the Donkey", "byline": "", "src": "Aesop (Jacobs)", "gid": "28", "theme": "Fables", "band": "G2+", "words": 307, "note": "You can't please everyone; funny", "text": "A Man and his son were once going with their Donkey to market. As they were walking along by its side a countryman passed them and said: “You fools, what is a Donkey for but to ride upon?”\n\nSo the Man put the Boy on the Donkey and they went on their way. But soon they passed a group of men, one of whom said: “See that lazy youngster, he lets his father walk while he rides.”\n\nSo the Man ordered his Boy to get off, and got on himself. But they hadn’t gone far when they passed two women, one of whom said to the other: “Shame on that lazy lout to let his poor little son trudge along.”\n\nWell, the Man didn’t know what to do, but at last he took his Boy up before him on the Donkey. By this time they had come to the town, and the passers-by began to jeer and point at them. The Man stopped and asked what they were scoffing at. The men said: “Aren’t you ashamed of yourself for overloading that poor donkey of yours and your hulking son?”\n\nThe Man and Boy got off and tried to think what to do. They thought and they thought, till at last they cut down a pole, tied the donkey’s feet to it, and raised the pole and the donkey to their shoulders. They went along amid the laughter of all who met them till they came to Market Bridge, when the Donkey, getting one of his feet loose, kicked out and caused the Boy to drop his end of the pole. In the struggle the Donkey fell over the bridge, and his fore-feet being tied together he was drowned.\n\n“That will teach you,” said an old man who had followed them:\n\n“Please all, and you will please none.”"}, {"id": "the-tortoise-and-the-birds", "title": "The Tortoise and the Birds", "byline": "", "src": "Aesop (Jacobs)", "gid": "28", "theme": "Fables", "band": "G2+", "words": 113, "note": "Aesop's version of the Talkative Tortoise: paired text for Week 1", "text": "A Tortoise desired to change its place of residence, so he asked an Eagle to carry him to his new home, promising her a rich reward for her trouble. The Eagle agreed and seizing the Tortoise by the shell with her talons soared aloft. On their way they met a Crow, who said to the Eagle: “Tortoise is good eating.” “The shell is too hard,” said the Eagle in reply. “The rocks will soon crack the shell,” was the Crow’s answer; and the Eagle, taking the hint, let fall the Tortoise on a sharp rock, and the two birds made a hearty meal of the Tortoise.\n\nNever soar aloft on an enemy’s pinions."}, {"id": "androcles", "title": "Androcles", "byline": "", "src": "Aesop (Jacobs)", "gid": "28", "theme": "Fables", "band": "G2+", "words": 268, "note": "Kindness repaid. Short version", "text": "A slave named Androcles once escaped from his master and fled to the forest. As he was wandering about there he came upon a Lion lying down moaning and groaning. At first he turned to flee, but finding that the Lion did not pursue him, he turned back and went up to him. As he came near, the Lion put out his paw, which was all swollen and bleeding, and Androcles found that a huge thorn had got into it, and was causing all the pain. He pulled out the thorn and bound up the paw of the Lion, who was soon able to rise and lick the hand of Androcles like a dog. Then the Lion took Androcles to his cave, and every day used to bring him meat from which to live. But shortly afterwards both Androcles and the Lion were captured, and the slave was sentenced to be thrown to the Lion, after the latter had been kept without food for several days. The Emperor and all his Court came to see the spectacle, and Androcles was led out into the middle of the arena. Soon the Lion was let loose from his den, and rushed bounding and roaring towards his victim. But as soon as he came near to Androcles he recognised his friend, and fawned upon him, and licked his hands like a friendly dog. The Emperor, surprised at this, summoned Androcles to him, who told him the whole story. Whereupon the slave was pardoned and freed, and the Lion let loose to his native forest.\n\nGratitude is the sign of noble souls."}, {"id": "the-frog-and-the-ox", "title": "The Frog and the Ox", "byline": "", "src": "Aesop (Jacobs)", "gid": "28", "theme": "Fables", "band": "G2+", "words": 186, "note": "Pride; exaggeration", "text": "“Oh Father,” said a little Frog to the big one sitting by the side of a pool, “I have seen such a terrible monster! It was as big as a mountain, with horns on its head, and a long tail, and it had hoofs divided in two.”\n\n“Tush, child, tush,” said the old Frog, “that was only Farmer White’s Ox. It isn’t so big either; he may be a little bit taller than I, but I could easily make myself quite as broad; just you see.” So he blew himself out, and blew himself out, and blew himself out. “Was he as big as that?” asked he.\n\n“Oh, much bigger than that,” said the young Frog.\n\nAgain the old one blew himself out, and asked the young one if the Ox was as big as that.\n\n“Bigger, father, bigger,” was the reply.\n\nSo the Frog took a deep breath, and blew and blew and blew, and swelled and swelled and swelled. And then he said: “I’m sure the Ox is not as big as this. But at this moment he burst.\n\nSelf-conceit may lead to self-destruction."}, {"id": "the-wolf-in-sheep-s-clothing", "title": "The Wolf in Sheep’s Clothing", "byline": "", "src": "Aesop (Jacobs)", "gid": "28", "theme": "Fables", "band": "G2+", "words": 105, "note": "Appearances deceive", "text": "A Wolf found great difficulty in getting at the sheep owing to the vigilance of the shepherd and his dogs. But one day it found the skin of a sheep that had been flayed and thrown aside, so it put it on over its own pelt and strolled down among the sheep. The Lamb that belonged to the sheep, whose skin the Wolf was wearing, began to follow the Wolf in the Sheep’s clothing; so, leading the Lamb a little apart, he soon made a meal off her, and for some time he succeeded in deceiving the sheep, and enjoying hearty meals.\n\nAppearances are deceptive."}, {"id": "hercules-and-the-waggoner", "title": "Hercules and the Waggoner", "byline": "", "src": "Aesop (Jacobs)", "gid": "28", "theme": "Fables", "band": "G2+", "words": 98, "note": "Help yourself first", "text": "A Waggoner was once driving a heavy load along a very muddy way. At last he came to a part of the road where the wheels sank half-way into the mire, and the more the horses pulled, the deeper sank the wheels. So the Waggoner threw down his whip, and knelt down and prayed to Hercules the Strong. “O Hercules, help me in this my hour of distress,” quoth he. But Hercules appeared to him, and said:\n\n“Tut, man, don’t sprawl there. Get up and put your shoulder to the wheel.”\n\nThe gods help them that help themselves."}, {"id": "the-tree-and-the-reed", "title": "The Tree and the Reed", "byline": "", "src": "Aesop (Jacobs)", "gid": "28", "theme": "Fables", "band": "G2+", "words": 131, "note": "Bend, don't break", "text": "“Well, little one,” said a Tree to a Reed that was growing at its foot, “why do you not plant your feet deeply in the ground, and raise your head boldly in the air as I do?”\n\n“I am contented with my lot,” said the Reed. “I may not be so grand, but I think I am safer.”\n\n“Safe!” sneered the Tree. “Who shall pluck me up by the roots or bow my head to the ground?” But it soon had to repent of its boasting, for a hurricane arose which tore it up from its roots, and cast it a useless log on the ground, while the little Reed, bending to the force of the wind, soon stood upright again when the storm had passed over.\n\nObscurity often brings safety."}, {"id": "the-talkative-tortoise", "title": "The Talkative Tortoise", "byline": "", "src": "Curry & Clippinger, Children's Literature", "gid": "25545", "theme": "Fables", "band": "G3+", "words": 566, "note": "Week 1 tale. Jataka version with a frame story about a talkative king", "text": "The future Buddha was once born in a minister's family, when Brahma-datta was reigning in Benares; and when he grew up he became the king's adviser in things temporal and spiritual.\n\nNow this king was very talkati
