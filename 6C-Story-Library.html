ve; while he was speaking others had no opportunity for a word. And the future Buddha, wanting to cure this talkativeness of his, was constantly seeking for some means of doing so.\n\nAt that time there was living, in a pond in the Himalaya mountains, a tortoise. Two young hamsas, or wild ducks, who came to feed there, made friends with him, and one day, when they had become very intimate with him, they said to the tortoise:\n\n\"Friend tortoise! the place where we live, at the Golden Cave on Mount Beautiful in the Himalaya country, is a delightful spot. Will you come there with us?\"\n\n\"But how can I get there?\"\n\n\"We can take you if you can only hold your tongue, and will say nothing to anybody.\"\n\n\"Oh! that I can do. Take me with you.\"\n\n\"That's right,\" said they. And making the tortoise bite hold of a stick, they themselves took the two ends in their teeth, and flew up into the air.\n\nSeeing him thus carried by the hamsas, some villagers called out, \"Two wild ducks are carrying a tortoise along on a stick!\" Whereupon the tortoise wanted to say, \"If my friends choose to carry me, what is that to you, you wretched slaves!\" So just as the swift flight of the wild ducks had brought him over the king's palace in the city of Benares, he let go of the stick he was biting, and falling in the open courtyard, split in two! And there arose a universal cry, \"A tortoise has fallen in the open courtyard, and has split in two!\"\n\nThe king, taking the future Buddha, went to the place, surrounded by his courtiers; and looking at the tortoise, he asked the Bodisat, \"Teacher! how comes he to be fallen here?\"\n\nThe future Buddha thought to himself, \"Long expecting, wishing to admonish the king, have I sought for some means of doing so. This tortoise must have made friends with the wild ducks; and they must have made him bite hold of the stick, and have flown up into the air to take him to the hills. But he, being unable to hold his tongue when he hears any one else talk, must have wanted to say something, and let go the stick; and so must have fallen down from the sky, and thus lost his life.\" And saying, \"Truly, O king! those who are called chatter-boxes—people whose words have no end—come to grief like this,\" he uttered these verses:\n\n\"Verily the tortoise killed himself\nWhile uttering his voice;\nThough he was holding tight the stick,\nBy a word himself he slew.\n\"Behold him then, O excellent by strength!\nAnd speak wise words, not out of season.\nYou see how, by his talking overmuch,\nThe tortoise fell into this wretched plight!\"\n\nThe king saw that he was himself referred to, and said, \"O Teacher! are you speaking of us?\"\n\nAnd the Bodisat spake openly, and said, \"O great king! be it thou, or be it any other, whoever talks beyond measure meets with some mishap like this.\"\n\nAnd the king henceforth refrained himself, and became a man of few words."}, {"id": "a-lion-tricked-by-a-rabbit", "title": "A Lion Tricked by a Rabbit", "byline": "", "src": "Curry & Clippinger, Children's Literature", "gid": "25545", "theme": "Fables", "band": "G3+", "words": 352, "note": "Panchatantra: clever beats strong", "text": "He who hath sense hath strength. Where hath he strength who wanteth judgment? See how a lion, when intoxicated with anger, was overcome by a rabbit.\n\nUpon the mountain Mandara there lived a lion, whose name was Durganta (hard to go near), who was very exact in complying with the ordinance for animal sacrifices. So at length all the different species assembled, and in a body represented that, as by his present mode of proceeding the forest would be cleared all at once, if it pleased his Highness, they would each of them in his turn provide him an animal for his daily food. And the lion gave his consent accordingly. Thus every beast delivered his stipulated provision, till at length, it coming to the rabbit's turn, he began to meditate in this manner: \"Policy should be practiced by him who would save his life; and I myself shall lose mine if I do not take care. Suppose I lead him after another lion? Who knows how that may turn out for me? I will approach him slowly, as if fatigued.\"\n\nThe lion by this time began to be very hungry; so, seeing the rabbit coming toward him, he called out in a great passion, \"What is the reason thou comest so late?\"\n\n\"Please your Highness,\" said the rabbit, \"as I was coming along I was forcibly detained by another of your species; but having given him my word that I would return immediately, I came here to represent it to your Highness.\"\n\n\"Go quickly,\" said the lion in a rage, \"and show me where this vile wretch may be found!\"\n\nAccordingly, the rabbit conducted the lion to the brink of a deep well, where being arrived, \"There,\" said the rabbit, \"look down and behold him.\" At the same time he pointed to the reflected image of the lion in the water, who, swelling with pride and resentment, leaped into the well, as he thought, upon his adversary; and thus put an end to his life.\n\nI repeat, therefore:\n\nHe who hath sense hath strength. Where hath he strength who wanteth judgment?"}, {"id": "the-ass-in-the-lion-s-skin", "title": "The Ass in the Lion's Skin", "byline": "", "src": "Curry & Clippinger, Children's Literature", "gid": "25545", "theme": "Fables", "band": "G3+", "words": 323, "note": "Jataka: pretending to be something you are not", "text": "At the same time when Brahma-datta was reigning in Benares, the future Buddha was born one of a peasant family; and when he grew up he gained his living by tilling the ground.\n\nAt that time a hawker used to go from place to place, trafficking in goods carried by an ass. Now at each place he came to, when he took the pack down from the ass's back, he used to clothe him in a lion's skin and turn him loose in the rice and barley fields. And when the watchmen in the fields saw the ass they dared not go near him, taking him for a lion.\n\nSo one day the hawker stopped in a village; and while he was getting his own breakfast cooked, he dressed the ass in a lion's skin and turned him loose in a barley field. The watchmen in the field dared not go up to him; but going home, they published the news. Then all the villagers came out with weapons in their hands; and blowing chanks, and beating drums, they went near the field and shouted. Terrified with the fear of death, the ass uttered a cry—the bray of an ass!\n\nAnd when he knew him then to be an ass, the future Buddha pronounced the first verse:\n\n\"This is not a lion's roaring,\nNor a tiger's nor a panther's;\nDressed in a lion's skin,\n'Tis a wretched ass that roars!\"\n\nBut when the villagers knew the creature to be an ass, they beat him till his bones broke; and, carrying off the lion's skin, went away. Then the hawker came; and seeing the ass fallen into so bad a plight, pronounced the second verse:\n\n\"Long might the ass,\nClad in a lion's skin,\nHave fed on the barley green;\nBut he brayed\nAnd that moment he came to ruin.\"\n\nAnd even while he was yet speaking the ass died on the spot."}, {"id": "the-camel-and-the-pig", "title": "The Camel and the Pig", "byline": "Adapted By P. V. Ramaswami Raju", "src": "Curry & Clippinger, Children's Literature", "gid": "25545", "theme": "Fables", "band": "G2+", "words": 264, "note": "Bidpai: is tall or short better? Debate", "text": "A camel said, \"Nothing like being tall! See how tall I am!\"\n\nA Pig who heard these words said, \"Nothing like being short; see how short I am!\"\n\nThe Camel said, \"Well, if I fail to prove the truth of what I said, I will give up my hump.\"\n\nThe Pig said, \"If I fail to prove the truth of what I have said, I will give up my snout.\"\n\n\"Agreed!\" said the Camel.\n\n\"Just so!\" said the Pig.\n\nThey came to a garden inclosed by a low wall without any opening. The Camel stood on this side the wall, and, reaching the plants within by means of his long neck, made a breakfast on them. Then he turned jeeringly to the Pig, who had been standing at the bottom of the wall, without even having a look at the good things in the garden, and said, \"Now, would you be tall or short?\"\n\nNext they came to a garden inclosed by a high wall, with a wicket gate at one end. The Pig entered by the gate and, after having eaten his fill of the vegetables within, came out, laughing at the poor Camel, who had to stay outside, because he was too tall to enter the garden by the gate, and said, \"Now, would you be tall or short?\"\n\nThen they thought the matter over, and came to the conclusion that the Camel should keep his hump and the Pig his snout, observing,—\n\n\"Tall is good, where tall would do;\nOf short, again, 'tis also true!\""}, {"id": "androcles-and-the-lion", "title": "Androcles and the Lion", "byline": "Thomas Day", "src": "Curry & Clippinger, Children's Literature", "gid": "25545", "theme": "Fables", "band": "G4+", "words": 1020, "note": "Long version; compare with Aesop's short one", "text": "There was a certain slave named Androcles, who was so ill-treated by his master that his life became insupportable. Finding no remedy for what he suffered, he at length said to himself, \"It is better to die than to continue to live in such hardships and misery as I am obliged to suffer. I am determined therefore to run away from my master. If I am taken again, I know that I shall be punished with a cruel death; but it is better to die at once than to live in misery. If I escape, I must betake myself to deserts and woods, inhabited only by wild beasts; but they cannot use me more cruelly than I have been used by my fellow-creatures. Therefore I will rather trust myself with them than continue to be a miserable slave.\"\n\nHaving formed this resolution, he took an opportunity of leaving his master's house, and hid himself in a thick forest, which was at some miles' distance from the city. But here the unhappy man found that he had only escaped from one kind of misery to experience another. He wandered about all day through a vast and trackless wood, where his flesh was continually torn by thorns and brambles. He grew hungry, but could find no food in this dreary solitude. At length he was ready to die with fatigue, and lay down in despair in a large cavern which he found by accident.\n\nThis unfortunate man had not lain long quiet in the cavern, before he heard a dreadful noise, which seemed to be the roar of some wild beast, and terrified him very much. He started up with a design to escape and had already reached the mouth of the cave when he saw coming towards him a lion of prodigious size, who prevented any possibility of retreat. The unfortunate man then believed his destruction to be inevitable; but, to his great astonishment, the beast advanced towards him with a gentle pace, without any mark of enmity or rage, and uttered a kind of mournful voice, as if he demanded the assistance of the man.\n\nAndrocles, who was naturally of a resolute disposition, acquired courage from this circumstance, to examine his monstrous guest, who gave him sufficient leisure for that purpose. He saw, as the lion approached him, that he seemed to limp upon one of his legs and that the foot was extremely swelled as if it had been wounded. Acquiring still more fortitude from the gentle demeanor of the beast, he advanced up to him and took hold of the wounded paw, as a surgeon would examine a patient. He then perceived that a thorn of uncommon size had penetrated the ball of the foot and was the occasion of the swelling and lameness he had observed. Androcles found that the beast, far from resenting this familiarity, received it with the greatest gentleness and seemed to invite him by his blandishments to proceed. He therefore extracted the thorn, and, pressing the swelling, discharged a considerable quantity of matter, which had been the cause of so much pain and uneasiness.\n\nAs soon as the beast felt himself thus relieved, he began to testify his joy and gratitude by every expression within his power. He jumped about like a wanton spaniel, wagged his enormous tail, and licked the feet and hands of his physician. Nor was he contented with these demonstrations of kindness; from this moment Androcles became his guest; nor did the lion ever sally forth in quest of prey without bringing home the produce of his chase and sharing it with his friend. In this savage state of hospitality did the man continue to live during the space of several months. At length, wandering unguardedly through the woods, he met with a company of soldiers sent out to apprehend him, and was by them taken prisoner and conducted back to his master. The laws of that country being very severe against slaves, he was tried and found guilty of having fled from his master, and, as a punishment for his pretended crime, he was sentenced to be torn in pieces by a furious lion, kept many days without food to inspire him with additional rage.\n\nWhen the destined moment arrived, the unhappy man was exposed, unarmed, in the midst of a spacious area, enclosed on every side, round which many thousand people were assembled to view the mournful spectacle.\n\nPresently a dreadful yell was heard, which struck the spectators with horror; and a monstrous lion rushed out of a den, which was purposely set open, and darted forward with erected mane, and flaming eyes, and jaws that gaped like an open sepulchre.—A mournful silence instantly prevailed! All eyes were turned upon the destined victim, whose destruction now appeared inevitable. But the pity of the multitude was soon converted into astonishment, when they beheld the lion, instead of destroying his defenceless prey, crouch submissively at his feet; fawn upon him as a faithful dog would do upon his master, and rejoice over him as a mother that unexpectedly recovers her offspring. The governor of the town, who was present, then called out with a loud voice and ordered Androcles to explain to them this unintelligible mystery, and how a savage beast of the fiercest and most unpitying nature should thus in a moment have forgotten his innate disposition, and be converted into a harmless and inoffensive animal.\n\nAndrocles then related to the assembly every circumstance of his adventures in the woods, and concluded by saying that the very lion which now stood before them had been his friend and entertainer in the woods. All the persons present were astonished and delighted with the story, to find that even the fiercest beasts are capable of being softened by gratitude and moved by humanity; and they unanimously joined to entreat for the pardon of the unhappy man from the governor of the place. This was immediately granted to him, and he was also presented with the lion, who had in this manner twice saved the life of Androcles."}, {"id": "the-miller-his-son-and-their-ass", "title": "The Miller, His Son, and Their Ass", "byline": "", "src": "Curry & Clippinger, Children's Literature", "gid": "25545", "theme": "Fables", "band": "G3+", "words": 399, "note": "Longer version of the Aesop", "text": "A Miller and his Son were driving their Ass to a neighboring fair to sell him. They had not gone far when they met with a troop of women collected round a well, talking and laughing.\n\n\"Look there,\" cried one of them, \"did you ever see such fellows, to be trudging along the road on foot when they might ride?\"\n\nThe Miller, hearing this, quickly made his Son mount the Ass, and continued to walk along merrily by his side. Presently they came up to a group of old men in earnest debate.\n\n\"There,\" said one of them, \"it proves what I was saying. What respect is shown to old age in these days? Do you see that idle lad riding while his old father has to walk? Get down, you young scapegrace, and let the old man rest his weary limbs.\"\n\nUpon this, the Miller made his Son dismount, and got up himself. In this manner they had not proceeded far when they met a company of women and children.\n\n\"Why, you lazy old fellow,\" cried several tongues at once, \"how can you ride upon the beast while that poor little lad there can hardly keep pace by the side of you?\"\n\nThe good-natured Miller immediately took up his Son behind him. They had now almost reached the town.\n\n\"Pray, honest friend,\" said a citizen, \"is that Ass your own?\"\n\n\"Yes,\" replied the old man.\n\n\"Oh, one would not have thought so,\" said the other, \"by the way you load him. Why, you two fellows are better able to carry the poor beast than he you.\"\n\n\"Anything to please you,\" said the Miller; \"we can but try.\"\n\nSo, alighting with his Son, they tied the legs of the Ass together, and by the help of a pole endeavored to carry him on their shoulders over a bridge near the entrance of the town. This entertaining sight brought the people in crowds to laugh at it, till the Ass, not liking the noise nor the strange handling that he was subject to, broke the cords that bound him and, tumbling off the pole, fell into the river. Upon this, the old man, vexed and ashamed, made the best of his way home again, convinced that by trying to please everybody he had pleased nobody, and lost his Ass into the bargain.\n\nHe who tries to please everybody pleases nobody."}, {"id": "the-story-of-alnaschar", "title": "The Story of Alnaschar", "byline": "", "src": "Curry & Clippinger, Children's Literature", "gid": "25545", "theme": "Fables", "band": "G4+", "words": 704, "note": "Arabian Nights daydreamer; pair with Milkmaid", "text": "Alnaschar, my fifth brother, was very lazy, and of course wretchedly poor. On the death of our father we divided his property, and each of us received a hundred drachms of silver for his share. Alnaschar, who hated labor, laid out his money in fine glasses, and having displayed his stock to the best advantage in a large basket, he took his stand in the market-place, with his back against the wall, waiting for customers. In this posture he indulged in a reverie, talking aloud to himself as follows:\n\n\"This glass cost me a hundred drachms of silver, which is all I have in the world. I shall make two hundred by retailing it, and of these very shortly four hundred. It will not be long before these produce four thousand. Money, they say, begets money. I shall soon therefore be possessed of eight thousand, and when these become ten thousand I will no longer be a glass-seller. I will trade in pearls and diamonds; and as I shall become rich apace, I will have a splendid palace, a great estate, slaves, and horses; I will not, however, leave traffic till I have acquired a hundred thousand drachms. Then I shall be as great as a prince, and will assume manners accordingly.\n\n\"I will demand the daughter of the grand vizier in marriage, who, no doubt, will be glad of an alliance with a man of my consequence. The marriage ceremony shall be performed with the utmost splendor and magnificence. I will have my horse clothed with the richest housings, ornamented with diamonds and pearls, and will be attended by a number of slaves, all richly dressed, when I go to the vizier's palace to conduct my wife thence to my own. The vizier shall receive me with great pomp, and shall give me the right hand and place me above himself, to do me the more honor. On my return I will appoint two of my handsomest slaves to throw money among the populace, that every one may speak well of my generosity.\n\n\"When we arrive at my own palace, I will take great state upon me, and hardly speak to my wife. She shall dress herself in all her ornaments, and stand before me as beautiful as the full moon, but I will not look at her. Her slaves shall draw near and entreat me to cast my eyes upon her; which, after much supplication, I will deign to do, though with great indifference. I will not suffer her to come out of her apartment without my leave; and when I have a mind to visit her there, it shall be in a manner that will make her respect me. Thus will I begin early to teach her what she is to expect the rest of her life.\n\n\"When her mother comes to visit her she will intercede with me for her. 'Sir,' she will say (for she will not dare to call me son, for fear of offending me by so much familiarity), 'do not, I beseech, treat my daughter with scorn; she is as beautiful as an Houri, and entirely devoted to you.' But my mother-in-law may as well hold her peace, for I will take no notice of what she says. She will then pour out some wine into a goblet, and give it to my wife, saying, 'Present it to your lord and husband; he will not surely be so cruel as to refuse it from so fair a hand.' My wife will then come with the glass, and stand trembling before me; and when she finds that I do not look on her, but continue to disdain her, she will kneel and entreat me to accept it; but I will continue inflexible. At last, redoubling her tears, she will rise and put the goblet to my lips, when, tired with her importunities, I will dart a terrible look at her and give her such a push with my foot as will spurn her from me.\" Alnaschar was so interested in this imaginary grandeur that he thrust forth his foot to kick the lady, and by that means overturned his glasses and broke them into a thousand pieces."}, {"id": "the-tiger-the-brahman-and-the-jackal", "title": "The Tiger, the Brahman, and the Jackal", "byline": "", "src": "Curry & Clippinger, Children's Literature", "gid": "25545", "theme": "Asian tales", "band": "G2+", "words": 866, "note": "Week 1 Book Circle; argument writing", "text": "Once upon a time a tiger was caught in a trap. He tried in vain to get out through the bars, and rolled and bit with rage and grief when he failed.\n\nBy chance a poor Brahman came by. \"Let me out of this cage, O pious one!\" cried the tiger.\n\n\"Nay, my friend,\" replied the Brahman mildly; \"you would probably eat me if I did.\"\n\n\"Not at all!\" swore the tiger with many oaths; \"on the contrary, I should be forever grateful, and serve you as a slave.\"\n\nNow, when the tiger sobbed and sighed and wept and swore, the pious Brahman's heart softened, and at last he consented to open the door of the cage. Out popped the tiger, and, seizing the poor man, cried, \"What a fool you are! What is to prevent my eating you now, for after being cooped up so long I am just terribly hungry?\"\n\nIn vain the Brahman pleaded for his life; the most he could gain was a promise to abide by the decision of the first three things he chose to question as to the justice of the tiger's action.\n\nSo the Brahman first asked a pipal tree what it thought of the matter, but the pipal tree replied coldly, \"What have you to complain about? Don't I give shade and shelter to every one who passes by, and don't they in return tear down my branches to feed their cattle? Don't whimper—be a man!\"\n\nThen the Brahman, sad at heart, went further afield till he saw a buffalo turning a well-wheel; but he fared no better from it, for it answered: \"You are a fool to expect gratitude! Look at me! While I gave milk they fed me on cotton-seed and oil-cake, but now I am dry they yoke me here, and give me refuse as fodder!\"\n\nThe Brahman, still more sad, asked the road to give him its opinion.\n\n\"My dear sir,\" said the road, \"how foolish you are to expect anything else! Here am I, useful to everybody, yet all, rich and poor, great and small, trample on me as they go past, giving me nothing but the ashes of their pipes and the husks of their grain!\"\n\nOn this the Brahman turned back sorrowfully, and on the way he met a jackal, who called out, \"Why, what's the matter, Mr. Brahman? You look as miserable as a fish out of water!\"\n\nThe Brahman told him all that had occurred. \"How very confusing!\" said the jackal, when the recital was ended; \"would you mind telling me over again, for everything seems so mixed up?\"\n\nThe Brahman told it all over again, but the jackal shook his head in a distracted sort of way, and still could not understand.\n\n\"It's very odd,\" said he sadly, \"but it all seems to go in at one ear and out at the other! I will go to the place where it all happened, and then, perhaps, I shall be able to give a judgment.\"\n\nSo they returned to the cage, by which the tiger was waiting for the Brahman, and sharpening his teeth and claws.\n\n\"You've been away a long time!\" growled the savage beast, \"but now let us begin our dinner.\"\n\n\"Our dinner!\" thought the wretched Brahman, as his knees knocked together with fright; \"what a remarkably delicate way of putting it!\"\n\n\"Give me five minutes, my lord!\" he pleaded, \"in order that I may explain matters to the jackal here, who is somewhat slow in his wits.\"\n\nThe tiger consented, and the Brahman began the whole story over again, not missing a single detail, and spinning as long a yarn as possible.\n\n\"Oh, my poor brain! oh, my poor brain!\" cried the jackal, wringing its paws. \"Let me see! how did it all begin? You were in the cage, and the tiger came walking by—\"\n\n\"Pooh!\" interrupted the tiger, \"what a fool you are! I was in the cage.\"\n\n\"Of course!\" cried the jackal, pretending to tremble with fright; \"yes! I was in the cage—no, I wasn't—dear! dear! where are my wits? Let me see—the tiger was in the Brahman, and the cage came walking by—no, that's not it, either! Well, don't mind me, but begin your dinner, for I shall never understand!\"\n\n\"Yes, you shall!\" returned the tiger, in a rage at the jackal's stupidity; \"I'll make you understand! Look here—I am the tiger—\"\n\n\"Yes, my lord!\"\n\n\"And that is the Brahman—\"\n\n\"Yes, my lord!\"\n\n\"And that is the cage—\"\n\n\"Yes, my lord!\"\n\n\"And I was in the cage—do you understand?\"\n\n\"Yes—no——Please, my lord—\"\n\n\"Well?\" cried the tiger impatiently.\n\n\"Please, my lord! How did you get in?\"\n\n\"How? Why in the usual way, of course!\"\n\n\"Oh, dear me! my head is beginning to whirl again! Please don't be angry, my lord, but what is the usual way?\"\n\nAt this the tiger lost patience, and jumping into the cage, cried, \"This way! Now do you understand how it was?\"\n\n\"Perfectly!\" grinned the jackal, as he dexterously shut the door, \"and if you will permit me to say so, I think matters will remain as they were!\""}, {"id": "the-lambikin", "title": "The Lambikin", "byline": "", "src": "Curry & Clippinger, Children's Literature", "gid": "25545", "theme": "Asian tales", "band": "G2+", "words": 632, "note": "Indian; clever escape, repeated refrain (good fluency text)", "text": "Once upon a time there was a wee wee Lambikin, who frolicked about on his little tottery legs, and enjoyed himself amazingly. Now one day he set off to visit his Granny, and was jumping with joy to think of all the good things he should get from her, when whom should he meet but a Jackal, who looked at the tender young morsel and said: \"Lambikin! Lambikin! I'll eat YOU!\"\n\nBut Lambikin only gave a little frisk and said:\n\n\"To Granny's house I go,\nWhere I shall fatter grow,\nThen you can eat me so.\"\n\nThe Jackal thought this reasonable, and let Lambikin pass.\n\nBy and by he met a Vulture, and the Vulture, looking hungrily at the tender morsel before him, said: \"Lambikin! Lambikin! I'll eat YOU!\"\n\nBut Lambikin only gave a little frisk, and said:\n\n\"To Granny's house I go,\nWhere I shall fatter grow,\nThen you can eat me so.\"\n\nThe Vulture thought this reasonable, and let Lambikin pass.\n\nAnd by and by he met a Tiger, and then a Wolf, and a Dog, and an Eagle, and all these, when they saw the tender little morsel, said: \"Lambikin! Lambikin! I'll eat YOU!\"\n\nBut to all of them Lambikin replied, with a little frisk:\n\n\"To Granny's house I go,\nWhere I shall fatter grow,\nThen you can eat me so.\"\n\nAt last he reached his Granny's house, and said, all in a great hurry, \"Granny, dear, I've promised to get very fat; so, as people ought to keep their promises, please put me into the corn-bin at once.\"\n\nSo his Granny said he was a good boy, and put him into the corn-bin, and there the greedy little Lambikin stayed for seven days, and ate, and ate, and ate, until he could scarcely waddle, and his Granny said he was fat enough for anything, and must go home. But cunning little Lambikin said that would never do, for some animal would be sure to eat him on the way back, he was so plump and tender.\n\n\"I'll tell you what you must do,\" said Master Lambikin, \"you must make a little drumikin out of the skin of my little brother who died, and then I can sit inside and trundle along nicely, for I'm as tight as a drum myself.\"\n\nSo his Granny made a nice little drumikin out of his brother's skin, with the wool inside, and Lambikin curled himself up snug and warm in the middle, and trundled away gayly. Soon he met with the Eagle, who called out:\n\n\"Drumikin! Drumikin!\nHave you seen Lambikin?\"\n\nAnd Mr. Lambikin, curled up in his soft warm nest, replied:\n\n\"Lost in the forest, and so are you,\nOn, little Drumikin! Tum-pa, tum-too!\"\n\n\"How very annoying!\" sighed the Eagle, thinking regretfully of the tender morsel he had let slip.\n\nMeanwhile Lambikin trundled along, laughing to himself, and singing:\n\n\"Tum-pa, tum-too;\nTum-pa, tum-too!\"\n\nEvery animal and bird he met asked him the same question:\n\n\"Drumikin! Drumikin!\nHave you seen Lambikin?\"\n\nAnd to each of them the little sly-boots replied:\n\n\"Lost in the forest, and so are you,\nOn, little Drumikin! Tum-pa, tum-too;\nTum-pa, tum-too; tum-pa, tum-too!\"\n\nThen they all sighed to think of the tender little morsel they had let slip.\n\nAt last the Jackal came limping along, for all his sorry looks as sharp as a needle, and he too called out:\n\n\"Drumikin! Drumikin!\nHave you seen Lambikin?\"\n\nAnd Lambikin, curled up in his snug little nest, replied gayly:\n\n\"Lost in the forest, and so are you,\nOn, little Drumikin! Tum-pa—\"\n\nBut he never got any further, for the Jackal recognized his voice at once, and cried: \"Hullo! you've turned yourself inside out, have you? Just you come out of that!\"\n\nWhereupon he tore open Drumikin and gobbled up Lambikin."}, {"id": "tit-for-tat", "title": "Tit for Tat", "byline": "", "src": "Curry & Clippinger, Children's Literature", "gid": "25545", "theme": "Asian tales", "band": "G2+", "words": 536, "note": "Indian; trickster", "text": "There once lived a Camel and a Jackal who were great friends. One day the Jackal said to the Camel, \"I know that there is a fine field of sugar cane on the other side of the river. If you will take me across, I'll show you the place. This plan will suit me as well as you. You will enjoy eating the sugar cane, and I am sure to find many crabs, bones, and bits of fish by the river side, on which to make a good dinner.\"\n\nThe Camel consented, and swam across the river, taking the Jackal, who could not swim, on his back. When they reached the other side, the Camel went to eat the sugar cane, and the Jackal ran up and down the river bank, devouring all the crabs, bits of fish, and bones he could find.\n\nBut being so much smaller an animal, he had made an excellent meal before the Camel had eaten more than two or three mouthfuls; and no sooner had he finished his dinner than he ran round and round the sugar-cane field, yelping and howling with all his might.\n\nThe villagers heard him, and thought, \"There is a Jackal among the sugar canes; he will be scratching holes in the ground and spoiling the roots of the plants.\" And they went down to the place to drive him away. But when they got there they found to their surprise not only a Jackal, but a Camel who was eating the sugar canes! This made them very angry, and they caught the poor Camel and drove him from the field and beat him until he was nearly dead.\n\nWhen the villagers had gone, the Jackal said to the Camel, \"We had better go home.\" And the Camel, said, \"Very well; then jump upon my back, as you did before.\"\n\nSo the Jackal jumped upon the Camel's back, and the Camel began to recross the river. When they had got well into the water, the Camel said, \"This is a pretty way in which you have treated me, friend Jackal. No sooner had you finished your own dinner than you must go yelping about the place loud enough to arouse the whole village, and bring all the villagers down to beat me black and blue, and turn me out of the field before I had eaten two mouthfuls! What in the world did you make such a noise for?\"\n\n\"I don't know,\" said the Jackal. \"It is a custom I have. I always like to sing a little after dinner.\"\n\nThe Camel waded on through the river. The water reached up to his knees—then above them—up, up, up, higher and higher, until at last he was obliged to swim.\n\nThen turning to the Jackal, he said, \"I feel very anxious to roll.\"\n\n\"Oh, pray don't; why do you wish to do so?\" asked the Jackal.\n\n\"I don't know,\" answered the Camel. \"It is a custom I have. I always like to have a little roll after dinner.\"\n\nSo saying, he rolled over in the water, shaking the Jackal off as he did so. And the Jackal was drowned, but the Camel swam safely ashore."}, {"id": "pride-goeth-before-a-fall", "title": "Pride Goeth Before a Fall", "byline": "", "src": "Curry & Clippinger, Children's Literature", "gid": "25545", "theme": "Asian tales", "band": "G3+", "words": 687, "note": "Indian; pride", "text": "In a certain village there lived ten cloth merchants, who always went about together. Once upon a time they had traveled far afield, and were returning home with a great deal of money which they had obtained by selling their wares. Now there happened to be a dense forest near their village, and this they reached early one morning. In it there lived three notorious robbers, of whose existence the traders had never heard, and while they were still in the middle of it the robbers stood before them, with swords and cudgels in their hands, and ordered them to lay down all they had. The traders had no weapons with them, and so, though they were many more in number, they had to submit themselves to the robbers, who took away everything from them, even the very clothes they wore, and gave to each only a small loin-cloth a span in breadth and a cubit in length.\n\nThe idea that they had conquered ten men and plundered all their property now took possession of the robbers' minds. They seated themselves like three monarchs before the men they had plundered, and ordered them to dance to them before returning home. The merchants now mourned their fate. They had lost all they had, except their loin-cloth, and still the robbers were not satisfied, but ordered them to dance.\n\nThere was among the ten merchants one who was very clever. He pondered over the calamity that had come upon him and his friends, the dance they would have to perform, and the magnificent manner in which the three robbers had seated themselves on the grass. At the same time he observed that these last had placed their weapons on the ground, in the assurance of having thoroughly cowed the traders, who were now commencing to dance; and, as a song is always sung by the leader on such occasions, to which the rest keep time with hands and feet, he thus began to sing:\n\n\"We are enty men,\nThey are erith men:\nIf each erith man,\nSurround eno men\nEno man remains.\nTâ, tai tôm, tadingana.\"\n\nThe robbers were all uneducated, and thought that the leader was merely singing a song as usual. So it was in one sense; for the leader commenced from a distance, and had sung the song over twice before he and his companions commenced to approach the robbers. They had understood his meaning, because they had been trained in trade.\n\nWhen two traders discuss the price of an article in the presence of a purchaser, they use a riddling sort of language.\n\n\"What is the price of this cloth?\" one trader will ask.\n\n\"Enty rupees,\" another will reply, meaning \"ten rupees.\"\n\nThus there is no possibility of the purchaser knowing what is meant unless he be acquainted with trade language. By the rules of this secret language erith means \"three,\" enty means \"ten,\" and eno means \"one.\" So the leader by his song meant to hint to his fellow-traders that they were ten men, the robbers only three, that if three pounced upon each of the robbers, nine of them could hold them down, while the remaining one bound the robbers' hands and feet.\n\nThe three thieves, glorying in their victory, and little understanding the meaning of the song and the intentions of the dancers, were proudly seated chewing betel and tobacco. Meanwhile the song was sung a third time. Tâ tai tôm had left the lips of the singer; and, before tadingana was out of them, the traders separated into parties of three, and each party pounced upon a thief. The remaining one—the leader himself—tore up into long narrow strips a large piece of cloth, six cubits long, and tied the hands and feet of the robbers. These were entirely humbled now, and rolled on the ground like three bags of rice!\n\nThe ten traders now took back all their property, and armed themselves with the swords and cudgels of their enemies; and when they reached their village they often amused their friends and relatives by relating their adventure."}, {"id": "the-tongue-cut-sparrow", "title": "The Tongue-cut Sparrow", "byline": "Version By Teresa Peirce Williston", "src": "Curry & Clippinger, Children's Literature", "gid": "25545", "theme": "Asian tales", "band": "G3+", "words": 1026, "note": "Japanese; kindness vs greed; compare with Thai tales", "text": "In a little old house in a little old village in Japan lived a little old man and his little old wife.\n\nOne morning when the old woman slid open the screens which form the sides of all Japanese houses, she saw, on the doorstep, a poor little sparrow. She took him up gently and fed him. Then she held him in the bright morning sunshine until the cold dew was dried from his wings. Afterward she let him go, so that he might fly home to his nest, but he stayed to thank her with his songs.\n\nEach morning, when the pink on the mountain tops told that the sun was near, the sparrow perched on the roof of the house and sang out his joy.\n\nThe old man and woman thanked the sparrow for this, for they liked to be up early and at work. But near them there lived a cross old woman who did not like to be awakened so early. At last she became so angry that she caught the sparrow and cut his tongue. Then the poor little sparrow flew away to his home, but he could never sing again.\n\nWhen the kind woman knew what had happened to her pet she was very sad. She said to her husband, \"Let us go and find our poor little sparrow.\" So they started together, and asked of each bird by the wayside: \"Do you know where the Tongue-Cut Sparrow lives? Do you know where the Tongue-Cut Sparrow went?\"\n\nIn this way they followed until they came to a bridge. They did not know which way to turn, and at first could see no one to ask.\n\nAt last they saw a Bat hanging head downward, taking his daytime nap. \"Oh, friend Bat, do you know where the Tongue-Cut Sparrow went?\" they asked.\n\n\"Yes. Over the bridge and up the mountain,\" said the Bat. Then he blinked his sleepy eyes and was fast asleep again.\n\nThey went over the bridge and up the mountain, but again they found two roads and did not know which one to take. A little Field Mouse peeped through the leaves and grass, so they asked him, \"Do you know where the Tongue-Cut Sparrow went?\"\n\n\"Yes. Down the mountain and through the woods,\" said the Field Mouse.\n\nDown the mountain and through the woods they went, and at last came to the home of their little friend.\n\nWhen he saw them coming the poor little sparrow was very happy indeed. He and his wife and children all came and bowed their heads down to the ground to show their respect. Then the Sparrow rose and led the old man and the old woman into his house, while his wife and children hastened to bring them boiled rice, fish, cress, and saké.\n\nAfter they had feasted, the Sparrow wished to please them still more, so he danced for them what is called the \"sparrow-dance.\"\n\nWhen the sun began to sink, the old man and woman started for home. The Sparrow brought out two baskets. \"I would like to give you one of these,\" he said. \"Which will you take?\" One basket was large and looked very full, while the other one seemed very small and light. The old people thought they would not take the large basket, for that might have all the Sparrow's treasure in it, so they said, \"The way is long and we are very old, so please let us take the smaller one.\"\n\nThey took it and walked home over the mountain and across the bridge, happy and contented.\n\nWhen they reached their own home they decided to open the basket and see what the Sparrow had given them. Within the basket they found many rolls of silk and piles of gold, enough to make them rich, so they were more grateful than ever to the Sparrow.\n\nThe cross old woman who had cut the Sparrow's tongue was peering in through the screen when they opened their basket. She saw the rolls of silk and the piles of gold, and planned how she might get some for herself.\n\nThe next morning she went to the kind woman and said: \"I am so sorry that I cut the tongue of your Sparrow. Please tell me the way to his home so that I may go to him and tell him I am sorry.\"\n\nThe kind woman told her the way and she set out. She went across the bridge, over the mountain, and through the woods. At last she came to the home of the little Sparrow.\n\nHe was not so glad to see this old woman, yet he was very kind to her and did everything to make her feel welcome. They made a feast for her, and when she started home the Sparrow brought out two baskets as before. Of course the woman chose the large basket, for she thought that would have even more wealth than the other one.\n\nIt was very heavy, and caught on the trees as she was going through the wood. She could hardly pull it up the mountain with her, and she was all out of breath when she reached the top. She did not get to the bridge until it was dark. Then she was so afraid of dropping the basket into the river that she scarcely dared to step.\n\nWhen at last she reached home she was so tired that she was half dead, but she pulled the screens close shut, so that no one could look in, and opened her treasure.\n\nTreasure indeed! A whole swarm of horrible creatures burst from the basket the moment she opened it. They stung her and bit her, they pushed her and pulled her, they scratched her and laughed at her screams.\n\nAt last she crawled to the edge of the room and slid aside the screen to get away from the pests. The moment the door was opened they swooped down upon her, picked her up, and flew away with her. Since then nothing has ever been heard of the old woman."}, {"id": "the-mirror-of-matsuyama", "title": "The Mirror of Matsuyama", "byline": "Version By Teresa Peirce Williston", "src": "Curry & Clippinger, Children's Literature", "gid": "25545", "theme": "Asian tales", "band": "G3+", "words": 1092, "note": "Japanese; family, memory", "text": "In Matsuyama there lived a man, his wife, and their little daughter. They loved each other very much, and were very happy together. One day the man came home very sad. He had received a message from the Emperor, which said that he must take a journey to far-off Tokio.\n\nThey had no horses and in those days there were no railroads in Japan. The man knew that he must walk the whole distance. It was not the long walk that he minded, however. It was because it would take him many days from home.\n\nStill he must obey his Emperor, so he made ready to start. His wife was very sorry that he must go, and yet a little proud, too, for no one else in the village had ever taken so long a journey.\n\nShe and the baby walked with him down to the turn in the road. There they stood and watched him through their tears, as he followed the path up through the pines on the mountain side. At last, no larger than a speck, he disappeared behind the hills. Then they went home to await his return.\n\nFor three long weeks they waited. Each day they spoke of him, and counted the days until they should see his dear face again. At last the time came. They walked down to the turn in the road to wait for his coming. Up on the mountain side some one was walking toward them. As he came nearer they could see that it was the one for whom they waited.\n\nThe good wife could scarcely believe that her husband was indeed safe home again. The baby girl laughed and clapped her hands to see the toys he brought her.\n\nThere was a tiny image of Uzume, the laughter-loving goddess. Next came a little red monkey of cotton, with a blue head. When she pressed the spring he ran to the top of the rod. Oh, how wonderful was the third gift! It was a tombo, or dragon fly. When she first looked at it she saw only a piece of wood shaped like a T. The cross piece was painted with different bright colors. But the queer thing, when her father twirled it between his fingers, would rise in the air, dipping and hovering like a real dragon fly.\n\nLast, of course, there was a ninghio, or doll, with a sweet face, slanting eyes, and such wonderful hair. Her name was O-Hina-San.\n\nHe told of the Feast of the Dead which he had seen in Tokio. He told of the beautiful lanterns, the Lanterns of the Dead; and the pine torches burning before each house. He told of the tiny boats made of barley straw and filled with food that are set floating away on the river, bearing two tiny lanterns to guide them to the Land of the Dead.\n\nAt last her husband handed the wife a small white box. \"Tell me what you see inside,\" he said. She opened it and took out something round and bright.\n\nOn one side were buds and flowers of frosted silver. The other side at first looked as clear and bright as a pool of water. When she moved it a little she saw in it a most beautiful woman.\n\n\"Oh, what a beautiful picture!\" she cried. \"It is of a woman and she seems to be smiling and talking just as I am. She has on a blue dress just like mine, too! How strange!\"\n\nThen her husband laughed and said: \"That is a mirror. It is yourself you see reflected in it. All the women in Tokio have them.\"\n\nThe wife was delighted with her present, and looked at it very often. She liked to see the smiling red lips, the laughing eyes, and beautiful dark hair.\n\nAfter a while she said to herself: \"How foolish this is of me to sit and gaze at myself in this mirror! I am not more beautiful than other women. How much better for me to enjoy others' beauty, and forget my own face. I shall only remember that it must always be happy and smiling or it will make no one else happy. I do not wish any cross or angry look of mine to make any one sad.\"\n\nShe put the mirror carefully away in its box. Only twice in a year she looked at it. Then it was to see if her face was still such as would make others happy.\n\nThe years passed by in their sweet and simple life until the baby had grown to be a big girl. Her ninghio, her tombo, the image of Uzume, even the cotton monkey, were put carefully away for her own children.\n\nThis girl was the very image of her mother. She was just as sweet and loving, just as kind and helpful.\n\nOne day her mother became very ill. Although the girl and her father did all they could for her, she grew worse and worse.\n\nAt last she knew that she must die, so she called her daughter to her and said: \"My child, I know that I must soon leave you, but I wish to leave something with you in my place. Open this box and see what you find in it.\"\n\nThe girl opened the box and looked for the first time in a mirror. \"Oh, mother dear!\" she cried. \"I see you here. Not thin and pale as you are now, but happy and smiling, as you have always been.\"\n\nThen her mother said: \"When I am gone, will you look in this every morning and every night? If anything troubles you, tell me about it. Always try to do right, so that you will see only happiness here.\"\n\nEvery morning when the sun rose and the birds began to twitter and sing, the girl rose and looked in her mirror. There she saw the bright, happy face that she remembered as her mother's.\n\nEvery evening when the shadows fell and the birds were asleep, she looked again. She told it all that had happened during the day. When it had been a happy day the face smiled back at her. When she was sad the face looked sad, too. She was very careful not to do anything unkind, for she knew how sad the face would be then.\n\nSo each day she grew more kind and loving, and more like the mother whose face she saw each day and loved."}, {"id": "the-three-sillies", "title": "The Three Sillies", "byline": "", "src": "English Fairy Tales (Jacobs)", "gid": "7439", "theme": "Folk & fairy tales", "band": "G3+", "words": 1332, "note": "Funny; problem-solution", "text": "Once upon a time there was a farmer and his wife who had one daughter, and she was courted by a gentleman. Every evening he used to come and see her, and stop to supper at the farmhouse, and the daughter used to be sent down into the cellar to draw the beer for supper. So one evening she had gone down to draw the beer, and she happened to look up at the ceiling while she was drawing, and she saw a mallet stuck in one of the beams. It must have been there a long, long time, but somehow or other she had never noticed it before, and she began a-thinking. And she thought it was very dangerous to have that mallet there, for she said to herself: “Suppose him and me was to be married, and we was to have a son, and he was to grow up to be a man, and come down into the cellar to draw the beer, like as I'm doing now, and the mallet was to fall on his head and kill him, what a dreadful thing it would be!” And she put down the candle and the jug, and sat herself down and began a-crying.\n\nWell, they began to wonder upstairs how it was that she was so long drawing the beer, and her mother went down to see after her, and she found her sitting on the settle crying, and the beer running over the floor. “Why, whatever is the matter?” said her mother. “Oh, mother!” says she, “look at that horrid mallet! Suppose we was to be married, and was to have a son, and he was to grow up, and was to come down to the cellar to draw the beer, and the mallet was to fall on his head and kill him, what a dreadful thing it would be!” “Dear, dear! what a dreadful thing it would be!” said the mother, and she sat her down aside of the daughter and started a-crying too. Then after a bit the father began to wonder that they didn't come back, and he went down into the cellar to look after them himself, and there they two sat a-crying, and the beer running all over the floor. “Whatever is the matter?” says he. “Why,” says the mother, “look at that horrid mallet. Just suppose, if our daughter and her sweetheart was to be married, and was to have a son, and he was to grow up, and was to come down into the cellar to draw the beer, and the mallet was to fall on his head and kill him, what a dreadful thing it would be!” “Dear, dear, dear! so it would!” said the father, and he sat himself down aside of the other two, and started a-crying.\n\nNow the gentleman got tired of stopping up in the kitchen by himself, and at last he went down into the cellar too, to see what they were after; and there they three sat a-crying side by side, and the beer running all over the floor. And he ran straight and turned the tap. Then he said: “Whatever are you three doing, sitting there crying, and letting the beer run all over the floor?”\n\n“Oh!” says the father, “look at that horrid mallet! Suppose you and our daughter was to be married, and was to have a son, and he was to grow up, and was to come down into the cellar to draw the beer, and the mallet was to fall on his head and kill him!” And then they all started a-crying worse than before. But the gentleman burst out a-laughing, and reached up and pulled out the mallet, and then he said: “I've travelled many miles, and I never met three such big sillies as you three before; and now I shall start out on my travels again, and when I can find three bigger sillies than you three, then I'll come back and marry your daughter.” So he wished them good-bye, and started off on his travels, and left them all crying because the girl had lost her sweetheart.\n\nWell, he set out, and he travelled a long way, and at last he came to a woman's cottage that had some grass growing on the roof. And the woman was trying to get her cow to go up a ladder to the grass, and the poor thing durst not go. So the gentleman asked the woman what she was doing. “Why, lookye,” she said, “look at all that beautiful grass. I'm going to get the cow on to the roof to eat it. She'll be quite safe, for I shall tie a string round her neck, and pass it down the chimney, and tie it to my wrist as I go about the house, so she can't fall off without my knowing it.” “Oh, you poor silly!” said the gentleman, “you should cut the grass and throw it down to the cow!” But the woman thought it was easier to get the cow up the ladder than to get the grass down, so she pushed her and coaxed her and got her up, and tied a string round her neck, and passed it down the chimney, and fastened it to her own wrist. And the gentleman went on his way, but he hadn't gone far when the cow tumbled off the roof, and hung by the string tied round her neck, and it strangled her. And the weight of the cow tied to her wrist pulled the woman up the chimney, and she stuck fast half-way and was smothered in the soot.\n\nWell, that was one big silly.\n\nAnd the gentleman went on and on, and he went to an inn to stop the night, and they were so full at the inn that they had to put him in a double-bedded room, and another traveller was to sleep in the other bed. The other man was a very pleasant fellow, and they got very friendly together; but in the morning, when they were both getting up, the gentleman was surprised to see the other hang his trousers on the knobs of the chest of drawers and run across the room and try to jump into them, and he tried over and over again, and couldn't manage it; and the gentleman wondered whatever he was doing it for. At last he stopped and wiped his face with his handkerchief. “Oh dear,” he says, “I do think trousers are the most awkwardest kind of clothes that ever were. I can't think who could have invented such things. It takes me the best part of an hour to get into mine every morning, and I get so hot! How do you manage yours?” So the gentleman burst out a-laughing, and showed him how to put them on; and he was very much obliged to him, and said he never should have thought of doing it that way.\n\nSo that was another big silly.\n\nThen the gentleman went on his travels again; and he came to a village, and outside the village there was a pond, and round the pond was a crowd of people. And they had got rakes, and brooms, and pitchforks, reaching into the pond; and the gentleman asked what was the matter. “Why,” they say, “matter enough! Moon's tumbled into the pond, and we can't rake her out anyhow!” So the gentleman burst out a-laughing, and told them to look up into the sky, and that it was only the shadow in the water. But they wouldn't listen to him, and abused him shamefully, and he got away as quick as he could.\n\nSo there was a whole lot of sillies bigger than them three sillies at home. So the gentleman turned back home again and married the farmer's daughter, and if they didn't live happy for ever after, that's nothing to do with you or me."}, {"id": "mr-vinegar", "title": "Mr. Vinegar", "byline": "", "src": "English Fairy Tales (Jacobs)", "gid": "7439", "theme": "Folk & fairy tales", "band": "G2+", "words": 1118, "note": "Bad trades; sequence", "text": "Mr. and Mrs. Vinegar lived in a vinegar bottle. Now, one day, when Mr. Vinegar was from home, Mrs. Vinegar, who was a very good housewife, was busily sweeping her house, when an unlucky thump of the broom brought the whole house clitter-clatter, clitter-clatter, about her ears. In an agony of grief she rushed forth to meet her husband.\n\nOn seeing him she exclaimed, “Oh, Mr. Vinegar, Mr. Vinegar, we are ruined, I have knocked the house down, and it is all to pieces!” Mr. Vinegar then said: “My dear, let us see what can be done. Here is the door; I will take it on my back, and we will go forth to seek our fortune.”\n\nThey walked all that day, and at nightfall entered a thick forest. They were both very, very tired, and Mr. Vinegar said: “My love, I will climb up into a tree, drag up the door, and you shall follow.” He accordingly did so, and they both stretched their weary limbs on the door, and fell fast asleep.\n\nIn the middle of the night Mr. Vinegar was disturbed by the sound of voices underneath, and to his horror and dismay found that it was a band of thieves met to divide their booty.\n\n“Here, Jack,” said one, “here's five pounds for you; here, Bill, here's ten pounds for you; here, Bob, here's three pounds for you.”\n\nMr. Vinegar could listen no longer; his terror was so great that he trembled and trembled, and shook down the door on their heads. Away scampered the thieves, but Mr. Vinegar dared not quit his retreat till broad daylight.\n\nHe then scrambled out of the tree, and went to lift up the door. What did he see but a number of golden guineas. “Come down, Mrs. Vinegar,” he cried; “come down, I say; our fortune's made, our fortune's made! Come down, I say.”\n\nMrs. Vinegar got down as fast as she could, and when she saw the money she jumped for joy. “Now, my dear,” said she, “I'll tell you what you shall do. There is a fair at the neighbouring town; you shall take these forty guineas and buy a cow. I can make butter and cheese, which you shall sell at market, and we shall then be able to live very comfortably.”\n\nMr. Vinegar joyfully agrees, takes the money, and off he goes to the fair. When he arrived, he walked up and down, and at length saw a beautiful red cow. It was an excellent milker, and perfect in every way. “Oh,” thought Mr. Vinegar, “if I had but that cow, I should be the happiest, man alive.”\n\nSo he offers the forty guineas for the cow, and the owner said that, as he was a friend, he'd oblige him. So the bargain was made, and he got the cow and he drove it backwards and forwards to show it.\n\nBy-and-by he saw a man playing the bagpipes—Tweedle-dum tweedle-dee. The children followed him about, and he appeared to be pocketing money on all sides. “Well,” thought Mr. Vinegar, “if I had but that beautiful instrument I should be the happiest man alive—my fortune would be made.”\n\nSo he went up to the man. “Friend,” says he, “what a beautiful instrument that is, and what a deal of money you must make.” “Why, yes,” said the man, “I make a great deal of money, to be sure, and it is a wonderful instrument.” “Oh!” cried Mr. Vinegar, “how I should like to possess it!” “Well,” said the man, “as you are a friend, I don't much mind parting with it; you shall have it for that red cow.” “Done!” said the delighted Mr. Vinegar. So the beautiful red cow was given for the bagpipes.\n\nHe walked up and down with his purchase; but it was in vain he tried to play a tune, and instead of pocketing pence, the boys followed him hooting, laughing, and pelting.\n\nPoor Mr. Vinegar, his fingers grew very cold, and, just as he was leaving the town, he met a man with a fine thick pair of gloves. “Oh, my fingers are so very cold,” said Mr. Vinegar to himself. “Now if I had but those beautiful gloves I should be the happiest man alive.” He went up to the man, and said to him, “Friend, you seem to have a capital pair of gloves there.” “Yes, truly,” cried the man; “and my hands are as warm as possible this cold November day.” “Well,” said Mr. Vinegar, “I should like to have them.”. “What will you give?” said the man; “as you are a friend, I don't much mind letting you have them for those bagpipes.” “Done!” cried Mr. Vinegar. He put on the gloves, and felt perfectly happy as he trudged homewards.\n\nAt last he grew very tired, when he saw a man coming towards him with a good stout stick in his hand.\n\n“Oh,” said Mr. Vinegar, “that I had but that stick! I should then be the happiest man alive.” He said to the man: “Friend! what a rare good stick you have got.” “Yes,” said the man; “I have used it for many a long mile, and a good friend it has been; but if you have a fancy for it, as you are a friend, I don't mind giving it to you for that pair of gloves.” Mr. Vinegar's hands were so warm, and his legs so tired, that he gladly made the exchange.\n\nAs he drew near to the wood where he had left his wife, he heard a parrot on a tree calling out his name: “Mr. Vinegar, you foolish man, you blockhead, you simpleton; you went to the fair, and laid out all your money in buying a cow. Not content with that, you changed it for bagpipes, on which you could not play, and which were not worth one-tenth of the money. You fool, you—you had no sooner got the bagpipes than you changed them for the gloves, which were not worth one-quarter of the money; and when you had got the gloves, you changed them for a poor miserable stick; and now for your forty guineas, cow, bagpipes, and gloves, you have nothing to show but that poor miserable stick, which you might have cut in any hedge.” On this the bird laughed and laughed, and Mr. Vinegar, falling into a violent rage, threw the stick at its head. The stick lodged in the tree, and he returned to his wife without money, cow, bagpipes, gloves, or stick, and she instantly gave him such a sound cudgelling that she almost broke every bone in his skin."}, {"id": "lazy-jack", "title": "Lazy Jack", "byline": "", "src": "English Fairy Tales (Jacobs)", "gid": "7439", "theme": "Folk & fairy tales", "band": "G2+", "words": 701, "note": "Literal-minded humour; cause-effect", "text": "Once upon a time there was a boy whose name was Jack, and he lived with his mother on a common. They were very poor, and the old woman got her living by spinning, but Jack was so lazy that he would do nothing but bask in the sun in the hot weather, and sit by the corner of the hearth in the winter-time. So they called him Lazy Jack. His mother could not get him to do anything for her, and at last told him, one Monday, that if he did not begin to work for his porridge she would turn him out to get his living as he could.\n\nThis roused Jack, and he went out and hired himself for the next day to a neighbouring farmer for a penny; but as he was coming home, never having had any money before, he lost it in passing over a brook. “You stupid boy,” said his mother, “you should have put it in your pocket.” “I'll do so another time,” replied Jack.\n\nOn Wednesday, Jack went out again and hired himself to a cow-keeper, who gave him a jar of milk for his day's work. Jack took the jar and put it into the large pocket of his jacket, spilling it all, long before he got home. “Dear me!” said the old woman; “you should have carried it on your head.” “I'll do so another time,” said Jack.\n\nSo on Thursday, Jack hired himself again to a farmer, who agreed to give him a cream cheese for his services. In the evening Jack took the cheese, and went home with it on his head. By the time he got home the cheese was all spoilt, part of it being lost, and part matted with his hair. “You stupid lout,” said his mother, “you should have carried it very carefully in your hands.” “I'll do so another time,” replied Jack.\n\nOn Friday, Lazy Jack again went out, and hired himself to a baker, who would give him nothing for his work but a large tom-cat. Jack took the cat, and began carrying it very carefully in his hands, but in a short time pussy scratched him so much that he was compelled to let it go. When he got home, his mother said to him, “You silly fellow, you should have tied it with a string, and dragged it along after you.” “I'll do so another time,” said Jack.\n\nSo on Saturday, Jack hired himself to a butcher, who rewarded him by the handsome present of a shoulder of mutton. Jack took the mutton, tied it to a string, and trailed it along after him in the dirt, so that by the time he had got home the meat was completely spoilt. His mother was this time quite out of patience with him, for the next day was Sunday, and she was obliged to make do with cabbage for her dinner. “You ninney-hammer,” said she to her son; “you should have carried it on your shoulder.” “I'll do so another time,” replied Jack.\n\nOn the next Monday, Lazy Jack went once more, and hired himself to a cattle-keeper, who gave him a donkey for his trouble. Jack found it hard to hoist the donkey on his shoulders, but at last he did it, and began walking slowly home with his prize. Now it happened that in the course of his journey there lived a rich man with his only daughter, a beautiful girl, but deaf and dumb. Now she had never laughed in her life, and the doctors said she would never speak till somebody made her laugh. This young lady happened to be looking out of the window when Jack was passing with the donkey on his shoulders, with the legs sticking up in the air, and the sight was so comical and strange that she burst out into a great fit of laughter, and immediately recovered her speech and hearing. Her father was overjoyed, and fulfilled his promise by marrying her to Lazy Jack, who was thus made a rich gentleman. They lived in a large house, and Jack's mother lived with them in great happiness until she died."}, {"id": "johnny-cake", "title": "Johnny-cake", "byline": "", "src": "English Fairy Tales (Jacobs)", "gid": "7439", "theme": "Folk & fairy tales", "band": "G2+", "words": 829, "note": "Cumulative tale; great for fluency", "text": "Once upon a time there was an old man, and an old woman, and a little boy. One morning the old woman made a Johnny-cake, and put it in the oven to bake. “You watch the Johnny-cake while your father and I go out to work in the garden.” So the old man and the old woman went out and began to hoe potatoes, and left the little boy to tend the oven. But he didn't watch it all the time, and all of a sudden he heard a noise, and he looked up and the oven door popped open, and out of the oven jumped Johnny-cake, and went rolling along end over end, towards the open door of the house. The little boy ran to shut the door, but Johnny-cake was too quick for him and rolled through the door, down the steps, and out into the road long before the little boy could catch him. The little boy ran after him as fast as he could clip it, crying out to his father and mother, who heard the uproar, and threw down their hoes and gave chase too. But Johnny-cake outran all three a long way, and was soon out of sight, while they had to sit down, all out of breath, on a bank to rest.\n\nOn went Johnny-cake, and by-and-by he came to two well-diggers who looked up from their work and called out: “Where ye going, Johnny-cake?”\n\nHe said: “I've outrun an old man, and an old woman, and a little boy, and I can outrun you too-o-o!”\n\n“Ye can, can ye? we'll see about that?” said they; and they threw down their picks and ran after him, but couldn't catch up with him, and soon they had to sit down by the roadside to rest.\n\nOn ran Johnny-cake, and by-and-by he came to two ditch-diggers who were digging a ditch. “Where ye going, Johnny-cake?” said they. He said: “I've outrun an old man, and an old woman, and a little boy, and two well-diggers, and I can outrun you too-o-o!”\n\n“Ye can, can ye? we'll see about that!” said they; and they threw down their spades, and ran after him too. But Johnny-cake soon outstripped them also, and seeing they could never catch him, they gave up the chase and sat down to rest.\n\nOn went Johnny-cake, and by-and-by he came to a bear. The bear said: “Where are ye going, Johnny-cake?”\n\nHe said: “I've outrun an old man, and an old woman and a little boy, and two well-diggers, and two ditch-diggers, and I can outrun you too-o-o!”\n\n“Ye can, can ye?” growled the bear, “we'll see about that!” and trotted as fast as his legs could carry him after Johnny-cake, who never stopped to look behind him. Before long the bear was left so far behind that he saw he might as well give up the hunt first as last, so he stretched himself out by the roadside to rest.\n\nOn went Johnny-cake, and by-and-by he came to a wolf. The wolf said:—“Where ye going, Johnny-cake?” He said: “I've outrun an old man, and an old woman, and a little boy, and two well-diggers, and two ditch-diggers and a bear, and I can outrun you too-o-o!”\n\n“Ye can, can ye?” snarled the wolf, “we'll see about that!” And he set into a gallop after Johnny-cake, who went on and on so fast that the wolf too saw there was no hope of overtaking him, and he too lay down to rest.\n\nOn went Johnny-cake, and by-and-by he came to a fox that lay quietly in a corner of the fence. The fox called out in a sharp voice, but without getting up: “Where ye going Johnny-cake?”\n\nHe said: “I've outrun an old man, and an old woman, and a little boy, and two well-diggers, and two ditch-diggers, a bear, and a wolf, and I can outrun you too-o-o!”\n\nThe fox said: “I can't quite hear you, Johnny-cake, won't you come a little closer?” turning his head a little to one side.\n\nJohnny-cake stopped his race for the first time, and went a little closer, and called out in a very loud voice “I've outrun an old man, and an old woman, and a little boy, and two well-diggers, and two ditch-diggers, and a bear, and a wolf, and I can outrun you too-o-o.”\n\n“Can't quite hear you; won't you come a little closer?” said the fox in a feeble voice, as he stretched out his neck towards Johnny-cake, and put one paw behind his ear.\n\nJohnny-cake came up close, and leaning towards the fox screamed out: I'VE OUTRUN AN OLD MAN, AND AN OLD WOMAN, AND A LITTLE BOY, AND TWO WELL-DIGGERS, AND TWO DITCH-DIGGERS, AND A BEAR, AND A WOLF, AND I CAN OUTRUN YOU TOO-O-O!”\n\n“You can, can you?” yelped the fox, and he snapped up the Johnny-cake in his sharp teeth in the twinkling of an eye."}, {"id": "molly-whuppie", "title": "Molly Whuppie", "byline": "", "src": "English Fairy Tales (Jacobs)", "gid": "7439", "theme": "Folk & fairy tales", "band": "G3+", "words": 1389, "note": "Clever girl outwits giant", "text": "Once upon a time there was a man and a wife had too many children, and they could not get meat for them, so they took the three youngest and left them in a wood. They travelled and travelled and could see never a house. It began to be dark, and they were hungry. At last they saw a light and made for it; it turned out to be a house. They knocked at the door, and a woman came to it, who said: “What do you want?” They said: “Please let us in and give us something to eat.” The woman said: “I can't do that, as my man is a giant, and he would kill you if he comes home.” They begged hard. “Let us stop for a little while,” said they, “and we will go away before he comes.” So she took them in, and set them down before the fire, and gave them milk and bread; but just as they had begun to eat a great knock came to the door, and a dreadful voice said:\n\n  “Fee, fie, fo, fum,\n  I smell the blood of some earthly one.\n\nWho have you there wife?” “Eh,” said the wife, “it's three poor lassies cold and hungry, and they will go away. Ye won't touch 'em, man.” He said nothing, but ate up a big supper, and ordered them to stay all night. Now he had three lassies of his own, and they were to sleep in the same bed with the three strangers.\n\nThe youngest of the three strange lassies was called Molly Whuppie, and she was very clever. She noticed that before they went to bed the giant put straw ropes round her neck and her sisters', and round his own lassies' necks he put gold chains. So Molly took care and did not fall asleep, but waited till she was sure every one was sleeping sound. Then she slipped out of the bed, and took the straw ropes off her own and her sisters' necks, and took the gold chains off the giant's lassies. She then put the straw ropes on the giant's lassies and the gold on herself and her sisters, and lay down.\n\nAnd in the middle of the night up rose the giant, armed with a great club, and felt for the necks with the straw. It was dark. He took his own lassies out of bed on to the floor, and battered them until they were dead, and then lay down again, thinking he had managed fine. Molly thought it time she and her sisters were out of that, so she wakened them and told them to be quiet, and they slipped out of the house. They all got out safe, and they ran and ran, and never stopped until morning, when they saw a grand house before them. It turned out to be a king's house: so Molly went in, and told her story to the king. He said: “Well, Molly, you are a clever girl, and you have managed well; but, if you would manage better, and go back, and steal the giant's sword that hangs on the back of his bed, I would give your eldest sister my eldest son to marry.” Molly said she would try.\n\nSo she went back, and managed to slip into the giant's house, and crept in below the bed. The giant came home, and ate up a great supper, and went to bed. Molly waited until he was snoring, and she crept out, and reached over the giant and got down the sword; but just as she got it out over the bed it gave a rattle, and up jumped the giant, and Molly ran out at the door and the sword with her; and she ran, and he ran, till they came to the “Bridge of one hair”; and she got over, but he couldn't, and he says, “Woe worth ye, Molly Whuppie! never ye come again.” And she says “Twice yet, carle,” quoth she, “I'll come to Spain.” So Molly took the sword to the king, and her sister was married to his son.\n\nWell, the king he says: “Ye've managed well, Molly; but if ye would manage better, and steal the purse that lies below the giant's pillow, I would marry your second sister to my second son.” And Molly said she would try. So she set out for the giant's house, and slipped in, and hid again below the bed, and waited till the giant had eaten his supper, and was snoring sound asleep. She slipped out, and slipped her hand below the pillow, and got out the purse; but just as she was going out the giant wakened, and ran after her; and she ran, and he ran, till they came to the “Bridge of one hair,” and she got over, but he couldn't, and he said, “Woe worth ye, Molly Whuppie! never you come again.” “Once yet, carle,” quoth she, “I'll come to Spain.” So Molly took the purse to the king, and her second sister was married to the king's second son.\n\nAfter that the king says to Molly: “Molly, you are a clever girl, but if you would do better yet, and steal the giant's ring that he wears on his finger, I will give you my youngest son for yourself.” Molly said she would try. So back she goes to the giant's house, and hides herself below the bed. The giant wasn't long ere he came home, and, after he had eaten a great big supper, he went to his bed, and shortly was snoring loud. Molly crept out and reached over the bed, and got hold of the giant's hand, and she pulled and she pulled until she got off the ring; but just as she got it off the giant got up, and gripped her by the hand, and he says: “Now I have catcht you, Molly Whuppie, and, if I had done as much ill to you as ye have done to me, what would ye do to me?”\n\nMolly says: “I would put you into a sack, and I'd put the cat inside with you, and the dog aside you, and a needle and thread and a shears, and I'd hang you up upon the wall, and I'd go to the wood, and choose the thickest stick I could get, and I would come home, and take you down, and bang you till you were dead.”\n\n“Well, Molly,” says the giant, “I'll just do that to you.”\n\nSo he gets a sack, and puts Molly into it, and the cat and the dog beside her, and a needle and thread and shears, and hangs her up upon the wall, and goes to the wood to choose a stick.\n\nMolly she sings out: “Oh, if ye saw what I see.”\n\n“Oh,” says the giant's wife, “what do ye see, Molly?”\n\nBut Molly never said a word but, “Oh, if ye saw what I see!”\n\nThe giant's wife begged that Molly would take her up into the sack till she would see what Molly saw. So Molly took the shears and cut a hole in the sack, and took out the needle and thread with her, and jumped down and helped, the giant's wife up into the sack, and sewed up the hole.\n\nThe giant's wife saw nothing, and began to ask to get down again; but Molly never minded, but hid herself at the back of the door. Home came the giant, and a great big tree in his hand, and he took down the sack, and began to batter it. His wife cried, “It's me, man;” but the dog barked and the cat mewed, and he did not know his wife's voice. But Molly came out from the back of the door, and the giant saw her, and he after her; and he ran and she ran, till they came to the “Bridge of one hair,” and she got over but he couldn't; and he said, “Woe worth you, Molly Whuppie! never you come again.” “Never more, carle,” quoth she, “will I come again to Spain.”\n\nSo Molly took the ring to the king, and she was married to his youngest son, and she never saw the giant again."}, {"id": "jack-and-the-beanstalk", "title": "Jack and the Beanstalk", "byline": "", "src": "English Fairy Tales (Jacobs)", "gid": "7439", "theme": "Folk & fairy tales", "band": "G3+", "words": 2432, "note": "Classic; compare with Curry's longer version", "text": "There was once upon a time a poor widow who had an only son named Jack, and a cow named Milky-white. And all they had to live on was the milk the cow gave every morning which they carried to the market and sold. But one morning Milky-white gave no milk and they didn't know what to do.\n\n“What shall we do, what shall we do?” said the widow, wringing her hands.\n\n“Cheer up, mother, I'll go and get work somewhere,” said Jack.\n\n“We've tried that before, and nobody would take you,” said his mother; “we must sell Milky-white and with the money do something, start shop, or something.”\n\n“All right, mother,” says Jack; “it's market-day today, and I'll soon sell Milky-white, and then we'll see what we can do.”\n\nSo he took the cow's halter in his hand, and off he starts. He hadn't gone far when he met a funny-looking old man who said to him: “Good morning, Jack.”\n\n“Good morning to you,” said Jack, and wondered how he knew his name.\n\n“Well, Jack, and where are you off to?” said the man.\n\n“I'm going to market to sell our cow here.”\n\n“Oh, you look the proper sort of chap to sell cows,” said the man; “I wonder if you know how many beans make five.”\n\n“Two in each hand and one in your mouth,” says Jack, as sharp as a needle.\n\n“Right you are,” said the man, “and here they are the very beans themselves,” he went on pulling out of his pocket a number of strange-looking beans. “As you are so sharp,” says he, “I don't mind doing a swop with you—your cow for these beans.”\n\n“Walker!” says Jack; “wouldn't you like it?”\n\n“Ah! you don't know what these beans are,” said the man; “if you plant them over-night, by morning they grow right up to the sky.”\n\n“Really?” says Jack; “you don't say so.”\n\n“Yes, that is so, and if it doesn't turn out to be true you can have your cow back.”\n\n“Right,” says Jack, and hands him over Milky-white's halter and pockets the beans.\n\nBack goes Jack home, and as he hadn't gone very far it wasn't dusk by the time he got to his door.\n\n“What back, Jack?” said his mother; “I see you haven't got Milky-white, so you've sold her. How much did you get for her?”\n\n“You'll never guess, mother,” says Jack.\n\n“No, you don't say so. Good boy! Five pounds, ten, fifteen, no, it can't be twenty.”\n\n“I told you you couldn't guess, what do you say to these beans
