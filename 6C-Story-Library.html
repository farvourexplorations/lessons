hing just a little bit near to being worthy of the honor of being owned by Jim.\n\nThere was a pier-glass between the windows of the room. Perhaps you have seen a pier-glass in an $8.00 flat. A very thin and very agile person may, by observing his reflection in a rapid sequence of longitudinal strips, obtain a fairly accurate conception of his looks. Della, being slender, had mastered the art.\n\nSuddenly she whirled from the window and stood before the glass. Her eyes were shining brilliantly, but her face had lost its color within twenty seconds. Rapidly she pulled down her hair and let it fall to its full length.\n\nNow, there were two possessions of the James Dillingham Youngs in which they both took a mighty pride. One was Jim's gold watch that had been his father's and his grandfather's. The other was Della's hair. Had the Queen of Sheba lived in the flat across the airshaft, Della would have let her hair hang out the window some day to dry just to depreciate Her Majesty's jewels and gifts. Had King Solomon been the janitor, with all his treasures piled up in the basement, Jim would have pulled out his watch every time he passed, just to see him pluck at his beard from envy.\n\nSo now Della's beautiful hair fell about her, rippling and shining like a cascade of brown waters. It reached below her knee and made itself almost a garment for her. And then she did it up again nervously and quickly. Once she faltered for a minute and stood still while a tear or two splashed on the worn red carpet.\n\nOn went her old brown jacket; on went her old brown hat. With a whirl of skirts and with the brilliant sparkle still in her eyes, she fluttered out the door and down the stairs to the street.\n\nWhere she stopped the sign read: \"Mme. Sofronie. Hair Goods of All Kinds.\" One flight up Della ran, and collected herself, panting. Madame, large, too white, chilly, hardly looked the \"Sofronie.\"\n\n\"Will you buy my hair?\" asked Della.\n\n\"I buy hair,\" said Madame. \"Take yer hat off and let's have a sight at the looks of it.\"\n\nDown rippled the brown cascade.\n\n\"Twenty dollars,\" said Madame, lifting the mass with a practised hand.\n\n\"Give it to me quick,\" said Della.\n\nOh, and the next two hours tripped by on rosy wings. Forget the hashed metaphor. She was ransacking the stores for Jim's present.\n\nShe found it at last. It surely had been made for Jim and no one else. There was no other like it in any of the stores, and she had turned all of them inside out. It was a platinum fob chain simple and chaste in design, properly proclaiming its value by substance alone and not by meretricious ornamentation—as all good things should do. It was even worthy of The Watch. As soon as she saw it she knew that it must be Jim's. It was like him. Quietness and value—the description applied to both. Twenty-one dollars they took from her for it, and she hurried home with the 87 cents. With that chain on his watch Jim might be properly anxious about the time in any company. Grand as the watch was, he sometimes looked at it on the sly on account of the old leather strap that he used in place of a chain.\n\nWhen Della reached home her intoxication gave way a little to prudence and reason. She got out her curling irons and lighted the gas and went to work repairing the ravages made by generosity added to love. Which is always a tremendous task, dear friends—a mammoth task.\n\nWithin forty minutes her head was covered with tiny, close-lying curls that made her look wonderfully like a truant schoolboy. She looked at her reflection in the mirror long, carefully, and critically.\n\n\"If Jim doesn't kill me,\" she said to herself, \"before he takes a second look at me, he'll say I look like a Coney Island chorus girl. But what could I do—oh! what could I do with a dollar and eighty-seven cents?\"\n\nAt 7 o'clock the coffee was made and the frying pan was on the back of the stove hot and ready to cook the chops.\n\nJim was never late. Della doubled the fob chain in her hand and sat on the corner of the table near the door that he always entered. Then she heard his step on the stair away down on the first flight, and she turned white for just a moment. She had a habit of saying little silent prayers about the simplest everyday things, and now she whispered; \"Please God, make him think I am still pretty.\"\n\nThe door opened and Jim stepped in and closed it. He looked thin and very serious. Poor fellow, he was only twenty-two—and to be burdened with a family! He needed a new overcoat and he was without gloves.\n\nJim stopped inside the door, as immovable as a setter at the scent of quail. His eyes were fixed upon Della, and there was an expression in them that she could not read, and it terrified her. It was not anger, nor surprise, nor disapproval, nor horror, nor any of the sentiments that she had been prepared for. He simply stared at her fixedly with that peculiar expression on his face.\n\nDella wriggled off the table and went for him.\n\n\"Jim, darling,\" she cried, \"don't look at me that way. I had my hair cut off and sold it because I couldn't have lived through Christmas without giving you a present. It'll grow out again— you won't mind, will you? I just had to do it. My hair grows awfully fast. Say 'Merry Christmas!' Jim, and let's be happy. You don't know what a nice—what a beautiful, nice gift I've got for you.\"\n\n\"You've cut off your hair?\" asked Jim, laboriously, as if he had not arrived at that patent fact yet even after the hardest mental labor.\n\n\"Cut it off and sold it,\" said Della. \"Don't you like me just as well, anyhow? I'm me without my hair, ain't I?\"\n\nJim looked about the room curiously.\n\n\"You say your hair is gone?\" he said, with an air almost of idiocy.\n\n\"You needn't look for it,\" said Della. \"It's sold, I tell you—sold and gone, too. It's Christmas Eve, boy. Be good to me, for it went for you. Maybe the hairs of my head were numbered,\" she went on with a sudden serious sweetness, \"but nobody could ever count my love for you. Shall I put the chops on, Jim?\"\n\nOut of his trance Jim seemed quickly to wake. He enfolded his Della. For ten seconds let us regard with discreet scrutiny some inconsequential object in the other direction. Eight dollars a week or a million a year—what is the difference? A mathematician or a wit would give you the wrong answer. The magi brought valuable gifts, but that was not among them. This dark assertion will be illuminated later on.\n\nJim drew a package from his overcoat pocket and threw it upon the table.\n\n\"Don't make any mistake, Dell,\" he said, \"about me. I don't think there's anything in the way of a haircut or a shave or a shampoo that could make me like my girl any less. But if you'll unwrap that package you may see why you had me going a while at first.\"\n\nWhite fingers and nimble tore at the string and paper. And then an ecstatic scream of joy; and then, alas! a quick feminine change to hysterical tears and wails, necessitating the immediate employment of all the comforting powers of the lord of the flat.\n\nFor-there lay The Combs—the set of combs, side and back, that Della had worshipped for long in a Broadway window. Beautiful combs, pure tortoise shell, with jewelled rims—just the shade to wear in the beautiful vanished hair. They were expensive combs, she knew, and her heart had simply craved and yearned over them without the least hope of possession. And now, they were hers, but the tresses that should have adorned the coveted adornments were gone.\n\nBut she hugged them to her bosom, and at length she was able to look up with dim eyes and a smile and say: \"My hair grows so fast, Jim!\"\n\nAnd then Della leaped up like a little singed cat and cried, \"Oh, oh!\"\n\nJim had not yet seen his beautiful present. She held it out to him eagerly upon her open palm. The dull precious metal seemed to flash with a reflection of her bright and ardent spirit.\n\n\"Isn't it a dandy, Jim? I hunted all over town to find it. You'll have to look at the time a hundred times a day now. Give me your watch. I want to see how it looks on it.\"\n\nInstead of obeying, Jim tumbled down on the couch and put his hands under the back of his head and smiled.\n\n\"Dell,\" said he, \"let's put our Christmas presents away and keep 'em a while. They're too nice to use just at present. I sold the watch to get the money to buy your combs. And now suppose you put the chops on.\"\n\nThe magi, as you know, were wise men—wonderfully wise men—who brought gifts to the Babe in the manger. They invented the art of giving Christmas presents. Being wise, their gifts were no doubt wise ones, possibly bearing the privilege of exchange in case of duplication. And here I have lamely related to you the uneventful chronicle of two foolish children in a flat who most unwisely sacrificed for each other the greatest treasures of their house. But in a last word to the wise of these days let it be said that of all who give gifts these two were the wisest. Of all who give and receive gifts, such as they are wisest. Everywhere they are wisest. They are the magi."}]</script>
<script>
const S = JSON.parse(document.getElementById('data').textContent);
const THEMES = ['Jataka tales','Fables','Asian tales','Folk & fairy tales','Andersen & Wilde','Myths','Spooky & eerie','Poems (read aloud)','Animals & real life'];
const BANDS = {'G1+':'Group 1 can read it with support; Groups 2–5 alone','G2+':'Group 2 and up can read it alone','G3+':'Group 3 and up can read it alone','G4+':'Groups 4–5 alone, Group 3 with support','G5':'Group 5 alone; read aloud to others','Read aloud':'Teacher reads it aloud','Teacher':'Preview first; teacher reads or retells'};
const $ = id => document.getElementById(id);
const store = { get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }, set(k,v){ try { localStorage.setItem(k,v); } catch(e){} } };
THEMES.forEach(t => { const o = document.createElement('option'); o.value = t; o.textContent = t; $('theme').appendChild(o); });
let current = null;
let fs = +(store.get('fs') || 20), pfs = +(store.get('pfs') || 40);
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function renderList() {
  const q = $('q').value.trim().toLowerCase(), b = $('band').value, th = $('theme').value;
  const hits = S.filter(s => (!b || s.band === b) && (!th || s.theme === th) && (!q || (s.title + ' ' + s.note + ' ' + s.theme + ' ' + s.src).toLowerCase().includes(q)));
  $('count').textContent = hits.length + (hits.length === 1 ? ' story' : ' stories');
  const list = $('list'); list.innerHTML = '';
  THEMES.forEach(t => {
    const g = hits.filter(s => s.theme === t); if (!g.length) return;
    const h = document.createElement('div'); h.className = 'group'; h.textContent = t; list.appendChild(h);
    g.forEach(s => {
      const btn = document.createElement('button'); btn.className = 'item'; btn.dataset.id = s.id;
      if (current && current.id === s.id) btn.setAttribute('aria-current', 'true');
      btn.innerHTML = `<span class="t">${esc(s.title)}</span><span class="band ${s.band === 'G1+' ? 'g1' : ''}">${esc(s.band)}</span><span class="m">${s.words.toLocaleString('en')} words · ${esc(s.src)}</span>`;
      btn.addEventListener('click', () => { location.hash = s.id; });
      list.appendChild(btn);
    });
  });
}

function show(id) {
  const s = S.find(x => x.id === id) || S.find(x => x.id === 'the-turtle-who-couldn-t-stop-talking') || S[0];
  current = s;
  const paras = s.text.split(/\n\n+/).map(p => `<p>${esc(p.trim())}</p>`).join('');
  $('reader').innerHTML = `
    <div class="meta"><span>${esc(s.theme)}</span><span>${s.words.toLocaleString('en')} words</span><span>Reads alone: <b>${esc(s.band)}</b></span></div>
    <h2>${esc(s.title)}</h2>${s.byline ? `<p class="by">${esc(s.byline)}</p>` : '<p class="by"></p>'}
    <div class="note"><b>${esc(s.band)}</b> · ${esc(BANDS[s.band] || '')}. ${esc(s.note)}.</div>
    <div class="txt">${paras}</div>
    <p class="src">Source: ${esc(s.src)}${s.gid ? ' · Project Gutenberg #' + s.gid + ' · public domain' : ''}</p>
    <p class="print">To print just this story, press Ctrl+P (Cmd+P on a Mac). There is also a ready-made PDF in the 6C Story PDFs pack (folder: ${esc(s.theme)}, file: ${esc(s.id)}.pdf).</p>`;
  document.querySelectorAll('.item[aria-current]').forEach(el => { if (el.dataset.id !== s.id) el.removeAttribute('aria-current'); else el.setAttribute('aria-current','true'); });
  $('main').scrollTop = 0;
}

function applySize() {
  document.documentElement.style.setProperty('--fs', fs + 'px');
  document.documentElement.style.setProperty('--pfs', pfs + 'px');
}
$('bigger').onclick = () => { if (document.body.classList.contains('proj')) { pfs = Math.min(80, pfs + 4); store.set('pfs', pfs); } else { fs = Math.min(32, fs + 2); store.set('fs', fs); } applySize(); };
$('smaller').onclick = () => { if (document.body.classList.contains('proj')) { pfs = Math.max(24, pfs - 4); store.set('pfs', pfs); } else { fs = Math.max(14, fs - 2); store.set('fs', fs); } applySize(); };
$('proj').onclick = () => {
  const on = document.body.classList.toggle('proj');
  $('proj').classList.toggle('on', on);
  $('proj').textContent = on ? 'Exit projector' : 'Projector';
  if (on && document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {});
  if (!on && document.fullscreenElement) document.exitFullscreen().catch(() => {});
};
$('back').onclick = () => { document.body.classList.remove('reading'); };
['q','band','theme'].forEach(id => $(id).addEventListener('input', renderList));
function route() { const id = location.hash.slice(1); show(id); if (id) document.body.classList.add('reading'); }
window.addEventListener('hashchange', route);
applySize(); renderList(); route();
</script>

</body>
</html>
