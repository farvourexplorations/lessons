; they're magical, plant them over-night and——”\n\n“What!” says Jack's mother, “have you been such a fool, such a dolt, such an idiot, as to give away my Milky-white, the best milker in the parish, and prime beef to boot, for a set of paltry beans. Take that! Take that! Take that! And as for your precious beans here they go out of the window. And now off with you to bed. Not a sup shall you drink, and not a bit shall you swallow this very night.”\n\nSo Jack went upstairs to his little room in the attic, and sad and sorry he was, to be sure, as much for his mother's sake, as for the loss of his supper.\n\nAt last he dropped off to sleep.\n\nWhen he woke up, the room looked so funny. The sun was shining into part of it, and yet all the rest was quite dark and shady. So Jack jumped up and dressed himself and went to the window. And what do you think he saw? why, the beans his mother had thrown out of the window into the garden, had sprung up into a big beanstalk which went up and up and up till it reached the sky. So the man spoke truth after all.\n\nThe beanstalk grew up quite close past Jack's window, so all he had to do was to open it and give a jump on to the beanstalk which was made like a big plaited ladder. So Jack climbed and he climbed and he climbed and he climbed and he climbed and he climbed and he climbed till at last he reached the sky. And when he got there he found a long broad road going as straight as a dart. So he walked along and he walked along and he walked along till he came to a great big tall house, and on the doorstep there was a great big tall woman.\n\n“Good morning, mum,” says Jack, quite polite-like. “Could you be so kind as to give me some breakfast.” For he hadn't had anything to eat, you know, the night before and was as hungry as a hunter.\n\n“It's breakfast you want, is it?” says the great big tall woman, “it's breakfast you'll be if you don't move off from here. My man is an ogre and there's nothing he likes better than boys broiled on toast. You'd better be moving on or he'll soon be coming.”\n\n“Oh! please mum, do give me something to eat, mum. I've had nothing to eat since yesterday morning, really and truly, mum,” says Jack. “I may as well be broiled, as die of hunger.”\n\nWell, the ogre's wife wasn't such a bad sort, after all. So she took Jack into the kitchen, and gave him a junk of bread and cheese and a jug of milk. But Jack hadn't half finished these when thump! thump! thump! the whole house began to tremble with the noise of someone coming.\n\n“Goodness gracious me! It's my old man,” said the ogre's wife, “what on earth shall I do? Here, come quick and jump in here.” And she bundled Jack into the oven just as the ogre came in.\n\nHe was a big one, to be sure. At his belt he had three calves strung up by the heels, and he unhooked them and threw them down on the table and said: “Here, wife, broil me a couple of these for breakfast. Ah what's this I smell?\n\n  Fee-fi-fo-fum,\n  I smell the blood of an Englishman,\n  Be he alive, or be he dead\n  I'll have his bones to grind my bread.”\n \n\n“Nonsense, dear,” said his wife, “you're dreaming. Or perhaps you smell the scraps of that little boy you liked so much for yesterday's dinner. Here, go you and have a wash and tidy up, and by the time you come back your breakfast'll be ready for you.”\n\nSo the ogre went off, and Jack was just going to jump out of the oven and run off when the woman told him not. “Wait till he's asleep,” says she; “he always has a snooze after breakfast.”\n\nWell, the ogre had his breakfast, and after that he goes to a big chest and takes out of it a couple of bags of gold and sits down counting them till at last his head began to nod and he began to snore till the whole house shook again.\n\nThen Jack crept out on tiptoe from his oven, and as he was passing the ogre he took one of the bags of gold under his arm, and off he pelters till he came to the beanstalk, and then he threw down the bag of gold which of course fell in to his mother's garden, and then he climbed down and climbed down till at last he got home and told his mother and showed her the gold and said: “Well, mother, wasn't I right about the beans. They are really magical, you see.”\n\nSo they lived on the bag of gold for some time, but at last they came to the end of that so Jack made up his mind to try his luck once more up at the top of the beanstalk. So one fine morning he got up early, and got on to the beanstalk, and he climbed and he climbed and he climbed and he climbed and he climbed and he climbed till at last he got on the road again and came to the great big tall house he had been to before. There, sure enough, was the great big tall woman a-standing on the door-step.\n\n“Good morning, mum,” says Jack, as bold as brass, “could you be so good as to give me something to eat?”\n\n“Go away, my boy,” said the big, tall woman, “or else my man will eat you up for breakfast. But aren't you the youngster who came here once before? Do you know, that very day, my man missed one of his bags of gold.”\n\n“That's strange, mum,” says Jack, “I dare say I could tell you something about that but I'm so hungry I can't speak till I've had something to eat.”\n\nWell the big tall woman was that curious that she took him in and gave him something to eat. But he had scarcely begun munching it as slowly as he could when thump! thump! thump! they heard the giant's footstep, and his wife hid Jack away in the oven.\n\nAll happened as it did before. In came the ogre as he did before, said: “Fee-fi-fo-fum,” and had his breakfast off three broiled oxen. Then he said: “Wife, bring me the hen that lays the golden eggs.” So she brought it, and the ogre said: “Lay,” and it laid an egg all of gold. And then the ogre began to nod his head, and to snore till the house shook.\n\nThen Jack crept out of the oven on tiptoe and caught hold of the golden hen, and was off before you could say “Jack Robinson.” But this time the hen gave a cackle which woke the ogre, and just as Jack got out of the house he heard him calling: “Wife, wife, what have you done with my golden hen?”\n\nAnd the wife said: “Why, my dear?”\n\nBut that was all Jack heard, for he rushed off to the beanstalk and climbed down like a house on fire. And when he got home he showed his mother the wonderful hen and said “Lay,” to it; and it laid a golden egg every time he said “Lay.”\n\nWell, Jack was not content, and it wasn't very long before he determined to have another try at his luck up there at the top of the beanstalk. So one fine morning, he got up early, and went on to the beanstalk, and he climbed and he climbed and he climbed and he climbed till he got to the top. But this time he knew better than to go straight to the ogre's house. And when he got near it he waited behind a bush till he saw the ogre's wife come out with a pail to get some water, and then he crept into the house and got into the copper. He hadn't been there long when he heard thump! thump! thump! as before, and in come the ogre and his wife.\n\n“Fee-fi-fo-fum, I smell the blood of an Englishman,” cried out the ogre; “I smell him, wife, I smell him.”\n\n“Do you, my dearie?” says the ogre's wife. “Then if it's that little rogue that stole your gold and the hen that laid the golden eggs he's sure to have got into the oven.” And they both rushed to the oven. But Jack wasn't there, luckily, and the ogre's wife said: “There you are again with your fee-fi-fo-fum. Why of course it's the laddie you caught last night that I've broiled for your breakfast. How forgetful I am, and how careless you are not to tell the difference between a live un and a dead un.”\n\nSo the ogre sat down to the breakfast and ate it, but every now and then he would mutter: “Well, I could have sworn——” and he'd get up and search the larder and the cupboards, and everything, only luckily he didn't think of the copper.\n\nAfter breakfast was over, the ogre called out: “Wife, wife, bring me my golden harp.” So she brought it and put it on the table before him. Then he said: “Sing!” and the golden harp sang most beautifully. And it went on singing till the ogre fell asleep, and commenced to snore like thunder.\n\nThen Jack lifted up the copper-lid very quietly and got down like a mouse and crept on hands and knees till he got to the table when he got up and caught hold of the golden harp and dashed with it towards the door. But the harp called out quite loud: “Master! Master!” and the ogre woke up just in time to see Jack running off with his harp.\n\nJack ran as fast as he could, and the ogre came rushing after, and would soon have caught him only Jack had a start and dodged him a bit and knew where he was going. When he got to the beanstalk the ogre was not more than twenty yards away when suddenly he saw Jack disappear like, and when he got up to the end of the road he saw Jack underneath climbing down for dear life. Well, the ogre didn't like trusting himself to such a ladder, and he stood and waited, so Jack got another start. But just then the harp cried out: “Master! master!” and the ogre swung himself down on to the beanstalk which shook with his weight. Down climbs Jack, and after him climbed the ogre. By this time Jack had climbed down and climbed down and climbed down till he was very nearly home. So he called out: “Mother! mother! bring me an axe, bring me an axe.” And his mother came rushing out with the axe in her hand, but when she came to the beanstalk she stood stock still with fright for there she saw the ogre just coming down below the clouds.\n\nBut Jack jumped down and got hold of the axe and gave a chop at the beanstalk which cut it half in two. The ogre felt the beanstalk shake and quiver so he stopped to see what was the matter. Then Jack gave another chop with the axe, and the beanstalk was cut in two and began to topple over. Then the ogre fell down and broke his crown, and the beanstalk came toppling after.\n\nThen Jack showed his mother his golden harp, and what with showing that and selling the golden eggs, Jack and his mother became very rich, and he married a great princess, and they lived happy ever after."}, {"id": "the-fish-and-the-ring", "title": "The Fish and the Ring", "byline": "", "src": "English Fairy Tales (Jacobs)", "gid": "7439", "theme": "Folk & fairy tales", "band": "G3+", "words": 1190, "note": "Fate; plot twists", "text": "Once upon a time, there was a mighty baron in the North Countrie who was a great magician that knew everything that would come to pass. So one day, when his little boy was four years old, he looked into the Book of Fate to see what would happen to him. And to his dismay, he found that his son would wed a lowly maid that had just been born in a house under the shadow of York Minster. Now the Baron knew the father of the little girl was very, very poor, and he had five children already. So he called for his horse, and rode into York; and passed by the father's house, and saw him sitting by the door, sad and doleful. So he dismounted and went up to him and said: “What is the matter, my good man?” And the man said: “Well, your honour, the fact is, I've five children already, and now a sixth's come, a little lass, and where to get the bread from to fill their mouths, that's more than I can say.”\n\n“Don't be downhearted, my man,” said the Baron. “If that's your trouble, I can help you. I'll take away the last little one, and you wont have to bother about her.”\n\n“Thank you kindly, sir,” said the man; and he went in and brought out the lass and gave her to the Baron, who mounted his horse and rode away with her. And when he got by the bank of the river Ouse, he threw the little, thing into the river, and rode off to his castle.\n\nBut the little lass didn't sink; her clothes kept her up for a time, and she floated, and she floated, till she was cast ashore just in front of a fisherman's hut. There the fisherman found her, and took pity on the poor little thing and took her into his house, and she lived there till she was fifteen years old, and a fine handsome girl.\n\nOne day it happened that the Baron went out hunting with some companions along the banks of the River Ouse, and stopped at the fisherman's hut to get a drink, and the girl came out to give it to them. They all noticed her beauty, and one of them said to the Baron: “You can read fates, Baron, whom will she marry, d'ye think?”\n\n“Oh! that's easy to guess,” said the Baron; “some yokel or other. But I'll cast her horoscope. Come here girl, and tell me on what day you were born?”\n\n“I don't know, sir,” said the girl, “I was picked up just here after having been brought down by the river about fifteen years ago.”\n\nThen the Baron knew who she was, and when they went away, he rode back and said to the girl: “Hark ye, girl, I will make your fortune. Take this letter to my brother in Scarborough, and you will be settled for life.” And the girl took the letter and said she would go. Now this was what he had written in the letter:\n\n“Dear Brother,—Take the bearer and put her to death immediately.\n\n“Yours affectionately,\n\n“Albert.”\n\nSo soon after the girl set out for Scarborough, and slept for the night at a little inn. Now that very night a band of robbers broke into the inn, and searched the girl, who had no money, and only the letter. So they opened this and read it, and thought it a shame. The captain of the robbers took a pen and paper and wrote this letter:\n\n“Dear Brother,—Take the bearer and marry her to my son immediately.\n\n“Yours affectionately,\n\n“Albert.”\n\nAnd then he gave it to the girl, bidding her begone. So she went on to the Baron's brother at Scarborough, a noble knight, with whom the Baron's son was staying. When she gave the letter to his brother, he gave orders for the wedding to be prepared at once, and they were married that very day.\n\nSoon after, the Baron himself came to his brother's castle, and what was his surprise to find that the very thing he had plotted against had come to pass. But he was not to be put off that way; and he took out the girl for a walk, as he said, along the cliffs. And when he got her all alone, he took her by the arms, and was going to throw her over. But she begged hard for her life. “I have not done anything,” she said: “if you will only spare me, I will do whatever you wish. I will never see you or your son again till you desire it.” Then the Baron took off his gold ring and threw it into the sea, saying: “Never let me see your face till you can show me that ring;” and he let her go.\n\nThe poor girl wandered on and on, till at last she came to a great noble's castle, and she asked to have some work given to her; and they made her the scullion girl of the castle, for she had been used to such work in the fisherman's hut.\n\nNow one day, who should she see coming up to the noble's house but the Baron and his brother and his son, her husband. She didn't know what to do; but thought they would not see her in the castle kitchen. So she went back to her work with a sigh, and set to cleaning a huge big fish that was to be boiled for their dinner. And, as she was cleaning it, she saw something shine inside it, and what do you think she found? Why, there was the Baron's ring, the very one he had thrown over the cliff at Scarborough. She was right glad to see it, you may be sure. Then she cooked the fish as nicely as she could, and served it up.\n\nWell, when the fish came on the table, the guests liked it so well that they asked the noble who cooked it. He said he didn't know, but called to his servants: “Ho, there, send up the cook that cooked that fine fish.” So they went down to the kitchen and told the girl she was wanted in the hall. Then she washed and tidied herself and put the Baron's gold ring on her thumb and went up into the hall.\n\nWhen the banqueters saw such a young and beautiful cook they were surprised. But the Baron was in a tower of a temper, and started up as if he would do her some violence. So the girl went up to him with her hand before her with the ring on it; and she put it down before him on the table. Then at last the Baron saw that no one could fight against Fate, and he handed her to a seat and announced to all the company that this was his son's true wife; and he took her and his son home to his castle; and they all lived as happy as could be ever afterwards."}, {"id": "master-of-all-masters", "title": "Master of All Masters", "byline": "", "src": "English Fairy Tales (Jacobs)", "gid": "7439", "theme": "Folk & fairy tales", "band": "G3+", "words": 293, "note": "Silly made-up words; vocabulary fun", "text": "A girl once went to the fair to hire herself for servant. At last a funny-looking old gentleman engaged her, and took her home to his house. When she got there, he told her that he had something to teach her, for that in his house he had his own names for things.\n\nHe said to her: “What will you call me?”\n\n“Master or mister, or whatever you please sir,” says she.\n\nHe said: “You must call me 'master of all masters.' And what would you call this?” pointing to his bed.\n\n“Bed or couch, or whatever you please, sir.”\n\n“No, that's my 'barnacle.' And what do you call these?” said he pointing to his pantaloons.\n\n“Breeches or trousers, or whatever you please, sir.”\n\n“You must call them 'squibs and crackers.' And what would you call her?” pointing to the cat.\n\n“Cat or kit, or whatever you please, sir.”\n\n“You must call her 'white-faced simminy.' And this now,” showing the fire, “what would you call this?”\n\n“Fire or flame, or whatever you please, sir.”\n\n“You must call it 'hot cockalorum,' and what this?” he went on, pointing to the water.\n\n“Water or wet, or whatever you please, sir.”\n\n“No, 'pondalorum' is its name. And what do you call all this?” asked he, as he pointed to the house.\n\n“House or cottage, or whatever you please, sir.”\n\n“You must call it 'high topper mountain.'”\n\nThat very night the servant woke her master up in a fright and said: “Master of all masters, get out of your barnacle and put on your squibs and crackers. For white-faced simminy has got a spark of hot cockalorum on its tail, and unless you get some pondalorum high topper mountain will be all on hot cockalorum.” .... That's all."}, {"id": "the-magpie-s-nest", "title": "The Magpie's Nest", "byline": "", "src": "English Fairy Tales (Jacobs)", "gid": "7439", "theme": "Folk & fairy tales", "band": "G2+", "words": 409, "note": "Why birds build different nests", "text": "Once upon a time when pigs spoke rhyme\n  And monkeys chewed tobacco,\n  And hens took snuff to make them tough,\n  And ducks went quack, quack, quack, O!\n\nAll the birds of the air came to the magpie and asked her to teach them how to build nests. For the magpie is the cleverest bird of all at building nests. So she put all the birds round her and began to show them how to do it. First of all she took some mud and made a sort of round cake with it.\n\n“Oh, that's how it's done,” said the thrush; and away it flew, and so that's how thrushes build their nests.\n\nThen the magpie took some twigs and arranged them round in the mud.\n\n“Now I know all about it,” says the blackbird, and off he flew; and that's how the blackbirds make their nests to this very day.\n\nThen the magpie put another layer of mud over the twigs.\n\n“Oh that's quite obvious,” said the wise owl, and away it flew; and owls have never made better nests since.\n\nAfter this the magpie took some twigs and twined them round the outside.\n\n“The very thing!” said the sparrow, and off he went; so sparrows make rather slovenly nests to this day.\n\nWell, then Madge Magpie took some feathers and stuff and lined the nest very comfortably with it.\n\n“That suits me,” cried the starling, and off it flew; and very comfortable nests have starlings.\n\nSo it went on, every bird taking away some knowledge of how to build nests, but, none of them waiting to the end. Meanwhile Madge Magpie went on working and working without, looking up till the only bird that remained was the turtle-dove, and that hadn't paid any attention all along, but only kept on saying its silly cry “Take two, Taffy, take two-o-o-o.”\n\nAt last the magpie heard this just as she was putting a twig across. So she said: “One's enough.”\n\nBut the turtle-dove kept on saying: “Take two, Taffy, take two-o-o-o.”\n\nThen the magpie got angry and said: “One's enough I tell you.”\n\nStill the turtle-dove cried: “Take two, Taffy, take two-o-o-o.”\n\nAt last, and at last, the magpie looked up and saw nobody near her but the silly turtle-dove, and then she got rare angry and flew away and refused to tell the birds how to build nests again. And that is why different birds build their nests differently."}, {"id": "cap-o-rushes", "title": "Cap o' Rushes", "byline": "", "src": "English Fairy Tales (Jacobs)", "gid": "7439", "theme": "Folk & fairy tales", "band": "G3+", "words": 1358, "note": "Cinderella-type; Week 4 version comparison", "text": "Well, there was once a very rich gentleman, and he'd three daughters, and he thought he'd see how fond they were of him. So he says to the first, “How much do you love me, my dear?”\n\n“Why,” says she, “as I love my life.”\n\n“That's good,” says he.\n\nSo he says to the second, “How much do you love me, my dear?”\n\n“Why,” says she, “better nor all the world.”\n\n“That's good,” says he.\n\nSo he says to the third, “How much do you love me, my dear?”\n\n“Why, I love you as fresh meat loves salt,” says she.\n\nWell, he was that angry. “You don't love me at all,” says he, “and in my house you stay no more.” So he drove her out there and then, and shut the door in her face.\n\nWell, she went away on and on till she came to a fen, and there she gathered a lot of rushes and made them into a kind of a sort of a cloak with a hood, to cover her from head to foot, and to hide her fine clothes. And then she went on and on till she came to a great house.\n\n“Do you want a maid?” says she.\n\n“No, we don't,” said they.\n\n“I haven't nowhere to go,” says she; “and I ask no wages, and do any sort of work,” says she.\n\n“Well,” says they, “if you like to wash the pots and scrape the saucepans you may stay,” said they.\n\nSo she stayed there and washed the pots and scraped the saucepans and did all the dirty work. And because she gave no name they called her “Cap o' Rushes.”\n\nWell, one day there was to be a great dance a little way off, and the servants were allowed to go and look on at the grand people. Cap o' Rushes said she was too tired to go, so she stayed at home.\n\nBut when they were gone she offed with her cap o' rushes, and cleaned herself, and went to the dance. And no one there was so finely dressed as her.\n\nWell, who should be there but her master's son, and what should he do but fall in love with her the minute he set eyes on her. He wouldn't dance with any one else.\n\nBut before the dance was done Cap o' Rushes slipt off, and away she went home. And when the other maids came back she was pretending to be asleep with her cap o' rushes on.\n\nWell, next morning they said to her, “You did miss a sight, Cap o' Rushes!”\n\n“What was that?” says she.\n\n“Why, the beautifullest lady you ever see, dressed right gay and ga'. The young master, he never took his eyes off her.”\n\n“Well, I should have liked to have seen her,” says Cap o' Rushes.\n\n“Well, there's to be another dance this evening, and perhaps she'll be there.”\n\nBut, come the evening, Cap o' Rushes said she was too tired to go with them. Howsoever, when they were gone, she offed with her cap o' rushes and cleaned herself, and away she went to the dance.\n\nThe master's son had been reckoning on seeing her, and he danced with no one else, and never took his eyes off her. But, before the dance was over, she slipt off, and home she went, and when the maids came back she, pretended to be asleep with her cap o' rushes on.\n\nNext day they said to her again, “Well, Cap o' Rushes, you should ha' been there to see the lady. There she was again, gay and ga', and the young master he never took his eyes off her.”\n\n“Well, there,” says she, “I should ha' liked to ha' seen her.”\n\n“Well,” says they, “there's a dance again this evening, and you must go with us, for she's sure to be there.”\n\nWell, come this evening, Cap o' Rushes said she was too tired to go, and do what they would she stayed at home. But when they were gone she offed with her cap o' rushes and cleaned herself, and away she went to the dance.\n\nThe master's son was rarely glad when he saw her. He danced with none but her and never took his eyes off her. When she wouldn't tell him her name, nor where she came from, he gave her a ring and told her if he didn't see her again he should die.\n\nWell, before the dance was over, off she slipped, and home she went, and when the maids came home she was pretending to be asleep with her cap o' rushes on.\n\nWell, next day they says to her, “There, Cap o' Rushes, you didn't come last night, and now you won't see the lady, for there's no more dances.”\n\n“Well I should have rarely liked to have seen her,” says she.\n\nThe master's son he tried every way to find out where the lady was gone, but go where he might, and ask whom he might, he never heard anything about her. And he got worse and worse for the love of her till he had to keep his bed.\n\n“Make some gruel for the young master,” they said to the cook. “He's dying for the love of the lady.” The cook she set about making it when Cap o' Rushes came in.\n\n“What are you a-doing of?”, says she.\n\n“I'm going to make some gruel for the young master,” says the cook, “for he's dying for love of the lady.”\n\n“Let me make it,” says Cap o' Rushes.\n\nWell, the cook wouldn't at first, but at last she said yes, and Cap o' Rushes made the gruel. And when she had made it she slipped the ring into it on the sly before the cook took it upstairs.\n\nThe young man he drank it and then he saw the ring at the bottom.\n\n“Send for the cook,” says he.\n\nSo up she comes.\n\n“Who made this gruel here?” says he.\n\n“I did,” says the cook, for she was frightened.\n\nAnd he looked at her,\n\n“No, you didn't,” says he. “Say who did it, and you shan't be harmed.”\n\n“Well, then, 'twas Cap o' Rushes,” says she.\n\n“Send Cap o' Rushes here,” says he.\n\nSo Cap o' Rushes came.\n\n“Did you make my gruel?” says he.\n\n“Yes, I did,” says she.\n\n“Where did you get this ring?” says he.\n\n“From him that gave it me,” says she.\n\n“Who are you, then?” says the young man.\n\n“I'll show you,” says she. And she offed with her cap o' rushes, and there she was in her beautiful clothes.\n\nWell, the master's son he got well very soon, and they were to be married in a little time. It was to be a very grand wedding, and every one was asked far and near. And Cap o' Rushes' father was asked. But she never told anybody who she was.\n\nBut before the wedding she went to the cook, and says she:\n\n“I want you to dress every dish without a mite o' salt.”\n\n“That'll be rare nasty,” says the cook.\n\n“That doesn't signify,” says she.\n\n“Very well,” says the cook.\n\nWell, the wedding-day came, and they were married. And after they were married all the company sat down to the dinner. When they began to eat the meat, that was so tasteless they couldn't eat it. But Cap o' Rushes' father he tried first one dish and then another, and then he burst out crying.\n\n“What is the matter?” said the master's son to him.\n\n“Oh!” says he, “I had a daughter. And I asked her how much she loved me. And she said 'As much as fresh meat loves salt.' And I turned her from my door, for I thought she didn't love me. And now I see she loved me best of all. And she may be dead for aught I know.”\n\n“No, father, here she is!” says Cap o' Rushes. And she goes up to him and puts her arms round him.\n\nAnd so they were happy ever after."}, {"id": "the-old-man-and-his-grandson", "title": "The Old Man and His Grandson", "byline": "", "src": "Grimms' Fairy Tales", "gid": "2591", "theme": "Folk & fairy tales", "band": "G2+", "words": 249, "note": "Very short; respect for elders (strong Thai link)", "text": "There was once a very old man, whose eyes had become dim, his ears dull of hearing, his knees trembled, and when he sat at table he could hardly hold the spoon, and spilt the broth upon the table-cloth or let it run out of his mouth. His son and his son’s wife were disgusted at this, so the old grandfather at last had to sit in the corner behind the stove, and they gave him his food in an earthenware bowl, and not even enough of it. And he used to look towards the table with his eyes full of tears. Once, too, his trembling hands could not hold the bowl, and it fell to the ground and broke. The young wife scolded him, but he said nothing and only sighed. Then they brought him a wooden bowl for a few half-pence, out of which he had to eat.\n\nThey were once sitting thus when the little grandson of four years old began to gather together some bits of wood upon the ground. ‘What are you doing there?’ asked the father. ‘I am making a little trough,’ answered the child, ‘for father and mother to eat out of when I am big.’\n\nThe man and his wife looked at each other for a while, and presently began to cry. Then they took the old grandfather to the table, and henceforth always let him eat with them, and likewise said nothing if he did spill a little of anything."}, {"id": "the-straw-the-coal-and-the-bean", "title": "The Straw, the Coal, and the Bean", "byline": "", "src": "Grimms' Fairy Tales", "gid": "2591", "theme": "Folk & fairy tales", "band": "G2+", "words": 504, "note": "'Why' story; short", "text": "In a village dwelt a poor old woman, who had gathered together a dish of beans and wanted to cook them. So she made a fire on her hearth, and that it might burn the quicker, she lighted it with a handful of straw. When she was emptying the beans into the pan, one dropped without her observing it, and lay on the ground beside a straw, and soon afterwards a burning coal from the fire leapt down to the two. Then the straw began and said: ‘Dear friends, from whence do you come here?’ The coal replied: ‘I fortunately sprang out of the fire, and if I had not escaped by sheer force, my death would have been certain,—I should have been burnt to ashes.’ The bean said: ‘I too have escaped with a whole skin, but if the old woman had got me into the pan, I should have been made into broth without any mercy, like my comrades.’ ‘And would a better fate have fallen to my lot?’ said the straw. ‘The old woman has destroyed all my brethren in fire and smoke; she seized sixty of them at once, and took their lives. I luckily slipped through her fingers.’\n\n‘But what are we to do now?’ said the coal.\n\n‘I think,’ answered the bean, ‘that as we have so fortunately escaped death, we should keep together like good companions, and lest a new mischance should overtake us here, we should go away together, and repair to a foreign country.’\n\nThe proposition pleased the two others, and they set out on their way together. Soon, however, they came to a little brook, and as there was no bridge or foot-plank, they did not know how they were to get over it. The straw hit on a good idea, and said: ‘I will lay myself straight across, and then you can walk over on me as on a bridge.’ The straw therefore stretched itself from one bank to the other, and the coal, who was of an impetuous disposition, tripped quite boldly on to the newly-built bridge. But when she had reached the middle, and heard the water rushing beneath her, she was after all, afraid, and stood still, and ventured no farther. The straw, however, began to burn, broke in two pieces, and fell into the stream. The coal slipped after her, hissed when she got into the water, and breathed her last. The bean, who had prudently stayed behind on the shore, could not but laugh at the event, was unable to stop, and laughed so heartily that she burst. It would have been all over with her, likewise, if, by good fortune, a tailor who was travelling in search of work, had not sat down to rest by the brook. As he had a compassionate heart he pulled out his needle and thread, and sewed her together. The bean thanked him most prettily, but as the tailor used black thread, all beans since then have a black seam."}, {"id": "hansel-and-gretel", "title": "Hansel and Gretel", "byline": "", "src": "Grimms' Fairy Tales", "gid": "2591", "theme": "Folk & fairy tales", "band": "G3+", "words": 2931, "note": "Classic; setting and mood", "text": "Hard by a great forest dwelt a poor wood-cutter with his wife and his two children. The boy was called Hansel and the girl Gretel. He had little to bite and to break, and once when great dearth fell on the land, he could no longer procure even daily bread. Now when he thought over this by night in his bed, and tossed about in his anxiety, he groaned and said to his wife: ‘What is to become of us? How are we to feed our poor children, when we no longer have anything even for ourselves?’ ‘I’ll tell you what, husband,’ answered the woman, ‘early tomorrow morning we will take the children out into the forest to where it is the thickest; there we will light a fire for them, and give each of them one more piece of bread, and then we will go to our work and leave them alone. They will not find the way home again, and we shall be rid of them.’ ‘No, wife,’ said the man, ‘I will not do that; how can I bear to leave my children alone in the forest?—the wild animals would soon come and tear them to pieces.’ ‘O, you fool!’ said she, ‘then we must all four die of hunger, you may as well plane the planks for our coffins,’ and she left him no peace until he consented. ‘But I feel very sorry for the poor children, all the same,’ said the man.\n\nThe two children had also not been able to sleep for hunger, and had heard what their stepmother had said to their father. Gretel wept bitter tears, and said to Hansel: ‘Now all is over with us.’ ‘Be quiet, Gretel,’ said Hansel, ‘do not distress yourself, I will soon find a way to help us.’ And when the old folks had fallen asleep, he got up, put on his little coat, opened the door below, and crept outside. The moon shone brightly, and the white pebbles which lay in front of the house glittered like real silver pennies. Hansel stooped and stuffed the little pocket of his coat with as many as he could get in. Then he went back and said to Gretel: ‘Be comforted, dear little sister, and sleep in peace, God will not forsake us,’ and he lay down again in his bed. When day dawned, but before the sun had risen, the woman came and awoke the two children, saying: ‘Get up, you sluggards! we are going into the forest to fetch wood.’ She gave each a little piece of bread, and said: ‘There is something for your dinner, but do not eat it up before then, for you will get nothing else.’ Gretel took the bread under her apron, as Hansel had the pebbles in his pocket. Then they all set out together on the way to the forest. When they had walked a short time, Hansel stood still and peeped back at the house, and did so again and again. His father said: ‘Hansel, what are you looking at there and staying behind for? Pay attention, and do not forget how to use your legs.’ ‘Ah, father,’ said Hansel, ‘I am looking at my little white cat, which is sitting up on the roof, and wants to say goodbye to me.’ The wife said: ‘Fool, that is not your little cat, that is the morning sun which is shining on the chimneys.’ Hansel, however, had not been looking back at the cat, but had been constantly throwing one of the white pebble-stones out of his pocket on the road.\n\nWhen they had reached the middle of the forest, the father said: ‘Now, children, pile up some wood, and I will light a fire that you may not be cold.’ Hansel and Gretel gathered brushwood together, as high as a little hill. The brushwood was lighted, and when the flames were burning very high, the woman said: ‘Now, children, lay yourselves down by the fire and rest, we will go into the forest and cut some wood. When we have done, we will come back and fetch you away.’\n\nHansel and Gretel sat by the fire, and when noon came, each ate a little piece of bread, and as they heard the strokes of the wood-axe they believed that their father was near. It was not the axe, however, but a branch which he had fastened to a withered tree which the wind was blowing backwards and forwards. And as they had been sitting such a long time, their eyes closed with fatigue, and they fell fast asleep. When at last they awoke, it was already dark night. Gretel began to cry and said: ‘How are we to get out of the forest now?’ But Hansel comforted her and said: ‘Just wait a little, until the moon has risen, and then we will soon find the way.’ And when the full moon had risen, Hansel took his little sister by the hand, and followed the pebbles which shone like newly-coined silver pieces, and showed them the way.\n\nThey walked the whole night long, and by break of day came once more to their father’s house. They knocked at the door, and when the woman opened it and saw that it was Hansel and Gretel, she said: ‘You naughty children, why have you slept so long in the forest?—we thought you were never coming back at all!’ The father, however, rejoiced, for it had cut him to the heart to leave them behind alone.\n\nNot long afterwards, there was once more great dearth throughout the land, and the children heard their mother saying at night to their father: ‘Everything is eaten again, we have one half loaf left, and that is the end. The children must go, we will take them farther into the wood, so that they will not find their way out again; there is no other means of saving ourselves!’ The man’s heart was heavy, and he thought: ‘It would be better for you to share the last mouthful with your children.’ The woman, however, would listen to nothing that he had to say, but scolded and reproached him. He who says A must say B, likewise, and as he had yielded the first time, he had to do so a second time also.\n\nThe children, however, were still awake and had heard the conversation. When the old folks were asleep, Hansel again got up, and wanted to go out and pick up pebbles as he had done before, but the woman had locked the door, and Hansel could not get out. Nevertheless he comforted his little sister, and said: ‘Do not cry, Gretel, go to sleep quietly, the good God will help us.’\n\nEarly in the morning came the woman, and took the children out of their beds. Their piece of bread was given to them, but it was still smaller than the time before. On the way into the forest Hansel crumbled his in his pocket, and often stood still and threw a morsel on the ground. ‘Hansel, why do you stop and look round?’ said the father, ‘go on.’ ‘I am looking back at my little pigeon which is sitting on the roof, and wants to say goodbye to me,’ answered Hansel. ‘Fool!’ said the woman, ‘that is not your little pigeon, that is the morning sun that is shining on the chimney.’ Hansel, however little by little, threw all the crumbs on the path.\n\nThe woman led the children still deeper into the forest, where they had never in their lives been before. Then a great fire was again made, and the mother said: ‘Just sit there, you children, and when you are tired you may sleep a little; we are going into the forest to cut wood, and in the evening when we are done, we will come and fetch you away.’ When it was noon, Gretel shared her piece of bread with Hansel, who had scattered his by the way. Then they fell asleep and evening passed, but no one came to the poor children. They did not awake until it was dark night, and Hansel comforted his little sister and said: ‘Just wait, Gretel, until the moon rises, and then we shall see the crumbs of bread which I have strewn about, they will show us our way home again.’ When the moon came they set out, but they found no crumbs, for the many thousands of birds which fly about in the woods and fields had picked them all up. Hansel said to Gretel: ‘We shall soon find the way,’ but they did not find it. They walked the whole night and all the next day too from morning till evening, but they did not get out of the forest, and were very hungry, for they had nothing to eat but two or three berries, which grew on the ground. And as they were so weary that their legs would carry them no longer, they lay down beneath a tree and fell asleep.\n\nIt was now three mornings since they had left their father’s house. They began to walk again, but they always came deeper into the forest, and if help did not come soon, they must die of hunger and weariness. When it was mid-day, they saw a beautiful snow-white bird sitting on a bough, which sang so delightfully that they stood still and listened to it. And when its song was over, it spread its wings and flew away before them, and they followed it until they reached a little house, on the roof of which it alighted; and when they approached the little house they saw that it was built of bread and covered with cakes, but that the windows were of clear sugar. ‘We will set to work on that,’ said Hansel, ‘and have a good meal. I will eat a bit of the roof, and you Gretel, can eat some of the window, it will taste sweet.’ Hansel reached up above, and broke off a little of the roof to try how it tasted, and Gretel leant against the window and nibbled at the panes. Then a soft voice cried from the parlour:\n\n ‘Nibble, nibble, gnaw,\n  Who is nibbling at my little house?’\n\nThe children answered:\n\n ‘The wind, the wind,\n  The heaven-born wind,’\n\nand went on eating without disturbing themselves. Hansel, who liked the taste of the roof, tore down a great piece of it, and Gretel pushed out the whole of one round window-pane, sat down, and enjoyed herself with it. Suddenly the door opened, and a woman as old as the hills, who supported herself on crutches, came creeping out. Hansel and Gretel were so terribly frightened that they let fall what they had in their hands. The old woman, however, nodded her head, and said: ‘Oh, you dear children, who has brought you here? do come in, and stay with me. No harm shall happen to you.’ She took them both by the hand, and led them into her little house. Then good food was set before them, milk and pancakes, with sugar, apples, and nuts. Afterwards two pretty little beds were covered with clean white linen, and Hansel and Gretel lay down in them, and thought they were in heaven.\n\nThe old woman had only pretended to be so kind; she was in reality a wicked witch, who lay in wait for children, and had only built the little house of bread in order to entice them there. When a child fell into her power, she killed it, cooked and ate it, and that was a feast day with her. Witches have red eyes, and cannot see far, but they have a keen scent like the beasts, and are aware when human beings draw near. When Hansel and Gretel came into her neighbourhood, she laughed with malice, and said mockingly: ‘I have them, they shall not escape me again!’ Early in the morning before the children were awake, she was already up, and when she saw both of them sleeping and looking so pretty, with their plump and rosy cheeks she muttered to herself: ‘That will be a dainty mouthful!’ Then she seized Hansel with her shrivelled hand, carried him into a little stable, and locked him in behind a grated door. Scream as he might, it would not help him. Then she went to Gretel, shook her till she awoke, and cried: ‘Get up, lazy thing, fetch some water, and cook something good for your brother, he is in the stable outside, and is to be made fat. When he is fat, I will eat him.’ Gretel began to weep bitterly, but it was all in vain, for she was forced to do what the wicked witch commanded.\n\nAnd now the best food was cooked for poor Hansel, but Gretel got nothing but crab-shells. Every morning the woman crept to the little stable, and cried: ‘Hansel, stretch out your finger that I may feel if you will soon be fat.’ Hansel, however, stretched out a little bone to her, and the old woman, who had dim eyes, could not see it, and thought it was Hansel’s finger, and was astonished that there was no way of fattening him. When four weeks had gone by, and Hansel still remained thin, she was seized with impatience and would not wait any longer. ‘Now, then, Gretel,’ she cried to the girl, ‘stir yourself, and bring some water. Let Hansel be fat or lean, tomorrow I will kill him, and cook him.’ Ah, how the poor little sister did lament when she had to fetch the water, and how her tears did flow down her cheeks! ‘Dear God, do help us,’ she cried. ‘If the wild beasts in the forest had but devoured us, we should at any rate have died together.’ ‘Just keep your noise to yourself,’ said the old woman, ‘it won’t help you at all.’\n\nEarly in the morning, Gretel had to go out and hang up the cauldron with the water, and light the fire. ‘We will bake first,’ said the old woman, ‘I have already heated the oven, and kneaded the dough.’ She pushed poor Gretel out to the oven, from which flames of fire were already darting. ‘Creep in,’ said the witch, ‘and see if it is properly heated, so that we can put the bread in.’ And once Gretel was inside, she intended to shut the oven and let her bake in it, and then she would eat her, too. But Gretel saw what she had in mind, and said: ‘I do not know how I am to do it; how do I get in?’ ‘Silly goose,’ said the old woman. ‘The door is big enough; just look, I can get in myself!’ and she crept up and thrust her head into the oven. Then Gretel gave her a push that drove her far into it, and shut the iron door, and fastened the bolt. Oh! then she began to howl quite horribly, but Gretel ran away and the godless witch was miserably burnt to death.\n\nGretel, however, ran like lightning to Hansel, opened his little stable, and cried: ‘Hansel, we are saved! The old witch is dead!’ Then Hansel sprang like a bird from its cage when the door is opened. How they did rejoice and embrace each other, and dance about and kiss each other! And as they had no longer any need to fear her, they went into the witch’s house, and in every corner there stood chests full of pearls and jewels. ‘These are far better than pebbles!’ said Hansel, and thrust into his pockets whatever could be got in, and Gretel said: ‘I, too, will take something home with me,’ and filled her pinafore full. ‘But now we must be off,’ said Hansel, ‘that we may get out of the witch’s forest.’\n\nWhen they had walked for two hours, they came to a great stretch of water. ‘We cannot cross,’ said Hansel, ‘I see no foot-plank, and no bridge.’ ‘And there is also no ferry,’ answered Gretel, ‘but a white duck is swimming there: if I ask her, she will help us over.’ Then she cried:\n\n ‘Little duck, little duck, dost thou see,\n  Hansel and Gretel are waiting for thee?\n  There’s never a plank, or bridge in sight,\n  Take us across on thy back so white.’\n\nThe duck came to them, and Hansel seated himself on its back, and told his sister to sit by him. ‘No,’ replied Gretel, ‘that will be too heavy for the little duck; she shall take us across, one after the other.’ The good little duck did so, and when they were once safely across and had walked for a short time, the forest seemed to be more and more familiar to them, and at length they saw from afar their father’s house. Then they began to run, rushed into the parlour, and threw themselves round their father’s neck. The man had not known one happy hour since he had left the children in the forest; the woman, however, was dead. Gretel emptied her pinafore until pearls and precious stones ran about the room, and Hansel threw one handful after another out of his pocket to add to them. Then all anxiety was at an end, and they lived together in perfect happiness. My tale is done, there runs a mouse; whosoever catches it, may make himself a big fur cap out of it."}, {"id": "the-valiant-little-tailor", "title": "The Valiant Little Tailor", "byline": "", "src": "Grimms' Fairy Tales", "gid": "2591", "theme": "Folk & fairy tales", "band": "G3+", "words": 3336, "note": "Boasting and luck; very popular", "text": "One summer’s morning a little tailor was sitting on his table by the window; he was in good spirits, and sewed with all his might. Then came a peasant woman down the street crying: ‘Good jams, cheap! Good jams, cheap!’ This rang pleasantly in the tailor’s ears; he stretched his delicate head out of the window, and called: ‘Come up here, dear woman; here you will get rid of your goods.’ The woman came up the three steps to the tailor with her heavy basket, and he made her unpack all the pots for him. He inspected each one, lifted it up, put his nose to it, and at length said: ‘The jam seems to me to be good, so weigh me out four ounces, dear woman, and if it is a quarter of a pound that is of no consequence.’ The woman who had hoped to find a good sale, gave him what he desired, but went away quite angry and grumbling. ‘Now, this jam shall be blessed by God,’ cried the little tailor, ‘and give me health and strength’; so he brought the bread out of the cupboard, cut himself a piece right across the loaf and spread the jam over it. ‘This won’t taste bitter,’ said he, ‘but I will just finish the jacket before I take a bite.’ He laid the bread near him, sewed on, and in his joy, made bigger and bigger stitches. In the meantime the smell of the sweet jam rose to where the flies were sitting in great numbers, and they were attracted and descended on it in hosts. ‘Hi! who invited you?’ said the little tailor, and drove the unbidden guests away. The flies, however, who understood no German, would not be turned away, but came back again in ever-increasing companies. The little tailor at last lost all patience, and drew a piece of cloth from the hole under his work-table, and saying: ‘Wait, and I will give it to you,’ struck it mercilessly on them. When he drew it away and counted, there lay before him no fewer than seven, dead and with legs stretched out. ‘Are you a fellow of that sort?’ said he, and could not help admiring his own bravery. ‘The whole town shall know of this!’ And the little tailor hastened to cut himself a girdle, stitched it, and embroidered on it in large letters: ‘Seven at one stroke!’ ‘What, the town!’ he continued, ‘the whole world shall hear of it!’ and his heart wagged with joy like a lamb’s tail. The tailor put on the girdle, and resolved to go forth into the world, because he thought his workshop was too small for his valour. Before he went away, he sought about in the house to see if there was anything which he could take with him; however, he found nothing but an old cheese, and that he put in his pocket. In front of the door he observed a bird which had caught itself in the thicket. It had to go into his pocket with the cheese. Now he took to the road boldly, and as he was light and nimble, he felt no fatigue. The road led him up a mountain, and when he had reached the highest point of it, there sat a powerful giant looking peacefully about him. The little tailor went bravely up, spoke to him, and said: ‘Good day, comrade, so you are sitting there overlooking the wide-spread world! I am just on my way thither, and want to try my luck. Have you any inclination to go with me?’ The giant looked contemptuously at the tailor, and said: ‘You ragamuffin! You miserable creature!’\n\n‘Oh, indeed?’ answered the little tailor, and unbuttoned his coat, and showed the giant the girdle, ‘there may you read what kind of a man I am!’ The giant read: ‘Seven at one stroke,’ and thought that they had been men whom the tailor had killed, and began to feel a little respect for the tiny fellow. Nevertheless, he wished to try him first, and took a stone in his hand and squeezed it together so that water dropped out of it. ‘Do that likewise,’ said the giant, ‘if you have strength.’ ‘Is that all?’ said the tailor, ‘that is child’s play with us!’ and put his hand into his pocket, brought out the soft cheese, and pressed it until the liquid ran out of it. ‘Faith,’ said he, ‘that was a little better, wasn’t it?’ The giant did not know what to say, and could not believe it of the little man. Then the giant picked up a stone and threw it so high that the eye could scarcely follow it. ‘Now, little mite of a man, do that likewise,’ ‘Well thrown,’ said the tailor, ‘but after all the stone came down to earth again; I will throw you one which shall never come back at all,’ and he put his hand into his pocket, took out the bird, and threw it into the air. The bird, delighted with its liberty, rose, flew away and did not come back. ‘How does that shot please you, comrade?’ asked the tailor. ‘You can certainly throw,’ said the giant, ‘but now we will see if you are able to carry anything properly.’ He took the little tailor to a mighty oak tree which lay there felled on the ground, and said: ‘If you are strong enough, help me to carry the tree out of the forest.’ ‘Readily,’ answered the little man; ‘take you the trunk on your shoulders, and I will raise up the branches and twigs; after all, they are the heaviest.’ The giant took the trunk on his shoulder, but the tailor seated himself on a branch, and the giant, who could not look round, had to carry away the whole tree, and the little tailor into the bargain: he behind, was quite merry and happy, and whistled the song: ‘Three tailors rode forth from the gate,’ as if carrying the tree were child’s play. The giant, after he had dragged the heavy burden part of the way, could go no further, and cried: ‘Hark you, I shall have to let the tree fall!’ The tailor sprang nimbly down, seized the tree with both arms as if he had been carrying it, and said to the giant: ‘You are such a great fellow, and yet cannot even carry the tree!’\n\nThey went on together, and as they passed a cherry-tree, the giant laid hold of the top of the tree where the ripest fruit was hanging, bent it down, gave it into the tailor’s hand, and bade him eat. But the little tailor was much too weak to hold the tree, and when the giant let it go, it sprang back again, and the tailor was tossed into the air with it. When he had fallen down again without injury, the giant said: ‘What is this? Have you not strength enough to hold the weak twig?’ ‘There is no lack of strength,’ answered the little tailor. ‘Do you think that could be anything to a man who has struck down seven at one blow? I leapt over the tree because the huntsmen are shooting down there in the thicket. Jump as I did, if you can do it.’ The giant made the attempt but he could not get over the tree, and remained hanging in the branches, so that in this also the tailor kept the upper hand.\n\nThe giant said: ‘If you are such a valiant fellow, come with me into our cavern and spend the night with us.’ The little tailor was willing, and followed him. When they went into the cave, other giants were sitting there by the fire, and each of them had a roasted sheep in his hand and was eating it. The little tailor looked round and thought: ‘It is much more spacious here than in my workshop.’ The giant showed him a bed, and said he was to lie down in it and sleep. The bed, however, was too big for the little tailor; he did not lie down in it, but crept into a corner. When it was midnight, and the giant thought that the little tailor was lying in a sound sleep, he got up, took a great iron bar, cut through the bed with one blow, and thought he had finished off the grasshopper for good. With the earliest dawn the giants went into the forest, and had quite forgotten the little tailor, when all at once he walked up to them quite merrily and boldly. The giants were terrified, they were afraid that he would strike them all dead, and ran away in a great hurry.\n\nThe little tailor went onwards, always following his own pointed nose. After he had walked for a long time, he came to the courtyard of a royal palace, and as he felt weary, he lay down on the grass and fell asleep. Whilst he lay there, the people came and inspected him on all sides, and read on his girdle: ‘Seven at one stroke.’ ‘Ah!’ said they, ‘what does the great warrior want here in the midst of peace? He must be a mighty lord.’ They went and announced him to the king, and gave it as their opinion that if war should break out, this would be a weighty and useful man who ought on no account to be allowed to depart. The counsel pleased the king, and he sent one of his courtiers to the little tailor to offer him military service when he awoke. The ambassador remained standing by the sleeper, waited until he stretched his limbs and opened his eyes, and then conveyed to him this proposal. ‘For this very reason have I come here,’ the tailor replied, ‘I am ready to enter the king’s service.’ He was therefore honourably received, and a special dwelling was assigned him.\n\nThe soldiers, however, were set against the little tailor, and wished him a thousand miles away. ‘What is to be the end of this?’ they said among themselves. ‘If we quarrel with him, and he strikes about him, seven of us will fall at every blow; not one of us can stand against him.’ They came therefore to a decision, betook themselves in a body to the king, and begged for their dismissal. ‘We are not prepared,’ said they, ‘to stay with a man who kills seven at one stroke.’ The king was sorry that for the sake of one he should lose all his faithful servants, wished that he had never set eyes on the tailor, and would willingly have been rid of him again. But he did not venture to give him his dismissal, for he dreaded lest he should strike him and all his people dead, and place himself on the royal throne. He thought about it for a long time, and at last found good counsel. He sent to the little tailor and caused him to be informed that as he was a great warrior, he had one request to make to him. In a forest of his country lived two giants, who caused great mischief with their robbing, murdering, ravaging, and burning, and no one could approach them without putting himself in danger of death. If the tailor conquered and killed these two giants, he would give him his only daughter to wife, and half of his kingdom as a dowry, likewise one hundred horsemen should go with him to assist him. ‘That would indeed be a fine thing for a man like me!’ thought the little tailor. ‘One is not offered a beautiful princess and half a kingdom every day of one’s life!’ ‘Oh, yes,’ he replied, ‘I will soon subdue the giants, and do not require the help of the hundred horsemen to do it; he who can hit seven with one blow has no need to be afraid of two.’\n\nThe little tailor went forth, and the hundred horsemen followed him. When he came to the outskirts of the forest, he said to his followers: ‘Just stay waiting here, I alone will soon finish off the giants.’ Then he bounded into the forest and looked about right and left. After a while he perceived both giants. They lay sleeping under a tree, and snored so that the branches waved up and down. The little tailor, not idle, gathered two pocketsful of stones, and with these climbed up the tree. When he was halfway up, he slipped down by a branch, until he sat just above the sleepers, and then let one stone after another fall on the breast of one of the giants. For a long time the giant felt nothing, but at last he awoke, pushed his comrade, and said: ‘Why are you knocking me?’ ‘You must be dreaming,’ said the other, ‘I am not knocking you.’ They laid themselves down to sleep again, and then the tailor threw a stone down on the second. ‘What is the meaning of this?’ cried the other ‘Why are you pelting me?’ ‘I am not pelting you,’ answered the first, growling. They disputed about it for a time, but as they were weary they let the matter rest, and their eyes closed once more. The little tailor began his game again, picked out the biggest stone, and threw it with all his might on the breast of the first giant. ‘That is too bad!’ cried he, and sprang up like a madman, and pushed his companion against the tree until it shook. The other paid him back in the same coin, and they got into such a rage that they tore up trees and belaboured each other so long, that at last they both fell down dead on the ground at the same time. Then the little tailor leapt down. ‘It is a lucky thing,’ said he, ‘that they did not tear up the tree on which I was sitting, or I should have had to sprint on to another like a squirrel; but we tailors are nimble.’ He drew out his sword and gave each of them a couple of thrusts in the breast, and then went out to the horsemen and said: ‘The work is done; I have finished both of them off, but it was hard work! They tore up trees in their sore need, and defended themselves with them, but all that is to no purpose when a man like myself comes, who can kill seven at one blow.’ ‘But are you not wounded?’ asked the horsemen. ‘You need not concern yourself about that,’ answered the tailor, ‘they have not bent one hair of mine.’ The horsemen would not believe him, and rode into the forest; there they found the giants swimming in their blood, and all round about lay the torn-up trees.\n\nThe little tailor demanded of the king the promised reward; he, however, repented of his promise, and again bethought himself how he could get rid of the hero. ‘Before you receive my daughter, and the half of my kingdom,’ said he to him, ‘you must perform one more heroic deed. In the forest roams a unicorn which does great harm, and you must catch it first.’ ‘I fear one unicorn still less than two giants. Seven at one blow, is my kind of affair.’ He took a rope and an axe with him, went forth into the forest, and again bade those who were sent with him to wait outside. He had not long to seek. The unicorn soon came towards him, and rushed directly on the tailor, as if it would gore him with its horn without more ado. ‘Softly, softly; it can’t be done as quickly as that,’ said he, and stood still and waited until the animal was quite close, and then sprang nimbly behind the tree. The unicorn ran against the tree with all its strength, and stuck its horn so fast in the trunk that it had not the strength enough to draw it out again, and thus it was caught. ‘Now, I have got the bird,’ said the tailor, and came out from behind the tree and put the rope round its neck, and then with his axe he hewed the horn out of the tree, and when all was ready he led the beast away and took it to the king.\n\nThe king still would not give him the promised reward, and made a third demand. Before the wedding the tailor was to catch him a wild boar that made great havoc in the forest, and the huntsmen should give him their help. ‘Willingly,’ said the tailor, ‘that is child’s play!’ He did not take the huntsmen with him into the forest, and they were well pleased that he did not, for the wild boar had several times received them in such a manner that they had no inclination to lie in wait for him. When the boar perceived the tailor, it ran on him with foaming mouth and whetted tusks, and was about to throw him to the ground, but the hero fled and sprang into a chapel which was near and up to the window at once, and in one bound out again. The boar ran after him, but the tailor ran round outside and shut the door behind it, and then the raging beast, which was much too heavy and awkward to leap out of the window, was caught. The little tailor called the huntsmen thither that they might see the prisoner with their own eyes. The hero, however, went to the king, who was now, whether he liked it or not, obliged to keep his promise, and gave his daughter and the half of his kingdom. Had he known that it was no warlike hero, but a little tailor who was standing before him, it would have gone to his heart still more than it did. The wedding was held with great magnificence and small joy, and out of a tailor a king was made.\n\nAfter some time the young queen heard her husband say in his dreams at night: ‘Boy, make me the doublet, and patch the pantaloons, or else I will rap the yard-measure over your ears.’ Then she discovered in what state of life the young lord had been born, and next morning complained of her wrongs to her father, and begged him to help her to get rid of her husband, who was nothing else but a tailor. The king comforted her and said: ‘Leave your bedroom door open this night, and my servants shall stand outside, and when he has fallen asleep shall go in, bind him, and take him on board a ship which shall carry him into the wide world.’ The woman was satisfied with this; but the king’s armour-bearer, who had heard all, was friendly with the young lord, and informed him of the whole plot. ‘I’ll put a screw into that business,’ said the little tailor. At night he went to bed with his wife at the usual time, and when she thought that he had fallen asleep, she got up, opened the door, and then lay down again. The little tailor, who was only pretending to be asleep, began to cry out in a clear voice: ‘Boy, make me the doublet and patch me the pantaloons, or I will rap the yard-measure over your ears. I smote seven at one blow. I killed two giants, I brought away one unicorn, and caught a wild boar, and am I to fear those who are standing outside the room.’ When these men heard the tailor speaking thus, they were overcome by a great dread, and ran as if the wild huntsman were behind them, and none of them would venture anything further against him. So the little tailor was and remained a king to the end of his life."}, {"id": "the-elves-and-the-shoemaker", "title": "The Elves and the Shoemaker", "byline": "", "src": "Grimms' Fairy Tales", "gid": "2591", "theme": "Folk & fairy tales", "band": "G3+", "words": 743, "note": "Kindness repaid", "text": "There was once a shoemaker, who worked very hard and was very honest: but still he could not earn enough to live upon; and at last all he had in the world was gone, save just leather enough to make one pair of shoes.\n\nThen he cut his leather out, all ready to make up the next day, meaning to rise early in the morning to his work. His conscience was clear and his heart light amidst all his troubles; so he went peaceably to bed, left all his cares to Heaven, and soon fell asleep. In the morning after he had said his prayers, he sat himself down to his work; when, to his great wonder, there stood the shoes all ready made, upon the table. The good man knew not what to say or think at such an odd thing happening. He looked at the workmanship; there was not one false stitch in the whole job; all was so neat and true, that it was quite a masterpiece.\n\nThe same day a customer came in, and the shoes suited him so well that he willingly paid a price higher than usual for them; and the poor shoemaker, with the money, bought leather enough to make two pairs more. In the evening he cut out the work, and went to bed early, that he might get up and begin betimes next day; but he was saved all the trouble, for when he got up in the morning the work was done ready to his hand. Soon in came buyers, who paid him handsomely for his goods, so that he bought leather enough for four pair more. He cut out the work again overnight and found it done in the morning, as before; and so it went on for some time: what was got ready in the evening was always done by daybreak, and the good man soon became thriving and well off again.\n\nOne evening, about Christmas-time, as he and his wife were sitting over the fire chatting together, he said to her, ‘I should like to sit up and watch tonight, that we may see who it is that comes and does my work for me.’ The wife liked the thought; so they left a light burning, and hid themselves in a corner of the room, behind a curtain that was hung up there, and watched what would happen.\n\nAs soon as it was midnight, there came in two little naked dwarfs; and they sat themselves upon the shoemaker’s bench, took up all the work that was cut out, and began to ply with their little fingers, stitching and rapping and tapping away at such a rate, that the shoemaker was all wonder, and could not take his eyes off them. And on they went, till the job was quite done, and the shoes stood ready for use upon the table. This was long before daybreak; and then they bustled away as quick as lightning.\n\nThe next day the wife said to the shoemaker. ‘These little wights have made us rich, and we ought to be thankful to them, and do them a good turn if we can. I am quite sorry to see them run about as they do; and indeed it is not very decent, for they have nothing upon their backs to keep off the cold. I’ll tell you what, I will make each of them a shirt, and a coat and waistcoat, and a pair of pantaloons into the bargain; and do you make each of them a little pair of shoes.’\n\nThe thought pleased the good cobbler very much; and one evening, when all the things were ready, they laid them on the table, instead of the work that they used to cut out, and then went and hid themselves, to watch what the little elves would do.\n\nAbout midnight in they came, dancing and skipping, hopped round the room, and then went to sit down to their work as usual; but when they saw the clothes lying for them, they laughed and chuckled, and seemed mightily delighted.\n\nThen they dressed themselves in the twinkling of an eye, and danced and capered and sprang about, as merry as could be; till at last they danced out at the door, and away over the green.\n\nThe good couple saw them no more; but everything went well with them from that time forward, as long as they lived."}, {"id": "the-fisherman-and-his-wife", "title": "The Fisherman and His Wife", "byline": "", "src": "Grimms' Fairy Tales", "gid": "2591", "theme": "Folk & fairy tales", "band": "G3+", "words": 2116, "note": "Greed; Week 4 Book Circle", "text": "There was once a fisherman who lived with his wife in a pigsty, close by the seaside. The fisherman used to go out all day long a-fishing; and one day, as he sat on the shore with his rod, looking at the sparkling waves and watching his line, all on a sudden his float was dragged away deep into the water: and in drawing it up he pulled out a great fish. But the fish said, ‘Pray let me live! I am not a real fish; I am an enchanted prince: put me in the water again, and let me go!’ ‘Oh, ho!’ said the man, ‘you need not make so many words about the matter; I will have nothing to do with a fish that can talk: so swim away, sir, as soon as you please!’ Then he put him back into the water, and the fish darted straight down to the bottom, and left a long streak of blood behind him on the wave.\n\nWhen the fisherman went home to his wife in the pigsty, he told her how he had caught a great fish, and how it had told him it was an enchanted prince, and how, on hearing it speak, he had let it go again. ‘Did not you ask it for anything?’ said the wife, ‘we live very wretchedly here, in this nasty dirty pigsty; do go back and tell the fish we want a snug little cottage.’\n\nThe fisherman did not much like the business: however, he went to the seashore; and when he came back there the water looked all yellow and green. And he stood at the water’s edge, and said:\n\n ‘O man of the sea!\n  Hearken to me!\n  My wife Ilsabill\n  Will have her own will,\n  And hath sent me to beg a boon of thee!’\n\nThen the fish came swimming to him, and said, ‘Well, what is her will? What does your wife want?’ ‘Ah!’ said the fisherman, ‘she says that when I had caught you, I ought to have asked you for something before I let you go; she does not like living any longer in the pigsty, and wants a snug little cottage.’ ‘Go home, then,’ said the fish; ‘she is in the cottage already!’ So the man went home, and saw his wife standing at the door of a nice trim little cottage. ‘Come in, come in!’ said she; ‘is not this much better than the filthy pigsty we had?’ And there was a parlour, and a bedchamber, and a kitchen; and behind the cottage there was a little garden, planted with all sorts of flowers and fruits; and there was a courtyard behind, full of ducks and chickens. ‘Ah!’ said the fisherman, ‘how happily we shall live now!’ ‘We will try to do so, at least,’ said his wife.\n\nEverything went right for a week or two, and then Dame Ilsabill said, ‘Husband, there is not near room enough for us in this cottage; the courtyard and the garden are a great deal too small; I should like to have a large stone castle to live in: go to the fish again and tell him to give us a castle.’ ‘Wife,’ said the fisherman, ‘I don’t like to go to him again, for perhaps he will be angry; we ought to be easy with this pretty cottage to live in.’ ‘Nonsense!’ said the wife; ‘he will do it very willingly, I know; go along and try!’\n\nThe fisherman went, but his heart was very heavy: and when he came to the sea, it looked blue and gloomy, though it was very calm; and he went close to the edge of the waves, and said:\n\n ‘O man of the sea!\n  Hearken to me!\n  My wife Ilsabill\n  Will have her own will,\n  And hath sent me to beg a boon of thee!’\n\n‘Well, what does she want now?’ said the fish. ‘Ah!’ said the man, dolefully, ‘my wife wants to live in a stone castle.’ ‘Go home, then,’ said the fish; ‘she is standing at the gate of it already.’ So away went the fisherman, and found his wife standing before the gate of a great castle. ‘See,’ said she, ‘is not this grand?’ With that they went into the castle together, and found a great many servants there, and the rooms all richly furnished, and full of golden chairs and tables; and behind the castle was a garden, and around it was a park half a mile long, full of sheep, and goats, and hares, and deer; and in the courtyard were stables and cow-houses. ‘Well,’ said the man, ‘now we will live cheerful and happy in this beautiful castle for the rest of our lives.’ ‘Perhaps we may,’ said the wife; ‘but let us sleep upon it, before we make up our minds to that.’ So they went to bed.\n\nThe next morning when Dame Ilsabill awoke it was broad daylight, and she jogged the fisherman with her elbow, and said, ‘Get up, husband, and bestir yourself, for we must be king of all the land.’ ‘Wife, wife,’ said the man, ‘why should we wish to be the king? I will not be king.’ ‘Then I will,’ said she. ‘But, wife,’ said the fisherman, ‘how can you be king—the fish cannot make you a king?’ ‘Husband,’ said she, ‘say no more about it, but go and try! I will be king.’ So the man went away quite sorrowful to think that his wife should want to be king. This time the sea looked a dark grey colour, and was overspread with curling waves and the ridges of foam as he cried out:\n\n ‘O man of the sea!\n  Hearken to me!\n  My wife Ilsabill\n  Will have her own will,\n  And hath sent me to beg a boon of thee!’\n\n‘Well, what would she have now?’ said the fish. ‘Alas!’ said the poor man, ‘my wife wants to be king.’ ‘Go home,’ said the fish; ‘she is king already.’\n\nThen the fisherman went home; and as he came close to the palace he saw a troop of soldiers, and heard the sound of drums and trumpets. And when he went in he saw his wife sitting on a throne of gold and diamonds, with a golden crown upon her head; and on each side of her stood six fair maidens, each a head taller than the other. ‘Well, wife,’ said the fisherman, ‘are you king?’ ‘Yes,’ said she, ‘I am king.’ And when he had looked at her for a long time, he said, ‘Ah, wife! what a fine thing it is to be king! Now we shall never have anything more to wish for as long as we live.’ ‘I don’t know how that may be,’ said she; ‘never is a long time. I am king, it is true; but I begin to be tired of that, and I think I should like to be emperor.’ ‘Alas, wife! why should you wish to be emperor?’ said the fisherman. ‘Husband,’ said she, ‘go to the fish! I say I will be emperor.’ ‘Ah, wife!’ replied the fisherman, ‘the fish cannot make an emperor, I am sure, and I should not like to ask him for such a thing.’ ‘I am king,’ said Ilsabill, ‘and you are my slave; so go at once!’\n\nSo the fisherman was forced to go; and he muttered as he went along, ‘This will come to no good, it is too much to ask; the fish will be tired at last, and then we shall be sorry for what we have done.’ He soon came to the seashore; and the water was quite black and muddy, and a mighty whirlwind blew over the waves and rolled them about, but he went as near as he could to the water’s brink, and said:\n\n ‘O man of the sea!\n  Hearken to me!\n  My wife Ilsabill\n  Will have her own will,\n  And hath sent me to beg a boon of thee!’\n\n‘What would she have now?’ said the fish. ‘Ah!’ said the fisherman, ‘she wants to be emperor.’ ‘Go home,’ said the fish; ‘she is emperor already.’\n\nSo he went home again; and as he came near he saw his wife Ilsabill sitting on a very lofty throne made of solid gold, with a great crown on her head full two yards high; and on each side of her stood her guards and attendants in a row, each one smaller than the other, from the tallest giant down to a little dwarf no bigger than my finger. And before her stood princes, and dukes, and earls: and the fisherman went up to her and said, ‘Wife, are you emperor?’ ‘Yes,’ said she, ‘I am emperor.’ ‘Ah!’ said the man, as he gazed upon her, ‘what a fine thing it is to be emperor!’ ‘Husband,’ said she, ‘why should we stop at being emperor? I will be pope next.’ ‘O wife, wife!’ said he, ‘how can you be pope? there is but one pope at a time in Christendom.’ ‘Husband,’ said she, ‘I will be pope this very day.’ ‘But,’ replied the husband, ‘the fish cannot make you pope.’ ‘What nonsense!’ said she; ‘if he can make an emperor, he can make a pope: go and try him.’\n\nSo the fisherman went. But when he came to the shore the wind was raging and the sea was tossed up and down in boiling waves, and the ships were in trouble, and rolled fearfully upon the tops of the billows. In the middle of the heavens there was a little piece of blue sky, but towards the south all was red, as if a dreadful storm was rising. At this sight the fisherman was dreadfully frightened, and he trembled so that his knees knocked together: but still he went down near to the shore, and said:\n\n ‘O man of the sea!\n  Hearken to me!\n  My wife Ilsabill\n  Will have her own will,\n  And hath sent me to beg a boon of thee!’\n\n‘What does she want now?’ said the fish. ‘Ah!’ said the fisherman, ‘my wife wants to be pope.’ ‘Go home,’ said the fish; ‘she is pope already.’\n\nThen the fisherman went home, and found Ilsabill sitting on a throne that was two miles high. And she had three great crowns on her head, and around her stood all the pomp and power of the Church. And on each side of her were two rows of burning lights, of all sizes, the greatest as large as the highest and biggest tower in the world, and the least no larger than a small rushlight. ‘Wife,’ said the fisherman, as he looked at all this greatness, ‘are you pope?’ ‘Yes,’ said she, ‘I am pope.’ ‘Well, wife,’ replied he, ‘it is a grand thing to be pope; and now you must be easy, for you can be nothing greater.’ ‘I will think about that,’ said the wife. Then they went to bed: but Dame Ilsabill could not sleep all night for thinking what she should be next. At last, as she was dropping asleep, morning broke, and the sun rose. ‘Ha!’ thought she, as she woke up and looked at it through the window, ‘after all I cannot prevent the sun rising.’ At this thought she was very angry, and wakened her husband, and said, ‘Husband, go to the fish and tell him I must be lord of the sun and moon.’ The fisherman was half asleep, but the thought frightened him so much that he started and fell out of bed. ‘Alas, wife!’ said he, ‘cannot you be easy with being pope?’ ‘No,’ said she, ‘I am very uneasy as long as th
