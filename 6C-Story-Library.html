he wicked folk of that region.\n\nNow one day he met a hideous giantess named Angur-Boda. This creature had a heart of ice, and because he loved ugliness and evil she had a great attraction for him, and in the end he married her, and they lived together in a horrible cave in Giantland.\n\nThree children were born to Loki and Angur-Boda in this dread abode, and they were even more terrible in appearance than their mother. The first was an immense wolf called Fenris, with a huge mouth filled with long white teeth, which he was constantly gnashing together. The second was a wicked-looking serpent with a fiery-red tongue lolling from its mouth. The third was a hideous giantess, partly blue and partly flesh color, whose name was Hela.\n\nNo sooner were these three terrible children born than all the wise men of the earth began to foretell the misery they would bring upon the Asa folk.\n\nIn vain did Loki try to keep them hidden within the cave wherein their mother dwelt. They soon grew so immense in size that no dwelling would contain them, and all the world began to talk of their frightful appearance.\n\nIt was not long, of course, before All-Father Odin, from his high seat in Asgard, heard of the children of Loki. So he sent for some of the Asas, and said: \"Much evil will come upon us, O my children, from this giant brood, if we defend not ourselves against them. For their mother will teach them wickedness, and still more quickly will they learn the cunning wiles of their father. Fetch me them here, therefore, that I may deal with them forthwith.\"\n\nSo, after somewhat of a struggle, the Asas captured the three giant-children and brought them before Odin's judgment seat.\n\nThen Odin looked first at Hela, and when he saw her gloomy eyes, full of misery and despair, he was sorry, and dealt kindly with her, saying: \"Thou art the bringer of Pain to man, and Asgard is no place for such as thou. But I will make thee ruler of the Mist Home, and there shalt thou rule over that unlighted world, the Region of the Dead.\"\n\nForthwith he sent her away over rough roads to the cold, dark region of the North called the Mist Home. And there did Hela rule over a grim crew, for all those who had done wickedness in the world above were imprisoned by her in those gloomy regions. To her came also all those who had died, not on the battlefield, but of old age or disease. And though these were treated kindly enough, theirs was a joyless life in comparison with that of the dead warriors who were feasting and fighting in the halls of Valhalla, under the kindly rule of All-Father Odin.\n\nHaving thus disposed of Hela, Odin next turned his attention to the serpent. And when he saw his evil tongue and cunning, wicked eyes, he said: \"Thou art he who bringest Sin into the world of men; therefore the ocean shall be thy home forever.\"\n\nThen he threw that horrid serpent into the deep sea which surrounds all lands, and there the creature grew so fast that when he stretched himself one day he encircled all the earth, and held his own tail fast in his mouth. And sometimes he grew angry to think that he, the son of a god, had thus been cast out; and at those times he would writhe with his huge body and lash his tail till the sea spouted up to the sky. And when that happened the men of the North said that a great tempest was raging. But it was only the serpent-son of Loki writhing in his wrath.\n\nThen Odin turned to the third child. And behold! the Fenris Wolf was so appalling to look upon that Odin feared to cast him forth, and he decided to endeavor to tame him by kindness so that he should not wish them ill.\n\nBut when he bade them carry food to the Fenris Wolf, not one of the Asas would do so, for they feared a snap from his great jaws. Only the brave Tyr had courage enough to feed him, and the wolf ate so much and so fast that the business took him all his time. Meantime, too, the Fenris grew so rapidly, and became so fierce, that the gods were compelled to take counsel and consider how they should get rid of him. They remembered that it would make their peaceful halls unholy if they were to slay him, and so they resolved instead to bind him fast, that he should be unable to do them harm.\n\nSo those of the Asa folk who were clever smiths set to work and made a very strong, thick chain; and when it was finished they carried it out to the yard where the wolf dwelt, and said to him, as though in jest: \"Here is a fine proof of thy boasted strength, O Fenris. Let us bind this about thee, that we may see if thou canst break it asunder.\"\n\nThen the wolf gave a great grin with his wide jaws, and came and stood still that they might bind the chain about him; for he knew what he could do. And it came to pass that directly they had fastened the chain, and had slipped aside from him, the great beast gave himself a shake, and the chain fell about him in little bits. At this the Asas were much annoyed, but they tried not to show it, and praised him for his strength.\n\nThen they set to work again upon a chain much stronger than the last, and brought it to the Fenris Wolf, saying: \"Great will be thy renown, O Fenris, if thou canst break this chain as thou didst the last.\"\n\nBut the wolf looked at them askance, for the chain they brought was very much thicker than the one he had already broken. He reflected, however, that since that time he himself had grown stronger and bigger, and moreover, that one must risk something in order to win renown.\n\nSo he let them put the chain upon him, and when the Asas said that all was ready, he gave a good shake and stretched himself a few times, and again the fetters lay in fragments on the ground.\n\nThen the gods began to fear that they would never hold the wolf in bonds; and it was All-Father Odin who persuaded them to make one more attempt. So they sent a messenger to Dwarfland bidding him ask the Little Men to make a chain which nothing could possibly destroy.\n\nSetting at once to work, the clever little smiths soon fashioned a slender silken rope, and gave it to the messenger, saying that no strength could break it, and that the more it was strained the stronger it would become.\n\nIt was made of the most mysterious things—the sound of a cat's footsteps, the roots of a mountain, the sinews of a bear, the breath of fishes, and other such strange materials, which only the dwarfs knew how to use. With this chain the messenger hastened back over the Rainbow Bridge to Asgard.\n\nBy this time the Fenris Wolf had grown too big for his yard, so he lived on a rocky island in the middle of the lake that lies in the midst of Asgard. And here the Asas now betook themselves with their chain, and began to play their part with wily words.\n\n\"See,\" they cried, \"O Fenris! Here is a cord so soft and thin that none would think of it binding such strength as thine.\" And they laughed great laughs, and handed it to one another, and tried its strength by pulling at it with all their might, but it did not break.\n\nThen they came nearer and used more wiles, saying: \"We cannot break the cord, though 'tis stronger than it looks, but thou, O mighty one, will be able to snap it in a moment.\"\n\nBut the wolf tossed his head in scorn, and said: \"Small renown would there be to me, O Asa folk, if I were to break yon slender string. Save, therefore, your breath, and leave me now alone.\"\n\n\"Aha!\" cried the Asas, \"thou fearest the might of the silken cord, thou false one, and that is why thou wilt not let us bind thee!\"\n\n\"Not I,\" said the Fenris Wolf, growing rather suspicious, \"but if it is made with craft and guile it shall never come near my feet.\"\n\n\"But,\" said the Asas, \"thou wilt surely be able to break this silken cord with ease, since thou hast already broken the great iron fetters.\"\n\nTo this the wolf made no answer, pretending not to hear.\n\n\"Come!\" said the Asas again, \"why shouldst thou fear? For even if thou couldst not break the cord we would immediately let thee free again. To refuse is a coward's piece of work.\"\n\nThen the wolf gnashed his teeth at them in anger, and said: \"Well I know you Asas! For if you bind me so fast that I cannot get loose you will skulk away, and it will be long before I get any help from you; and therefore am I loth to let this band be laid upon me.\"\n\nBut still the Asas continued to persuade him and to twit him with cowardice until at length the Fenris Wolf said, with a sullen growl: \"Have it your own way then. But, as a pledge that this is done without deceit, let one of you lay his hand in my mouth while you are binding me, and afterwards while I try to break the bonds.\"\n\nThen the Asa folk looked at one another in dismay, for they knew very well what this would mean. And while they consulted together the wolf stood gnashing his teeth at them with a horrid grin.\n\nAt length Tyr the Brave hesitated no longer. Boldly he stalked up to the wolf and thrust his arm into his enormous mouth, bidding the Asas bind fast the beast. Scarce had they done so when the wolf began to strain and pull, but the more he did so the tighter and stiffer the rope became.\n\nThe gods shouted and laughed with glee when they saw how all his efforts were in vain. But Tyr did not join in their mirth, for the wolf in his rage snapped his great teeth together and bit off his hand at the wrist.\n\nNow when the Asas discovered that the animal was fast bound, they took the chain which was fixed to the rope and drew it through a huge rock, and fastened this rock deep down in the earth, so that it could never be moved. And this they fastened to another great rock which was driven still deeper into the ground.\n\nWhen the Fenris Wolf found that he had been thus secured he opened his mouth terribly wide, and twisted himself right and left, and tried his best to bite the Asa folk. He uttered, moreover, such terrible howls that at length the gods could bear it no longer. So they took a sword and thrust it into his mouth, so that the hilt rested on his lower, and the point against his upper, jaw. And there he was doomed to remain until the end of All Things shall come, when he\n\n\"Freed from the Chain\nShall range the Earth.\""}, {"id": "teeny-tiny", "title": "Teeny-tiny", "byline": "", "src": "English Fairy Tales (Jacobs)", "gid": "7439", "theme": "Spooky & eerie", "band": "G2+", "words": 330, "note": "Mild, funny-spooky; perfect first scary read-aloud", "text": "Once upon a time there was a teeny-tiny woman lived in a teeny-tiny house in a teeny-tiny village. Now, one day this teeny-tiny woman put on her teeny-tiny bonnet, and went out of her teeny-tiny house to take a teeny-tiny walk. And when this teeny-tiny woman had gone a teeny-tiny way she came to a teeny-tiny gate; so the teeny-tiny woman opened the teeny-tiny gate, and went into a teeny-tiny churchyard. And when this teeny-tiny woman had got into the teeny-tiny churchyard, she saw a teeny-tiny bone on a teeny-tiny grave, and the teeny-tiny woman said to her teeny-tiny self, “This teeny-tiny bone will make me some teeny-tiny soup for my teeny-tiny supper.” So the teeny-tiny woman put the teeny-tiny bone into her teeny-tiny pocket, and went home to her teeny-tiny house.\n\nNow when the teeny-tiny woman got home to her teeny-tiny house she was a teeny-tiny bit tired; so she went up her teeny-tiny stairs to her teeny-tiny bed, and put the teeny-tiny bone into a teeny-tiny cupboard. And when this teeny-tiny woman had been to sleep a teeny-tiny time, she was awakened by a teeny-tiny voice from the teeny-tiny cupboard, which said:\n\n“Give me my bone!”\n\nAnd this teeny-tiny woman was a teeny-tiny frightened, so she hid her teeny-tiny head under the teeny-tiny clothes and went to sleep again. And when she had been to sleep again a teeny-tiny time, the teeny-tiny voice again cried out from the teeny-tiny cupboard a teeny-tiny louder, “Give me my bone!”\n\nThis made the teeny-tiny woman a teeny-tiny more frightened, so she hid her teeny-tiny head a teeny-tiny further under the teeny-tiny clothes. And when the teeny-tiny woman had been to sleep again a teeny-tiny time, the teeny-tiny voice from the teeny-tiny cupboard said again a teeny-tiny louder,\n\n“Give me my bone!”\n\nAnd this teeny-tiny woman was a teeny-tiny bit more frightened, but she put her teeny-tiny head out of the teeny-tiny clothes, and said in her loudest teeny-tiny voice, “TAKE IT!”"}, {"id": "the-golden-arm", "title": "The Golden Arm", "byline": "", "src": "English Fairy Tales (Jacobs)", "gid": "7439", "theme": "Spooky & eerie", "band": "G2+", "words": 258, "note": "Classic 'jump' story; read aloud and shout the last line", "text": "There was once a man who travelled the land all over in search of a wife. He saw young and old, rich and poor, pretty and plain, and could not meet with one to his mind. At last he found a woman, young, fair, and rich, who possessed a right arm of solid gold. He married her at once, and thought no man so fortunate as he was. They lived happily together, but, though he wished people to think otherwise, he was fonder of the golden arm than of all his wife's gifts besides.\n\nAt last she died. The husband put on the blackest black, and pulled the longest face at the funeral; but for all that he got up in the middle of the night, dug up the body, and cut off the golden arm. He hurried home to hide his treasure, and thought no one would know.\n\nThe following night he put the golden arm under his pillow, and was just falling asleep, when the ghost of his dead wife glided into the room. Stalking up to the bedside it drew the curtain, and looked at him reproachfully. Pretending not to be afraid, he spoke to the ghost, and said: “What hast thou done with thy cheeks so red?”\n\n“All withered and wasted away,” replied the ghost, in a hollow tone.\n\n“What hast thou done with thy red rosy lips?”\n\n“All withered and wasted away.”\n\n“What hast thou done with thy golden hair?”\n\n“All withered and wasted away.”\n\n“What hast thou done with thy Golden Arm?”"}, {"id": "mr-miacca", "title": "Mr. Miacca", "byline": "", "src": "English Fairy Tales (Jacobs)", "gid": "7439", "theme": "Spooky & eerie", "band": "G2+", "words": 639, "note": "Boy outwits a child-catcher; tense but safe", "text": "Tommy Grimes was sometimes a good boy, and sometimes a bad boy; and when he was a bad boy, he was a very bad boy. Now his mother used to say to him: “Tommy, Tommy, be a good boy, and don't go out of the street, or else Mr. Miacca will take you.” But still when he was a bad boy he would go out of the street; and one day, sure enough, he had scarcely got round the corner, when Mr. Miacca did catch him and popped him into a bag upside down, and took him off to his house.\n\nWhen Mr. Miacca got Tommy inside, he pulled him out of the bag and set him down, and felt his arms and legs. “You're rather tough,” says he; “but you're all I've got for supper, and you'll not taste bad boiled. But body o' me, I've forgot the herbs, and it's bitter you'll taste without herbs. Sally! Here, I say, Sally!” and he called Mrs. Miacca.\n\nSo Mrs. Miacca came out of another room and said: “What d'ye want, my dear?”\n\n“Oh, here's a little boy for supper,” said Mr. Miacca, “and I've forgot the herbs. Mind him, will ye, while I go for them.”\n\n“All right, my love,” says Mrs. Miacca, and off he goes.\n\nThen Tommy Grimes said to Mrs. Miacca: “Does Mr. Miacca always have little boys for supper?”\n\n“Mostly, my dear,” said Mrs. Miacca, “if little boys are bad enough, and get in his way.”\n\n“And don't you have anything else but boy-meat? No pudding?” asked Tommy.\n\n“Ah, I loves pudding,” says Mrs. Miacca. “But it's not often the likes of me gets pudding.”\n\n“Why, my mother is making a pudding this very day,” said Tommy Grimes, “and I am sure she'd give you some, if I ask her. Shall I run and get some?”\n\n“Now, that's a thoughtful boy,” said Mrs. Miacca, “only don't be long and be sure to be back for supper.”\n\nSo off Tommy pelters, and right glad he was to get off so cheap; and for many a long day he was as good as good could be, and never went round the corner of the street. But he couldn't always be good; and one day he went round the corner, and as luck would have it, he hadn't scarcely got round it when Mr. Miacca grabbed him up, popped him in his bag, and took him home.\n\nWhen he got him there, Mr. Miacca dropped him out; and when he saw him, he said: “Ah, you're the youngster what served me and my missus that shabby trick, leaving us without any supper. Well, you shan't do it again. I'll watch over you myself. Here, get under the sofa, and I'll set on it and watch the pot boil for you.”\n\nSo poor Tommy Grimes had to creep under the sofa, and Mr. Miacca sat on it and waited for the pot to boil. And they waited, and they waited, but still the pot didn't boil, till at last Mr. Miacca got tired of waiting, and he said: “Here, you under there, I'm not going to wait any longer; put out your leg, and I'll stop your giving us the slip.”\n\nSo Tommy put out a leg, and Mr. Miacca got a chopper, and chopped it off, and pops it in the pot.\n\nSuddenly he calls out: “Sally, my dear, Sally!” and nobody answered. So he went into the next room to look out for Mrs. Miacca, and while he was there, Tommy crept out from under the sofa and ran out of the door. For it was a leg of the sofa that he had put out.\n\nSo Tommy Grimes ran home, and he never went round the corner again till he was old enough to go alone."}, {"id": "the-strange-visitor", "title": "The Strange Visitor", "byline": "", "src": "English Fairy Tales (Jacobs)", "gid": "7439", "theme": "Spooky & eerie", "band": "G3+", "words": 516, "note": "A creature assembles itself piece by piece; great refrain. Some Scots dialect", "text": "A woman was sitting at her reel one night; And still she sat, and still she reeled, and still she wished for company.\n\nIn came a pair of broad broad soles, and sat down at the fireside;\n\nAnd still she sat, and still she reeled, and still she wished for company.\n\nIn came a pair of small small legs, and sat down on the broad broad soles;\n\nAnd still she sat, and still she reeled, and still she wished for company.\n\nIn came a pair of thick thick knees, and sat down on the small small legs;\n\nAnd still she sat, and still she reeled, and still she wished for company.\n\nIn came a pair of thin thin thighs, and sat down on the thick thick knees;\n\nAnd still she sat, and still she reeled, and still she wished for company.\n\nIn came a pair of huge huge hips, and sat down on the thin thin thighs;\n\nAnd still she sat, and still she reeled, and still she wished for company.\n\nIn came a wee wee waist, and sat down on the huge huge hips;\n\nAnd still she sat, and still she reeled, and still she wished for company.\n\nIn came a pair of broad broad shoulders, and sat down on the wee wee waist;\n\nAnd still she sat, and still she reeled, and still she wished for company.\n\nIn came a pair of small small arms, and sat down on the broad broad shoulders;\n\nAnd still she sat, and still she reeled, and still she wished for company.\n\nIn came a pair of huge huge hands, and sat down on the small small arms;\n\nAnd still she sat, and still she reeled, and still she wished for company.\n\nIn came a small small neck, and sat down on the broad broad shoulders;\n\nAnd still she sat, and still she reeled, and still she wished for company.\n\nIn came a huge huge head, and sat down on the small small neck.\n\n“How did you get such broad broad feet?” quoth the woman.\n\n“Much tramping, much tramping” (gruffly).\n\n“How did you get such small small legs?”\n\n“Aih-h-h!-late—and wee-e-e—moul” (whiningly).\n\n“How did you get such thick thick knees?”\n\n“Much praying, much praying” (piously).\n\n“How did you get such thin thin thighs?”\n\n“Aih-h-h!—late—and wee-e-e—moul” (whiningly).\n\n“How did you get such big big hips?”\n\n“Much sitting, much sitting” (gruffly).\n\n“How did you get such a wee wee waist?”\n\n“Aih-h-h!—late—and wee-e-e-moul” (whiningly).\n\n“How did you get such broad broad shoulders?”\n\n“With carrying broom, with carrying broom” (gruffly).\n\n“How did you get such small small arms?”\n\n“Aih-h-h!—late—and wee-e-e—moul” (whiningly.)\n\n“How did you get such huge huge hands?”\n\n“Threshing with an iron flail, threshing with an iron flail” (gruffly).\n\n“How did you get such a small small neck?”\n\n“Aih-h-h!—late—wee-e-e—moul” (pitifully).\n\n“How did you get such a huge huge head?”\n\n“Much knowledge, much knowledge” (keenly).\n\n“What do you come for?”\n\n“FOR YOU!” (At the top of the voice, with a wave of the arm and a stamp of the feet.)"}, {"id": "the-cauld-lad-of-hilton", "title": "The Cauld Lad of Hilton", "byline": "", "src": "English Fairy Tales (Jacobs)", "gid": "7439", "theme": "Spooky & eerie", "band": "G3+", "words": 429, "note": "Friendly ghost", "text": "At Hilton Hall, long years ago, there lived a Brownie that was the contrariest Brownie you ever knew. At night, after the servants had gone to bed, it would turn everything topsy-turvy, put sugar in the salt-cellars, pepper into the beer, and was up to all kinds of pranks. It would throw the chairs down, put tables on their backs, rake out fires, and do as much mischief as could be. But sometimes it would be in a good temper, and then!—“What's a Brownie?” you say. Oh, it's a kind of a sort of a Bogle, but it isn't so cruel as a Redcap! What! you don't know what's a Bogle or a Redcap! Ah, me! what's the world a-coming to? Of course a Brownie is a funny little thing, half man, half goblin, with pointed ears and hairy hide. When you bury a treasure, you scatter over it blood drops of a newly slain kid or lamb, or, better still, bury the animal with the treasure, and a Brownie will watch over it for you, and frighten everybody else away.\n\nWhere was I? Well, as I was a-saying, the Brownie at Hilton Hall would play at mischief, but if the servants laid out for it a bowl of cream, or a knuckle cake spread with honey, it would clear away things for them, and make everything tidy in the kitchen. One night, however, when the servants had stopped up late, they heard a noise in the kitchen, and, peeping in, saw the Brownie swinging to and fro on the Jack chain, and saying:\n\n  “Woe's me! woe's me!\n  The acorn's not yet\n  Fallen from the tree,\n  That's to grow the wood,\n  That's to make the cradle,\n  That's to rock the bairn,\n  That's to grow to the man,\n  That's to lay me.\n  Woe's me! woe's me!”\n \n\nSo they took pity on the poor Brownie, and asked the nearest henwife what they should do to send it away. “That's easy enough,” said the henwife, and told them that a Brownie that's paid for its service, in aught that's not perishable, goes away at once. So they made a cloak of Lincoln green, with a hood to it, and put it by the hearth and watched. They saw the Brownie come up, and seeing the hood and cloak, put them on, and frisk about, dancing on one leg and saying:\n\n  “I've taken your cloak, I've taken your hood;\n  The Cauld Lad of Hilton will do no more good.”\n \n\nAnd with that it vanished, and was never seen or heard of afterwards."}, {"id": "fairy-ointment", "title": "Fairy Ointment", "byline": "", "src": "English Fairy Tales (Jacobs)", "gid": "7439", "theme": "Spooky & eerie", "band": "G3+", "words": 804, "note": "Eerie fairy tale; short", "text": "Dame Goody was a nurse that looked after sick people, and minded babies. One night she was woke up at midnight, and when she went downstairs, she saw a strange squinny-eyed, little ugly old fellow, who asked her to come to his wife who was too ill to mind her baby. Dame Goody didn't like the look of the old fellow, but business is business; so she popped on her things, and went down to him. And when she got down to him, he whisked her up on to a large coal-black horse with fiery eyes, that stood at the door; and soon they were going at a rare pace, Dame Goody holding on to the old fellow like grim death.\n\nThey rode, and they rode, till at last they stopped before a cottage door. So they got down and went in and found the good woman abed with the children playing about; and the babe, a fine bouncing boy, beside her.\n\nDame Goody took the babe, which was as fine a baby boy as you'd wish to see. The mother, when she handed the baby to Dame Goody to mind, gave her a box of ointment, and told her to stroke the baby's eyes with it as soon as it opened them. After a while it began to open its eyes. Dame Goody saw that it had squinny eyes just like its father. So she took the box of ointment and stroked its two eyelids with it. But she couldn't help wondering what it was for, as she had never seen such a thing done before. So she looked to see if the others were looking, and, when they were not noticing she stroked her own right eyelid with the ointment.\n\nNo sooner had she done so, than everything seemed changed about her. The cottage became elegantly furnished. The mother in the bed was a beautiful lady, dressed up in white silk. The little baby was still more beautiful than before, and its clothes were made of a sort of silvery gauze. Its little brothers and sisters around the bed were flat-nosed imps with pointed ears, who made faces at one another, and scratched their polls. Sometimes they would pull the sick lady's ears with their long and hairy paws. In fact, they were up to all kinds of mischief; and Dame Goody knew that she had got into a house of pixies. But she said nothing to nobody, and as soon as the lady was well enough to mind the baby, she asked the old fellow to take her back home. So he came round to the door with the coal-black horse with eyes of fire, and off they went as fast as before, or perhaps a little faster, till they came to Dame Goody's cottage, where the squinny-eyed old fellow lifted her down and left her, thanking her civilly enough, and paying her more than she had ever been paid before for such service.\n\nNow next day happened to be market-day, and as Dame Goody had been away from home, she wanted many things in the house, and trudged off to get them at the market. As she was buying the things she wanted, who should she see but the squinny-eyed old fellow who had taken her on the coal-black horse. And what do you think he was doing? Why he went about from stall to stall taking up things from each, here some fruit, and there some eggs, and so on; and no one seemed to take any notice.\n\nNow Dame Goody did not think it her business to interfere, but she thought she ought not to let so good a customer pass without speaking. So she ups to him and bobs a curtsey and said: “Gooden, sir, I hopes as how your good lady and the little one are as well as——”\n\nBut she couldn't finish what she was a-saying, for the funny old fellow started back in surprise, and he says to her, says he: “What! do you see me today?”\n\n“See you,” says she, “why, of course I do, as plain as the sun in the skies, and what's more,” says she, “I see you are busy too, into the bargain.”\n\n“Ah, you see too much,” said he; “now, pray, with which eye do you see all this?”\n\n“With the right eye to be sure,” said she, as proud as can be to find him out.\n\n“The ointment! The ointment!” cried the old pixy thief. “Take that for meddling with what don't concern you: you shall see me no more.” And with that he struck her on her right eye, and she couldn't see him any more; and, what was worse, she was blind on the right side from that hour till the day of her death."}, {"id": "mr-fox", "title": "Mr. Fox", "byline": "", "src": "English Fairy Tales (Jacobs)", "gid": "7439", "theme": "Spooky & eerie", "band": "G5", "words": 190, "note": "Bluebeard-type; preview first (a severed hand)", "text": "Lady Mary was young, and Lady Mary was fair. She had two brothers, and more lovers than she could count. But of them all, the bravest and most gallant, was a Mr. Fox, whom she met when she was down at her father's country-house. No one knew who Mr. Fox was; but he was certainly brave, and surely rich, and of all her lovers, Lady Mary cared for him alone. At last it was agreed upon between them that they should be married. Lady Mary asked Mr. Fox where they should live, and he described to her his castle, and where it was; but, strange to say, did not ask her, or her brothers to come and see it.\n\nSo one day, near the wedding-day, when her brothers were out, and Mr. Fox was away for a day or two on business, as he said, Lady Mary set out for Mr. Fox's castle. And after many searchings, she came at last to it, and a fine strong house it was, with high walls and a deep moat. And when she came up to the gateway she saw written on it:"}, {"id": "the-rose-tree", "title": "The Rose-tree", "byline": "", "src": "English Fairy Tales (Jacobs)", "gid": "7439", "theme": "Spooky & eerie", "band": "G5", "words": 955, "note": "Dark (a child is killed and returns as a bird); preview first", "text": "There was once upon a time a good man who had two children: a girl by a first wife, and a boy by the second. The girl was as white as milk, and her lips were like cherries. Her hair was like golden silk, and it hung to the ground. Her brother loved her dearly, but her wicked stepmother hated her. “Child,” said the stepmother one day, “go to the grocer's shop and buy me a pound of candles.” She gave her the money; and the little girl went, bought the candles, and started on her return. There was a stile to cross. She put down the candles whilst she got over the stile. Up came a dog and ran off with the candles.\n\nShe went back to the grocer's, and she got a second bunch. She came to the stile, set down the candles, and proceeded to climb over. Up came the dog and ran off with the candles.\n\nShe went again to the grocer's, and she got a third bunch; and just the same happened. Then she came to her stepmother crying, for she had spent all the money and had lost three bunches of candles.\n\nThe stepmother was angry, but she pretended not to mind the loss. She said to the child: “Come, lay your head on my lap that I may comb your hair.” So the little one laid her head in the woman's lap, who proceeded to comb the yellow silken hair. And when she combed the hair fell over her knees, and rolled right down to the ground.\n\nThen the stepmother hated her more for the beauty of her hair; so she said to her, “I cannot part your hair on my knee, fetch a billet of wood.” So she fetched it. Then said the stepmother, “I cannot part your hair with a comb, fetch me an axe.” So she fetched it.\n\n“Now,” said the wicked woman, “lay your head down on the billet whilst I part your hair.”\n\nWell! she laid down her little golden head without fear; and whist! down came the axe, and it was off. So the mother wiped the axe and laughed.\n\nThen she took the heart and liver of the little girl, and she stewed them and brought them into the house for supper. The husband tasted them and shook his head. He said they tasted very strangely. She gave some to the little boy, but he would not eat. She tried to force him, but he refused, and ran out into the garden, and took up his little sister, and put her in a box, and buried the box under a rose-tree; and every day he went to the tree and wept, till his tears ran down on the box.\n\nOne day the rose-tree flowered. It was spring, and there among the flowers was a white bird; and it sang, and sang, and sang like an angel out of heaven. Away it flew, and it went to a cobbler's shop, and perched itself on a tree hard by; and thus it sang,\n\n  “My wicked mother slew me,\n  My dear father ate me,\n  My little brother whom I love\n  Sits below, and I sing above\n    Stick, stock, stone dead.”\n \n\n“Sing again that beautiful song,” asked the shoemaker. “If you will first give me those little red shoes you are making.” The cobbler gave the shoes, and the bird sang the song; then flew to a tree in front of a watchmaker's, and sang:\n\n  “My wicked mother slew me,\n  My dear father ate me,\n  My little brother whom I love\n  Sits below, and I sing above\n    Stick, stock, stone dead.”\n \n\n“Oh, the beautiful song! sing it again, sweet bird,” asked the watchmaker. “If you will give me first that gold watch and chain in your hand.” The jeweller gave the watch and chain. The bird took it in one foot, the shoes in the other, and, after having repeated the song, flew away to where three millers were picking a millstone. The bird perched on a tree and sang:\n\n  “My wicked mother slew me,\n  My dear father ate me,\n  My little brother whom I love\n  Sits below, and I sing above\n    Stick!”\n \n\nThen one of the men put down his tool and looked up from his work,\n\n  “Stock!”\n \n\nThen the second miller's man laid aside his tool and looked up,\n\n  “Stone!”\n \n\nThen the third miller's man laid down his tool and looked up,\n\n  “Dead!”\n \n\nThen all three cried out with one voice: “Oh, what a beautiful song! Sing it, sweet bird, again.” “If you will put the millstone round my neck,” said the bird. The men did what the bird wanted and away to the tree it flew with the millstone round its neck, the red shoes in one foot, and the gold watch and chain in the other. It sang the song and then flew home. It rattled the millstone against the eaves of the house, and the stepmother said: “It thunders.” Then the little boy ran out to see the thunder, and down dropped the red shoes at his feet. It rattled the millstone against the eaves of the house once more, and the stepmother said again: “It thunders.” Then the father ran out and down fell the chain about his neck.\n\nIn ran father and son, laughing and saying, “See, what fine things the thunder has brought us!” Then the bird rattled the millstone against the eaves of the house a third time; and the stepmother said: “It thunders again, perhaps the thunder has brought something for me,” and she ran out; but the moment she stepped outside the door, down fell the millstone on her head; and so she died."}, {"id": "the-horned-women", "title": "The Horned Women", "byline": "", "src": "Curry & Clippinger, Children's Literature", "gid": "25545", "theme": "Spooky & eerie", "band": "G3+", "words": 865, "note": "Irish witches; Week 6 tale", "text": "A rich woman sat up late one night carding and preparing wool, while all the family and servants were asleep. Suddenly a knock was given at the door, and a voice called, \"Open! Open!\"\n\n\"Who is there?\" said the woman of the house.\n\n\"I am the Witch of the one Horn,\" was answered.\n\nThe mistress, supposing that one of her neighbors had called and required assistance, opened the door, and a woman entered, having in her hand a pair of wool carders, and bearing a horn on her forehead, as if growing there. She sat down by the fire in silence, and began to card the wool with violent haste. Suddenly she paused, and said aloud: \"Where are the women; they delay too long.\"\n\nThen a second knock came to the door, and a voice called as before, \"Open! Open!\"\n\nThe mistress felt herself constrained to rise and open to the call, and immediately a second witch entered, having two horns on her forehead, and in her hand a wheel for spinning wool.\n\n\"Give me place,\" she said, \"I am the Witch of the two Horns\"; and she began to spin as quick as lightning.\n\nAnd so the knocks went on, and the call was heard, and the witches entered, until at last, twelve women sat round the fire—the first with one horn, the last with twelve horns.\n\nAnd they carded the thread, and turned their spinning wheels, and wound and wove.\n\nAll were singing together an ancient rhyme, but no word did they speak to the mistress of the house. Strange to hear and frightful to look upon were these twelve women, with their horns and their wheels; and the mistress felt near to death, and she tried to rise that she might call for help, but she could not move, nor could she utter a word or a cry, for the spell of the witches was upon her.\n\nThen one of them called to her in Irish, and said, \"Rise, woman, and make us a cake.\" Then the mistress searched for a vessel to bring water from the well that she might mix the meal and make the cake, but she could find none.\n\nAnd they said to her, \"Take a sieve, and bring water in it.\" And she took the sieve and went to the well; but the water poured from it, and she could fetch none for the cake, and she sat down by the well and wept.\n\nThen came a voice by her, and said, \"Take yellow clay and moss and bind them together, and plaster the sieve so that it will hold.\"\n\nThis she did, and the sieve held the water for the cake; and the voice said again: \"Return, and when thou comest to the north angle of the house cry aloud three times, and say, 'The mountain of the Fenian women and the sky over it is all on fire.'\"\n\nAnd she did so.\n\nWhen the witches inside heard the call, a great and terrible cry broke from their lips, and they rushed forth with wild lamentations and shrieks, and fled away to Slievenamon, where was their chief abode. But the Spirit of the Well bade the mistress of the house to enter and prepare her home against the enchantments of the witches, if they returned again.\n\nAnd first, to break their spells, she sprinkled the water in which she had washed her child's feet (the feet-water) outside the door on the threshold; secondly, she took the cake which the witches had made in her absence, of meal mixed with the blood drawn from the sleeping family, and she broke the cake in bits, and placed a bit in the mouth of each sleeper, and they were restored; and she took the cloth they had woven, and placed it half in and half out of the chest with the padlock; and, lastly, she secured the door with a great crossbeam fastened in the jambs, so that they could not enter, and having done these things she waited.\n\nNot long were the witches in coming, and they raged and called for vengeance.\n\n\"Open! Open!\" they screamed. \"Open, feet-water!\"\n\n\"I cannot,\" said the feet-water; \"I am scattered on the ground, and my path is down to the Lough.\"\n\n\"Open, open, wood and trees and beam!\" they cried to the door.\n\n\"I cannot,\" said the door, \"for the beam is fixed in the jambs, and I have no power to move.\"\n\n\"Open, open, cake that we have made and mingled with blood!\" they cried again.\n\n\"I cannot,\" said the cake, \"for I am broken and bruised, and my blood is on the lips of the sleeping children.\"\n\nThen the witches rushed through the air with great cries, and fled back to Slievenamon, uttering strange curses on the Spirit of the Well, who had wished their ruin. But the woman and the house were left in peace, and a mantle dropped by one of the witches was kept hung up by the mistress as a sign of the night's awful contest; and this mantle was in possession of the same family from generation to generation for five hundred years after."}, {"id": "connla-and-the-fairy-maiden", "title": "Connla and the Fairy Maiden", "byline": "", "src": "Curry & Clippinger, Children's Literature", "gid": "25545", "theme": "Spooky & eerie", "band": "G4+", "words": 863, "note": "Irish; mysterious", "text": "Connla of the Fiery Hair was son of Conn of the Hundred Fights. One day as he stood by the side of his father on the height of Usna, he saw a maiden clad in strange attire towards him coming.\n\n\"Whence comest thou, maiden?\" said Connla.\n\n\"I come from the Plains of the Ever Living,\" she said, \"there where is neither death nor sin. There we keep holiday alway, nor need we help from any in our joy. And in all our pleasure we have no strife. And because we have our homes in the round green hills, men call us the Hill Folk.\"\n\nThe king and all with him wondered much to hear a voice when they saw no one. For save Connla alone, none saw the Fairy Maiden.\n\n\"To whom art thou talking, my son?\" said Conn the king.\n\nThen the maiden answered, \"Connla speaks to a young, fair maid, whom neither death nor old age awaits. I love Connla, and now I call him away to the Plain of Pleasure, Moy Mell, where Boadag is king for aye, nor has there been sorrow or complaint in that land since he held the kingship. Oh, come with me, Connla of the Fiery Hair, ruddy as the dawn, with thy tawny skin. A fairy crown awaits thee to grace thy comely face and royal form. Come, and never shall thy comeliness fade, nor thy youth, till the last awful day of judgment.\"\n\nThe king in fear at what the maiden said, which he heard though he could not see her, called aloud to his Druid, Coran by name. \"O Coran of the many spells,\" he said, \"and of the cunning magic, I call upon thy aid. A task is upon me too great for all my skill and wit, greater than any laid upon me since I seized the kingship. A maiden unseen has met us, and by her power would take from me my dear, my comely son. If thou help not, he will be taken from thy king by woman's wiles and witchery.\"\n\nThen Coran the Druid stood forth and chanted his spells towards the spot where the maiden's voice had been heard. And none heard her voice again, nor could Connla see her longer. Only as she vanished before the Druid's mighty spell, she threw an apple to Connla.\n\nFor a whole month from that day Connla would take nothing, either to eat or to drink, save only from that apple.\n\nBut as he ate, it grew again and always kept whole. And all the while there grew within him a mighty yearning and longing after the maiden he had seen.\n\nBut when the last day of the month of waiting came, Connla stood by the side of the king his father on the Plain of Arcomin, and again he saw the maiden come towards him, and again she spoke to him. \"'Tis a glorious place, forsooth, that Connla holds among shortlived mortals awaiting the day of death. But now the folk of life, the ever-living ones, beg and bid thee come to Moy Mell, the Plain of Pleasure, for they have learnt to know thee, seeing thee in thy home among thy dear ones.\"\n\nWhen Conn the king heard the maiden's voice he called to his men aloud and said: \"Summon swift my Druid Coran, for I see she has again this day the power of speech.\"\n\nThen the maiden said: \"O mighty Conn, Fighter of a Hundred Fights, the Druid's power is little loved; it has little honor in the mighty land, peopled with so many of the upright. When the Law comes, it will do away with the Druid's magic spells that issue from the lips of the false black demon.\"\n\nThen Conn the king observed that since the coming of the maiden Connla his son spoke to none that spake to him. So Conn of the Hundred Fights said to him, \"Is it to thy mind what the woman says, my son?\"\n\n\"'Tis hard upon me,\" said Connla; \"I love my own folk above all things; but yet a longing seizes me for the maiden.\"\n\nWhen the maiden heard this, she answered and said: \"The ocean is not so strong as the waves of thy longing. Come with me in my curragh, the gleaming, straight-gliding crystal canoe. Soon can we reach Boadag's realm. I see the bright sun sink, yet far as it is, we can reach it before dark. There is, too, another land worthy of thy journey, a land joyous to all that seek it. Only wives and maidens dwell there. If thou wilt, we can seek it and live there alone together in joy.\"\n\nWhen the maiden ceased to speak, Connla of the Fiery Hair rushed away from his kinsmen and sprang into the curragh, the gleaming, straight-gliding crystal canoe. And then they all, king and court, saw it glide away over the bright sea towards the setting sun, away and away, till eye could see it no longer. So Connla and the Fairy Maiden went forth on the sea, and were no more seen, nor did any know whither they went."}, {"id": "the-story-of-the-youth-who-went-forth-to-learn-what-fear-was", "title": "The Story of the Youth Who Went Forth to Learn What Fear Was", "byline": "", "src": "Grimms' Fairy Tales", "gid": "2591", "theme": "Spooky & eerie", "band": "G4+", "words": 3786, "note": "Funny-scary; a boy who can't be frightened. Groups 4-5", "text": "A certain father had two sons, the elder of who was smart and sensible, and could do everything, but the younger was stupid and could neither learn nor understand anything, and when people saw him they said: ‘There’s a fellow who will give his father some trouble!’ When anything had to be done, it was always the elder who was forced to do it; but if his father bade him fetch anything when it was late, or in the night-time, and the way led through the churchyard, or any other dismal place, he answered: ‘Oh, no father, I’ll not go there, it makes me shudder!’ for he was afraid. Or when stories were told by the fire at night which made the flesh creep, the listeners sometimes said: ‘Oh, it makes us shudder!’ The younger sat in a corner and listened with the rest of them, and could not imagine what they could mean. ‘They are always saying: “It makes me shudder, it makes me shudder!” It does not make me shudder,’ thought he. ‘That, too, must be an art of which I understand nothing!’\n\nNow it came to pass that his father said to him one day: ‘Hearken to me, you fellow in the corner there, you are growing tall and strong, and you too must learn something by which you can earn your bread. Look how your brother works, but you do not even earn your salt.’ ‘Well, father,’ he replied, ‘I am quite willing to learn something—indeed, if it could but be managed, I should like to learn how to shudder. I don’t understand that at all yet.’ The elder brother smiled when he heard that, and thought to himself: ‘Goodness, what a blockhead that brother of mine is! He will never be good for anything as long as he lives! He who wants to be a sickle must bend himself betimes.’\n\nThe father sighed, and answered him: ‘You shall soon learn what it is to shudder, but you will not earn your bread by that.’\n\nSoon after this the sexton came to the house on a visit, and the father bewailed his trouble, and told him how his younger son was so backward in every respect that he knew nothing and learnt nothing. ‘Just think,’ said he, ‘when I asked him how he was going to earn his bread, he actually wanted to learn to shudder.’ ‘If that be all,’ replied the sexton, ‘he can learn that with me. Send him to me, and I will soon polish him.’ The father was glad to do it, for he thought: ‘It will train the boy a little.’ The sexton therefore took him into his house, and he had to ring the church bell. After a day or two, the sexton awoke him at midnight, and bade him arise and go up into the church tower and ring the bell. ‘You shall soon learn what shuddering is,’ thought he, and secretly went there before him; and when the boy was at the top of the tower and turned round, and was just going to take hold of the bell rope, he saw a white figure standing on the stairs opposite the sounding hole. ‘Who is there?’ cried he, but the figure made no reply, and did not move or stir. ‘Give an answer,’ cried the boy, ‘or take yourself off, you have no business here at night.’\n\nThe sexton, however, remained standing motionless that the boy might think he was a ghost. The boy cried a second time: ‘What do you want here?—speak if you are an honest fellow, or I will throw you down the steps!’ The sexton thought: ‘He can’t mean to be as bad as his words,’ uttered no sound and stood as if he were made of stone. Then the boy called to him for the third time, and as that was also to no purpose, he ran against him and pushed the ghost down the stairs, so that it fell down the ten steps and remained lying there in a corner. Thereupon he rang the bell, went home, and without saying a word went to bed, and fell asleep. The sexton’s wife waited a long time for her husband, but he did not come back. At length she became uneasy, and wakened the boy, and asked: ‘Do you know where my husband is? He climbed up the tower before you did.’ ‘No, I don’t know,’ replied the boy, ‘but someone was standing by the sounding hole on the other side of the steps, and as he would neither give an answer nor go away, I took him for a scoundrel, and threw him downstairs. Just go there and you will see if it was he. I should be sorry if it were.’ The woman ran away and found her husband, who was lying moaning in the corner, and had broken his leg.\n\nShe carried him down, and then with loud screams she hastened to the boy’s father, ‘Your boy,’ cried she, ‘has been the cause of a great misfortune! He has thrown my husband down the steps so that he broke his leg. Take the good-for-nothing fellow out of our house.’ The father was terrified, and ran thither and scolded the boy. ‘What wicked tricks are these?’ said he. ‘The devil must have put them into your head.’ ‘Father,’ he replied, ‘do listen to me. I am quite innocent. He was standing there by night like one intent on doing evil. I did not know who it was, and I entreated him three times either to speak or to go away.’ ‘Ah,’ said the father, ‘I have nothing but unhappiness with you. Go out of my sight. I will see you no more.’\n\n‘Yes, father, right willingly, wait only until it is day. Then will I go forth and learn how to shudder, and then I shall, at any rate, understand one art which will support me.’ ‘Learn what you will,’ spoke the father, ‘it is all the same to me. Here are fifty talers for you. Take these and go into the wide world, and tell no one from whence you come, and who is your father, for I have reason to be ashamed of you.’ ‘Yes, father, it shall be as you will. If you desire nothing more than that, I can easily keep it in mind.’\n\nWhen the day dawned, therefore, the boy put his fifty talers into his pocket, and went forth on the great highway, and continually said to himself: ‘If I could but shudder! If I could but shudder!’ Then a man approached who heard this conversation which the youth was holding with himself, and when they had walked a little farther to where they could see the gallows, the man said to him: ‘Look, there is the tree where seven men have married the ropemaker’s daughter, and are now learning how to fly. Sit down beneath it, and wait till night comes, and you will soon learn how to shudder.’ ‘If that is all that is wanted,’ answered the youth, ‘it is easily done; but if I learn how to shudder as fast as that, you shall have my fifty talers. Just come back to me early in the morning.’ Then the youth went to the gallows, sat down beneath it, and waited till evening came. And as he was cold, he lighted himself a fire, but at midnight the wind blew so sharply that in spite of his fire, he could not get warm. And as the wind knocked the hanged men against each other, and they moved backwards and forwards, he thought to himself: ‘If you shiver below by the fire, how those up above must freeze and suffer!’ And as he felt pity for them, he raised the ladder, and climbed up, unbound one of them after the other, and brought down all seven. Then he stoked the fire, blew it, and set them all round it to warm themselves. But they sat there and did not stir, and the fire caught their clothes. So he said: ‘Take care, or I will hang you up again.’ The dead men, however, did not hear, but were quite silent, and let their rags go on burning. At this he grew angry, and said: ‘If you will not take care, I cannot help you, I will not be burnt with you,’ and he hung them up again each in his turn. Then he sat down by his fire and fell asleep, and the next morning the man came to him and wanted to have the fifty talers, and said: ‘Well do you know how to shudder?’ ‘No,’ answered he, ‘how should I know? Those fellows up there did not open their mouths, and were so stupid that they let the few old rags which they had on their bodies get burnt.’ Then the man saw that he would not get the fifty talers that day, and went away saying: ‘Such a youth has never come my way before.’\n\nThe youth likewise went his way, and once more began to mutter to himself: ‘Ah, if I could but shudder! Ah, if I could but shudder!’ A waggoner who was striding behind him heard this and asked: ‘Who are you?’ ‘I don’t know,’ answered the youth. Then the waggoner asked: ‘From whence do you come?’ ‘I know not.’ ‘Who is your father?’ ‘That I may not tell you.’ ‘What is it that you are always muttering between your teeth?’ ‘Ah,’ replied the youth, ‘I do so wish I could shudder, but no one can teach me how.’ ‘Enough of your foolish chatter,’ said the waggoner. ‘Come, go with me, I will see about a place for you.’ The youth went with the waggoner, and in the evening they arrived at an inn where they wished to pass the night. Then at the entrance of the parlour the youth again said quite loudly: ‘If I could but shudder! If I could but shudder!’ The host who heard this, laughed and said: ‘If that is your desire, there ought to be a good opportunity for you here.’ ‘Ah, be silent,’ said the hostess, ‘so many prying persons have already lost their lives, it would be a pity and a shame if such beautiful eyes as these should never see the daylight again.’\n\nBut the youth said: ‘However difficult it may be, I will learn it. For this purpose indeed have I journeyed forth.’ He let the host have no rest, until the latter told him, that not far from thence stood a haunted castle where anyone could very easily learn what shuddering was, if he would but watch in it for three nights. The king had promised that he who would venture should have his daughter to wife, and she was the most beautiful maiden the sun shone on. Likewise in the castle lay great treasures, which were guarded by evil spirits, and these treasures would then be freed, and would make a poor man rich enough. Already many men had gone into the castle, but as yet none had come out again. Then the youth went next morning to the king, and said: ‘If it be allowed, I will willingly watch three nights in the haunted castle.’\n\nThe king looked at him, and as the youth pleased him, he said: ‘You may ask for three things to take into the castle with you, but they must be things without life.’ Then he answered: ‘Then I ask for a fire, a turning lathe, and a cutting-board with the knife.’\n\nThe king had these things carried into the castle for him during the day. When night was drawing near, the youth went up and made himself a bright fire in one of the rooms, placed the cutting-board and knife beside it, and seated himself by the turning-lathe. ‘Ah, if I could but shudder!’ said he, ‘but I shall not learn it here either.’ Towards midnight he was about to poke his fire, and as he was blowing it, something cried suddenly from one corner: ‘Au, miau! how cold we are!’ ‘You fools!’ cried he, ‘what are you crying about? If you are cold, come and take a seat by the fire and warm yourselves.’ And when he had said that, two great black cats came with one tremendous leap and sat down on each side of him, and looked savagely at him with their fiery eyes. After a short time, when they had warmed themselves, they said: ‘Comrade, shall we have a game of cards?’ ‘Why not?’ he replied, ‘but just show me your paws.’ Then they stretched out their claws. ‘Oh,’ said he, ‘what long nails you have! Wait, I must first cut them for you.’ Thereupon he seized them by the throats, put them on the cutting-board and screwed their feet fast. ‘I have looked at your fingers,’ said he, ‘and my fancy for card-playing has gone,’ and he struck them dead and threw them out into the water. But when he had made away with these two, and was about to sit down again by his fire, out from every hole and corner came black cats and black dogs with red-hot chains, and more and more of them came until he could no longer move, and they yelled horribly, and got on his fire, pulled it to pieces, and tried to put it out. He watched them for a while quietly, but at last when they were going too far, he seized his cutting-knife, and cried: ‘Away with you, vermin,’ and began to cut them down. Some of them ran away, the others he killed, and threw out into the fish-pond. When he came back he fanned the embers of his fire again and warmed himself. And as he thus sat, his eyes would keep open no longer, and he felt a desire to sleep. Then he looked round and saw a great bed in the corner. ‘That is the very thing for me,’ said he, and got into it. When he was just going to shut his eyes, however, the bed began to move of its own accord, and went over the whole of the castle. ‘That’s right,’ said he, ‘but go faster.’ Then the bed rolled on as if six horses were harnessed to it, up and down, over thresholds and stairs, but suddenly hop, hop, it turned over upside down, and lay on him like a mountain. But he threw quilts and pillows up in the air, got out and said: ‘Now anyone who likes, may drive,’ and lay down by his fire, and slept till it was day. In the morning the king came, and when he saw him lying there on the ground, he thought the evil spirits had killed him and he was dead. Then said he: ‘After all it is a pity,—for so handsome a man.’ The youth heard it, got up, and said: ‘It has not come to that yet.’ Then the king was astonished, but very glad, and asked how he had fared. ‘Very well indeed,’ answered he; ‘one night is past, the two others will pass likewise.’ Then he went to the innkeeper, who opened his eyes very wide, and said: ‘I never expected to see you alive again! Have you learnt how to shudder yet?’ ‘No,’ said he, ‘it is all in vain. If someone would but tell me!’\n\nThe second night he again went up into the old castle, sat down by the fire, and once more began his old song: ‘If I could but shudder!’ When midnight came, an uproar and noise of tumbling about was heard; at first it was low, but it grew louder and louder. Then it was quiet for a while, and at length with a loud scream, half a man came down the chimney and fell before him. ‘Hullo!’ cried he, ‘another half belongs to this. This is not enough!’ Then the uproar began again, there was a roaring and howling, and the other half fell down likewise. ‘Wait,’ said he, ‘I will just stoke up the fire a little for you.’ When he had done that and looked round again, the two pieces were joined together, and a hideous man was sitting in his place. ‘That is no part of our bargain,’ said the youth, ‘the bench is mine.’ The man wanted to push him away; the youth, however, would not allow that, but thrust him off with all his strength, and seated himself again in his own place. Then still more men fell down, one after the other; they brought nine dead men’s legs and two skulls, and set them up and played at nine-pins with them. The youth also wanted to play and said: ‘Listen you, can I join you?’ ‘Yes, if you have any money.’ ‘Money enough,’ replied he, ‘but your balls are not quite round.’ Then he took the skulls and put them in the lathe and turned them till they were round. ‘There, now they will roll better!’ said he. ‘Hurrah! now we’ll have fun!’ He played with them and lost some of his money, but when it struck twelve, everything vanished from his sight. He lay down and quietly fell asleep. Next morning the king came to inquire after him. ‘How has it fared with you this time?’ asked he. ‘I have been playing at nine-pins,’ he answered, ‘and have lost a couple of farthings.’ ‘Have you not shuddered then?’ ‘What?’ said he, ‘I have had a wonderful time! If I did but know what it was to shudder!’\n\nThe third night he sat down again on his bench and said quite sadly: ‘If I could but shudder.’ When it grew late, six tall men came in and brought a coffin. Then he said: ‘Ha, ha, that is certainly my little cousin, who died only a few days ago,’ and he beckoned with his finger, and cried: ‘Come, little cousin, come.’ They placed the coffin on the ground, but he went to it and took the lid off, and a dead man lay therein. He felt his face, but it was cold as ice. ‘Wait,’ said he, ‘I will warm you a little,’ and went to the fire and warmed his hand and laid it on the dead man’s face, but he remained cold. Then he took him out, and sat down by the fire and laid him on his breast and rubbed his arms that the blood might circulate again. As this also did no good, he thought to himself: ‘When two people lie in bed together, they warm each other,’ and carried him to the bed, covered him over and lay down by him. After a short time the dead man became warm too, and began to move. Then said the youth, ‘See, little cousin, have I not warmed you?’ The dead man, however, got up and cried: ‘Now will I strangle you.’\n\n‘What!’ said he, ‘is that the way you thank me? You shall at once go into your coffin again,’ and he took him up, threw him into it, and shut the lid. Then came the six men and carried him away again. ‘I cannot manage to shudder,’ said he. ‘I shall never learn it here as long as I live.’\n\nThen a man entered who was taller than all others, and looked terrible. He was old, however, and had a long white beard. ‘You wretch,’ cried he, ‘you shall soon learn what it is to shudder, for you shall die.’ ‘Not so fast,’ replied the youth. ‘If I am to die, I shall have to have a say in it.’ ‘I will soon seize you,’ said the fiend. ‘Softly, softly, do not talk so big. I am as strong as you are, and perhaps even stronger.’ ‘We shall see,’ said the old man. ‘If you are stronger, I will let you go—come, we will try.’ Then he led him by dark passages to a smith’s forge, took an axe, and with one blow struck an anvil into the ground. ‘I can do better than that,’ said the youth, and went to the other anvil. The old man placed himself near and wanted to look on, and his white beard hung down. Then the youth seized the axe, split the anvil with one blow, and in it caught the old man’s beard. ‘Now I have you,’ said the youth. ‘Now it is your turn to die.’ Then he seized an iron bar and beat the old man till he moaned and entreated him to stop, when he would give him great riches. The youth drew out the axe and let him go. The old man led him back into the castle, and in a cellar showed him three chests full of gold. ‘Of these,’ said he, ‘one part is for the poor, the other for the king, the third yours.’ In the meantime it struck twelve, and the spirit disappeared, so that the youth stood in darkness. ‘I shall still be able to find my way out,’ said he, and felt about, found the way into the room, and slept there by his fire. Next morning the king came and said: ‘Now you must have learnt what shuddering is?’ ‘No,’ he answered; ‘what can it be? My dead cousin was here, and a bearded man came and showed me a great deal of money down below, but no one told me what it was to shudder.’ ‘Then,’ said the king, ‘you have saved the castle, and shall marry my daughter.’ ‘That is all very well,’ said he, ‘but still I do not know what it is to shudder!’\n\nThen the gold was brought up and the wedding celebrated; but howsoever much the young king loved his wife, and however happy he was, he still said always: ‘If I could but shudder—if I could but shudder.’ And this at last angered her. Her waiting-maid said: ‘I will find a cure for him; he shall soon learn what it is to shudder.’ She went out to the stream which flowed through the garden, and had a whole bucketful of gudgeons brought to her. At night when the young king was sleeping, his wife was to draw the clothes off him and empty the bucket full of cold water with the gudgeons in it over him, so that the little fishes would sprawl about him. Then he woke up and cried: ‘Oh, what makes me shudder so?—what makes me shudder so, dear wife? Ah! now I know what it is to shudder!’"}, {"id": "the-ride-on-the-gravestone", "title": "The Ride on the Gravestone", "byline": "", "src": "Russian Fairy Tales (Ralston)", "gid": "22373", "theme": "Spooky & eerie", "band": "Teacher", "words": 231, "note": "Russian ghost story, 230 words; preview first", "text": "Late one evening a certain artisan happened to be returning home from a jovial feast in a distant village. There met him on the way an old friend, one who had been dead some ten years.\n\n“Good health to you!” said the dead man.\n\n“I wish you good health!” replied the reveller, and straight way forgot that his acquaintance had ever so long ago bidden the world farewell.\n\n“Let’s go to my house. We’ll quaff a cup or two once more.”\n\n“Come along. On such a happy occasion as this meeting of ours, we may as well have a drink.”\n\nThey arrived at a dwelling and there they drank and revelled.\n\n“Now then, good-bye! It’s time for me to go home,” said the artisan.\n\n“Stay a bit. Where do you want to go now? Spend the night here with me.”\n\n“No, brother! don’t ask me; it cannot be. I’ve business to do to-morrow, so I must get home as early as possible.”\n\n“Well, good-bye! but why should you walk? Better get on my horse; it will carry you home quickly.”\n\n“Thanks! let’s have it.”\n\nHe got on its back, and was carried off—just as a whirlwind flies! All of a sudden a cock crew. It was awful! All around were graves, and the rider found he had a gravestone under him!\n\nOf a somewhat similar nature is the story of—"}, {"id": "the-dog-and-the-corpse", "title": "The Dog and the Corpse", "byline": "", "src": "Russian Fairy Tales (Ralston)", "gid": "22373", "theme": "Spooky & eerie", "band": "Teacher", "words": 453, "note": "Russian ghost story; preview first", "text": "A moujik went out in pursuit of game one day, and took a favorite dog with him. He walked and walked through woods and bogs, but got nothing for his pains. At last the darkness of night surprised him. At an uncanny hour he passed by a graveyard, and there, at a place where two roads met, he saw standing a corpse in a white shroud. The moujik was horrified, and knew not which way to go—whether to keep on or to turn back.\n\n“Well, whatever happens, I’ll go on,” he thought; and on he went, his dog running at his heels. When the corpse perceived him, it came to meet him; not touching the earth with its feet, but keeping about a foot above it—the shroud fluttering after it. When it had come up with the sportsman, it made a rush at him; but the dog seized hold of it by its bare calves, and began a tussle with it. When the moujik saw his dog and the corpse grappling with each other, he was delighted that things had turned out so well for himself, and he set off running home with all his might. The dog kept up the struggle until cock-crow, when the corpse fell motionless to the ground. Then the dog ran off in pursuit of its master, caught him up just as he reached home, and rushed at him, furiously trying to bite and to rend him. So savage was it, and so persistent, that it was as much as the people of the house could do to beat it off.\n\n“Whatever has come over the dog?” asked the moujik’s old mother. “Why should it hate its master so?”\n\nThe moujik told her all that had happened.\n\n“A bad piece of work, my son!” said the old woman. “The dog was disgusted at your not helping it. There it was fighting with the corpse—and you deserted it, and thought only of saving yourself! Now it will owe you a grudge for ever so long.”\n\nNext morning, while the family were going about the farmyard, the dog was perfectly quiet. But the moment its master made his appearance, it began to growl like anything.\n\nThey fastened it to a chain; for a whole year they kept it chained up. But in spite of that, it never forgot how its master had offended it. One day it got loose, flew straight at him, and began trying to throttle him.\n\nSo they had to kill it.\n\nIn the next story a most detailed account is given of the manner in which a Vampire sets to work, and also of the best means of ridding the world of it."}, {"id": "the-owl-and-the-pussy-cat", "title": "The Owl and the Pussy-cat", "byline": "Edward Lear", "src": "Curry & Clippinger, Children's Literature", "gid": "25545", "theme": "Poems (read aloud)", "band": "Read aloud", "words": 223, "note": "Nonsense; rhyme and rhythm", "text": "The Owl and the Pussy-Cat went to sea\nIn a beautiful pea-green boat:\nThey took some honey, and plenty of money\nWrapped up in a five-pound note.\nThe Owl looked up to the stars above,\nAnd sang to a small guitar,\n\"O lovely Pussy, O Pussy, my love,\nWhat a beautiful Pussy you are,\nYou are,\nYou are!\nWhat a beautiful Pussy you are!\"\nPussy said to the Owl, \"You elegant fowl,\nHow charmingly sweet you sing!\nOh! let us be married; too long we have tarried:\nBut what shall we do for a ring?\"\nThey sailed away, for a year and a day,\nTo the land where the bong-tree grows;\nAnd there in a wood a Piggy-wig stood,\nWith a ring at the end of his nose,\nHis nose,\nHis nose,\nWith a ring at the end of his nose.\n\"Dear Pig, are you willing to sell for one shilling\nYour ring?\" Said the Piggy, \"I will.\"\nSo they took it away, and were married next day\nBy the Turkey who lives on the hill.\nThey dined on mince, and slices of quince,\nWhich they ate with a runcible spoon;\nAnd hand in hand, on the edge of the sand,\nThey danced by the light of the moon,\nThe moon,\nThe moon,\nThey danced by the light of the moon."}, {"id": "the-walrus-and-the-carpenter", "title": "The Walrus and the Carpenter", "byline": "", "src": "Curry & Clippinger, Children's Literature", "gid": "25545", "theme": "Poems (read aloud)", "band": "Read aloud", "words": 616, "note": "Trickery; narrative poem", "text": "\"LEWIS CARROLL\"\n\nThe sun was shining on the sea,\nShining with all his might:\nHe did his very best to make\nThe billows smooth and bright—\nAnd this was odd, because it was\nThe middle of the night.\nThe moon was shining sulkily,\nBecause she thought the sun\nHad got no business to be there\nAfter the day was done—\n\"It's very rude of him,\" she said,\n\"To come and spoil the fun!\"\nThe sea was wet as wet could be.\nThe sands were dry as dry.\nYou could not see a cloud, because\nNo cloud was in the sky;\nNo birds were flying overhead—\nThere were no birds to fly.\nThe Walrus and the Carpenter\nWere walking close at hand;\nThey wept like anything to see\nSuch quantities of sand:\n\"If this were only cleared away,\"\nThey said, \"it would be grand!\"\n\"If seven maids with seven mops\nSwept it for half a year,\nDo you suppose,\" the Walrus said,\n\"That they could get it clear?\"\n\"I doubt it,\" said the Carpenter,\nAnd shed a bitter tear.\n\"O Oysters, come and walk with us!\"\nThe Walrus did beseech.\n\"A pleasant walk, a pleasant talk,\nAlong the briny beach:\nWe cannot do with more than four,\nTo give a hand to each.\"\nThe eldest Oyster looked at him,\nBut never a word he said:\nThe eldest Oyster winked his eye,\nAnd shook his heavy head—\nMeaning to say he did not choose\nTo leave the oyster-bed.\nBut four young Oysters hurried up,\nAll eager for the treat:\nTheir coats were brushed, their faces washed,\nTheir shoes were clean and neat—\nAnd this was odd, because, you know,\nThey hadn't any feet.\nFour other Oysters followed them,\nAnd yet another four;\nAnd thick and fast they came at last,\nAnd more, and more, and more—\nAll hopping through the frothy waves,\nAnd scrambling to the shore.\nThe Walrus and the Carpenter\nWalked on a mile or so,\nAnd then they rested on a rock\nConveniently low:\nAnd all the little Oysters stood\nAnd waited in a row.\n\"The time has come,\" the Walrus said,\n\"To talk of many things:\nOf shoes—and ships—and sealing wax\nOf cabbages—and kings—\nAnd why the sea is boiling hot—\nAnd whether pigs have wings.\"\n\"But wait a bit,\" the Oysters cried,\n\"Before we have our chat;\nFor some of us are out of breath,\nAnd all of us are fat!\"\n\"No hurry!\" said the Carpenter.\nThey thanked him much for that.\n\"A loaf of bread,\" the Walrus said,\n\"Is what we chiefly need:\nPepper and vinegar besides\nAre very good indeed—\nNow if you're ready, Oysters dear,\nWe can begin to feed.\"\n\"But not on us!\" the Oysters cried,\nTurning a little blue.\n\"After such kindness, that would be\nA dismal thing to do!\"\n\"The night is fine,\" the Walrus said.\n\"Do you admire the view?\n\"It was so kind of you to come!\nAnd you are very nice!\"\nThe Carpenter said nothing but\n\"Cut me another slice:\nI wish you were not quite so deaf—\nI've had to ask you twice!\"\n\"It seems a shame,\" the Walrus said,\n\"To play them such a trick,\nAfter we've brought them out so far,\nAnd made them trot so quick!\"\nThe Carpenter said nothing but\n\"The butter's spread too thick!\"\n\"I weep for you,\" the Walrus said:\n\"I deeply sympathize.\"\nWith sobs and tears he sorted out\nThose of the largest size,\nHolding his pocket handkerchief\nBefore his streaming eyes.\n\"O Oysters,\" cried the Carpenter,\n\"You've had a pleasant run!\nShall we be trotting home again?\"\nBut answer came there none—\nAnd this was scarcely odd, because\nThey'd eaten every one."}, {"id": "the-spider-and-the-fly", "title": "The Spider and the Fly", "byline": "Mary Howitt", "src": "Curry & Clippinger, Children's Literature", "gid": "25545", "theme": "Poems (read aloud)", "band": "Read aloud", "words": 494, "note": "Flattery; pair with The Fox and the Crow", "text": "\"Will you walk into my parlor?\"\nSaid the Spider to the Fly;\n\"'Tis the prettiest little parlor\nThat ever you did spy.\n\"The way into my parlor\nIs up a winding stair,\nAnd I have many curious things\nTo show when you are there.\"\n\"Oh, no, no,\" said the little Fly,\n\"To ask me is in vain;\nFor who goes up your winding stair\nCan ne'er come down again.\"\n\"I'm sure you must be weary, dear,\nWith soaring up so high;\nWill you rest upon my little bed?\"\nSaid the Spider to the Fly.\n\"There are pretty curtains drawn around;\nThe sheets are fine and thin,\nAnd if you like to rest awhile,\nI'll snugly tuck you in!\"\n\"Oh, no, no,\" said the little Fly,\n\"For I've often heard it said,\nThey never, never wake again,\nWho sleep upon your bed.\"\nSaid the cunning Spider to the Fly:\n\"Dear friend, what can I do\nTo prove the warm affection\nI've always felt for you?\n\"I have within my pantry\nGood store of all that's nice:\nI'm sure you're very welcome—\nWill you please to take a slice?\"\n\"Oh, no, no,\" said the little Fly,\n\"Kind sir, that cannot be;\nI've heard what's in your pantry,\nAnd I do not wish to see.\"\n\"Sweet creature!\" said the Spider,\n\"You're witty and you're wise;\nHow handsome are your gauzy wings\nHow brilliant are your eyes!\n\"I have a little looking-glass\nUpon my parlor shelf;\nIf you'll step in one moment, dear,\nYou shall behold yourself.\"\n\"I thank you, gentle sir,\" she said,\n\"For what you're pleased to say,\nAnd, bidding you good-morning now,\nI'll call another day.\"\nThe Spider turned him round about.\nAnd went into his den,\nFor well he knew the silly Fly\nWould soon come back again:\nSo he wove a subtle web\nIn a little corner sly,\nAnd set his table ready\nTo dine upon the Fly.\nThen came out to his door again,\nAnd merrily did sing:\n\"Come hither, hither, pretty Fly,\nWith the pearl and silver wing;\n\"Your robes are green and purple—\nThere's a crest upon your head;\nYour eyes are like the diamond bright,\nBut mine are dull as lead!\"\nAlas, alas! how very soon\nThis silly little Fly,\nHearing his wily, flattering words,\nCame slowly flitting by;\nWith buzzing wings she hung aloft,\nThen near and nearer drew,\nThinking only of her brilliant eyes,\nAnd green and purple hue—\nThinking only of her crested head—\nPoor, foolish thing! At last,\nUp jumped the cunning Spider,\nAnd fiercely held her fast.\nHe dragged her up his winding stair,\nInto his dismal den,\nWithin his little parlor—\nBut she ne'er came out again.\nAnd now, dear little children,\nWho may this story read,\nTo idle, silly, flattering words,\nI pray you ne'er give heed.\nUnto an evil counsellor\nClose heart and ear and eye,\nAnd take a lesson from this tale\nOf the Spider and the Fly."}, {"id": "my-shadow", "title": "My Shadow", "byline": "Robert Louis Stevenson", "src": "Curry & Clippinger, Children's Literature", "gid": "25545", "theme": "Poems (read aloud)", "band": "Read aloud", "words": 190, "note": "Stevenson; easy", "text": "I have a little shadow that goes in and out with me,\nAnd what can be the use of him is more than I can see.\nHe is very, very like me from the heels up to the head;\nAnd I see him jump before me, when I jump into my bed.\nThe funniest thing about him is the way he likes to grow—\nNot at all like proper children, which is always very slow;\nFor he sometimes shoots up taller like an india-rubber ball,\nAnd he sometimes gets so little that there's none of him at all.\nHe hasn't got a notion of how children ought to play,\nAnd can only make a fool of me in every sort of way.\nHe stays so close beside me, he's a coward you can see;\nI'd think shame to stick to nursie as that shadow sticks to me!\nOne morning, very early, before the sun was up,\nI rose and found the shining dew on every buttercup;\nBut my lazy little shadow, like an arrant sleepy-head,\nHad stayed at home behind me and was fast asleep in bed."}, {"id": "windy-nights", "title": "Windy Nights", "byline": "Robert Louis Stevenson", "src": "Curry & Clippinger, Children's Literature", "gid": "25545", "theme": "Poems (read aloud)", "band": "Read aloud", "words": 135, "note": "Stevenson; eerie mood", "text": "Whenever the moon and stars are set,\nWhenever the wind is high,\nAll night long in the dark and wet\nA man goes riding by.\nLate in the night when the fires are out,\nWhy does he gallop and gallop about?\nWhenever the trees are crying aloud,\nAnd ships are tossed at sea,\nBy, on the highway, low and loud,\nBy at the gallop goes he.\nBy at the gallop he goes, and then\nBy he comes back at the gallop again.\n\nThe four poems that follow are from Little-Folk Lyrics, by Frank Dempster Sherman (1860—), and are used here by permission of and special arrangement with the publishers, Houghton Mifflin Co., Boston. Many of Sherman's poems have been found pleasing to children, particularly those dealing with nature themes and with outdoor activities."}, {"id": "who-has-seen-the-wind", "title": "Who Has Seen the Wind?", "byline": "Christina G. Rossetti", "src": "Curry & Clippinger, Children's Literature", "gid": "25545", "theme": "Poems (read aloud)", "band": "Read aloud", "words": 45, "note": "Rossetti; very short", "text": "Who has seen the wind?\nNeither I nor you:\nBut when the leaves hang trembling,\nThe wind is passing thro'.\nWho has seen the wind?\nNeither you nor I:\nBut when the trees bow down their heads,\nThe wind is passing by."}, {"id": "the-tiger", "title": "The Tiger", "byline": "William Blake", "src": "Curry & Clippinger, Children's Literature", "gid": "25545", "theme": "Poems (read aloud)", "band": "Read aloud", "words": 145, "note": "Blake; 'Tyger'", "text": "Tiger, tiger, burning bright\nIn the forests of the night,\nWhat immortal hand or eye\nCould frame thy fearful symmetry?\nIn what distant deeps or skies\nBurnt the fire of thine eyes?\nOn what wings dare he aspire?\nWhat the hand dare seize thy fire?\nAnd what shoulder and what art\nCould twist the sinews of thy heart?\nAnd when thy heart began to beat,\nWhat dread hand formed thy dread feet?\nWhat the hammer? what the chain?\nIn what furnace was thy brain?\nWhat the anvil? what dread grasp\nDare its deadly terrors clasp?\nWhen the stars threw down their spears,\nAnd water'd heaven with their tears,\nDid He smile His work to see?\nDid He who made the lamb make thee?\nTiger, tiger, burning bright\nIn the forests of the night,\nWhat immortal hand or eye\nDare frame thy fearful symmetry?"}, {"id": "casabianca", "title": "Casabianca", "byline": "Felicia Dorothea Hemans", "src": "Curry & Clippinger, Children's Literature", "gid": "25545", "theme": "Poems (read aloud)", "band": "Read aloud", "words": 374, "note": "Duty and courage", "text": "The boy stood on the burning deck,\nWhence all but him had fled;\nThe flame that lit the battle's wreck\nShone round him o'er the dead.\nYet beautiful and bright he stood,\nAs born to rule the storm;\nA creature of he
