<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cambridge IGCSE Biology 0610/22 — May/June 2023</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Source+Serif+4:ital,wght@0,300;0,400;0,600;1,300&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f1117;
    --surface: #181c27;
    --surface2: #1e2335;
    --accent: #4ecca3;
    --accent2: #e8c547;
    --text: #e8e6df;
    --muted: #7a8199;
    --correct: #4ecca3;
    --wrong: #e05c5c;
    --border: rgba(255,255,255,0.07);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Source Serif 4', Georgia, serif;
    font-weight: 300;
    min-height: 100vh;
    line-height: 1.7;
  }

  /* Subtle grid background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: 
      linear-gradient(rgba(78,204,163,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(78,204,163,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  .container {
    max-width: 860px;
    margin: 0 auto;
    padding: 0 24px 80px;
    position: relative;
    z-index: 1;
  }

  /* Header */
  header {
    padding: 60px 0 40px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 48px;
  }

  .exam-tag {
    display: inline-block;
    font-family: 'Source Serif 4', serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--accent);
    border: 1px solid var(--accent);
    padding: 4px 12px;
    margin-bottom: 20px;
  }

  h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(28px, 5vw, 48px);
    font-weight: 900;
    line-height: 1.1;
    color: #fff;
    margin-bottom: 12px;
  }

  h1 span { color: var(--accent); }

  .subtitle {
    font-size: 15px;
    color: var(--muted);
    font-style: italic;
  }

  .meta-row {
    display: flex;
    gap: 32px;
    margin-top: 24px;
    flex-wrap: wrap;
  }

  .meta-item {
    font-size: 13px;
    color: var(--muted);
    letter-spacing: 0.05em;
  }

  .meta-item strong {
    color: var(--accent2);
    font-style: normal;
    font-weight: 600;
  }

  /* Progress bar */
  .progress-bar-wrap {
    position: sticky;
    top: 0;
    z-index: 100;
    background: var(--bg);
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
    margin-bottom: 40px;
  }

  .progress-info {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 6px;
    letter-spacing: 0.05em;
  }

  #progress-count { color: var(--accent); font-weight: 600; }

  .progress-track {
    height: 3px;
    background: var(--surface2);
    border-radius: 2px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 2px;
    transition: width 0.4s ease;
    width: 0%;
  }

  /* Questions */
  .question-block {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 32px;
    margin-bottom: 20px;
    transition: border-color 0.2s;
    position: relative;
  }

  .question-block:hover { border-color: rgba(78,204,163,0.2); }

  .question-block.answered { border-color: rgba(78,204,163,0.15); }

  .q-number {
    font-family: 'Playfair Display', serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 10px;
  }

  .q-text {
    font-size: 16px;
    color: var(--text);
    margin-bottom: 24px;
    line-height: 1.65;
  }

  .q-text .note {
    font-style: italic;
    color: var(--muted);
    font-size: 14px;
    display: block;
    margin-top: 6px;
  }

  .options {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .option {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    padding: 14px 16px;
    border: 1px solid var(--border);
    border-radius: 2px;
    cursor: pointer;
    transition: all 0.15s ease;
    background: var(--surface2);
    font-size: 15px;
    line-height: 1.55;
    user-select: none;
  }

  .option:hover {
    border-color: rgba(78,204,163,0.4);
    background: rgba(78,204,163,0.04);
  }

  .option.selected {
    border-color: var(--accent);
    background: rgba(78,204,163,0.08);
  }

  .option-letter {
    flex-shrink: 0;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    border: 1px solid var(--muted);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Playfair Display', serif;
    font-size: 12px;
    font-weight: 700;
    color: var(--muted);
    transition: all 0.15s;
    margin-top: 1px;
  }

  .option.selected .option-letter {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(78,204,163,0.15);
  }

  /* Results state */
  .option.correct {
    border-color: var(--correct) !important;
    background: rgba(78,204,163,0.1) !important;
  }

  .option.wrong {
    border-color: var(--wrong) !important;
    background: rgba(224,92,92,0.08) !important;
  }

  .option.correct .option-letter {
    border-color: var(--correct);
    color: var(--correct);
    background: rgba(78,204,163,0.2);
  }

  .option.wrong .option-letter {
    border-color: var(--wrong);
    color: var(--wrong);
    background: rgba(224,92,92,0.15);
  }

  .option.show-correct {
    border-color: var(--correct) !important;
    background: rgba(78,204,163,0.05) !important;
  }

  .option.show-correct .option-letter {
    border-color: var(--correct);
    color: var(--correct);
  }

  .result-icon {
    display: none;
    font-size: 16px;
    margin-left: auto;
    flex-shrink: 0;
    align-self: center;
  }

  .explanation {
    display: none;
    margin-top: 20px;
    padding: 16px 18px;
    background: rgba(232,197,71,0.06);
    border-left: 3px solid var(--accent2);
    font-size: 14px;
    color: #c9c5b8;
    line-height: 1.65;
    border-radius: 0 2px 2px 0;
  }

  .explanation strong { color: var(--accent2); }

  .explanation.visible { display: block; }

  /* Submit / Results section */
  .submit-area {
    margin-top: 48px;
    text-align: center;
  }

  .btn-submit {
    font-family: 'Playfair Display', serif;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--bg);
    background: var(--accent);
    border: none;
    padding: 18px 56px;
    cursor: pointer;
    border-radius: 2px;
    transition: all 0.2s;
  }

  .btn-submit:hover {
    background: #5fe0b5;
    transform: translateY(-1px);
    box-shadow: 0 8px 32px rgba(78,204,163,0.25);
  }

  .btn-submit:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    transform: none;
    box-shadow: none;
  }

  .unanswered-note {
    font-size: 13px;
    color: var(--wrong);
    margin-top: 12px;
    font-style: italic;
    display: none;
  }

  /* Score panel */
  #score-panel {
    display: none;
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 48px 40px;
    text-align: center;
    margin-bottom: 48px;
    position: relative;
    overflow: hidden;
  }

  #score-panel::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--accent), var(--accent2), var(--accent));
  }

  .score-title {
    font-family: 'Playfair Display', serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 16px;
  }

  .score-big {
    font-family: 'Playfair Display', serif;
    font-size: 72px;
    font-weight: 900;
    line-height: 1;
    color: var(--accent);
    margin-bottom: 8px;
  }

  .score-max { font-size: 32px; color: var(--muted); }

  .score-percent {
    font-size: 20px;
    color: var(--accent2);
    margin-bottom: 16px;
    font-style: italic;
  }

  .score-grade {
    font-family: 'Playfair Display', serif;
    font-size: 18px;
    font-weight: 700;
    color: #fff;
    margin-bottom: 24px;
  }

  .score-bar-wrap {
    max-width: 400px;
    margin: 0 auto 24px;
    height: 8px;
    background: var(--surface2);
    border-radius: 4px;
    overflow: hidden;
  }

  .score-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 4px;
    transition: width 1.2s cubic-bezier(0.4,0,0.2,1);
    width: 0;
  }

  .btn-retry {
    font-family: 'Playfair Display', serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--accent);
    background: transparent;
    border: 1px solid var(--accent);
    padding: 12px 32px;
    cursor: pointer;
    margin-top: 16px;
    transition: all 0.2s;
  }

  .btn-retry:hover { background: rgba(78,204,163,0.1); }

  /* Disabled after submit */
  .option.locked { cursor: default; pointer-events: none; }

  /* Table support for Q3 */
  .q-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    margin: 12px 0 8px;
    color: var(--text);
  }

  .q-table th {
    border: 1px solid var(--muted);
    padding: 6px 12px;
    text-align: center;
    font-weight: 600;
    color: var(--accent2);
    background: var(--surface2);
    font-family: 'Source Serif 4', serif;
  }

  .q-table td {
    border: 1px solid rgba(255,255,255,0.1);
    padding: 6px 12px;
    text-align: center;
  }

  .q-table tr:nth-child(odd) td { background: rgba(255,255,255,0.02); }

  .diagram-wrap {
    margin: 16px 0 20px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 20px;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow-x: auto;
  }

  .diagram-wrap svg {
    max-width: 100%;
    height: auto;
    display: block;
  }

  .diagram-caption {
    font-size: 12px;
    color: var(--muted);
    text-align: center;
    margin-top: 10px;
    font-style: italic;
    letter-spacing: 0.04em;
  }

  @media (max-width: 600px) {
    .question-block { padding: 22px 18px; }
    header { padding: 40px 0 28px; }
    .score-big { font-size: 52px; }
  }
</style>
<body>
<div class="container">

  <header>
    <div class="exam-tag">Cambridge IGCSE · Biology 0610/22</div>
    <h1>Paper 2 <span>Multiple Choice</span><br>Extended</h1>
    <p class="subtitle">May / June 2023 — Revision Edition</p>
    <div class="meta-row">
      <div class="meta-item"><strong>40</strong> Questions</div>
      <div class="meta-item"><strong>40</strong> Marks</div>
      <div class="meta-item"><strong>45</strong> Minutes (suggested)</div>
    </div>
  </header>

  <div id="score-panel">
    <div class="score-title">Your Result</div>
    <div class="score-big"><span id="score-num">0</span><span class="score-max">/40</span></div>
    <div class="score-percent" id="score-pct"></div>
    <div class="score-grade" id="score-grade"></div>
    <div class="score-bar-wrap"><div class="score-bar-fill" id="score-bar"></div></div>
    <p style="font-size:14px;color:var(--muted);font-style:italic;">Scroll down to review each question with explanations.</p>
    <button class="btn-retry" onclick="location.reload()">↺ Start Again</button>
  </div>

  <div class="progress-bar-wrap">
    <div class="progress-info">
      <span>Progress</span>
      <span><span id="progress-count">0</span> / 40 answered</span>
    </div>
    <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
  </div>

  <div id="quiz"></div>

  <div class="submit-area">
    <button class="btn-submit" id="btn-submit" onclick="submitExam()">Submit Answers</button>
    <p class="unanswered-note" id="unanswered-note"></p>
  </div>

</div>

<script>
const questions = [
  {
    n: 1,
    q: "Which process occurs both in plants and in animals?",
    opts: ["Excretion","Phagocytosis","Photosynthesis","Transpiration"],
    ans: "A",
    exp: "Excretion — the removal of metabolic waste products — occurs in both plants and animals. Phagocytosis is an animal/protist process; photosynthesis occurs only in plants (and algae/some bacteria); transpiration (water loss from leaves) is plant-specific."
  },
  {
    n: 2,
    q: "Some statements about species are given:\n1. Members of a species all look identical.\n2. Members of a species belong to the same genus.\n3. Members of a species can produce fertile offspring.\n4. Species are named using an international system.\nWhich statements are correct?",
    opts: ["1, 2, 3 and 4","1, 2 and 3 only","2 and 4 only","2, 3 and 4 only"],
    ans: "D",
    exp: "Statement 1 is false — members of a species do not all look identical (e.g. humans show great variation). Statements 2, 3, and 4 are all correct: members of a species share a genus name, can interbreed to produce fertile offspring (the biological species concept), and are named using the binomial nomenclature system."
  },
  {
    n: 3,
    q: "Which structures are found in the cells of all living organisms?\n1. cell membrane\n2. chloroplast\n3. cytoplasm",
    opts: ["1, 2 and 3","1 and 2 only","1 and 3 only","2 and 3 only"],
    ans: "C",
    exp: "All living cells have a cell membrane and cytoplasm. Chloroplasts are found only in plant cells and algae — not in animal cells, fungi, or bacteria. So only 1 (cell membrane) and 3 (cytoplasm) are universal."
  },
  {
    n: 4,
    q: "In the diagram of a palisade cell, the distance between X and Y is 20 mm. The actual width of the cell between X and Y is 40 μm. What is the magnification of the diagram?", diagram: `<svg viewBox="0 0 280 140" xmlns="http://www.w3.org/2000/svg" width="280" height="140">
<style>.cell{fill:#1e3028;stroke:#4ecca3;stroke-width:1.8}.chl{fill:#2d6040;stroke:none}.lbl{fill:#e8e6df;font-size:11px;font-family:serif;text-anchor:middle}.acc{fill:#4ecca3;font-size:11px;font-family:serif}<\/style>
<!-- Palisade cell - tall rectangular -->
<rect x="80" y="15" width="120" height="100" class="cell" rx="10"/>
<!-- Vacuole -->
<ellipse cx="140" cy="68" rx="40" ry="36" fill="#0f2018" stroke="#4ecca3" stroke-width="1"/>
<!-- Chloroplasts -->
<ellipse cx="95" cy="35" rx="9" ry="4" class="chl"/>
<ellipse cx="115" cy="28" rx="9" ry="4" class="chl"/>
<ellipse cx="160" cy="28" rx="9" ry="4" class="chl"/>
<ellipse cx="178" cy="35" rx="9" ry="4" class="chl"/>
<ellipse cx="95" cy="98" rx="9" ry="4" class="chl"/>
<ellipse cx="178" cy="98" rx="9" ry="4" class="chl"/>
<!-- X and Y markers -->
<line x1="80" y1="68" x2="200" y2="68" stroke="#e8c547" stroke-width="1.2" stroke-dasharray="4,3"/>
<circle cx="80" cy="68" r="4" fill="#e8c547"/>
<circle cx="200" cy="68" r="4" fill="#e8c547"/>
<text x="66" y="72" style="fill:#e8c547;font-size:12px;font-family:serif;font-weight:bold">X</text>
<text x="207" y="72" style="fill:#e8c547;font-size:12px;font-family:serif;font-weight:bold">Y</text>
<!-- Dimension arrow -->
<line x1="80" y1="125" x2="200" y2="125" stroke="#7a8199" stroke-width="1.2"/>
<polygon points="80,122 74,125 80,128" fill="#7a8199"/>
<polygon points="200,122 206,125 200,128" fill="#7a8199"/>
<text x="140" y="138" class="lbl" style="fill:#7a8199;font-size:10px">20 mm in diagram = 40 μm actual</text>
</svg>`, diagCaption: `Palisade cell diagram — measured distance X to Y = 20 mm; actual = 40 μm`,
    opts: ["×200","×500","×2500","×5000"],
    ans: "B",
    exp: "Magnification = image size ÷ actual size. Convert: 20 mm = 20,000 μm. Magnification = 20,000 ÷ 40 = ×500."
  },
  {
    n: 5,
    q: "The diagram shows a root hair cell. When does water enter the cell by osmosis?", diagram: `<svg viewBox="0 0 340 160" xmlns="http://www.w3.org/2000/svg" width="340" height="160">
<style>.soil{fill:#2a1f0f;stroke:none}.cell{fill:#1e3028;stroke:#4ecca3;stroke-width:1.8}.vac{fill:#0f2018;stroke:#4ecca3;stroke-width:1}.lbl{fill:#e8e6df;font-size:10px;font-family:serif;text-anchor:middle}.water{fill:none;stroke:#6aafe0;stroke-width:1.8;stroke-dasharray:5,3}<\/style>
<!-- Soil particles -->
<rect x="0" y="0" width="140" height="160" class="soil"/>
<circle cx="20" cy="25" r="14" fill="#3a2a15" stroke="#5a4a25" stroke-width="1"/>
<circle cx="55" cy="18" r="11" fill="#3a2a15" stroke="#5a4a25" stroke-width="1"/>
<circle cx="90" cy="28" r="16" fill="#3a2a15" stroke="#5a4a25" stroke-width="1"/>
<circle cx="25" cy="65" r="18" fill="#3a2a15" stroke="#5a4a25" stroke-width="1"/>
<circle cx="72" cy="70" r="14" fill="#3a2a15" stroke="#5a4a25" stroke-width="1"/>
<circle cx="110" cy="62" r="12" fill="#3a2a15" stroke="#5a4a25" stroke-width="1"/>
<circle cx="30" cy="115" r="16" fill="#3a2a15" stroke="#5a4a25" stroke-width="1"/>
<circle cx="80" cy="120" r="18" fill="#3a2a15" stroke="#5a4a25" stroke-width="1"/>
<circle cx="120" cy="108" r="13" fill="#3a2a15" stroke="#5a4a25" stroke-width="1"/>
<circle cx="18" cy="148" r="12" fill="#3a2a15" stroke="#5a4a25" stroke-width="1"/>
<circle cx="65" cy="152" r="10" fill="#3a2a15" stroke="#5a4a25" stroke-width="1"/>
<!-- Root hair cell body -->
<ellipse cx="220" cy="80" rx="75" ry="55" class="cell"/>
<!-- Root hair extension into soil -->
<path d="M145,80 Q130,70 120,65 Q105,60 100,55" fill="#1e3028" stroke="#4ecca3" stroke-width="1.8"/>
<path d="M145,80 Q130,90 120,95 Q105,100 100,105" fill="#1e3028" stroke="#4ecca3" stroke-width="1.8"/>
<!-- Vacuole -->
<ellipse cx="225" cy="80" rx="48" ry="35" class="vac"/>
<!-- Water arrows (correct - from high ψ outside to lower ψ inside) -->
<path d="M108,68 Q125,74 140,78" stroke="#6aafe0" stroke-width="2" fill="none" marker-end="url(#wArr)"/>
<path d="M108,92 Q125,88 140,82" stroke="#6aafe0" stroke-width="2" fill="none" marker-end="url(#wArr)"/>
<defs><marker id="wArr" markerWidth="7" markerHeight="6" refX="5" refY="3" orient="auto"><polygon points="0 0,7 3,0 6" fill="#6aafe0"/></marker></defs>
<!-- Labels -->
<text x="55" y="148" class="lbl" style="fill:#7a8199">soil (higher ψ)</text>
<text x="230" y="148" class="lbl" style="fill:#4ecca3">root hair cell</text>
<text x="230" y="158" class="lbl" style="fill:#4ecca3">(lower ψ)</text>
<text x="120" y="58" class="lbl" style="fill:#6aafe0">H₂O</text>
</svg>`, diagCaption: `Root hair cell — water enters by osmosis when water potential outside is higher (less negative) than inside`,
    opts: [
      "When the concentration of solutes outside the cell is greater than inside the cell",
      "When the concentration of solutes inside and outside the cell are equal",
      "When the water potential inside the cell is higher than outside the cell",
      "When the water potential outside the cell is higher than inside the cell"
    ],
    ans: "D",
    exp: "Water moves by osmosis from a region of higher water potential to lower water potential. Water enters the root hair cell when the water potential outside is higher (less negative) than inside. Note: higher solute concentration = lower water potential, so option A describes the opposite situation."
  },
  {
    n: 6,
    q: "Which row shows the changes that occur during the germination of a seed?",
    table: {
      headers: ["","Respiration rate","Amount of energy required","How ions are absorbed"],
      rows: [
        ["A","decreased","decreased","active transport"],
        ["B","decreased","increased","diffusion"],
        ["C","increased","decreased","diffusion"],
        ["D","increased","increased","active transport"]
      ]
    },
    opts: ["A","B","C","D"],
    ans: "D",
    exp: "During germination, the seed is rapidly growing and building new cells — this requires large amounts of energy. Respiration rate increases to supply that energy. Mineral ions (e.g. nitrates, phosphates) are absorbed against their concentration gradient by active transport using ATP."
  },
  {
    n: 7,
    q: "The diagram shows the human alimentary canal. In which structure is most glucose absorbed into the blood?", diagram: `<svg viewBox="0 0 200 300" xmlns="http://www.w3.org/2000/svg" width="200" height="300">
<style>.organ{fill:#1e2335;stroke:#7a8199;stroke-width:1.5}.lbl{fill:#e8e6df;font-size:11px;font-family:serif;text-anchor:middle}.acc{fill:#4ecca3;font-size:11px;font-family:serif;text-anchor:middle}<\/style>
<!-- Oesophagus -->
<rect x="88" y="10" width="24" height="35" class="organ" rx="8"/>
<text x="140" y="30" class="lbl">oesophagus</text>
<!-- Stomach = A -->
<path d="M88,45 Q60,45 55,65 Q50,85 65,100 Q80,110 100,108 Q115,106 112,90 L112,45 Z" class="organ"/>

let answered = {};
let submitted = false;

function letterToIndex(letter) {
  return letter.charCodeAt(0) - 65; // A=0, B=1, C=2, D=3
}

function buildQuiz() {
  const container = document.getElementById('quiz');
  questions.forEach((q, qi) => {
    const block = document.createElement('div');
    block.className = 'question-block';
    block.id = `q-${qi}`;

    let tableHTML = '';
    if (q.table) {
      tableHTML = '<table class="q-table"><thead><tr>';
      q.table.headers.forEach(h => { tableHTML += `<th>${h}</th>`; });
      tableHTML += '</tr></thead><tbody>';
      q.table.rows.forEach(row => {
        tableHTML += '<tr>';
        row.forEach((cell, ci) => {
          tableHTML += ci === 0 ? `<td><strong style="color:var(--accent2)">${cell}</strong></td>` : `<td>${cell}</td>`;
        });
        tableHTML += '</tr>';
      });
      tableHTML += '</tbody></table>';
    }

    const qTextFormatted = q.q.replace(/\n/g, '<br>');

    let diagHTML = '';
    if (q.diagram) {
      const cap = q.diagCaption ? `<div class="diagram-caption">${q.diagCaption}</div>` : '';
      diagHTML = `<div class="diagram-wrap">${q.diagram}</div>${cap}`;
    }

    let optsHTML = '';
    q.opts.forEach((opt, oi) => {
      const letter = String.fromCharCode(65 + oi);
      optsHTML += `
        <div class="option" id="q${qi}-opt${oi}" onclick="selectOption(${qi}, ${oi})">
          <div class="option-letter">${letter}</div>
          <div style="flex:1">${opt}</div>
          <div class="result-icon" id="q${qi}-icon${oi}"></div>
        </div>`;
    });

    block.innerHTML = `
      <div class="q-number">Question ${q.n} of 40</div>
      <div class="q-text">${qTextFormatted}</div>
      ${diagHTML}
      ${tableHTML ? `<div style="overflow-x:auto;margin:0 0 20px">${tableHTML}</div>` : ''}
      <div class="options">${optsHTML}</div>
      <div class="explanation" id="q${qi}-exp"></div>
    `;
    container.appendChild(block);
  });
}

function selectOption(qi, oi) {
  if (submitted) return;
  const prev = answered[qi];
  if (prev !== undefined) {
    document.getElementById(`q${qi}-opt${prev}`).classList.remove('selected');
  }
  answered[qi] = oi;
  document.getElementById(`q${qi}-opt${oi}`).classList.add('selected');
  document.getElementById(`q-${qi}`).classList.add('answered');
  updateProgress();
}

function updateProgress() {
  const count = Object.keys(answered).length;
  document.getElementById('progress-count').textContent = count;
  document.getElementById('progress-fill').style.width = (count / 40 * 100) + '%';
}

function submitExam() {
  const unanswered = questions.length - Object.keys(answered).length;
  if (unanswered > 0) {
    const note = document.getElementById('unanswered-note');
    note.style.display = 'block';
    note.textContent = `You have ${unanswered} unanswered question${unanswered > 1 ? 's' : ''}. Submit anyway or go back and answer them.`;
    if (!document.getElementById('btn-submit-confirm')) {
      const btn2 = document.createElement('button');
      btn2.className = 'btn-submit';
      btn2.id = 'btn-submit-confirm';
      btn2.style.marginTop = '14px';
      btn2.style.background = 'var(--accent2)';
      btn2.textContent = 'Submit Anyway';
      btn2.onclick = doSubmit;
      document.querySelector('.submit-area').appendChild(btn2);
    }
    return;
  }
  doSubmit();
}

function doSubmit() {
  submitted = true;
  document.getElementById('btn-submit').disabled = true;
  const conf = document.getElementById('btn-submit-confirm');
  if (conf) conf.disabled = true;

  let score = 0;
  questions.forEach((q, qi) => {
    const correctIdx = letterToIndex(q.ans);
    const userIdx = answered[qi];

    // Lock all options
    q.opts.forEach((_, oi) => {
      document.getElementById(`q${qi}-opt${oi}`).classList.add('locked');
    });

    // Show correct answer
    const correctEl = document.getElementById(`q${qi}-opt${correctIdx}`);

    if (userIdx !== undefined) {
      const userEl = document.getElementById(`q${qi}-opt${userIdx}`);
      const icon = document.getElementById(`q${qi}-icon${userIdx}`);
      if (userIdx === correctIdx) {
        userEl.classList.remove('selected');
        userEl.classList.add('correct');
        icon.style.display = 'block';
        icon.textContent = '✓';
        icon.style.color = 'var(--correct)';
        score++;
      } else {
        userEl.classList.remove('selected');
        userEl.classList.add('wrong');
        icon.style.display = 'block';
        icon.textContent = '✗';
        icon.style.color = 'var(--wrong)';
        correctEl.classList.add('show-correct');
        const correctIcon = document.getElementById(`q${qi}-icon${correctIdx}`);
        correctIcon.style.display = 'block';
        correctIcon.textContent = '✓';
        correctIcon.style.color = 'var(--correct)';
      }
    } else {
      // Not answered — just show correct
      correctEl.classList.add('show-correct');
      const correctIcon = document.getElementById(`q${qi}-icon${correctIdx}`);
      correctIcon.style.display = 'block';
      correctIcon.textContent = '✓';
      correctIcon.style.color = 'var(--correct)';
    }

    // Show explanation
    const expEl = document.getElementById(`q${qi}-exp`);
    expEl.innerHTML = `<strong>Answer: ${q.ans}</strong> — ${q.exp.replace(/\n/g,'<br>')}`;
    expEl.classList.add('visible');
  });

  // Score panel
  const pct = Math.round(score / 40 * 100);
  let grade = '';
  if (pct >= 90) grade = 'Exceptional — A*';
  else if (pct >= 80) grade = 'Excellent — A';
  else if (pct >= 70) grade = 'Strong — B';
  else if (pct >= 60) grade = 'Good — C';
  else if (pct >= 50) grade = 'Satisfactory — D';
  else grade = 'Keep Revising — E/U';

  document.getElementById('score-num').textContent = score;
  document.getElementById('score-pct').textContent = pct + '%';
  document.getElementById('score-grade').textContent = grade;

  const panel = document.getElementById('score-panel');
  panel.style.display = 'block';
  panel.scrollIntoView({ behavior: 'smooth', block: 'start' });

  setTimeout(() => {
    document.getElementById('score-bar').style.width = pct + '%';
  }, 300);

  updateProgress();
}

buildQuiz();
</script>
